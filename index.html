<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>刘莫个人工作台</title>
<style>
  /* ========== 基础重置与变量 ========== */
  :root {
    --bg: #f6f7f9;
    --bg-soft: #eef0f3;
    --card: #ffffff;
    --text: #1f2937;
    --text-soft: #6b7280;
    --text-muted: #9ca3af;
    --border: #e5e7eb;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --primary-soft: #eff6ff;
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    --warning: #f59e0b;
    --warning-soft: #fffbeb;
    --success: #10b981;
    --shadow-sm: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.03);
    --shadow: 0 1px 3px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
    --shadow-md: 0 12px 20px -6px rgba(16,24,40,0.12), 0 4px 8px -4px rgba(16,24,40,0.06);
    --shadow-lg: 0 20px 30px -10px rgba(16,24,40,0.18), 0 8px 12px -6px rgba(16,24,40,0.08);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.22s ease;
    --primary-2: #6366f1;
    --brand-grad: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
    --side-grad: linear-gradient(165deg, #4f46e5 0%, #4338ca 52%, #3730a3 100%);
    --bg-grad: linear-gradient(180deg, #eef2ff 0%, #f8fafc 55%, #f6f7f9 100%);
    --ring: 0 0 0 4px rgba(99,102,241,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg-grad);
    background-attachment: fixed;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, select { font-family: inherit; font-size: inherit; color: inherit; }

  /* ========== 整体布局 ========== */
  .app {
    display: flex;
    min-height: 100vh;
  }

  /* ========== 侧边栏 ========== */
  .sidebar {
    width: 248px;
    background: var(--side-grad);
    border-right: none;
    box-shadow: 4px 0 28px rgba(49,46,129,0.20);
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    color: #fff;
  }

  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 6px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
    margin-bottom: 16px;
  }

  .brand-avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(255,255,255,0.16);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 17px;
    flex-shrink: 0;
  }

  .brand-name {
    font-weight: 700;
    font-size: 16px;
    line-height: 1.3;
    color: #fff;
  }

  .brand-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    margin-top: 2px;
  }

  .nav-section-title {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 10px 12px 4px;
    margin-top: 4px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    border-radius: 10px;
    color: rgba(255,255,255,0.78);
    cursor: pointer;
    transition: all var(--transition);
    margin-bottom: 3px;
    width: 100%;
    text-align: left;
    font-size: 14px;
    position: relative;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  .nav-item.active {
    background: #fff;
    color: #4338ca;
    font-weight: 600;
    box-shadow: 0 8px 18px rgba(0,0,0,0.22);
  }

  .nav-item.active .nav-icon { color: #4338ca; }

  .nav-item.disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .nav-item.disabled:hover {
    background: transparent;
    color: rgba(255,255,255,0.78);
  }

  .nav-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .nav-badge {
    margin-left: auto;
    font-size: 11px;
    color: rgba(255,255,255,0.82);
    background: rgba(255,255,255,0.16);
    padding: 2px 7px;
    border-radius: 6px;
  }

  /* 侧边栏菜单拖拽排序 */
  .nav-entry { position: relative; }
  .nav-entry[draggable="true"] { cursor: grab; }
  .nav-entry[draggable="true"]:active { cursor: grabbing; }
  .nav-entry.dragging { opacity: 0.4; }
  .nav-entry.drag-over { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7); border-radius: 10px; }
  .nav-move {
    display: none;
    margin-left: auto;
    gap: 4px;
    flex-shrink: 0;
    align-items: center;
  }
  .nav-entry { display: flex; }   /* 确保 move 按钮可推到右侧 */
  .nav-group.nav-entry { display: block; }
  .sidebar.reorder-on .nav-move { display: inline-flex; }
  .nav-move-btn {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: rgba(255,255,255,0.16);
    color: #fff; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; user-select: none;
  }
  .nav-move-btn:hover { background: rgba(255,255,255,0.34); }
  .nav-move-btn[data-disabled] { opacity: 0.3; cursor: default; pointer-events: none; }
  .sidebar.reorder-on .nav-item.nav-entry { background: rgba(255,255,255,0.06); }
  .sidebar.reorder-on .nav-entry { cursor: grab; }
  .nav-reorder-btn {
    margin-top: 10px;
    width: 100%;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .nav-reorder-btn:hover { background: rgba(255,255,255,0.16); }
  .nav-reorder-btn.active { background: #4338ca; border-color: #4338ca; }
  .nav-reorder-tip { display: none; margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.55); }
  .sidebar.reorder-on .nav-reorder-tip { display: block; }

  /* 库存管理 */
  .iv-filter { cursor: pointer; padding: 6px 14px; border-radius: 20px; background: #f1f5f9; border: 1px solid var(--border); font-size: 13px; color: var(--text-soft); user-select: none; }
  .iv-filter.active { background: var(--primary-2); color: #fff; border-color: var(--primary-2); }
  .iv-filter-cig.active { background: #b45309; border-color: #b45309; }
  .iv-filter-liq.active { background: #6d28d9; border-color: #6d28d9; }
  .iv-filter-warn { color: #b45309; border-color: #fde68a; background: #fffbeb; }
  .iv-filter-warn.active { background: #f59e0b; border-color: #f59e0b; color: #fff; }
  .iv-warn-count { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 3px; border-radius: 10px; background: rgba(0,0,0,0.13); font-size: 11px; line-height: 16px; text-align: center; font-weight: 600; }
  .iv-search { flex: 1 1 160px; min-width: 140px; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; background: #fff; color: var(--text); outline: none; }
  .iv-search:focus { border-color: var(--primary-2); }
  .iv-cat-filter { flex: 0 0 auto; height: 38px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; color: var(--text); font-size: 13px; cursor: pointer; outline: none; }
  .iv-cat-filter:focus { border-color: var(--primary-2); }
  .iv-back-all { flex: 0 0 auto; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--text); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .iv-back-all:hover { background: #f8fafc; }
  .iv-warn-card { cursor: pointer; }
  .iv-warn-card:active { transform: scale(0.98); }
  .toolbar.iv-search-bar { flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 8px; }
  .toolbar.iv-search-bar .iv-search { flex: 1 1 auto; min-width: 0; }
  .toolbar.iv-search-bar .iv-cat-filter { flex: 0 0 auto; min-width: 84px; }
  .iv-group-title { margin: 14px 2px 8px; font-size: 13px; font-weight: 700; color: var(--text-soft); display: flex; align-items: center; gap: 6px; }
  .iv-group-title::before { content: ''; width: 3px; height: 13px; border-radius: 2px; background: var(--primary-2); }
  .iv-item { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); border-left: 4px solid var(--primary-2); }
  .iv-item.iv-cat-cig { border-left-color: #b45309; }
  .iv-item.iv-cat-liq { border-left-color: #6d28d9; }
  .iv-item-main { flex: 1 1 0%; min-width: 120px; overflow: hidden; }
  .iv-item-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
  .iv-item-sub { font-size: 12px; color: var(--text-soft); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iv-tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; color: #fff; }
  .iv-tag.iv-cat-cig { background: #b45309; }
  .iv-tag.iv-cat-liq { background: #6d28d9; }
  .iv-item-stock { text-align: right; flex: 0 0 44px; }
  .iv-stock-num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .iv-stock-unit { font-size: 11px; color: var(--text-soft); }
  .iv-item-stock.iv-warn .iv-stock-num, .iv-item-stock.iv-warn .iv-stock-unit { color: var(--danger); }
  .iv-item-amount { text-align: right; flex: 0 0 84px; }
  .iv-amount-label { font-size: 11px; color: var(--text-soft); }
  .iv-amount-val { font-size: 14px; font-weight: 700; color: var(--primary-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #ivList { overflow-x: auto; }
  .iv-item-actions { flex: 0 0 auto; display: flex; justify-content: flex-end; gap: 5px; flex-shrink: 0; }
  .iv-btn { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 5px 8px; font-size: 12px; cursor: pointer; transition: background var(--transition); white-space: nowrap; }
  .iv-btn:hover { background: #f8fafc; }
  .iv-in { color: #15803d; border-color: #bbf7d0; }
  .iv-out { color: #b45309; border-color: #fde68a; }
  .iv-checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); white-space: nowrap; cursor: pointer; height: 38px; user-select: none; }
  .iv-checkbox-label input { width: auto; height: auto; margin: 0; cursor: pointer; }
  .iv-warn-when { color: var(--text-2); font-size: 12px; }
  .iv-edit { color: var(--primary-2); border-color: #c7d2fe; }
  .iv-del { color: #dc2626; border-color: #fecaca; }
  .iv-log-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; flex-wrap: wrap; }
  .iv-log-tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; color: #fff; }
  .iv-log-tag.iv-log-in { background: #15803d; }
  .iv-log-tag.iv-log-out { background: #b45309; }
  .iv-log-name { font-weight: 600; }
  .iv-log-qty { font-weight: 700; font-variant-numeric: tabular-nums; }
  .iv-log-qty.iv-log-in { color: #15803d; }
  .iv-log-qty.iv-log-out { color: #b45309; }
  .iv-log-note { color: var(--text-soft); font-size: 12px; }
  .iv-log-time { margin-left: auto; color: var(--text-muted); font-size: 12px; }
  .iv-modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,0.45); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
  .iv-modal { background: var(--card); border-radius: var(--radius); padding: 20px; width: 100%; max-width: 360px; box-shadow: var(--shadow-lg); }
  .iv-modal-title { font-weight: 600; margin-bottom: 14px; font-size: 15px; }
  .iv-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
  .iv-clear-btn { flex: 0 0 auto; height: 38px; padding: 0 14px; border: 1px solid #fca5a5; border-radius: var(--radius-sm); background: #fff; color: #dc2626; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .iv-clear-btn:hover { background: #fef2f2; }
  .btn-danger { padding: 10px 18px; border: 1px solid var(--danger); background: var(--danger); color: #fff; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; transition: all var(--transition); white-space: nowrap; }
  .btn-danger:hover { opacity: 0.9; }
  .iv-clear-modal { max-width: 380px; }
  .iv-clear-tip { font-size: 13px; color: var(--text-soft); line-height: 1.55; margin: -6px 0 14px; }
  .iv-clear-cats { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .iv-clear-cat { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; user-select: none; }
  .iv-clear-cat:hover { background: #f8fafc; }
  .iv-clear-cat input { width: auto; height: auto; margin: 0; cursor: pointer; }
  .iv-clear-cat .iv-clear-cnt { margin-left: auto; font-size: 12px; color: var(--text-soft); }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.14);
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    padding-left: 12px;
  }

  /* 移动端汉堡按钮 */
  .menu-toggle {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 50;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: var(--card);
    box-shadow: var(--shadow);
    align-items: center;
    justify-content: center;
  }

  /* 移动端侧边栏遮罩 */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 35;
  }
  .sidebar-overlay.show { display: block; }

  /* ========== 主内容区 ========== */
  .main {
    flex: 1;
    min-width: 0;
    padding: 36px 44px 56px;
    max-width: 1160px;
    margin: 0 auto;
    scrollbar-width: thin;
  }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
  .main::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

  .page-header {
    margin-bottom: 26px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    padding-left: 14px;
  }
  .page-header::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 4px;
    background: var(--brand-grad);
    border-radius: 2px;
  }

  .page-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.4px;
    background: var(--brand-grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }

  .page-desc {
    color: var(--text-soft);
    margin-top: 2px;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ========== 统计卡片 ========== */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition), box-shadow var(--transition);
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--brand-grad);
    opacity: 0.85;
  }

  .stat-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }

  .stat-value.primary { color: var(--primary); }
  .stat-value.warning { color: var(--warning); }
  .stat-value.success { color: var(--success); }

  .stat-bar {
    height: 4px;
    background: var(--bg-soft);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }

  .stat-bar-fill {
    height: 100%;
    background: var(--success);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* ========== 工具栏 ========== */
  .toolbar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .input-add {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    transition: all var(--transition);
  }

  .input-add:focus {
    outline: none;
    border-color: var(--primary-2);
    background: #fff;
    box-shadow: var(--ring);
  }

  .select-priority {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text-soft);
    transition: all var(--transition);
  }

  .select-priority:focus {
    outline: none;
    border-color: var(--primary-2);
    background: #fff;
    box-shadow: var(--ring);
  }

  .btn-add {
    padding: 10px 20px;
    background: var(--brand-grad);
    color: #fff;
    border-radius: var(--radius-sm);
    font-weight: 500;
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 6px 14px -4px rgba(99,102,241,0.45);
  }

  .btn-add:hover {
    background: linear-gradient(135deg, #4f46e5, #2563eb);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .btn-add:active { transform: translateY(0); }

  /* ========== 待办添加弹窗表单 ========== */
  #todo-form-container { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
  #todo-form-container .input-add { width: 100%; flex: none; }
  #todo-form-container .select-priority { width: 100%; }
  .todo-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 2px; }
  .btn-cancel {
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-cancel:hover { border-color: var(--danger); color: var(--danger); }

  /* ========== 筛选条 ========== */
  .filter-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .filter-group {
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 4px;
    color: var(--text-soft);
    font-size: 13px;
    transition: all var(--transition);
  }

  .filter-btn:hover { color: var(--text); }

  .filter-btn.active {
    background: var(--brand-grad);
    color: #fff;
    font-weight: 500;
    box-shadow: 0 4px 10px -3px rgba(99,102,241,0.5);
  }

  .search-box {
    flex: 1;
    min-width: 180px;
    position: relative;
    max-width: 260px;
    margin-left: auto;
  }

  .search-box svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    transition: all var(--transition);
  }

  .search-input:focus {
    outline: none;
    border-color: var(--primary-2);
    box-shadow: var(--ring);
  }

  .btn-clear {
    padding: 6px 12px;
    color: var(--text-soft);
    font-size: 13px;
    border-radius: var(--radius-sm);
    transition: all var(--transition);
  }

  .btn-clear:hover {
    color: var(--danger);
    background: var(--danger-soft);
  }

  /* ========== 待办列表 ========== */
  .todo-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .todo-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all var(--transition);
    position: relative;
  }

  .todo-item:hover {
    box-shadow: var(--shadow-md);
    border-color: #d1d5db;
  }

  .todo-item.done {
    opacity: 0.62;
  }

  .todo-item.done .todo-title {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .todo-item.overdue:not(.done) {
    border-left: 3px solid var(--danger);
    padding-left: 14px;
  }

  .checkbox {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }

  .checkbox:hover { border-color: var(--primary); }

  .todo-item.done .checkbox {
    background: var(--success);
    border-color: var(--success);
  }

  .checkbox svg {
    width: 12px;
    height: 12px;
    color: #fff;
    opacity: 0;
    transition: opacity var(--transition);
  }

  .todo-item.done .checkbox svg { opacity: 1; }

  .todo-content {
    flex: 1;
    min-width: 0;
  }

  .todo-title {
    font-weight: 500;
    color: var(--text);
    word-break: break-word;
    cursor: text;
  }

  .todo-meta {
    display: flex;
    gap: 12px;
    margin-top: 4px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-muted);
  }

  .meta-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .meta-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  .priority-iq  { color: #ef4444; }
  .priority-iq  .meta-dot { background: #ef4444; }
  .priority-inq { color: #3b82f6; }
  .priority-inq .meta-dot { background: #3b82f6; }
  .priority-uq  { color: #f59e0b; }
  .priority-uq  .meta-dot { background: #f59e0b; }
  .priority-nuq { color: #10b981; }
  .priority-nuq .meta-dot { background: #10b981; }

  .meta-overdue {
    color: var(--danger);
    font-weight: 500;
  }

  .todo-actions {
    display: flex;
    gap: 4px;
    opacity: 1;
    transition: opacity var(--transition);
  }

  .action-btn {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: all var(--transition);
  }

  .todo-item:hover .action-btn { color: var(--text-soft); }

  .action-btn:hover {
    background: var(--bg-soft);
    color: var(--text);
  }

  .action-btn.delete:hover {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .action-btn.edit:hover {
    background: var(--primary-soft);
    color: var(--primary-2);
  }

  /* 拖拽排序 */
  .drag-handle {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    padding: 0 2px;
    color: var(--text-muted);
    cursor: grab;
    align-self: stretch;
  }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle svg { width: 16px; height: 16px; }
  .todo-item.dragging { opacity: 0.4; }
  .todo-item.drag-over { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.25); }
  .todo-item[draggable="true"] { cursor: default; }
  .filter-group.sort-group { margin-left: 0; }

  /* 编辑模式 */
  .todo-edit-input {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid var(--primary);
    border-radius: var(--radius-sm);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
  }

  .todo-edit-input:focus { outline: none; }

  .todo-edit-priority { max-width: 160px; flex: none; }

  /* ========== 空状态 ========== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    background: var(--bg-soft);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }

  .empty-title {
    font-size: 15px;
    color: var(--text-soft);
    margin-bottom: 4px;
  }

  .empty-desc {
    font-size: 13px;
  }

  /* ========== 占位模块 ========== */
  .placeholder-module {
    text-align: center;
    padding: 80px 20px;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-muted);
  }

  .placeholder-icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  /* ========== Toast ========== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 100;
    box-shadow: var(--shadow-md);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ========== 响应式 ========== */
  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 768px) {
    .menu-toggle { display: flex; }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 40;
      transform: translateX(-100%);
      transition: transform var(--transition);
      box-shadow: var(--shadow-md);
    }
    .sidebar.open { transform: translateX(0); }
    .main { padding: 64px 16px 32px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .input-add, .select-priority, .btn-add { width: 100%; }
    .search-box { max-width: none; margin-left: 0; }
  }

  /* ========== 心灵鸡汤模块 ========== */
  .quote-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .quote-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 20px 16px;
    box-shadow: var(--shadow-sm);
    transition: all var(--transition);
    position: relative;
    display: flex;
    flex-direction: column;
    border-left: 3px solid var(--primary);
  }

  .quote-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
    border-color: #d1d5db;
  }

  .quote-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    word-break: break-word;
    white-space: pre-wrap;
    cursor: text;
    min-height: 24px;
  }

  .quote-text::before {
    content: '\201C';
    font-size: 28px;
    color: var(--text-muted);
    line-height: 0;
    vertical-align: -6px;
    margin-right: 2px;
    opacity: 0.5;
  }

  .quote-source {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-soft);
    font-style: italic;
  }

  .quote-source::before {
    content: '—— ';
    color: var(--text-muted);
  }

  .quote-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .quote-meta-time {
    font-size: 11px;
    color: var(--text-muted);
  }

  .quote-actions {
    display: flex;
    gap: 4px;
  }

  .quote-star {
    cursor: pointer;
    color: var(--text-muted);
    transition: all var(--transition);
    background: none;
    padding: 0;
    display: inline-flex;
  }

  .quote-star.starred {
    color: var(--warning);
  }

  .quote-star:hover { transform: scale(1.15); }

  .quote-edit-area {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .quote-edit-text {
    width: 100%;
    min-height: 80px;
    padding: 10px 12px;
    border: 1px solid var(--primary);
    border-radius: var(--radius-sm);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    resize: vertical;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
  }

  .quote-edit-text:focus { outline: none; }

  .quote-edit-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .quote-edit-input {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #fff;
    font-size: 13px;
  }

  .quote-edit-input:focus {
    outline: none;
    border-color: var(--primary);
  }

  .quote-edit-select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #fff;
    font-size: 13px;
    color: var(--text-soft);
  }

  .quote-edit-actions {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }

  .quote-edit-btn {
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    transition: all var(--transition);
    font-weight: 500;
  }

  .quote-edit-btn.save {
    background: var(--primary);
    color: #fff;
  }

  .quote-edit-btn.save:hover { background: var(--primary-hover); }

  .quote-edit-btn.cancel {
    background: var(--bg-soft);
    color: var(--text-soft);
  }

  .quote-edit-btn.cancel:hover { background: var(--border); }

  /* 心灵鸡汤统计 */
  .quotes-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  @media (max-width: 900px) {
    .quotes-stats { grid-template-columns: repeat(2, 1fr); }
  }

  /* ========== 学习管理模块（v2 · 任务明细 / 计划明细） ========== */
  .study2 { padding: 4px 2px 24px; }
  .study2 .page-header { margin-bottom: 10px; }

  /* 页签 */
  .study2-tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .study2-tab {
    flex: 0 0 auto; padding: 8px 14px; font-size: 14px; font-weight: 600;
    color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent;
    cursor: pointer; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 6px;
  }
  .study2-tab:hover { color: var(--text-soft); background: var(--bg-soft); }
  .study2-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .study2-tab-badge {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--danger); color: #fff; font-size: 11px; line-height: 18px; text-align: center;
  }

  /* 工具栏 */
  .study2-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .study2-spacer { flex: 1; }
  .study2-select {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; background: var(--card); color: inherit;
  }
  .study2-btn {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); cursor: pointer; font-size: 13px; color: var(--text-soft); white-space: nowrap;
  }
  .study2-btn:hover { filter: brightness(.97); }
  .study2-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* 科目分组 */
  .study2-subject {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-sm); margin-bottom: 10px; overflow: hidden;
  }
  .study2-subject-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg-soft); }
  .study2-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .study2-subject-name { font-weight: 600; font-size: 14px; }
  .study2-subject-count { font-size: 12px; color: var(--text-muted); background: var(--border); border-radius: 10px; padding: 0 7px; }
  .study2-subject-actions { margin-left: auto; display: flex; gap: 4px; }

  /* 通用小按钮 */
  .study2-mini {
    border: 1px solid var(--border); background: var(--card); border-radius: 6px;
    padding: 3px 7px; font-size: 12px; cursor: pointer; color: var(--text-soft); line-height: 1.4; white-space: nowrap;
  }
  .study2-mini:hover { border-color: var(--primary); color: var(--primary); }
  .study2-mini.danger:hover { border-color: var(--danger); color: var(--danger); }
  .study2-mini.done { background: var(--success); color: #fff; border-color: var(--success); }

  /* 任务行 */
  .study2-tasks { padding: 4px 6px 6px; }
  .study2-subtask-empty { color: var(--text-muted); font-size: 12px; padding: 6px; }
  .study2-task { display: flex; align-items: flex-start; gap: 8px; padding: 7px 6px; border-radius: 8px; }
  .study2-task:hover { background: var(--bg-soft); }
  .study2-stripe { width: 3px; align-self: stretch; border-radius: 2px; flex: 0 0 auto; min-height: 18px; }
  .study2-task-main { flex: 1; min-width: 0; }
  .study2-task-title { font-size: 14px; font-weight: 500; word-break: break-word; }
  .study2-task-note { font-size: 12px; color: var(--text-muted); margin-top: 1px; word-break: break-word; }
  .study2-task-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .study2-task-actions { display: flex; gap: 4px; flex: 0 0 auto; align-items: center; }

  /* 标签 */
  .study2-badge {
    font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: var(--bg-soft); color: var(--text-muted); border: 1px solid var(--border); white-space: nowrap;
  }
  .study2-badge.date { color: #2563eb; border-color: #bfdbfe; background: #eff6ff; }
  .study2-badge.weekly { color: #7c3aed; border-color: #ddd6fe; background: #f5f3ff; }
  .study2-badge.none { color: var(--text-muted); }
  .study2-badge.cont { color: #b45309; border-color: #fde68a; background: #fffbeb; }
  .study2-badge.overdue { color: #fff; background: var(--danger); border-color: var(--danger); }
  .study2-badge.sub { color: var(--text-soft); }

  .study2-empty {
    text-align: center; color: var(--text-muted); padding: 30px 16px; font-size: 13px;
    background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius-sm);
  }

  /* 计划明细 */
  .study2-plan-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .study2-plan-summary { font-size: 13px; color: var(--text-muted); }
  .study2-plan-summary b { color: var(--primary); font-size: 15px; }
  .study2-plan-today { font-size: 12px; color: var(--text-muted); }
  .study2-plan-group { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 10px; overflow: hidden; }
  .study2-plan-group.is-today { border-color: var(--primary); }
  .study2-plan-date { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg-soft); font-size: 13px; }
  .study2-plan-date-main { font-weight: 700; }
  .study2-plan-date-wd { color: var(--text-muted); }
  .study2-plan-today-tag { margin-left: auto; font-size: 11px; color: #fff; background: var(--primary); border-radius: 10px; padding: 1px 8px; }
  .study2-plan-row { display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; }
  .study2-plan-row:hover { background: var(--bg-soft); }
  .study2-plan-row.is-overdue .study2-task-title { color: var(--danger); }

  /* 弹窗 */
  .study2-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
  }
  .study2-modal-card {
    background: var(--card); border-radius: 14px; width: 100%; max-width: 380px;
    padding: 16px; box-shadow: var(--shadow-sm); max-height: 90vh; overflow: auto;
  }
  .study2-modal-title { font-weight: 700; font-size: 16px; margin-bottom: 12px; }
  .study2-form { display: flex; flex-direction: column; gap: 10px; }
  .study2-field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-soft); }
  .study2-field > span { font-weight: 500; }
  .study2-field input[type=text], .study2-field input[type=date], .study2-field select, .study2-field input[type=color] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; background: var(--card); color: inherit;
  }
  .study2-field input[type=color] { padding: 2px; height: 38px; }
  .study2-field.cont { flex-direction: row; align-items: center; gap: 8px; }
  .study2-field.cont input { width: auto; }
  .study2-hidden { display: none !important; }
  .study2-form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  /* ========== 果然鲜模块 ========== */
  .fresh-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 768px) {
    .fresh-grid { grid-template-columns: 1fr; }
  }

  /* ========== 侧边栏树形二级类目（可展开分组） ========== */
  .nav-group { margin-bottom: 2px; }

  .nav-parent { position: relative; }

  .nav-chevron {
    margin-left: auto;
    color: var(--text-muted);
    transition: transform var(--transition);
    flex-shrink: 0;
  }

  .nav-group.expanded > .nav-parent .nav-chevron { transform: rotate(90deg); }

  .nav-children {
    padding: 2px 0 4px 12px;
    margin-left: 18px;
    border-left: 1px solid var(--border);
  }

  .nav-child {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    color: var(--text-soft);
    cursor: pointer;
    transition: all var(--transition);
    text-align: left;
    font-size: 13.5px;
    border: none;
    background: none;
  }

  .nav-child:hover { background: var(--bg-soft); color: var(--text); }

  .nav-child.active {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 500;
  }

  .nav-child-icon {
    width: 18px;
    text-align: center;
    flex-shrink: 0;
    font-size: 13px;
  }

  /* ========== 通用「笔记 / 活动列表」子面板 ========== */
  .subnote-input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    resize: vertical;
    line-height: 1.6;
    transition: all var(--transition);
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
  }

  .subnote-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
  }

  .subnote-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .subnote-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    transition: all var(--transition);
  }

  .subnote-item:hover { box-shadow: var(--shadow-md); border-color: #d1d5db; }

  .subnote-text {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.7;
    color: var(--text);
  }

  .subnote-meta {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .subnote-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    justify-content: flex-end;
  }

  .subnote-btn {
    padding: 5px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text-soft);
    border: 1px solid var(--border);
    transition: all var(--transition);
  }

  .subnote-btn:hover { background: var(--bg-soft); color: var(--text); }

  .subnote-btn.save {

  /* ========== 果然鲜 · 活动列表（标题 + 类别 + 图片 + 双页签） ========== */
  .act-tabs { display: flex; gap: 8px; margin-bottom: 16px; }

  /* 活动图片放大预览（点击卡片图片弹出，可保存到本地） */
  .act-lightbox {

  .act-lb-close:hover { background: rgba(255,255,255,.34); }

  /* 活动列表：顶栏（页签 + 添加按钮） */
  .act-topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .act-topbar .act-tabs { flex: 1; min-width: 0; flex-wrap: wrap; }
  #actAddBtn { flex-shrink: 0; }

  /* 活动列表：弹窗表单 */
  .act-modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .act-modal.open { display: flex; }
  .act-modal-backdrop { position: absolute; inset: 0; background: rgba(15,23,42,0.45); backdrop-filter: blur(2px); }

  .fresh-card {

  /* ========== 果然鲜 · 天气日历海报（canvas 图片卡片） ========== */

  /* ============ 任务管理模块 ============ */

  .tm-progress-card::before {

  .co-admin-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }

  /* 成本录入模块 */

  .dl-fab { position: fixed; right: 14px; bottom: 16px; z-index: 1200;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 11px 16px; border: none; border-radius: 999px;
    background: var(--primary); color: #fff; font-size: 14px; font-weight: 600;
    box-shadow: var(--shadow-md); cursor: pointer; }
  .dl-fab:active { transform: scale(.96); }
  @media (max-width: 768px) { .dl-fab { right: 12px; bottom: 12px; padding: 12px 18px; font-size: 15px; } }

  /* ---------- 生日提醒模块 ---------- */
  .bd-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .bd-add { border: 1px solid var(--primary); background: var(--primary); color: #fff; border-radius: var(--radius-sm); padding: 9px 16px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .bd-add:hover { filter: brightness(1.05); }
  .bd-hint { font-size: 12px; color: var(--text-muted); margin: -4px 0 12px; }
  .bd-list { display: flex; flex-direction: column; gap: 10px; }
  .bd-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .bd-card.bd-passed { opacity: .62; }
  .bd-card.bd-today { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99,102,241,.18); }
  .bd-avatar { width: 42px; height: 42px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #fff; background: var(--primary); }
  .bd-main { flex: 1; min-width: 0; }
  .bd-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bd-tag { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: rgba(99,102,241,.12); color: var(--primary); }
  .bd-tag.lunar { background: rgba(234,88,12,.12); color: #ea580c; }
  .bd-tag.passed { background: rgba(100,116,139,.16); color: #64748b; }
  .bd-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
  .bd-date { font-size: 13px; color: var(--text-soft); margin-top: 2px; }
  .bd-right { text-align: right; flex: 0 0 auto; }
  .bd-countdown { font-weight: 700; font-size: 15px; color: var(--primary); }
  .bd-countdown.passed { color: #64748b; font-weight: 600; }
  .bd-age { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .bd-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
  .bd-actions button { border: 1px solid var(--border); background: var(--card); color: var(--text-soft); border-radius: var(--radius-sm); padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .bd-actions button:hover { border-color: var(--primary); color: var(--primary); }
  .bd-sep { font-size: 12px; color: var(--text-muted); margin: 14px 2px 4px; font-weight: 600; }
  /* 生日弹窗 */
  .bd-field { margin-bottom: 12px; }
  .bd-field > label { display: block; font-size: 13px; color: var(--text-soft); margin-bottom: 6px; font-weight: 600; }
  .bd-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .bd-row .bd-field { flex: 1; min-width: 84px; margin-bottom: 0; }
  .bd-input, .bd-select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 14px; box-sizing: border-box; }
  .bd-radio { display: inline-flex; gap: 8px; }
  .bd-radio label { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; }
  .bd-radio input { accent-color: var(--primary); }
  .bd-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-soft); margin-top: 8px; }
</style>
</head>

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const m = (d.getMonth() + 1).toString().padStart(2, '0');
  const day = d.getDate().toString().padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function showToast(msg) {

// ---------- 侧边栏菜单顺序 ----------
function getNavOrder() {
  try {
    const v = JSON.parse(localStorage.getItem(NAV_ORDER_KEY) || 'null');
    return Array.isArray(v) ? v : null;
  } catch (e) { return null; }
}
function saveNavOrder() {
  const nav = document.getElementById('navList');
  if (!nav) return;
  const ids = Array.from(nav.querySelectorAll('.nav-entry')).map(e => e.dataset.module).filter(Boolean);
  localStorage.setItem(NAV_ORDER_KEY, JSON.stringify(ids));
}
function orderedModules() {
  const order = getNavOrder();
  if (!order || !order.length) return MODULES.slice();
  const pos = {}; order.forEach((id, i) => { pos[id] = i; });
  const known = MODULES.filter(m => pos[m.id] !== undefined);
  const unknown = MODULES.filter(m => pos[m.id] === undefined);
  known.sort((a, b) => pos[a.id] - pos[b.id]);
  return known.concat(unknown);
}
function navMoveHtml() {
  return `<span class="nav-move">
      <span class="nav-move-btn" data-move="up" title="上移">↑</span>
      <span class="nav-move-btn" data-move="down" title="下移">↓</span>
    </span>`;
}
function moveNavEntry(el, dir) {
  const parent = el.parentNode;
  if (!parent) return;
  if (dir < 0) {
    const prev = el.previousElementSibling;
    if (prev) parent.insertBefore(el, prev);
  } else {
    const next = el.nextElementSibling;
    if (next) parent.insertBefore(next, el);
  }
  saveNavOrder();
}
function attachNavReorder(nav) {
  const entries = Array.from(nav.querySelectorAll('.nav-entry'));
  entries.forEach((el, i) => {
    const up = el.querySelector('[data-move="up"]');
    const down = el.querySelector('[data-move="down"]');
    if (up) { if (i === 0) up.dataset.disabled = '1'; else delete up.dataset.disabled; }
    if (down) { if (i === entries.length - 1) down.dataset.disabled = '1'; else delete down.dataset.disabled; }
  });
  nav.querySelectorAll('.nav-move .nav-move-btn').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      e.preventDefault();
      if (b.dataset.disabled) return;
      const entry = b.closest('.nav-entry');
      if (!entry) return;
      moveNavEntry(entry, b.dataset.move === 'up' ? -1 : 1);
      renderNav();
    });
  });
  let dragEl = null;
  entries.forEach(el => {
    el.addEventListener('dragstart', e => {
      dragEl = el;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', el.dataset.module); } catch (_) {}
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      nav.querySelectorAll('.nav-entry').forEach(x => x.classList.remove('drag-over'));
      dragEl = null;
      saveNavOrder();
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragEl || dragEl === el) return;
      el.classList.add('drag-over');
      const rect = el.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      if (after) {
        if (el.nextSibling !== dragEl) nav.insertBefore(dragEl, el.nextSibling);
      } else {
        if (el.previousSibling !== dragEl) nav.insertBefore(dragEl, el);
      }
    });
    el.addEventListener('dragleave', () => { el.classList.remove('drag-over'); });
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drag-over'); });
  });
}

// ---------- 渲染:侧边栏 ----------
function renderNav() {
  const nav = document.getElementById('navList');
  const chevron = '<svg class="nav-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>';
  const dragAttr = navReorder ? 'true' : 'false';

  let html = '';
  orderedModules().forEach(m => {
    if (m.hidden) return;
    const isActive = (m.id === currentModule);
    const hasChildren = !!(m.children && m.children.length);
    const isGroup = hasChildren && m.group;  // 页签式父菜单：内容区页签，不在侧边栏展开子列表

    if (!hasChildren || isGroup) {
      html += `
        <button class="nav-item nav-entry ${isActive ? 'active' : ''} ${m.enabled ? '' : 'disabled'}"
                data-module="${m.id}" ${isGroup ? 'data-parent="1"' : ''} ${m.enabled ? '' : 'disabled'} draggable="${dragAttr}">
          <span class="nav-icon">${m.icon}</span>
          <span>${m.name}</span>
          ${isGroup ? '<span class="nav-group-badge">▾</span>' : ''}
          ${!m.enabled ? '<span class="nav-badge">即将上线</span>' : ''}
          ${navMoveHtml()}
        </button>`;
      return;
    }

    // 带二级类目的模块：在侧边栏内可展开
    const expanded = !!expandedModules[m.id];
    html += `
      <div class="nav-group nav-entry ${expanded ? 'expanded' : ''}" data-module="${m.id}" draggable="${dragAttr}">
        <button class="nav-item nav-parent ${isActive ? 'active' : ''} ${m.enabled ? '' : 'disabled'}"
                data-module="${m.id}" data-parent="1" ${m.enabled ? '' : 'disabled'}>
          <span class="nav-icon">${m.icon}</span>
          <span>${m.name}</span>
          ${navMoveHtml()}
          ${chevron}
        </button>
        <div class="nav-children" ${expanded ? '' : 'style="display:none;"'}>
          ${m.children.map(c => `
            <button class="nav-child ${isActive && currentSub === c.id ? 'active' : ''}"
                    data-module="${m.id}" data-sub="${c.id}">
              <span class="nav-child-icon">${c.icon || '•'}</span>
              <span>${c.name}</span>
            </button>`).join('')}
        </div>
      </div>`;
  });
  nav.innerHTML = html;

  // 普通模块 / 父级（展开）点击
  nav.querySelectorAll('.nav-item[data-module]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (navReorder) return;   // 排序模式下不导航
      const id = btn.dataset.module;
      const mod = MODULES.find(m => m.id === id);
      if (!mod || !mod.enabled) { showToast('该模块正在开发中,敬请期待'); return; }

      if (btn.dataset.parent) {
        // 页签式父菜单（group）：点击直接进入模块（默认展示首个页签）
        if (mod && mod.group) {
          currentModule = id;
          if (currentModule !== id || !currentSub) currentSub = mod.children[0].id;
          renderNav();
          renderContent();
          document.getElementById('sidebar').classList.remove('open');
          const _ov = document.getElementById('sidebarOverlay'); if (_ov) _ov.classList.remove('show');
          return;
        }
        // 普通父级：仅展开/收起子分类，侧边栏保持不关闭
        if (expandedModules[id]) {
          expandedModules[id] = false;
        } else {
          expandedModules[id] = true;
          // 展开时若尚未选中子分类，则跳到默认子分类
          if (currentModule !== id || !currentSub) {
            currentModule = id;
            currentSub = mod.children[0].id;
            renderContent();
          }
        }
        renderNav();
        return;   // 不关闭侧边栏
      }

      // 普通叶子模块
      currentModule = id;
      currentSub = null;
      renderNav();
      renderContent();
      document.getElementById('sidebar').classList.remove('open');
      const _ov = document.getElementById('sidebarOverlay'); if (_ov) _ov.classList.remove('show');
    });
  });

  // 二级类目点击：导航 + 移动端关闭侧边栏
  nav.querySelectorAll('.nav-child').forEach(btn => {
    btn.addEventListener('click', () => {
      if (navReorder) return;   // 排序模式下不导航
      const id = btn.dataset.module;
      const sub = btn.dataset.sub;
      currentModule = id;
      currentSub = sub;
      expandedModules[id] = true;
      renderNav();
      renderContent();
      document.getElementById('sidebar').classList.remove('open');
      const _ov = document.getElementById('sidebarOverlay'); if (_ov) _ov.classList.remove('show');
    });
  });

  // 排序模式：绑定 ↑↓ 与拖拽
  if (navReorder) attachNavReorder(nav);
}

// 默认选中顺序中的第 1 个可用菜单
// opts.keepSub: 若第 1 个菜单不变则保留原有二级类目选中，避免刷新后被重置
function selectFirstModule(opts) {
  opts = opts || {};
  const first = orderedModules().find(m => !m.hidden && m.enabled);
  if (!first) return;
  const sameModule = (first.id === currentModule);
  currentModule = first.id;
  if (sameModule && opts.keepSub && currentSub) return;   // 模块未变，不动当前子分类
  currentSub = (first.children && first.children.length) ? first.children[0].id : null;
  renderContent();
}

// 手机下载浮标：在线访问时点一下，把当前页面原样存为 index.html
function bindDownloadFab() {
  const btn = document.getElementById('dlFab');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    try {
      // 抓取当前页面源码（与线上文件逐字节一致），生成下载
      const res = await fetch(location.href, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      const old = btn.textContent;
      btn.textContent = '✅ 已下载';
      setTimeout(() => { btn.textContent = old; }, 2000);
    } catch (e) {
      alert('下载失败：' + e.message + '（请确认是通过在线网址打开的本页）');
    }
  });
}

// 移动端：汉堡按钮开关侧边栏 + 遮罩关闭
function bindMenuToggle() {
  const toggle = document.getElementById('menuToggle');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (!toggle || !sidebar) return;
  toggle.addEventListener('click', () => {
    const open = sidebar.classList.toggle('open');
    if (overlay) overlay.classList.toggle('show', open);
  });
  if (overlay) {
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
  }
}

// 侧边栏「调整菜单顺序」开关
function bindNavReorder() {
  const btn = document.getElementById('navReorderBtn');
  const sidebar = document.getElementById('sidebar');
  if (!btn || !sidebar) return;
  const syncRefresh = () => { renderNav(); };
  btn.addEventListener('click', () => {
    const finishing = navReorder;   // 当前处于排序模式，点击即完成排序
    navReorder = !navReorder;
    sidebar.classList.toggle('reorder-on', navReorder);
    btn.classList.toggle('active', navReorder);
    btn.textContent = navReorder ? '✓ 完成排序' : '⇅ 调整菜单顺序';
    if (finishing) {
      // 调整顺序完成后，默认选中第 1 个菜单
      selectFirstModule();
    }
    renderNav();
  });
  // 若已存在自定义顺序，提示用户可调整（无需强制开启）
  syncRefresh();
}

const DS_CATS_KEY = 'liumo_ds_cats';
const DS_LOGS_KEY = 'liumo_ds_logs';

function loadDailySales() {
  try {
    const d = localStorage.getItem(DS_CATS_KEY);
    dsCats = d ? JSON.parse(d) : [];
    if (!Array.isArray(dsCats)) dsCats = [];
  } catch (e) { dsCats = []; }
  try {
    const d = localStorage.getItem(DS_LOGS_KEY);
    dsLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(dsLogs)) dsLogs = [];
  } catch (e) { dsLogs = []; }
  try {
    const md = localStorage.getItem(DS_MODE_KEY);
    dsEntryMode = (md === 'day' || md === 'month') ? md : 'day';
  } catch (e) { dsEntryMode = 'day'; }
  dsCats.sort((a, b) => (a.order || 0) - (b.order || 0));
}
function saveDsCats() { localStorage.setItem(DS_CATS_KEY, JSON.stringify(dsCats)); }
function saveDsLogs() { localStorage.setItem(DS_LOGS_KEY, JSON.stringify(dsLogs)); }

// ---- 两级类别辅助 ----
// parentId 为空(undefined/null/''),视为一级大类
function dsIsTop(c) { return !c.parentId; }
function dsTopCats() { return dsCats.filter(dsIsTop).sort((a, b) => (a.order || 0) - (b.order || 0)); }
function dsChildren(parentId) { return dsCats.filter(c => c.parentId === parentId).sort((a, b) => (a.order || 0) - (b.order || 0)); }
function dsIsLeaf(c) { return dsChildren(c.id).length === 0; }
// 某类别(含其所有后代叶子)在指定日期的「每日营业额」合计
function dsSumAmtForCat(catId, date) {
  const c = dsCats.find(x => x.id === catId);
  if (!c) return 0;
  let s = 0;
  if (date) {
    const r = dsLogs.find(l => l.catId === catId && l.date === date);
    if (r) s += Number(r.amount) || 0;
  } else {
    s += dsLogs.filter(l => l.catId === catId).reduce((a, l) => a + (Number(l.amount) || 0), 0);
  }
  dsChildren(catId).forEach(ch => { s += dsSumAmtForCat(ch.id, date); });
  return s;
}

// 取某类别某日期记录
function dsGet(catId, date) {
  return dsLogs.find(l => l.catId === catId && l.date === date) || null;
}
// 某日期「每日营业额」汇总
function dsSumAmt(date) {
  return dsLogs.filter(l => l.date === date).reduce((s, l) => s + (Number(l.amount) || 0), 0);
}
// 某类别某月「营业额」汇总（用于按月填写预填 / 小计）
function dsMonthCatAmt(catId, y, m) {
  const p = y + '-' + ('0' + m).slice(-2);
  return dsLogs.filter(l => l.catId === catId && (l.date || '').slice(0, 7) === p).reduce((s, l) => s + (Number(l.amount) || 0), 0);
}
// 上月平均值：若上月为「按月填写」（数据全部集中在当月 1 号），则除以上月总天数；否则除以上月有数据的天数
function dsLastMonthAvg(y, m) {
  let ly = y, lm = m - 1;
  if (lm < 1) { lm = 12; ly--; }
  const lp = ly + '-' + ('0' + lm).slice(-2);
  const logs = dsLogs.filter(l => (l.date || '').slice(0, 7) === lp);
  if (logs.length === 0) return 0;
  const total = logs.reduce((s, l) => s + (Number(l.amount) || 0), 0);
  const daySet = new Set(logs.map(l => l.date));
  // 按月填写时所有类别都写入当月 1 号，故上月仅 1 号有数据即视为按月，除数取上月总天数
  const isMonthly = daySet.size === 1 && [...daySet][0] === lp + '-01';
  const days = isMonthly ? new Date(ly, lm, 0).getDate() : daySet.size;
  return days > 0 ? total / days : 0;
}
// 某大类（含全部子类）的上月日均：按月则除上月总天数，否则除该大类上月有数据的天数
function dsCatLastMonthAvg(catId, y, m) {
  let ly = y, lm = m - 1;
  if (lm < 1) { lm = 12; ly--; }
  const lp = ly + '-' + ('0' + lm).slice(-2);
  const logs = dsLogs.filter(l => (l.date || '').slice(0, 7) === lp && dsIsDescendantOrSelf(catId, l.catId));
  if (logs.length === 0) return 0;
  const total = logs.reduce((s, l) => s + (Number(l.amount) || 0), 0);
  const daySet = new Set(logs.map(l => l.date));
  const isMonthly = daySet.size === 1 && [...daySet][0] === lp + '-01';
  const days = isMonthly ? new Date(ly, lm, 0).getDate() : daySet.size;
  return days > 0 ? total / days : 0;
}
// 判断某月数据是否为「按月填写」（全部集中在当月 1 号）；无数据返回 null
function dsDetectMonthMode(y, m) {
  const p = y + '-' + ('0' + m).slice(-2);
  const logs = dsLogs.filter(l => (l.date || '').slice(0, 7) === p);
  if (logs.length === 0) return null;
  const daySet = new Set(logs.map(l => l.date));
  return (daySet.size === 1 && [...daySet][0] === p + '-01') ? 'month' : 'day';
}
// 某月是否已有录入数据
function dsMonthHasData(y, m) {
  const p = y + '-' + ('0' + m).slice(-2);
  return dsLogs.some(l => (l.date || '').slice(0, 7) === p);
}
// 某大类（含全部子类）某月营业额合计
function dsCatMonthTotal(catId, y, m) {
  const p = y + '-' + ('0' + m).slice(-2);
  let s = 0;
  for (let d = 1; d <= new Date(y, m, 0).getDate(); d++) s += dsCatDayAmt(catId, p + '-' + ('0' + d).slice(-2));
  return s;
}
// 某大类（含全部子类）某月日均
// 当前月：仅统计今天以前已填的日期（不含当日），日均 = 已填合计 ÷ 已填天数
// 其它月份：合计 ÷ 当月天数
function dsCatMonthAvg(catId, y, m) {
  const prefix = y + '-' + ('0' + m).slice(-2);
  const now = new Date();
  const curPrefix = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
  if (prefix === curPrefix) {
    let total = 0, filled = 0;
    for (let d = 1; d < now.getDate(); d++) {
      const v = dsCatDayAmt(catId, prefix + '-' + ('0' + d).slice(-2));
      if (v > 0) { total += v; filled++; }
    }
    return filled > 0 ? total / filled : 0;
  }
  const days = new Date(y, m, 0).getDate();
  return days > 0 ? dsCatMonthTotal(catId, y, m) / days : 0;
}
// 日期偏移（deltaDays 可正可负），返回 YYYY-MM-DD
function dsShiftDate(dateStr, deltaDays) {
  const dt = new Date(dateStr + 'T00:00:00');
  dt.setDate(dt.getDate() + deltaDays);
  return dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2) + '-' + ('0' + dt.getDate()).slice(-2);
}
// 对比分析：单行（类别 + 两期值 + 差异 + 变化%）
function dsCmpRowHtml(name, catCls, rowCls, a, b) {
  const diff = a - b;
  const sign = diff > 0 ? '+' : (diff < 0 ? '-' : '');
  const diffTxt = diff === 0 ? '0' : sign + saMoney(Math.abs(diff));
  const diffCls = diff > 0 ? 'up' : (diff < 0 ? 'down' : '');
  let pctTxt = '—', pctCls = '';
  if (b !== 0) { const pct = (diff / b) * 100; pctTxt = (pct > 0 ? '+' : '') + pct.toFixed(1) + '%'; pctCls = diff > 0 ? 'up' : (diff < 0 ? 'down' : ''); }
  else if (a !== 0) { pctTxt = '—'; }
  return `<tr class="${rowCls}">
    <td class="ds-tbl-cat ${catCls}">${escapeHtml(name)}</td>
    <td class="ds-tbl-v">${saMoney(a)}</td>
    <td class="ds-tbl-v">${saMoney(b)}</td>
    <td class="ds-tbl-v ds-cmp-diff ${diffCls}">${diffTxt}</td>
    <td class="ds-tbl-v ds-cmp-pct ${pctCls}">${pctTxt}</td>
  </tr>`;
}
function dsCmpTotalRow(a, b) {
  const diff = a - b;
  const sign = diff > 0 ? '+' : (diff < 0 ? '-' : '');
  const diffTxt = diff === 0 ? '0' : sign + saMoney(Math.abs(diff));
  const diffCls = diff > 0 ? 'up' : (diff < 0 ? 'down' : '');
  let pctTxt = '—', pctCls = '';
  if (b !== 0) { const pct = (diff / b) * 100; pctTxt = (pct > 0 ? '+' : '') + pct.toFixed(1) + '%'; pctCls = diff > 0 ? 'up' : (diff < 0 ? 'down' : ''); }
  return `<tr class="ds-tbl-total">
    <td class="ds-tbl-cat">合计</td>
    <td class="ds-tbl-v ds-tbl-sum-v">${saMoney(a)}</td>
    <td class="ds-tbl-v ds-tbl-sum-v">${saMoney(b)}</td>
    <td class="ds-tbl-v ds-tbl-sum-v ds-cmp-diff ${diffCls}">${diffTxt}</td>
    <td class="ds-tbl-v ds-tbl-sum-v ds-cmp-pct ${pctCls}">${pctTxt}</td>
  </tr>`;
}
// 对比分析：通用表格（getA/getB 取值函数；合计仅累加大类，避免展开小类重复统计）
function buildDsCmpTable(getA, getB, expanded, colAName, colBName) {
  const tops = dsTopCats();
  if (tops.length === 0) return '<div class="wt-empty">尚未添加类别，请先到「类别管理」添加</div>';
  const head = `<tr><th class="ds-tbl-cat">类别</th><th>${colAName}</th><th>${colBName}</th><th>差异</th><th>变化</th></tr>`;
  let body = '', totA = 0, totB = 0;
  tops.forEach(top => {
    const a = getA(top.id), b = getB(top.id);
    totA += a; totB += b;
    body += dsCmpRowHtml(top.name, 'ds-tbl-top', 'ds-tbl-leaf', a, b);
    if (expanded) dsChildren(top.id).forEach(k => { body += dsCmpRowHtml(k.name, 'ds-tbl-sub', 'ds-tbl-leaf ds-tbl-sub-row', getA(k.id), getB(k.id)); });
  });
  body += dsCmpTotalRow(totA, totB);
  return `<table class="ds-tbl ds-tbl-cmp"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
// 设置查看月份，并据数据自动匹配填写方式（不弹提醒）
function dsSetMonth(y, m) {
  dsCalY = y; dsCalM = m;
  const dm = dsDetectMonthMode(y, m);
  if (dm) dsEntryMode = dm;
}
// 切换月份：设置月份 + 自动匹配方式，并在已有数据时弹窗提醒

function dsAlert(msg) {

// 写入/更新某类别某日期数据
function dsUpsert(catId, date, amount) {
  const now = Date.now();
  const r = dsGet(catId, date);
  if (r) { r.amount = amount; r.updatedAt = now; }
  else dsLogs.push({ id: uid(), catId, date, amount, createdAt: now, updatedAt: now });
  saveDsLogs();
}
// 删除类别（级联删除其全部子类别及销售数据）
function dsDeleteCat(catId) {
  const toDel = new Set([catId]);
  let changed = true;
  while (changed) {
    changed = false;
    dsCats.forEach(c => {
      if (c.parentId && toDel.has(c.parentId) && !toDel.has(c.id)) { toDel.add(c.id); changed = true; }
    });
  }
  dsLogs = dsLogs.filter(l => !toDel.has(l.catId));
  dsCats = dsCats.filter(c => !toDel.has(c.id));
  saveDsLogs(); saveDsCats();
}
// 给某一级添加二级类别；若该一级原本有自身销售记录,自动归入「其他」小类,避免数据丢失
function dsAddSubCat(parentId, name) {
  const parent = dsCats.find(c => c.id === parentId);
  if (!parent) return;
  if (!dsChildren(parentId).length) {
    // 第一个子类别:若该大类自身曾作为叶子录入过,迁移到「其他」
    if (dsLogs.some(l => l.catId === parentId)) {
      const other = { id: uid(), name: '其他', order: 0, parentId: parentId };
      dsCats.push(other);
      dsLogs.forEach(l => { if (l.catId === parentId) l.catId = other.id; });
      saveDsLogs();
      showToast('已将原大类记录归入「其他」小类');
    }
  }
  dsCats.push({ id: uid(), name, order: dsChildren(parentId).length, parentId });
  saveDsCats();
}

    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    dsCats.push({ id: uid(), name, order: dsCats.length });
    saveDsCats();
    nameInput.value = '';
    renderDsCatTab(body);
  });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addBtn.click(); });
  renderDsCatList(body);
}

function renderDsCatList(body) {
  const list = document.getElementById('dsCatList');
  if (!list) return;
  if (dsTopCats().length === 0) {
    list.innerHTML = '<div class="wt-empty">还没有类别，先添加一个吧</div>';
    return;
  }
  const catItemHtml = (c, isSub) => {
    const editInput = dsEditingCatId === c.id
      ? `<input type="text" class="ds-cat-edit" data-id="${c.id}" value="${escapeAttr(c.name)}" style="flex:1;" />`
      : `<div class="iv-name">${escapeHtml(c.name)}</div>`;
    const kids = isSub ? [] : dsChildren(c.id);
    const open = !isSub && !!dsCatOpen[c.id];
    const toggleBtn = (!isSub && kids.length > 0)
      ? `<button class="btn-sm btn-sub ds-cat-toggle" data-act="toggle" data-id="${c.id}">${open ? '▾ 收起' : '▸ 子类'}(${kids.length})</button>`
      : '';
    const actions = dsEditingCatId === c.id
      ? `<button class="btn-sm btn-save" data-act="save" data-id="${c.id}">保存</button>
         <button class="btn-sm btn-cancel" data-act="cancel" data-id="${c.id}">取消</button>`
      : `${toggleBtn}
         <button class="btn-sm btn-edit" data-act="edit" data-id="${c.id}">编辑</button>
         <button class="btn-sm btn-del" data-act="del" data-id="${c.id}">删除</button>
         ${isSub ? '' : `<button class="btn-sm btn-sub" data-act="addsub" data-id="${c.id}">+ 子类别</button>`}`;
    return `<div class="wt-item ${isSub ? 'ds-sub' : 'ds-top'}">
      ${editInput}
      <div class="wt-item-actions">${actions}</div>
    </div>`;
  };
  const subAddHtml = (topId) => dsAddingSubId === topId
    ? `<div class="wt-item ds-sub ds-sub-add">
         <input type="text" class="ds-sub-edit" data-pid="${topId}" placeholder="子类别名称" style="flex:1;" />
         <div class="wt-item-actions">
           <button class="btn-sm btn-save" data-act="subsave" data-pid="${topId}">添加</button>
           <button class="btn-sm btn-cancel" data-act="subcancel" data-pid="${topId}">取消</button>
         </div>
       </div>`
    : '';

  list.innerHTML = dsTopCats().map(top => {
    const open = !!dsCatOpen[top.id];
    const kids = dsChildren(top.id);
    const subHtml = (!open && dsAddingSubId !== top.id)
      ? ''
      : `${kids.map(sub => catItemHtml(sub, true)).join('')}${subAddHtml(top.id)}`;
    return `
    <div class="ds-cat-group">
      ${catItemHtml(top, false)}
      <div class="ds-sub-list">${subHtml}</div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-act]').forEach(btn => {
    const act = btn.getAttribute('data-act');
    const id = btn.getAttribute('data-id');
    const pid = btn.getAttribute('data-pid');
    btn.addEventListener('click', () => {
      if (act === 'toggle') {
        dsCatOpen[id] = !dsCatOpen[id]; renderDsCatList(body);
      } else if (act === 'edit') {
        dsEditingCatId = id; dsAddingSubId = null; renderDsCatList(body);
        const inp = list.querySelector('.ds-cat-edit[data-id="' + id + '"]'); if (inp) { inp.focus(); inp.select(); }
      } else if (act === 'cancel') {
        dsEditingCatId = null; renderDsCatList(body);
      } else if (act === 'addsub') {
        dsAddingSubId = id; dsEditingCatId = null; dsCatOpen[id] = true; renderDsCatList(body);
        const inp = list.querySelector('.ds-sub-edit[data-pid="' + id + '"]'); if (inp) { inp.focus(); }
      } else if (act === 'subcancel') {
        dsAddingSubId = null; renderDsCatList(body);
      } else if (act === 'subsave') {
        const inp = list.querySelector('.ds-sub-edit[data-pid="' + pid + '"]');
        const name = (inp ? inp.value : '').trim();
        if (!name) { if (inp) inp.focus(); return; }
        dsAddSubCat(pid, name);
        dsAddingSubId = null; renderDsCatList(body);
      } else if (act === 'save') {
        const inp = list.querySelector('.ds-cat-edit[data-id="' + id + '"]');
        const name = (inp ? inp.value : '').trim();
        if (!name) { if (inp) inp.focus(); return; }
        const cat = dsCats.find(c => c.id === id);
        if (cat) { cat.name = name; saveDsCats(); }
        dsEditingCatId = null; renderDsCatList(body);
      } else if (act === 'del') {
        const cat = dsCats.find(c => c.id === id);
        const hasKids = cat && dsChildren(id).length > 0;
        const msg = hasKids
          ? '确定删除该大类？其下全部子类别及销售记录将一并删除。'
          : '确定删除该类别？其全部销售记录将一并删除。';
        if (confirm(msg)) {
          dsDeleteCat(id);
          dsEditingCatId = null; dsAddingSubId = null; renderDsCatList(body);
        }
      }
    });
  });
  list.querySelectorAll('.ds-cat-edit').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { const b = list.querySelector('.btn-save[data-id="' + inp.getAttribute('data-id') + '"]'); if (b) b.click(); }
      if (e.key === 'Escape') { dsEditingCatId = null; renderDsCatList(body); }
    });
  });
  list.querySelectorAll('.ds-sub-edit').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { const b = list.querySelector('.btn-save[data-pid="' + inp.getAttribute('data-pid') + '"]'); if (b) b.click(); }
      if (e.key === 'Escape') { dsAddingSubId = null; renderDsCatList(body); }
    });
  });
}

// ---------- 大类×日期表：行=一级大类，列=当月每日 + 月合计 ----------
// 某一级大类（含其所有后代叶子）在指定日期的合计
function dsCatDayAmt(catId, date) {
  let s = 0;
  dsLogs.forEach(l => {
    if (l.date !== date) return;
    if (!dsIsDescendantOrSelf(catId, l.catId)) return;
    s += Number(l.amount) || 0;
  });
  return s;
}
// catId 是否等于或包含 descId（含全部后代）
function dsIsDescendantOrSelf(catId, descId) {
  if (catId === descId) return true;
  return dsChildren(catId).some(ch => dsIsDescendantOrSelf(ch.id, descId));
}
function buildDsCatDateTable(y, m, expanded) {
  const tops = dsTopCats();
  if (tops.length === 0) return { html: '<div class="wt-empty">尚未添加类别，请先到「类别管理」添加</div>', totalSum: 0, totalFilled: 0, catCount: 0, monthly: false };
  const prefix = y + '-' + ('0' + m).slice(-2);
  const daysInMonth = new Date(y, m, 0).getDate();
  const dowArr = ['日', '一', '二', '三', '四', '五', '六'];
  const now = new Date();
  const curPrefix = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
  // 当前月：今天及以后的日期不显示（只到昨天）；其它月份显示整月
  const lastDay = prefix === curPrefix ? Math.max(0, now.getDate() - 1) : daysInMonth;
  // 按月填写的月份：用「本月均值」列替代逐日列
  const monthly = dsDetectMonthMode(y, m) === 'month';
  // 全品类合计均值（用于计算各品类金额占比）
  const grandMAvg = tops.reduce((s, c) => s + dsCatMonthAvg(c.id, y, m), 0);
  const grandLAvg = tops.reduce((s, c) => s + dsCatLastMonthAvg(c.id, y, m), 0);
  const pctTxt = x => (x).toFixed(1) + '%';

  // 列头：首列「大类」+（按月：本月均值 | 按日：各日）+ 本月均值 + 本月占比 + 上月均值 + 上月占比
  let head = `<tr><th class="ds-tbl-cat">大类</th>`;
  if (monthly) {
    head += `<th class="ds-tbl-avg ds-tbl-avg-col ds-tbl-mavg">本月均值</th><th class="ds-tbl-avg ds-tbl-avg-col">本月占比</th>`;
  } else {
    for (let d = 1; d <= lastDay; d++) {
      const dow = new Date(y, m - 1, d).getDay();
      const wk = (dow === 0 || dow === 6) ? ' ds-tbl-wk' : '';
      head += `<th class="ds-tbl-d${wk}" title="${d}日 周${dowArr[dow]}">${d}</th>`;
    }
    head += `<th class="ds-tbl-avg ds-tbl-avg-col ds-tbl-mavg">本月均值</th><th class="ds-tbl-avg ds-tbl-avg-col">本月占比</th>`;
  }
  head += `<th class="ds-tbl-avg ds-tbl-avg-col ds-tbl-last">上月均值</th><th class="ds-tbl-avg ds-tbl-avg-col ds-tbl-last">上月占比</th></tr>`;

  // 某类别一行（大类 / 小类共用）：各日（按日）或本月均值（按月）+ 本月均值 + 本月占比 + 上月均值 + 上月占比
  const overallFilledSet = new Set();
  const makeRow = (catId, name, rowCls, catCls, avgTitle) => {
    const avg = dsCatLastMonthAvg(catId, y, m);
    const mAvg = dsCatMonthAvg(catId, y, m);
    // 本月均值低于上月均值 → 绿色
    const mAvgLow = (mAvg > 0 && avg > 0 && mAvg < avg) ? ' ds-below' : '';
    const mShare = (mAvg > 0 && grandMAvg > 0) ? (mAvg / grandMAvg * 100) : 0;
    const lShare = (avg > 0 && grandLAvg > 0) ? (avg / grandLAvg * 100) : 0;
    let r = `<tr class="${rowCls}"><td class="ds-tbl-cat ${catCls}">${escapeHtml(name)}</td>`;
    let rowSum = 0;
    if (monthly) {
      for (let d = 1; d <= daysInMonth; d++) { const date = prefix + '-' + ('0' + d).slice(-2); rowSum += dsCatDayAmt(catId, date); }
      r += `<td class="ds-tbl-v ds-tbl-avg-v ds-tbl-mavg${mAvgLow}" title="${escapeAttr(name)} 本月均值">${mAvg ? saMoney(mAvg) : '—'}</td>`;
    } else {
      for (let d = 1; d <= lastDay; d++) {
        const date = prefix + '-' + ('0' + d).slice(-2);
        const v = dsCatDayAmt(catId, date);
        rowSum += v;
        const dow = new Date(y, m - 1, d).getDay();
        const wk = (dow === 0 || dow === 6) ? ' ds-tbl-wk' : '';
        // 最后一天的数据与本月均值对比，低于则绿色
        const lowCls = (d === lastDay && mAvg > 0 && v > 0 && v < mAvg) ? ' ds-below' : '';
        r += `<td class="ds-tbl-v${v ? '' : ' ds-tbl-empty'}${wk}${lowCls}" title="${escapeAttr(name)} ${d}日${v ? '：' + saMoney(v) : '：未填'}">${v ? saMoney(v) : ''}</td>`;
        if (v > 0) overallFilledSet.add(date);
      }
      r += `<td class="ds-tbl-v ds-tbl-avg-v ds-tbl-mavg${mAvgLow}" title="${escapeAttr(name)} 本月均值（当前月为今天以前已填日均）">${mAvg ? saMoney(mAvg) : '—'}</td>`;
    }
    r += `<td class="ds-tbl-v ds-tbl-share" title="${escapeAttr(name)} 本月均值占比（占全品类合计）">${pctTxt(mShare)}</td>`;
    r += `<td class="ds-tbl-v ds-tbl-avg-v ds-tbl-last" title="${escapeAttr(avgTitle)}">${avg ? saMoney(avg) : '—'}</td>`;
    r += `<td class="ds-tbl-v ds-tbl-share ds-tbl-last" title="${escapeAttr(avgTitle)} 上月均值占比（占全品类合计）">${pctTxt(lShare)}</td></tr>`;
    return { html: r, rowSum };
  };

  // 行：每个一级大类一行（含其全部子类汇总）；展开时追加其下小类明细行
  let body = '';
  let totalSum = 0;
  tops.forEach(top => {
    const rr = makeRow(top.id, top.name, 'ds-tbl-leaf', 'ds-tbl-top', top.name + ' 上月日均');
    body += rr.html;
    // 大类行已包含其全部子类，合计仅累加大类，避免展开小类时重复统计
    totalSum += rr.rowSum;
    if (expanded) {
      const kids = dsChildren(top.id);
      if (kids.length) {
        kids.forEach(k => { body += makeRow(k.id, k.name, 'ds-tbl-leaf ds-tbl-sub-row', 'ds-tbl-sub', k.name + ' 上月日均').html; });
      }
    }
  });
  // 底部合计行：各类别列 + 本月均值（全品类） + 本月占比(100%) + 上月均值（全品类） + 上月占比(100%)
  const allAvg = grandMAvg;
  const lastAvgAll = grandLAvg;
  const allAvgLow = (allAvg > 0 && lastAvgAll > 0 && allAvg < lastAvgAll) ? ' ds-below' : '';
  let tRow = `<tr class="ds-tbl-total"><td class="ds-tbl-cat">合计</td>`;
  if (monthly) {
    tRow += `<td class="ds-tbl-v ds-tbl-avg-v ds-tbl-mavg${allAvgLow}" title="本月全品类日均">${allAvg ? saMoney(allAvg) : '—'}</td>`;
  } else {
    for (let d = 1; d <= lastDay; d++) {
      const date = prefix + '-' + ('0' + d).slice(-2);
      const v = dsSumAmt(date);
      if (v > 0) overallFilledSet.add(date);
      const dow = new Date(y, m - 1, d).getDay();
      const wk = (dow === 0 || dow === 6) ? ' ds-tbl-wk' : '';
      // 最后一天的合计与本月均值对比，低于则绿色
      const lowCls = (d === lastDay && allAvg > 0 && v > 0 && v < allAvg) ? ' ds-below' : '';
      tRow += `<td class="ds-tbl-v ds-tbl-total-cell${wk}${lowCls}">${v ? saMoney(v) : ''}</td>`;
    }
    tRow += `<td class="ds-tbl-v ds-tbl-avg-v ds-tbl-mavg${allAvgLow}" title="本月全品类日均（当前月为今天以前已填日均）">${allAvg ? saMoney(allAvg) : '—'}</td>`;
  }
  tRow += `<td class="ds-tbl-v ds-tbl-share ds-tbl-sum-v" title="本月全品类占比">100.0%</td>`;
  tRow += `<td class="ds-tbl-v ds-tbl-avg-v ds-tbl-sum-v ds-tbl-last" title="上月全品类日均">${saMoney(lastAvgAll)}</td>`;
  tRow += `<td class="ds-tbl-v ds-tbl-share ds-tbl-sum-v ds-tbl-last" title="上月全品类占比">100.0%</td></tr>`;
  body += tRow;
  const totalFilled = overallFilledSet.size;

  const html = `<table class="ds-tbl${monthly ? ' ds-tbl-monthly' : ''}"><thead>${head}</thead><tbody>${body}</tbody></table>`;
  return { html, totalSum, totalFilled, catCount: tops.length, monthly };
}
