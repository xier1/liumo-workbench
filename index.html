function renderSalaryStats() {
  const el = document.getElementById('saStats');
  if (!el) return;
  const asc = salaryAsc();
  const desc = salaryDesc();
  const last = desc.length ? desc[0] : null;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 11, 1);
  const cutoffStr = start.getFullYear() + '-' + ('0' + (start.getMonth() + 1)).slice(-2);
  const last12 = asc.filter(l => l.date >= cutoffStr);
  const sum12 = last12.reduce((s, l) => s + (l.total || 0), 0);
  const avgHead = last12.length ? (last12.reduce((s, l) => s + (l.head || 0), 0) / last12.length) : null;
  // 人效 = 营业额 ÷ 当月天数 ÷（人数 − 2）
  const daysOf = l => { if (!l) return null; const p = (l.date || '').split('-').map(Number); return (p[0] && p[1]) ? new Date(p[0], p[1], 0).getDate() : null; };
  const effOf = l => { if (!l) return null; const d = daysOf(l); return (d && l.head > 2) ? (l.revenue || 0) / d / (l.head - 2) : null; };
  // 平均工资 = 总工资 ÷（人数 − 2）（不含管理人员）
  const avgSalOf = l => (!l ? null : (l.head > 2 ? l.total / (l.head - 2) : null));
  const perCap = effOf(last);
  const avgSal = avgSalOf(last);
  const effLast12 = last12.map(effOf).filter(v => v != null);
  const avgEff = effLast12.length ? Math.round(effLast12.reduce((s, v) => s + v, 0) / effLast12.length) : null;
  const avgSalLast12 = last12.map(avgSalOf).filter(v => v != null);
  const avgSalary12 = avgSalLast12.length ? Math.round(avgSalLast12.reduce((s, v) => s + v, 0) / avgSalLast12.length) : null;
  const cards = [];
  cards.push(statCard('上月人数', last ? last.head + ' 人' : '—', ''));
  cards.push(statCard('平均月人数', avgHead != null ? avgHead.toFixed(1) + ' 人' : '—', ''));
  cards.push(statCard('上月人效', perCap != null ? Math.round(perCap) + ' 元/人' : '—', 'success'));
  cards.push(statCard('近一年平均人效', avgEff != null ? avgEff + ' 元/人' : '—', ''));
  cards.push(statCard('上月平均工资', avgSal != null ? Math.round(avgSal) + ' 元/人' : '—', ''));
  cards.push(statCard('近一年平均工资', avgSalary12 != null ? avgSalary12 + ' 元/人' : '—', ''));
  el.innerHTML = cards.join('');
}

function buildSalaryLineSVG(logs, getVal, color, unit, marks) {
  const W = 640, H = 210, padL = 54, padR = 14, padT = 12, padB = 28;
  const all = logs.map(getVal).filter(v => v != null && isFinite(v));
  if (all.length === 0) return `<div class="wt-empty" style="padding:18px 0;">暂无数据</div>`;
  let vMin = Math.min.apply(null, all), vMax = Math.max.apply(null, all);
  if (vMin === vMax) { const pad = Math.max(1, Math.abs(vMax) * 0.1 || 1); vMin -= pad; vMax += pad; }
  const vRange = vMax - vMin;
  const n = logs.length;
  const xOf = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
  const yOf = v => H - padB - ((v - vMin) / vRange) * (H - padT - padB);
  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const gy = padT + k * (H - padT - padB) / 3;
    const val = vMax - (k / 3) * vRange;
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${Math.round(val)}</text>`;
  }
  let line = '', dots = '', prev = false;
  logs.forEach((l, i) => {
    const v = getVal(l);
    if (v == null || !isFinite(v)) { prev = false; return; }
    const x = xOf(i), y = yOf(v);
    line += (prev ? ' ' : '') + x.toFixed(1) + ',' + y.toFixed(1);
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}" stroke="#fff" stroke-width="1.5"><title>${escapeHtml(l.date)} ${Math.round(v)}${unit}</title></circle>`;
    prev = true;
  });
  let xlab = '';
  const step = Math.max(1, Math.ceil(n / 6));
  logs.forEach((l, i) => {
    if (i % step === 0 || i === n - 1) {
      const x = xOf(i);
      xlab += `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#9ca3af">${escapeHtml(l.date.slice(5))}</text>`;
    }
  });
  let marksSvg = '';
  if (marks) {
    const markList = [];
    if (marks.last != null) markList.push({ i: marks.last, kind: 'last' });
    if (marks.yoy != null) markList.push({ i: marks.yoy, kind: 'yoy' });
    markList.forEach(m => {
      const l = logs[m.i];
      if (!l) return;
      const v = getVal(l);
      if (v == null || !isFinite(v)) return;
      const x = xOf(m.i), y = yOf(v);
      const ring = m.kind === 'yoy' ? '#dc2626' : color;
      const isEnd = m.i === n - 1;
      const anchor = isEnd ? 'end' : 'middle';
      const tx = isEnd ? x - 6 : x;
      let ty = y - 9;
      if (ty < 14) ty = y + 16;
      marksSvg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="none" stroke="${ring}" stroke-width="2"/>`;
      marksSvg += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" font-size="10" font-weight="700" fill="${ring}">${Math.round(v)}${unit}</text>`;
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}<polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xlab}${marksSvg}</svg>`;
}

// 多项成本年度曲线：x 轴为 1-12 月，每个 series 代表一年（一条曲线），点上标记数值
function buildYearLinesSVG(series) {
  const W = 660, H = 240, padL = 56, padR = 16, padT = 18, padB = 34;
  const allVals = [];
  series.forEach(s => Object.values(s.vals).forEach(v => { if (isFinite(v)) allVals.push(v); }));
  if (allVals.length === 0) return `<div class="wt-empty" style="padding:18px 0;">暂无数据</div>`;
  let vMax = Math.max.apply(null, allVals);
  let vMin = Math.min.apply(null, allVals);
  if (vMin > 0) vMin = 0;
  if (vMax <= vMin) vMax = vMin + Math.max(1, Math.abs(vMin) || 1);
  const vRange = vMax - vMin;
  const months = 12;
  const xOf = m => padL + (m - 1) * (W - padL - padR) / (months - 1);
  const yOf = v => H - padB - (v - vMin) / vRange * (H - padT - padB);
  let grid = '';
  for (let k = 0; k <= 4; k++) {
    const gy = padT + k * (H - padT - padB) / 4;
    const val = vMax - (k / 4) * vRange;
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${Math.round(val)}</text>`;
  }
  let xlab = '';
  for (let m = 1; m <= 12; m++) {
    if (m % 2 === 1 || m === 12) {
      const x = xOf(m);
      xlab += `<text x="${x.toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="9" fill="#9ca3af">${m}月</text>`;
    }
  }
  let lines = '', dots = '', labels = '';
  series.forEach(s => {
    const pts = Object.keys(s.vals).map(Number).sort((a, b) => a - b);
    if (pts.length === 0) return;
    let poly = '', prev = false;
    pts.forEach(m => {
      const v = s.vals[m];
      const x = xOf(m), y = yOf(v);
      poly += (prev ? ' ' : '') + x.toFixed(1) + ',' + y.toFixed(1);
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${s.color}" stroke="#fff" stroke-width="1.4"><title>${s.year}年${m}月 ${Math.round(v)}元</title></circle>`;
      let ty = y - 8; if (ty < 12) ty = y + 14; if (ty > H - 6) ty = y - 14;
      labels += `<text x="${x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${s.color}">${Math.round(v)}</text>`;
      prev = true;
    });
    lines += `<polyline points="${poly}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}${lines}${dots}${xlab}${labels}</svg>`;
}

function renderSalaryChart() {
  const el = document.getElementById('saChart');
  if (!el) return;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 23, 1); // 近两年 = 24个月
  const cutoffStr = start.getFullYear() + '-' + ('0' + (start.getMonth() + 1)).slice(-2);
  const logs = salaryAsc().filter(l => l.date >= cutoffStr);
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">还没有工资记录,先在上方记录月份工资吧</div>`;
    return;
  }
  const daysOf = l => { const p = (l.date || '').split('-').map(Number); return (p[0] && p[1]) ? new Date(p[0], p[1], 0).getDate() : null; };
  // 人效 = 营业额 ÷ 当月天数 ÷（人数 − 2）
  const effOf = l => { const d = daysOf(l); return (d && l.head > 2) ? (l.revenue || 0) / d / (l.head - 2) : null; };
  // 平均工资 = 总工资 ÷（人数 − 2）（不含管理人员）
  const avgSalOf = l => (l.head > 2 ? l.total / (l.head - 2) : null);
  const lastLog = logs[logs.length - 1];
  const lastDate = lastLog.date;
  const [ly, lm] = lastDate.split('-').map(Number);
  const yoyStr = (ly - 1) + '-' + ('0' + lm).slice(-2);
  const yoyIdx = logs.findIndex(l => l.date === yoyStr);
  const charts = [
    { title: '营业额 (元)', color: '#14b8a6', unit: '元', get: l => l.revenue || 0 },
    { title: '总工资 (元)', color: '#6366f1', unit: '元', get: l => l.total || 0 },
    { title: '人数 (人)', color: '#f59e0b', unit: '人', get: l => l.head || 0 },
    { title: '人效 (元/人·天)', color: '#10b981', unit: '元/人', get: effOf },
    { title: '平均工资 (元/人)', color: '#ec4899', unit: '元/人', get: avgSalOf },
  ];
  el.innerHTML = charts.map(c => `
    <div class="wt-chart-sub">
      <div class="wt-chart-subtitle" style="color:${c.color}">${c.title}</div>
      ${buildSalaryLineSVG(logs, c.get, c.color, c.unit, { last: logs.length - 1, yoy: yoyIdx >= 0 ? yoyIdx : null })}
      <div class="wt-chart-subnote">最新 <b style="color:${c.color}">${lastDate}</b> · 同比 <b style="color:#dc2626">${yoyStr}</b>${yoyIdx >= 0 ? '' : '（暂无数据）'}</div>
    </div>`).join('');
}

function renderSalaryList() {
  const el = document.getElementById('saList');
  if (!el) return;
  const logs = salaryDesc();
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">暂无记录</div>`;
    return;
  }
  el.innerHTML = logs.map(l => {
    const d = (l.date || '').split('-').map(Number);
    const days = (d[0] && d[1]) ? new Date(d[0], d[1], 0).getDate() : null;
    const eff = (days && l.head > 2) ? Math.round((l.revenue || 0) / days / (l.head - 2)) : null;
    const avgSal = l.head > 2 ? Math.round(l.total / (l.head - 2)) : null;
    return `
      <div class="wt-item" data-id="${l.id}">
        <div class="wt-item-date">${escapeHtml(l.date)}</div>
        <div class="wt-item-delta">营业额 ${(l.revenue || 0)}元 · 总工资 ${l.total}元 · 人数 ${l.head}人${eff != null ? ' · 人效' + eff + '元/人' : ''}${avgSal != null ? ' · 平均工资' + avgSal + '元/人' : ''}</div>
        <button class="action-btn edit" data-action="sa-edit" data-id="${l.id}" title="修改">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        </button>
        <button class="action-btn delete" data-action="sa-del" data-id="${l.id}" title="删除">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </div>`;
  }).join('');
}

function bindSalaryEvents() {
  const addBtn = document.getElementById('salaryAddBtn');
  const totalEl = document.getElementById('salaryTotal');
  const revenueEl = document.getElementById('salaryRevenue');
  const headEl = document.getElementById('salaryHead');
  const list = document.getElementById('saList');

  function addLog() {
    const monthEl = document.getElementById('salaryMonth');
    const date = monthEl.value || currentMonthStr();
    const total = parseFloat(totalEl.value);
    const revenue = parseFloat(revenueEl.value);
    const head = parseFloat(headEl.value);
    if (isNaN(total) || total < 0) { showToast('请输入有效总工资'); totalEl.focus(); return; }
    if (isNaN(revenue) || revenue < 0) { showToast('请输入有效营业额'); revenueEl.focus(); return; }
    if (isNaN(head) || head < 0) { showToast('请输入有效人数'); headEl.focus(); return; }
    const exist = salaryLogs.find(l => l.date === date);
    if (exist) {
      exist.total = total; exist.revenue = revenue; exist.head = head; exist.updatedAt = Date.now();
    } else {
      salaryLogs.push({ id: uid(), date, total, revenue, head, createdAt: Date.now(), updatedAt: Date.now() });
    }
    salaryLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveSalaryLogs();
    totalEl.value = ''; revenueEl.value = ''; headEl.value = '';
    renderSalaryStats();
    renderSalaryChart();
    renderSalaryList();
      showToast(exist ? '已更新该月工资' : '已记录工资');
  }

  addBtn.addEventListener('click', addLog);
  totalEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });
  revenueEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });
  headEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });

  if (list) {
    list.addEventListener('click', e => {
      const delBtn = e.target.closest('[data-action="sa-del"]');
      const editBtn = e.target.closest('[data-action="sa-edit"]');
      if (delBtn) {
        const id = delBtn.dataset.id;
        salaryLogs = salaryLogs.filter(l => l.id !== id);
        saveSalaryLogs();
        renderSalaryStats();
        renderSalaryChart();
        renderSalaryList();
              showToast('已删除该记录');
        return;
      }
      if (editBtn) {
        const rec = salaryLogs.find(l => l.id === editBtn.dataset.id);
        if (rec) {
          document.getElementById('salaryMonth').value = rec.date;
          totalEl.value = rec.total;
          revenueEl.value = (rec.revenue != null ? rec.revenue : '');
          headEl.value = rec.head;
          totalEl.focus();
          renderSalaryList();
          showToast('已载入该月工资,修改后点「记录工资」即可更新');
        }
      }
    });
  }
}

// ==================== 超市成本核算模块 ====================
const COST_LOGS_KEY = 'liumo_cost_logs';
const COST_ITEMS_KEY = 'liumo_cost_items';
// 默认成本项模板（含默认值，每月录入时可一键填入，默认值均可编辑）
const COST_DEFAULT_ITEMS = [
  { name: '房租', default: 5000 },
  { name: '人工', default: 8000 },
  { name: '进货成本', default: 0 },
  { name: '水电', default: 1200 },
  { name: '损耗', default: 800 },
  { name: '其他', default: 0 },
];

function loadCost() {
  try {
    const d = localStorage.getItem(COST_LOGS_KEY);
    costLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(costLogs)) costLogs = [];
  } catch (e) { costLogs = []; }
  // 兼容旧版（字段为 category/cost/sale/loss）: 转为「成本项」结构
  costLogs = costLogs.map(normalizeCostLog);
  costLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function loadCostItems() {
  try {
    const d = localStorage.getItem(COST_ITEMS_KEY);
    let arr = d ? JSON.parse(d) : null;
    if (!Array.isArray(arr)) arr = null;
    costItems = arr;
  } catch (e) { costItems = null; }
  // 首次无数据：初始化一份常见默认成本项（用户可增删改）
  if (!costItems) { costItems = COST_DEFAULT_ITEMS.map(n => ({ id: uid(), name: n.name, default: n.default || 0 })); saveCostItems(); }
  // 兼容旧数据（无 default 字段）
  costItems.forEach(it => { it.default = (it.default != null && !isNaN(Number(it.default))) ? Number(it.default) : 0; });
}
function saveCostItems() { localStorage.setItem(COST_ITEMS_KEY, JSON.stringify(costItems)); }
// 把任意记录规范为 { id, date, items:[{name,amount}], note } 结构
function normalizeCostLog(l) {
  if (!l || typeof l !== 'object') return { id: uid(), date: currentMonthStr(), items: [], note: '' };
  if (Array.isArray(l.items)) {
    const items = l.items
      .map(it => ({ name: String(it && it.name != null ? it.name : '').trim() || '未命名', amount: Number(it && it.amount != null ? it.amount : 0) || 0 }))
      .filter(it => it.amount > 0 || it.name !== '未命名');
    return { id: l.id || uid(), date: l.date, items, note: l.note || '', createdAt: l.createdAt || Date.now(), updatedAt: l.updatedAt || Date.now() };
  }
  // 旧版: 只有单条成本/损耗, 并入 items
  const items = [];
  const cat = (l.category || '').trim() || '进货成本';
  if (l.cost != null && !isNaN(Number(l.cost)) && Number(l.cost) > 0) items.push({ name: cat, amount: Number(l.cost) });
  if (l.loss != null && !isNaN(Number(l.loss)) && Number(l.loss) > 0) items.push({ name: '损耗', amount: Number(l.loss) });
  return { id: l.id || uid(), date: l.date, items, note: l.note || '', createdAt: l.createdAt || Date.now(), updatedAt: l.updatedAt || Date.now() };
}
function saveCostLogs() { localStorage.setItem(COST_LOGS_KEY, JSON.stringify(costLogs)); }
function costAsc() { return [...costLogs].sort((a, b) => (a.date || '').localeCompare(b.date || '')); }
function costDesc() { return [...costLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
// 单条记录的总支出
function costRecTotal(rec) { return (rec.items || []).reduce((s, it) => s + (Number(it.amount) || 0), 0); }
// 全部记录的总支出
function costAllTotal() { return costLogs.reduce((s, r) => s + costRecTotal(r), 0); }
// 各成本项累计（跨所有月份）: { name: total }
function costItemTotals() {
  const map = {};
  costLogs.forEach(r => (r.items || []).forEach(it => {
    const n = (it.name || '').trim() || '未命名';
    map[n] = (map[n] || 0) + (Number(it.amount) || 0);
  }));
  return map;
}
function costWindowLogs() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 23, 1); // 近两年 = 24 个月
  const cutoffStr = start.getFullYear() + '-' + ('0' + (start.getMonth() + 1)).slice(-2);
  return costAsc().filter(l => l.date >= cutoffStr);
}
// 改名成本项：同步所有历史记录里同名的项
function renameCostItem(id, newName) {
  const it = costItems.find(x => x.id === id);
  if (!it) return;
  const oldName = it.name;
  it.name = newName;
  costLogs.forEach(r => (r.items || []).forEach(i => { if (i.name === oldName) i.name = newName; }));
  saveCostItems(); saveCostLogs();
}
// 删除成本项：移除定义并清理所有历史记录中该名称的金额
function removeCostItem(id) {
  const it = costItems.find(x => x.id === id);
  if (!it) return;
  costItems = costItems.filter(x => x.id !== id);
  costLogs.forEach(r => { r.items = (r.items || []).filter(i => i.name !== it.name); });
  saveCostItems(); saveCostLogs();
}

function renderCostStats() {
  const el = document.getElementById('coStats');
  if (!el) return;
  const total = costAllTotal();                 // 总支出（全部月份）
  const months = costLogs.length;               // 记录月份数
  const itemMap = costItemTotals();
  const kinds = Object.keys(itemMap).length;    // 成本项种类数
  const avg = months > 0 ? total / months : 0;  // 月均支出
  const last = costDesc()[0];
  const lastTotal = last ? costRecTotal(last) : 0;
  const money = v => Math.round(v).toLocaleString() + ' 元';
  const cards = [];
  cards.push(statCard('总支出', money(total), ''));
  cards.push(statCard('记录月份', months + ' 个月', ''));
  cards.push(statCard('成本项种类', kinds + ' 类', ''));

}

function renderCostChart() {
  const el = document.getElementById('coChart');
  if (!el) return;
  const logs = costWindowLogs();
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">还没有成本记录,先在上方记录月份数据吧</div>`;
    return;
  }
  const lastLog = logs[logs.length - 1];
  const lastDate = lastLog.date;
  const [ly, lm] = lastDate.split('-').map(Number);
  const yoyStr = (ly - 1) + '-' + ('0' + lm).slice(-2);
  const yoyIdx = logs.findIndex(l => l.date === yoyStr);
  el.innerHTML = buildSalaryLineSVG(logs, costRecTotal, '#6366f1', '元', { last: logs.length - 1, yoy: yoyIdx >= 0 ? yoyIdx : null })
    + `<div class="wt-chart-subnote">最新 <b style="color:#6366f1">${lastDate}</b> · 同比 <b style="color:#dc2626">${yoyStr}</b>${yoyIdx >= 0 ? '' : '（暂无数据）'}</div>`;
}

// 成本汇总：各成本项跨月合计、占比、条形
function renderCostSummary() {
  const el = document.getElementById('coSummary');
  if (!el) return;
  const map = costItemTotals();
  const names = Object.keys(map).sort((a, b) => map[b] - map[a]);
  const grand = names.reduce((s, n) => s + map[n], 0);
  if (names.length === 0) { el.innerHTML = `<div class="wt-empty">暂无数据</div>`; return; }
  const money = v => Math.round(v).toLocaleString();
  const pct = v => grand > 0 ? (v / grand * 100).toFixed(1) + '%' : '0%';
  el.innerHTML = `
    <table class="wt-cat">
      <thead><tr><th>成本项</th><th>合计金额</th><th>占比</th><th>分布</th></tr></thead>
      <tbody>
        ${names.map(n => {
          const v = map[n];
          const share = grand > 0 ? v / grand * 100 : 0;
          return `<tr>
            <td>${escapeHtml(n)}</td>
            <td>${money(v)} 元</td>
            <td>${pct(v)}</td>
            <td><div class="cat-gross"><span class="bar"><i style="width:${share.toFixed(1)}%;background:#6366f1"></i></span></div></td>
          </tr>`;
        }).join('')}
        <tr class="co-grand">
          <td><b>合计</b></td>
          <td><b>${money(grand)} 元</b></td>
          <td>100%</td>
          <td></td>
        </tr>
      </tbody>
    </table>`;
}

// 月度明细矩阵：月份 × 成本项
function renderCostMatrix() {
  const el = document.getElementById('coMatrix');
  if (!el) return;
  const logs = costDesc();
  if (logs.length === 0) { el.innerHTML = `<div class="wt-empty">暂无数据</div>`; return; }
  const totals = costItemTotals();
  // 列顺序优先按成本项清单顺序，历史中遗漏的项追加在末尾
  const seen = new Set();
  const itemNames = [];
  costItems.forEach(it => {
    const n = (it.name || '').trim();
    if (n && totals[n] != null && !seen.has(n)) { itemNames.push(n); seen.add(n); }
  });
  Object.keys(totals).forEach(n => { if (!seen.has(n)) { itemNames.push(n); seen.add(n); } });
  const money = v => Math.round(v).toLocaleString();
  const sumsOf = r => {
    const s = {};
    (r.items || []).forEach(it => { const n = (it.name || '').trim() || '未命名'; s[n] = (s[n] || 0) + (Number(it.amount) || 0); });
    return s;
  };
  el.innerHTML = `
    <table class="wt-cat co-matrix">
      <thead><tr>
        <th>月份</th>
        ${itemNames.map(n => `<th>${escapeHtml(n)}</th>`).join('')}
        <th>合计</th>
      </tr></thead>
      <tbody>
        ${logs.map(r => {
          const sums = sumsOf(r);
          const rowTotal = costRecTotal(r);
          return `<tr>
            <td>${escapeHtml(r.date)}${r.note ? ' · ' + escapeHtml(r.note) : ''}</td>
            ${itemNames.map(n => `<td>${sums[n] ? money(sums[n]) : '—'}</td>`).join('')}
            <td class="co-rowtotal"><b>${money(rowTotal)}</b></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function bindCostEvents() {
  const addBtn = document.getElementById('costAddBtn');
  const monthEl = document.getElementById('costMonth');
  const noteEl = document.getElementById('costNote');
  const adminList = document.getElementById('coItemList');
  const addItemBtn = document.getElementById('coItemAddBtn');
  const fixedEl = document.getElementById('costFixed');
  const laborEl = document.getElementById('costLabor');
  const otherEl = document.getElementById('costOther');
  const entryTotalEl = document.getElementById('coEntryTotal');
  const fillBtn = document.getElementById('coFillDefaultBtn');
  const getSalaryBtn = document.getElementById('coGetSalaryBtn');
  const list = document.getElementById('coList');

  function refreshDerived() {
    renderCostStats(); renderCostChart(); renderCostSummary(); renderCostMatrix(); renderCostList();
  }

  // 固定成本设置：折叠/展开
  const adminToggle = document.getElementById('coAdminToggle');
  if (adminToggle) {
    adminToggle.addEventListener('click', () => {
      const card = adminToggle.closest('.co-admin-card');
      const collapsed = card.classList.toggle('co-collapsed');
      adminToggle.setAttribute('aria-expanded', String(!collapsed));
    });
  }

  // 成本项管理：添加
  addItemBtn.addEventListener('click', () => {
    costItems.push({ id: uid(), name: '新成本项' });
    saveCostItems();
    renderCostItemAdmin();
    // 添加新项时自动展开，便于立即编辑
    const card = addItemBtn.closest('.co-admin-card');
    if (card && card.classList.contains('co-collapsed')) {
      card.classList.remove('co-collapsed');
      if (adminToggle) adminToggle.setAttribute('aria-expanded', 'true');
    }
    const rows = adminList.querySelectorAll('.co-admin-row');
    const last = rows[rows.length - 1];
    if (last) last.querySelector('.co-admin-name').focus();
  });
  // 成本项管理：删除（同时清理历史金额）
  adminList.addEventListener('click', e => {
    const del = e.target.closest('.co-admin-del');
    if (del) {
      const id = del.dataset.id;
      const it = costItems.find(x => x.id === id);
      removeCostItem(id);
      renderCostItemAdmin();
      refreshDerived();
      showToast('已删除成本项' + (it ? '「' + it.name + '」' : '') + '及其历史金额');
    }
  });
  // 成本项管理：改名 / 改默认值（失焦保存）
  adminList.addEventListener('change', e => {
    const defInp = e.target.closest('.co-admin-default');
    if (defInp) {
      const it = costItems.find(x => x.id === defInp.dataset.id);
      if (it) { it.default = parseFloat(defInp.value) || 0; saveCostItems(); showToast('已更新「' + it.name + '」默认值'); }
      return;
    }
    const nameInp = e.target.closest('.co-admin-name');
    if (nameInp) {
      const id = nameInp.dataset.id;
      const newName = (nameInp.value || '').trim() || '未命名';
      nameInp.value = newName;
      renameCostItem(id, newName);
      refreshDerived();
    }
  });

  // 录入：读取三项聚合金额
  function readEntryItems() {
    const items = [];
    const fixed = parseFloat(fixedEl.value);
    const labor = parseFloat(laborEl.value);
    const other = parseFloat(otherEl.value);
    if (!isNaN(fixed) && fixed > 0) items.push({ name: '固定成本', amount: fixed });
    if (!isNaN(labor) && labor > 0) items.push({ name: '人工成本', amount: labor });
    if (!isNaN(other) && other > 0) items.push({ name: '其他', amount: other });
    return items;
  }

  // 实时合计显示
  function updateEntryTotal() {
    if (!entryTotalEl) return;
    const sum = ['costFixed', 'costLabor', 'costOther'].reduce((s, id) => {
      const v = parseFloat(document.getElementById(id).value);
      return s + (isNaN(v) ? 0 : v);
    }, 0);
    entryTotalEl.textContent = saMoney(sum);
  }
  [fixedEl, laborEl, otherEl].forEach(el => el && el.addEventListener('input', updateEntryTotal));

  function addLog() {
    const date = monthEl.value || currentMonthStr();
    const items = readEntryItems();
    const note = (noteEl.value || '').trim();
    const exist = costLogs.find(l => l.date === date);
    if (exist) { exist.items = items; exist.note = note; exist.updatedAt = Date.now(); }
    else { costLogs.push({ id: uid(), date, items, note, createdAt: Date.now(), updatedAt: Date.now() }); }
    costLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveCostLogs();
    fixedEl.value = ''; laborEl.value = ''; otherEl.value = '';
    noteEl.value = '';
    updateEntryTotal();
    refreshDerived();
    showToast(exist ? '已更新 ' + date + ' 成本' : '已记录 ' + date + ' 成本');
  }

  // 一键填入默认值：把上方固定成本设置的成本合计填入「固定成本金额」
  fillBtn.addEventListener('click', () => {
    const total = costItems.reduce((s, it) => s + (Number(it.default) || 0), 0);
    if (fixedEl) { fixedEl.value = total > 0 ? total : ''; updateEntryTotal(); }
    showToast('已填入固定成本设置的成本合计：' + saMoney(total));
  });

  // 获取工资：从工资管理读取选择月份的总工资并填入「人工成本」
  if (getSalaryBtn) {
    getSalaryBtn.addEventListener('click', () => {
      const date = monthEl ? (monthEl.value || currentMonthStr()) : currentMonthStr();
      let logs = [];
      try { const raw = localStorage.getItem('liumo_salary_logs'); logs = raw ? JSON.parse(raw) : []; } catch (e) { logs = []; }
      if (!Array.isArray(logs)) logs = [];
      const rec = logs.find(l => String(l.date) === String(date));
      if (!rec) { showToast('工资管理中未找到 ' + date + ' 的记录'); return; }
      const total = Number(rec.total) || 0;
      if (laborEl) { laborEl.value = total > 0 ? total : ''; updateEntryTotal(); }
      showToast('已填入 ' + date + ' 总工资：' + saMoney(total));
    });
  }

  addBtn.addEventListener('click', addLog);
  noteEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });

  if (list) list.addEventListener('click', e => {
    const delBtn = e.target.closest('[data-action="co-del"]');
    const editBtn = e.target.closest('[data-action="co-edit"]');
    if (delBtn) {
      const id = delBtn.dataset.id;
      costLogs = costLogs.filter(l => l.id !== id);
      saveCostLogs();
      refreshDerived();
      showToast('已删除该记录');
      return;
    }
    if (editBtn) {
      const rec = costLogs.find(l => l.id === editBtn.dataset.id);
      if (rec) {
        monthEl.value = rec.date;
        noteEl.value = rec.note || '';
        const sums = {};
        (rec.items || []).forEach(it => { sums[(it.name || '').trim()] = it.amount; });
        if (fixedEl) fixedEl.value = sums['固定成本'] != null ? sums['固定成本'] : '';
        if (laborEl) laborEl.value = sums['人工成本'] != null ? sums['人工成本'] : '';
        if (otherEl) otherEl.value = sums['其他'] != null ? sums['其他'] : '';
        updateEntryTotal();
        monthEl.focus();
        showToast('已载入 ' + rec.date + '，修改后点「记录成本」即可更新');
      }
    }
  });
}

let costEntryLogs = [];
let ceEditingId = null;
const COSTENTRY_ITEMS_KEY = 'liumo_costentry_items';
const COSTENTRY_LOGS_KEY = 'liumo_costentry_logs';

function loadCostEntry() {
  try { const d = localStorage.getItem(COSTENTRY_ITEMS_KEY); costEntryItems = d ? JSON.parse(d) : []; if (!Array.isArray(costEntryItems)) costEntryItems = []; } catch (e) { costEntryItems = []; }
  try { const d = localStorage.getItem(COSTENTRY_LOGS_KEY); costEntryLogs = d ? JSON.parse(d) : []; if (!Array.isArray(costEntryLogs)) costEntryLogs = []; } catch (e) { costEntryLogs = []; }
  if (costEntryItems.length === 0) {
    costEntryItems = ['房租', '水电', '人工成本', '其他'].map(n => ({ id: uid(), name: n }));
    saveCostEntryItems();
  }
}
function saveCostEntryItems() { localStorage.setItem(COSTENTRY_ITEMS_KEY, JSON.stringify(costEntryItems)); }
function saveCostEntryLogs() { localStorage.setItem(COSTENTRY_LOGS_KEY, JSON.stringify(costEntryLogs)); }

function renderCeItemSelect() {
  const sel = document.getElementById('ceItem');
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = costEntryItems.map(it => `<option value="${it.id}">${escapeHtml(it.name)}</option>`).join('');
  if (prev && costEntryItems.some(it => it.id === prev)) sel.value = prev;
  updateCeSalaryBtn();
}

function setCeAddLabel(text) {
  const el = document.getElementById('ceAddBtnLabel');
  if (el) el.textContent = text;
}

function updateCeSalaryBtn() {
  const sel = document.getElementById('ceItem');
  const btn = document.getElementById('ceGetSalaryBtn');
  if (!sel || !btn) return;
  const it = costEntryItems.find(x => x.id === sel.value);
  const wage = !!(it && /工资|人工|薪|劳务/.test(it.name || ''));
  btn.style.display = wage ? '' : 'none';
}

function renderCeStats() {
  const el = document.getElementById('ceStats');
  if (!el) return;
  const now = new Date();
  const cy = now.getFullYear(), cm = now.getMonth() + 1;
  const curMonth = cy + '-' + ('0' + cm).slice(-2);
  const lastYearMonth = (cy - 1) + '-' + ('0' + cm).slice(-2);
  const last12 = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(cy, cm - 1 - i, 1);
    last12.push(d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2));
  }
  function findItemId(name) {
    let it = costEntryItems.find(x => (x.name || '').trim() === name);
    if (it) return it.id;
    it = costEntryItems.find(x => (x.name || '').includes(name));
    return it ? it.id : null;
  }
  function monthTotal(itemName, month) {
    const id = findItemId(itemName);
    if (!id) return 0;
    return costEntryLogs.reduce((s, l) => s + (((l.date || '').startsWith(month) && l.itemId === id) ? (Number(l.amount) || 0) : 0), 0);
  }
  function avg12(itemName) {
    const id = findItemId(itemName);
    if (!id) return 0;
    const sum = last12.reduce((s, m) => s + costEntryLogs.reduce((ss, l) => ss + (((l.date || '').startsWith(m) && l.itemId === id) ? (Number(l.amount) || 0) : 0), 0), 0);
    return sum / 12;
  }
  const plasticThis = monthTotal('塑料袋', curMonth);
  const plasticAvg = avg12('塑料袋');
  const elecThis = monthTotal('电费', curMonth);
  const elecLast = monthTotal('电费', lastYearMonth);
  const elecAvg = avg12('电费');
  const cards = [
    statCard('本月塑料袋成本', saMoney(plasticThis), ''),
    statCard('近一年平均每月塑料袋成本', saMoney(plasticAvg), ''),
    statCard('本月电费', saMoney(elecThis), ''),
    statCard('近一年平均每月电费', saMoney(elecAvg), ''),
    statCard('去年同月份电费', saMoney(elecLast), '')
  ];
  el.innerHTML = cards.join('');
}

function mcSalaryMonthTotal(month) {

function bindMonthCostEvents() {
  const monthEl = document.getElementById('mcMonth');
  const fixedEl = document.getElementById('mcFixed');
  const entryEl = document.getElementById('mcEntry');
  const salaryEl = document.getElementById('mcSalary');
  const totalEl = document.getElementById('mcTotal');
  const genBtn = document.getElementById('mcGenBtn');
  if (!monthEl || !fixedEl || !entryEl || !salaryEl || !totalEl || !genBtn) return;

  const listToggle = document.getElementById('mcListToggle');
  if (listToggle) {
    listToggle.addEventListener('click', () => {
      const card = listToggle.closest('.co-admin-card');
      const collapsed = card.classList.toggle('co-collapsed');
      listToggle.setAttribute('aria-expanded', String(!collapsed));
    });
  }

  function refreshTotal() {
    const f = Number(fixedEl.dataset.val || 0);
    const e = Number(entryEl.dataset.val || 0);
    const s = Number(salaryEl.dataset.val || 0);
    totalEl.textContent = saMoney(f + e + s);
  }

  document.getElementById('mcFetchFixed').addEventListener('click', () => {
    const v = mcFixedTotal();
    fixedEl.value = saMoney(v);
    fixedEl.dataset.val = v;
    refreshTotal();
  });

  document.getElementById('mcFetchEntry').addEventListener('click', () => {
    const m = monthEl.value;
    if (!m) { showToast('请先选择月份'); return; }
    const v = mcEntryMonthTotal(m);
    entryEl.value = saMoney(v);
    entryEl.dataset.val = v;
    refreshTotal();
  });

  document.getElementById('mcFetchSalary').addEventListener('click', () => {
    const m = monthEl.value;
    if (!m) { showToast('请先选择月份'); return; }
    const v = mcSalaryMonthTotal(m);
    salaryEl.value = saMoney(v);
    salaryEl.dataset.val = v;
    refreshTotal();
  });

  genBtn.addEventListener('click', () => {
    const m = monthEl.value;
    if (!m) { showToast('请先选择月份'); return; }
    const f = Number(fixedEl.dataset.val || 0);
    const e = Number(entryEl.dataset.val || 0);
    const s = Number(salaryEl.dataset.val || 0);
    const gotFixed = fixedEl.dataset.val !== undefined && fixedEl.dataset.val !== '';
    const gotEntry = entryEl.dataset.val !== undefined && entryEl.dataset.val !== '';
    const gotSalary = salaryEl.dataset.val !== undefined && salaryEl.dataset.val !== '';
    if (!gotFixed || !gotEntry || !gotSalary) { showToast('请先分别获取「固定成本」「成本录入」「工资」三项金额'); return; }
    const total = f + e + s;
    const ok = window.confirm(
      m + ' 月度成本\n' +
      '固定成本设置合计：' + saMoney(f) + '\n' +
      '成本录入当月合计：' + saMoney(e) + '\n' +
      '该月工资总额：' + saMoney(s) + '\n' +
      '该月成本：' + saMoney(total) + '\n\n' +
      '确认生成 / 覆盖该月成本记录？'
    );
    if (!ok) return;
    const existIdx = monthlyCostLogs.findIndex(r => r.month === m);
    const rec = { id: uid(), month: m, fixedTotal: f, entryTotal: e, salaryTotal: s, total: total, createdAt: Date.now() };
    if (existIdx >= 0) monthlyCostLogs[existIdx] = rec; else monthlyCostLogs.push(rec);
    monthlyCostLogs.sort((a, b) => (a.month || '').localeCompare(b.month || ''));
    saveMonthlyCost();
    showToast('已生成 ' + m + ' 月度成本记录');
    renderMcList();
    renderMcChart();
  });
}

function renderMcList() {
  const el = document.getElementById('mcList');
  if (!el) return;
  if (monthlyCostLogs.length === 0) { el.innerHTML = `<div class="wt-empty">还没有生成月度成本记录</div>`; return; }
  el.innerHTML = monthlyCostLogs.slice().reverse().map(r => `
    <div class="wt-item" data-id="${r.id}">
      <div class="wt-item-date">${r.month}</div>
      <div class="wt-item-delta"><b>该月成本 ${saMoney(r.total)}</b> · 固定 ${saMoney(r.fixedTotal)} · 录入 ${saMoney(r.entryTotal)} · 工资 ${saMoney(r.salaryTotal)}</div>

        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>

  el.querySelectorAll('[data-action="mc-del"]').forEach(b => b.addEventListener('click', () => {

    saveMonthlyCost();
    renderMcList();

    showToast('已删除该月度成本记录');
  }));
}

const GROSS_MARGIN_KEY = 'liumo_gross_margin';
let grossMargin = 0.18;   // 毛利率（率），默认 18 个点 = 18%
function loadGrossMargin() {
  try { const d = localStorage.getItem(GROSS_MARGIN_KEY); const v = d == null ? NaN : Number(d); grossMargin = isNaN(v) ? 0.18 : Math.min(Math.max(v, 0), 1); } catch (e) { grossMargin = 0.18; }
}
function saveGrossMargin() { localStorage.setItem(GROSS_MARGIN_KEY, String(grossMargin)); }

function renderGrossProfitModule(content, mod) {

          <div class="co-inline">
            <input type="number" step="0.1" min="0" max="100" id="gpMargin" class="co-entry-amt" value="${Math.round(grossMargin * 1000) / 10}" />

          </div>
        </div>
      </div>
      <div class="co-admin-total">

      </div>
    </div>
    <div class="wt-stats" id="gpStats"></div>
    <div class="wt-chart-card" style="margin-top:18px;">
      <div class="wt-chart-title">年度净利润曲线（一年一条曲线 · 每月净利润，单位：元）</div>
      <div class="wt-cat-wrap"><div id="gpChart"></div></div>
    </div>
    <div class="wt-chart-card" style="margin-top:18px;">
      <div class="wt-chart-title">净利润分析（趋势 · 具体原因 · 解决方案）</div>
      <div class="wt-cat-wrap"><div id="gpAnalysis"></div></div>
    </div>
    <div class="wt-chart-card" style="margin-top:18px;">
      <div class="wt-chart-title">今年 vs 去年 净利润对比（同比分析）</div>
      <div class="wt-cat-wrap"><div id="gpCompare"></div></div>
    </div>
    <div class="wt-chart-card" style="margin-top:18px;">
      <div class="wt-chart-title">月度净利润明细（营业额 × 利润率 − 总成本）</div>
      <div class="wt-cat-wrap"><div id="gpTable"></div></div>
    </div>
  `;
  document.getElementById('gpMarginSave').addEventListener('click', () => {
    const inp = document.getElementById('gpMargin');
    let pts = parseFloat(inp.value);
    if (isNaN(pts) || pts < 0) pts = 0;
    if (pts > 100) pts = 100;
    grossMargin = pts / 100;
    saveGrossMargin();
    document.getElementById('gpMarginVal').textContent = (Math.round(grossMargin * 1000) / 10) + '%';
    renderGpStats(); renderGpTable(); renderGpChart(); renderGpAnalysis(); renderGpCompare();

  renderGpStats();
  renderGpTable();

  renderGpCompare();
}

function gpMonthRows() {
  const revMap = {}, costMap = {};
  (salaryLogs || []).forEach(l => { const m = l.date; if (m) revMap[m] = (Number(l.revenue) || 0); });
  (monthlyCostLogs || []).forEach(r => { const m = r.month; if (m) costMap[m] = (Number(r.total) || 0); });
  const months = Array.from(new Set([...Object.keys(revMap), ...Object.keys(costMap)])).sort().reverse();
  return months.map(m => {
    const revenue = revMap[m] || 0;
    const cost = costMap[m] || 0;
    const gross = revenue * grossMargin - cost;
    return { month: m, revenue, cost, gross };
  });
}

function renderGpStats() {
  const el = document.getElementById('gpStats');
  if (!el) return;
  const rows = gpMonthRows();
  const totalGross = rows.reduce((s, r) => s + r.gross, 0);
  const avg = rows.length ? totalGross / rows.length : 0;
  const profitMonths = rows.filter(r => r.gross >= 0).length;
  const lossMonths = rows.length - profitMonths;
  el.innerHTML = [
    statCard('总净利润', saMoney(totalGross), totalGross < 0 ? 'warning' : 'success'),
    statCard('平均月净利润', saMoney(avg), ''),
    statCard('盈利月数', profitMonths + ' 个月', 'success'),
    statCard('亏损月数', lossMonths + ' 个月', lossMonths ? 'warning' : '')
  ].join('');
}

  el.innerHTML = `
    <table class="wt-cat">

        ${rows.map(r => {
          const cls = r.gross < 0 ? 'gp-neg' : 'gp-pos';
          return `<tr>

            <td>${saMoney(r.revenue)}</td>

            <td>${rateTxt}</td>
            <td class="${cls}">${saMoney(r.gross)}</td>

}

function renderGpAnalysis() {
  const el = document.getElementById('gpAnalysis');
  if (!el) return;
  const rows = gpMonthRows();
  if (rows.length === 0) { el.innerHTML = `<div class="wt-empty">还没有可用数据：请先在「工资管理」录入营业额、在「月度成本管理」生成月度成本记录，即可自动生成净利润分析。</div>`; return; }
  const sorted = [...rows].sort((a, b) => a.month.localeCompare(b.month));
  const total = rows.reduce((s, r) => s + r.gross, 0);
  const avg = total / rows.length;
  const totalRev = rows.reduce((s, r) => s + r.revenue, 0);
  const totalCost = rows.reduce((s, r) => s + r.cost, 0);
  const profitMonths = rows.filter(r => r.gross >= 0);
  const lossMonths = rows.filter(r => r.gross < 0);
  const costRate = totalRev ? totalCost / totalRev : 0;
  const netRate = totalRev ? total / totalRev : 0;
  const best = sorted.reduce((m, r) => r.gross > m.gross ? r : m, sorted[0]);
  const worst = sorted.reduce((m, r) => r.gross < m.gross ? r : m, sorted[0]);
  const first = sorted[0], last = sorted[sorted.length - 1];
  const ratePct = Math.round(grossMargin * 1000) / 10;
  const costRatePct = Math.round(costRate * 1000) / 10;
  const netRatePct = Math.round(netRate * 1000) / 10;

  // 一、净利润分析
  const trendTxt = sorted.length >= 2
    ? `从 ${first.month} 的 ${saMoney(first.gross)} 到 ${last.month} 的 ${saMoney(last.gross)}，${last.gross > first.gross ? '整体呈改善趋势' : '整体呈下滑趋势'}`
    : `仅 ${first.month} 一个月数据`;
  const overall = total >= 0 ? '整体盈利' : '整体亏损';
  const analysis = [
    `统计区间共 ${rows.length} 个月，<b>${overall}</b>：总净利润 <b>${saMoney(total)}</b>，平均每月 <b>${saMoney(avg)}</b>（整体净利润率约 ${netRatePct}%）。`,
    `盈利 ${profitMonths.length} 个月，亏损 ${lossMonths.length} 个月。`,
    `表现最好：${best.month}（${saMoney(best.gross)}）；表现最差：${worst.month}（${saMoney(worst.gross)}）。`,
    `趋势：${trendTxt}。`
  ];

  // 二、具体原因
  const reasons = [];
  if (costRate > grossMargin + 1e-9) {
    reasons.push(`<b>总成本偏高</b>：成本占营业额比重达 <b>${costRatePct}%</b>，高于设定利润率 <b>${ratePct}%</b>，成本端已吃掉利润空间${total < 0 ? '并造成亏损' : ''}。`);
  } else {
    reasons.push(`成本占营业额比重为 <b>${costRatePct}%</b>，低于设定利润率 <b>${ratePct}%</b>，成本端相对可控。`);
  }
  if (lossMonths.length) {
    const items = lossMonths.map(r => `${r.month}（${saMoney(r.gross)}，成本率 ${Math.round((r.revenue ? r.cost / r.revenue : 1) * 1000) / 10}%）`).join('、');
    reasons.push(`以下月份净利润为负，需重点复盘：${items}。${costRate > grossMargin + 1e-9 ? '共性是当月成本率过高或营业额不足。' : '多为营业额偏低所致。'}`);
  }
  if (netRate > 0 && netRate < grossMargin * 0.5) {
    reasons.push(`整体净利润率仅约 <b>${netRatePct}%</b>，利润空间偏薄，抗风险能力弱，一旦成本波动即转亏。`);
  }
  if (!reasons.length) reasons.push('当前均为盈利月份，结构良好，可继续关注成本与营业额的匹配增长。');

  // 三、解决方案
  const solutions = [];
  if (total < 0 || costRate > grossMargin + 1e-9) {
    solutions.push(`<b>压降总成本</b>：进入「月度成本管理」逐项核查高成本项（固定 / 录入 / 工资），优先砍掉可变动成本；建立日盘+周盘减少损耗，设报损红线。`);
  }
  if (lossMonths.length || avg < 0) {
    solutions.push(`<b>提升营业额</b>：用引流品 + 满减 / 买赠拉动来客数与客单价；推动关联陈列与连带话术，把薄弱月份的客流补起来。`);
  }
  if (netRate < grossMargin - 1e-9 || costRate > grossMargin + 1e-9) {
    solutions.push(`<b>优化定价</b>：当前利润率设定为 ${ratePct}%，若市场可接受，可适度上调至 ${Math.round(ratePct + 2)}%–${Math.round(ratePct + 5)}% 档位，直接在上方「利润率设置」调整。`);
  }
  solutions.push(`<b>复盘最差月 ${worst.month}</b>：对比其营业额与成本结构，判断是订货 / 促销力度 / 临时支出异常，避免同类月份重演。`);
  solutions.push(`<b>动态跟踪</b>：每月更新营业额与成本后，本分析会自动重算，建议按月对照趋势。`);

  el.innerHTML = `
    <div class="gp-analysis">
      <section><h4>一、净利润分析</h4><ul>${analysis.map(t => `<li>${t}</li>`).join('')}</ul></section>
      <section><h4>二、具体原因</h4><ul>${reasons.map(t => `<li>${t}</li>`).join('')}</ul></section>
      <section><h4>三、解决方案</h4><ul>${solutions.map(t => `<li>${t}</li>`).join('')}</ul></section>
    </div>`;
}

function gpMonthDetailRows() {
  const revMap = {}, costMap = {};
  (salaryLogs || []).forEach(l => { const m = l.date; if (m) revMap[m] = (Number(l.revenue) || 0); });
  (monthlyCostLogs || []).forEach(r => {
    const m = r.month; if (!m) return;
    costMap[m] = {
      total: Number(r.total) || 0,
      fixedTotal: Number(r.fixedTotal) || 0,
      entryTotal: Number(r.entryTotal) || 0,
      salaryTotal: Number(r.salaryTotal) || 0
    };
  });
  const months = Array.from(new Set([...Object.keys(revMap), ...Object.keys(costMap)])).sort().reverse();
  return months.map(m => {
    const revenue = revMap[m] || 0;
    const c = costMap[m] || { total: 0, fixedTotal: 0, entryTotal: 0, salaryTotal: 0 };
    return { month: m, revenue, cost: c.total, fixedTotal: c.fixedTotal, entryTotal: c.entryTotal, salaryTotal: c.salaryTotal, gross: revenue * grossMargin - c.total };
  });
}
function gpYearMonthMap(year) {
  const m = {};
  gpMonthDetailRows().forEach(r => {
    const p = (r.month || '').split('-').map(Number);
    if (p[0] === year) m[p[1]] = r;
  });
  return m;
}
function gpYoyText(cur, prev) {
  if (prev === 0) {
    if (cur === 0) return '—';
    return cur > 0 ? '去年为 0（新增）' : '去年为 0（新增亏损）';
  }
  const pct = Math.round((cur - prev) / Math.abs(prev) * 1000) / 10;
  return (pct > 0 ? '+' : '') + pct + '%';
}
function gpDeltaClass(cur, prev) {
  const d = cur - prev;
  if (d > 1e-9) return 'gp-up';
  if (d < -1e-9) return 'gp-down';
  return 'gp-flat';
}
function gpAgg(map) {
  return Object.values(map).reduce((s, r) => ({
    gross: s.gross + r.gross, revenue: s.revenue + r.revenue, cost: s.cost + r.cost, n: s.n + 1
  }), { gross: 0, revenue: 0, cost: 0, n: 0 });
}
function saMoneyShort(v) {
  const a = Math.abs(v);
  if (a >= 10000) return (Math.round(v / 1000) / 10) + '万';
  return saMoney(v).replace(' 元', '');
}
function niceCeil(v) {
  if (v <= 0) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / pow;
  const nice = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return nice * pow;
}
// groups: [{label, cur, prev}]  → 每个维度今年/去年并排分组柱状图
function buildGroupedBarChart(groups) {
  const W = 720, H = 360;
  const padL = 58, padR = 16, padT = 18, padB = 56;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const baseY = padT + plotH;
  const curColor = '#2563eb', prevColor = '#f59e0b';
  const maxV = Math.max(1, ...groups.flatMap(g => [g.cur, g.prev]));
  const niceMax = niceCeil(maxV);
  const yOf = v => baseY - (Math.abs(v) / niceMax) * plotH;
  const ticks = 4;
  let grid = '';
  for (let i = 0; i <= ticks; i++) {
    const v = niceMax * i / ticks, y = yOf(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--border)" stroke-width="1" opacity="0.55"/>`;
    grid += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--text-muted,#6b7280)">${saMoneyShort(v)}</text>`;
  }
  const n = groups.length;
  const groupW = plotW / n;
  const barW = Math.min(44, groupW * 0.30);
  const gap = 6;
  let bars = '';
  groups.forEach((g, i) => {
    const cx = padL + groupW * i + groupW / 2;
    const x1 = cx - barW - gap / 2, x2 = cx + gap / 2;
    const h1 = Math.max(0, baseY - yOf(g.cur)), h2 = Math.max(0, baseY - yOf(g.prev));
    bars += `<rect x="${x1}" y="${yOf(g.cur)}" width="${barW}" height="${h1}" rx="3" fill="${curColor}"><title>${g.label}·今年：${saMoney(g.cur)}</title></rect>`;
    if (h1 >= 12) bars += `<text x="${x1 + barW / 2}" y="${yOf(g.cur) - 5}" text-anchor="middle" font-size="10.5" fill="${curColor}" font-weight="700">${saMoneyShort(g.cur)}</text>`;
    bars += `<rect x="${x2}" y="${yOf(g.prev)}" width="${barW}" height="${h2}" rx="3" fill="${prevColor}"><title>${g.label}·去年：${saMoney(g.prev)}</title></rect>`;
    if (h2 >= 12) bars += `<text x="${x2 + barW / 2}" y="${yOf(g.prev) - 5}" text-anchor="middle" font-size="10.5" fill="${prevColor}" font-weight="700">${saMoneyShort(g.prev)}</text>`;
    bars += `<text x="${cx}" y="${baseY + 18}" text-anchor="middle" font-size="12" fill="var(--text)">${g.label}</text>`;
  });
  return `<svg class="gp-grp-bar" viewBox="0 0 ${W} ${H}" role="img" aria-label="今年与去年各维度对比分组柱状图">${grid}${bars}</svg>`;
}

function renderGpCompare() {
  const el = document.getElementById('gpCompare');
  if (!el) return;
  const rows = gpMonthRows();
  if (rows.length === 0) { el.innerHTML = `<div class="wt-empty">还没有可用数据：请先在「工资管理」录入营业额、在「月度成本管理」生成月度成本记录，即可自动生成同比对比。</div>`; return; }

  const curY = new Date().getFullYear();
  const prevY = curY - 1;
  const curMonthNow = new Date().getMonth() + 1;
  const curMap = gpYearMonthMap(curY);
  const prevMap = gpYearMonthMap(prevY);
  const curS = gpAgg(curMap);
  const prevS = gpAgg(prevMap);
  const rateTxt = (v, rev) => (rev ? (Math.round(v / rev * 1000) / 10) : 0) + '%';

  // 缺某一年：给出提示并展示已有年份
  if (curS.n === 0 || prevS.n === 0) {
    const hasCur = curS.n > 0;
    const s = hasCur ? curS : prevS;
    const y = hasCur ? curY : prevY;
    const missY = hasCur ? prevY : curY;
    el.innerHTML = `
      <div class="gp-compare">
        <div class="gp-cmp-note">当前仅有 <b>${y}</b> 年数据（共 ${s.n} 个月，净利润总额 <b>${saMoney(s.gross)}</b>），但 <b>${missY}</b> 年暂无营业额或成本记录，暂无法生成「今年 vs 去年」同比对比。请在「工资管理 / 月度成本管理」补齐 ${missY} 年数据后，本板块会自动生成对比。</div>
      </div>`;
    return;
  }

  // 无重叠月份时的兜底参考（非同区间，仅作提示用）
  const overallTableFull = `
    <div class="gp-cmp-sub">全年概览（参考 · 口径为各自全部月份，月份数不同，非同区间对比）</div>
    <table class="wt-cat">
      <thead><tr><th>指标</th><th>今年 ${curY}（${curS.n} 个月）</th><th>去年 ${prevY}（${prevS.n} 个月）</th><th>同比</th></tr></thead>
      <tbody>
        <tr><td>净利润总额</td><td>${saMoney(curS.gross)}</td><td>${saMoney(prevS.gross)}</td><td class="${gpDeltaClass(curS.gross, prevS.gross)}">${gpYoyText(curS.gross, prevS.gross)}</td></tr>
        <tr><td>总营业额</td><td>${saMoney(curS.revenue)}</td><td>${saMoney(prevS.revenue)}</td><td class="${gpDeltaClass(curS.revenue, prevS.revenue)}">${gpYoyText(curS.revenue, prevS.revenue)}</td></tr>
        <tr><td>总成本</td><td>${saMoney(curS.cost)}</td><td>${saMoney(prevS.cost)}</td><td class="${gpDeltaClass(curS.cost, prevS.cost)}">${gpYoyText(curS.cost, prevS.cost)}</td></tr>
        <tr><td>净利润率</td><td>${rateTxt(curS.gross, curS.revenue)}</td><td>${rateTxt(prevS.gross, prevS.revenue)}</td><td class="${gpDeltaClass(curS.gross / (curS.revenue || 1), prevS.gross / (prevS.revenue || 1))}">${gpYoyText(curS.gross / (curS.revenue || 1), prevS.gross / (prevS.revenue || 1))}</td></tr>
      </tbody>
    </table>`;

  // 主对比口径：严格同月份区间（年初 1 月至当前月），两年交集；窗口内无重叠则放宽到全年重叠
  let winSet = [];
  for (let mo = 1; mo <= curMonthNow; mo++) { if (curMap[mo] && prevMap[mo]) winSet.push(mo); }
  let fallback = false;
  if (winSet.length === 0) {
    for (let mo = 1; mo <= 12; mo++) { if (curMap[mo] && prevMap[mo]) winSet.push(mo); }
    fallback = true;
  }
  if (winSet.length === 0) {
    el.innerHTML = `
      <div class="gp-compare">
        <div class="gp-cmp-note">今年（${curS.n} 个月）与去年（${prevS.n} 个月）没有可比的重叠月份，无法生成同区间同比。请补齐两年相同月份（如都录入 1–${curMonthNow} 月）的数据后再看本板块。</div>
        ${overallTableFull}
      </div>`;
    return;
  }

  const sumBy = (map, mos, key) => mos.reduce((s, mo) => s + map[mo][key], 0);
  const curWinGross = sumBy(curMap, winSet, 'gross');
  const prevWinGross = sumBy(prevMap, winSet, 'gross');
  const curWinRev = sumBy(curMap, winSet, 'revenue');
  const prevWinRev = sumBy(prevMap, winSet, 'revenue');
  const curWinCost = sumBy(curMap, winSet, 'cost');
  const prevWinCost = sumBy(prevMap, winSet, 'cost');
  const curWinEntry = sumBy(curMap, winSet, 'entryTotal');
  const prevWinEntry = sumBy(prevMap, winSet, 'entryTotal');
  const curWinSalary = sumBy(curMap, winSet, 'salaryTotal');
  const prevWinSalary = sumBy(prevMap, winSet, 'salaryTotal');
  const curWinFixed = sumBy(curMap, winSet, 'fixedTotal');
  const prevWinFixed = sumBy(prevMap, winSet, 'fixedTotal');
  const cmpDelta = curWinGross - prevWinGross;
  const cmpPct = gpYoyText(curWinGross, prevWinGross);
  const yoyBadge = (curWinGross >= prevWinGross ? 'success' : 'warning');
  const winLabel = fallback ? `重叠 ${winSet.length} 个月` : `1–${curMonthNow} 月（重叠 ${winSet.length} 个月）`;

  // 年度关键指标同比（同区间口径，与主对比完全一致）
  const overallTable = `
    <div class="gp-cmp-sub">年度关键指标同比（同区间口径 ${winLabel}）</div>
    <table class="wt-cat">
      <thead><tr><th>指标</th><th>今年 ${curY}</th><th>去年 ${prevY}</th><th>同比</th></tr></thead>
      <tbody>
        <tr><td>净利润总额</td><td>${saMoney(curWinGross)}</td><td>${saMoney(prevWinGross)}</td><td class="${gpDeltaClass(curWinGross, prevWinGross)}">${gpYoyText(curWinGross, prevWinGross)}</td></tr>
        <tr><td>总营业额</td><td>${saMoney(curWinRev)}</td><td>${saMoney(prevWinRev)}</td><td class="${gpDeltaClass(curWinRev, prevWinRev)}">${gpYoyText(curWinRev, prevWinRev)}</td></tr>
        <tr><td>总成本</td><td>${saMoney(curWinCost)}</td><td>${saMoney(prevWinCost)}</td><td class="${gpDeltaClass(curWinCost, prevWinCost)}">${gpYoyText(curWinCost, prevWinCost)}</td></tr>
        <tr><td>净利润率</td><td>${rateTxt(curWinGross, curWinRev)}</td><td>${rateTxt(prevWinGross, prevWinRev)}</td><td class="${gpDeltaClass(curWinGross / (curWinRev || 1), prevWinGross / (prevWinRev || 1))}">${gpYoyText(curWinGross / (curWinRev || 1), prevWinGross / (prevWinRev || 1))}</td></tr>
      </tbody>
    </table>`;

  const overviewCards = `
    <div class="wt-stats">
      ${statCard(`今年(${curY})·1–${curMonthNow}月净利润`, saMoney(curWinGross), '')}
      ${statCard(`去年(${prevY})·1–${curMonthNow}月净利润`, saMoney(prevWinGross), '')}
      ${statCard('同区间同比增长', saMoney(cmpDelta) + '（' + cmpPct + '）', yoyBadge)}
    </div>`;

  const monthRows = winSet.map(mo => {
    const c = curMap[mo].gross, p = prevMap[mo].gross;
    const dCls = gpDeltaClass(c, p);
    return `<tr>
      <td>${String(mo).padStart(2, '0')}月</td>
      <td>${saMoney(c)}</td>
      <td>${saMoney(p)}</td>
      <td class="${dCls}">${saMoney(c - p)}</td>
      <td class="${dCls}">${gpYoyText(c, p)}</td>
    </tr>`;
  }).join('');
  const monthTable = `
    <div class="gp-cmp-sub">逐月对比 · 主口径（${winLabel} · 单位：元）</div>
    <table class="wt-cat">
      <thead><tr><th>月份</th><th>今年净利润</th><th>去年净利润</th><th>同比差额</th><th>同比</th></tr></thead>
      <tbody>
        ${monthRows}
        <tr class="gp-cmp-total"><td>同区间合计</td><td>${saMoney(curWinGross)}</td><td>${saMoney(prevWinGross)}</td><td class="${gpDeltaClass(curWinGross, prevWinGross)}">${saMoney(cmpDelta)}</td><td class="${gpDeltaClass(curWinGross, prevWinGross)}">${cmpPct}</td></tr>
      </tbody>
    </table>`;

  // 分组柱状图：各维度今年 vs 去年（主口径）
  const grpGroups = [
    { label: '营业额', cur: curWinRev, prev: prevWinRev },
    { label: '录入成本', cur: curWinEntry, prev: prevWinEntry },
    { label: '工资', cur: curWinSalary, prev: prevWinSalary },
    { label: '固定成本', cur: curWinFixed, prev: prevWinFixed }
  ];
  const grpChart = `
    <div class="gp-grp-wrap">
      <div class="gp-grp-legend"><span><i style="background:#2563eb"></i>今年 ${curY}</span><span><i style="background:#f59e0b"></i>去年 ${prevY}</span></div>
      ${buildGroupedBarChart(grpGroups)}
    </div>`;

  // 净利润变化拆解（营业额 / 录入成本 / 工资 / 固定成本）
  const ratePct = Math.round(grossMargin * 1000) / 10;
  const dRevW = curWinRev - prevWinRev;
  const dEntryW = curWinEntry - prevWinEntry;
  const dSalaryW = curWinSalary - prevWinSalary;
  const dFixedW = curWinFixed - prevWinFixed;
  const revContribW = dRevW * grossMargin;
  const bdRows = [
    { name: '营业额', cur: curWinRev, prev: prevWinRev, d: dRevW, impact: revContribW, note: '×' + ratePct + '%利润率' },
    { name: '录入成本', cur: curWinEntry, prev: prevWinEntry, d: dEntryW, impact: -dEntryW, note: '直接扣减' },
    { name: '工资', cur: curWinSalary, prev: prevWinSalary, d: dSalaryW, impact: -dSalaryW, note: '直接扣减' },
    { name: '固定成本', cur: curWinFixed, prev: prevWinFixed, d: dFixedW, impact: -dFixedW, note: '直接扣减' }
  ];
  const bdTable = `
    <div class="gp-cmp-sub">净利润变化拆解 · 主口径（${winLabel} · 单位：元）</div>
    <table class="wt-cat">
      <thead><tr><th>维度</th><th>今年</th><th>去年</th><th>同比变化</th><th>对净利润影响</th></tr></thead>
      <tbody>
        ${bdRows.map(r => {
          const dCls = gpDeltaClass(r.cur, r.prev);
          const impCls = r.impact >= 0 ? 'gp-up' : 'gp-down';
          return `<tr><td>${r.name}<span class="gp-cmp-note-tag">${r.note}</span></td><td>${saMoney(r.cur)}</td><td>${saMoney(r.prev)}</td><td class="${dCls}">${saMoney(r.d)}（${gpYoyText(r.cur, r.prev)}）</td><td class="${impCls}">${r.impact >= 0 ? '+' : ''}${saMoney(r.impact)}</td></tr>`;
        }).join('')}
        <tr class="gp-cmp-total"><td>合计（≈净利润变化）</td><td>—</td><td>—</td><td class="${gpDeltaClass(curWinGross, prevWinGross)}">${saMoney(cmpDelta)}</td><td class="${gpDeltaClass(curWinGross, prevWinGross)}">${saMoney(revContribW - dEntryW - dSalaryW - dFixedW)}</td></tr>
      </tbody>
    </table>`;

  // 原因拆解（基于同区间口径，最公平）
  const dGross = curWinGross - prevWinGross;
  const dCostW = curWinCost - prevWinCost;
  const better = dGross >= 0;
  const dir = better ? '优于' : '不及';
  const reasons = [
    `同区间（${winLabel}）下，今年净利润 <b>${saMoney(curWinGross)}</b>，${better ? '高于' : '低于'}去年 <b>${saMoney(prevWinGross)}</b>，同比 <b>${cmpPct}</b>，今年经营整体${dir}去年。`,
    `<b>营业额角度</b>：今年 ${saMoney(curWinRev)} vs 去年 ${saMoney(prevWinRev)}（${gpYoyText(curWinRev, prevWinRev)}），按 ${ratePct}% 利润率约贡献净利润 <b>${saMoney(revContribW)}</b>。`,
    `<b>录入成本角度</b>：今年 ${saMoney(curWinEntry)} vs 去年 ${saMoney(prevWinEntry)}（${gpYoyText(curWinEntry, prevWinEntry)}），${dEntryW >= 0 ? '上升' : '下降'} <b>${saMoney(dEntryW)}</b>，${dEntryW >= 0 ? '拖累' : '贡献'}净利润。`,
    `<b>工资角度</b>：今年 ${saMoney(curWinSalary)} vs 去年 ${saMoney(prevWinSalary)}（${gpYoyText(curWinSalary, prevWinSalary)}），${dSalaryW >= 0 ? '上升' : '下降'} <b>${saMoney(dSalaryW)}</b>，${dSalaryW >= 0 ? '拖累' : '贡献'}净利润${dSalaryW > 1e-9 ? '——工资是人力成本大头，需重点看排班人效' : ''}。`,
    `固定成本今年 ${saMoney(curWinFixed)} vs 去年 ${saMoney(prevWinFixed)}（${gpYoyText(curWinFixed, prevWinFixed)}）。以上分项拆解见上方「净利润变化拆解」表，合计应等于净利润变化 ${saMoney(cmpDelta)}。`
  ];
  if (dEntryW > 1e-9 && dGross < 0) reasons.push(`录入成本上升是今年转弱的重要成本因素，需核查报损 / 采购价 / 临期处理，减少无谓损耗。`);
  if (dSalaryW > 1e-9 && dGross < 0) reasons.push(`工资同比上升拖累利润，需复盘排班与人效，避免工时虚高。`);
  if (dCostW > 1e-9 && dGross < 0) reasons.push(`总体成本上升是今年转弱的主因，进入「月度成本管理」逐项核查固定 / 录入 / 工资。`);
  if (dRevW < -1e-9 && dGross < 0) reasons.push(`营业额下滑叠加成本压力，双重挤压导致净利润走弱。`);

  // 解决方案
  const solutions = [];
  if (better) {
    solutions.push(`<b>巩固优势</b>：今年整体${dir}去年，保持现有成本控制节奏，把表现好的月份策略（引流 / 促销 / 陈列）标准化并复制到薄弱月份。`);
  } else {
    solutions.push(`<b>补强薄弱月</b>：对照上方逐月对比，针对同比下滑明显的月份，用引流品 + 满减拉动客流与客单价，把缺口补回来。`);
    solutions.push(`<b>压降成本</b>：今年成本同比上升 <b>${saMoney(dCost)}</b>，进入「月度成本管理」逐项核查高成本项，优先砍可变动成本、设报损红线。`);
  }
  solutions.push(`<b>参考去年做法</b>：对比去年同月净利润较高的月份，借鉴其营业额结构与成本控制经验，避免今年同类月份重演下滑。`);
  solutions.push(`<b>月度经营复盘</b>：以上逐月对比表作为每月复盘依据，对连续同比下滑的月份设预警与改进动作，动态跟踪。`);

  el.innerHTML = `
    <div class="gp-compare">
      ${overviewCards}
      ${monthTable}
      <div class="gp-cmp-sub">分组柱状图 · 各维度今年 vs 去年（主口径 ${winLabel} · 单位：元）</div>
      ${grpChart}
      ${bdTable}
      <div class="gp-analysis" style="margin-top:14px;">
        <section><h4>同比变化原因（同区间口径）</h4><ul>${reasons.map(t => `<li>${t}</li>`).join('')}</ul></section>
        <section><h4>今年改进方案</h4><ul>${solutions.map(t => `<li>${t}</li>`).join('')}</ul></section>
      </div>
      ${overallTable}
    </div>`;
}

// ===================== 经销商费用管理 =====================
const DEALER_FEE_DEALERS_KEY = 'liumo_dealerfee_dealers';
const DEALER_FEE_SETTINGS_KEY = 'liumo_dealerfee_settings';
const DEALER_FEE_RECORDS_KEY = 'liumo_dealerfee_records';
let dealerFeeDealers = [];
let dealerFeeSettings = {};   // { [dealerId]: 每月固定金额 }
let dealerFeeRecords = [];    // { id, dealerId, year, month, amount, note, createdAt }
let dealerFeeTab = 'setting';  // setting | entry
let dealerFeeDealerEditing = null;
let dealerFeeRecEditing = null;
let dfContent = null, dfMod = null;

function loadDealerFee() {
  try { dealerFeeDealers = JSON.parse(localStorage.getItem(DEALER_FEE_DEALERS_KEY) || '[]'); } catch (e) { dealerFeeDealers = []; }
  if (!Array.isArray(dealerFeeDealers)) dealerFeeDealers = [];
  try { dealerFeeSettings = JSON.parse(localStorage.getItem(DEALER_FEE_SETTINGS_KEY) || '{}'); } catch (e) { dealerFeeSettings = {}; }
  if (typeof dealerFeeSettings !== 'object' || !dealerFeeSettings) dealerFeeSettings = {};
  try { dealerFeeRecords = JSON.parse(localStorage.getItem(DEALER_FEE_RECORDS_KEY) || '[]'); } catch (e) { dealerFeeRecords = []; }
  if (!Array.isArray(dealerFeeRecords)) dealerFeeRecords = [];
}
function saveDealerFeeDealers() { localStorage.setItem(DEALER_FEE_DEALERS_KEY, JSON.stringify(dealerFeeDealers)); }
function saveDealerFeeSettings() { localStorage.setItem(DEALER_FEE_SETTINGS_KEY, JSON.stringify(dealerFeeSettings)); }
function saveDealerFeeRecords() { localStorage.setItem(DEALER_FEE_RECORDS_KEY, JSON.stringify(dealerFeeRecords)); }

const dfDealerById = id => dealerFeeDealers.find(d => d.id === id);
const dfDealerName = id => { const d = dfDealerById(id); return d ? d.name : '已删除经销商'; };
const dfDealerEnabled = id => { const d = dfDealerById(id); return d ? !!d.enabled : false; };
const dfMonthLabel = (y, m) => y + '年' + (m < 10 ? '0' + m : '' + m) + '月';
const dfCurY = () => new Date().getFullYear();
const dfCurM = () => new Date().getMonth() + 1;
const dfEnabledDealers = () => dealerFeeDealers.filter(d => d.enabled);

function dfTabsHtml() {
  const tabs = [['setting', '经销商设置'], ['entry', '费用录入']];
  return `<div class="df-tabs">` + tabs.map(([id, name]) =>
    `<button class="df-tab ${dealerFeeTab === id ? 'on' : ''}" data-tab="${id}" type="button">${name}</button>`
  ).join('') + `</div>`;
}
function dfRender() { if (dfContent) renderDealerFeeModule(dfContent, dfMod); }

function renderDealerFeeModule(content, mod) {
  loadDealerFee();
  dfContent = content; dfMod = mod;
  content.innerHTML = `
    <div class="page-header">
      <div class="page-title">${mod.name}</div>
      <div class="page-desc">${mod.desc}</div>
    </div>
    <div class="wt-note">
      维护<b>经销商每月给超市的固定费用</b>。在「经销商设置」中添加经销商并<b>启用</b>、同时填写其<b>每月固定费用</b>；
      在「费用录入」中选择经销商（自动带出设置金额，可改）按月登记费用。
      <b>禁用</b>的经销商在费用录入中不可选择，其<b>已登记费用不受影响</b>。
    </div>
    ${dfTabsHtml()}
    <div id="dfBody"></div>
  `;
  content.querySelectorAll('.df-tab').forEach(b => b.addEventListener('click', () => {
    dealerFeeTab = b.dataset.tab;
    renderDealerFeeModule(content, mod);
  }));
  renderDealerFeeBody();
}
function renderDealerFeeBody() {
  const body = dfContent && dfContent.querySelector('#dfBody');
  if (!body) return;
  if (dealerFeeTab === 'setting') dfRenderSettingTab(body);
  else dfRenderEntryTab(body);
}
// 经销商设置：添加 / 编辑经销商（含每月固定费用）
function dfRenderSettingTab(body) {
  body.innerHTML = `
    <div class="wt-note">在添加经销商时即可同步设置其<b>每月固定费用</b>（也可在编辑中修改）。启用后方可用于费用录入。</div>
    <div id="dfDealerWrap"></div>
  `;
  dfRenderDealer(body.querySelector('#dfDealerWrap'));
}
// 费用录入：登记/编辑费用（自动带出设置金额）+ 记录列表 + 统计概览
function dfRenderEntryTab(body) {
  body.innerHTML = `
    <div class="wt-note">选择经销商后自动带出其在「经销商设置」中填写的每月固定金额，可修改后保存；同一经销商同月仅保留一条记录。</div>
    <div id="dfManageWrap"></div>
    <h3 style="margin:18px 0 8px;font-size:15px;font-weight:700;color:var(--text);">费用统计</h3>
    <div id="dfStatsWrap"></div>
  `;
  dfRenderManage(body.querySelector('#dfManageWrap'));
  dfRenderStats(body.querySelector('#dfStatsWrap'));
}

// ---- 费用管理 ----
function dfRenderManage(body) {
  const enabled = dfEnabledDealers();
  const curY = dfCurY(), curM = dfCurM();
  const edit = dealerFeeRecEditing ? dealerFeeRecords.find(r => r.id === dealerFeeRecEditing) : null;
  const selDealer = edit ? edit.dealerId : '';
  const selYear = edit ? edit.year : curY;
  const selMonth = edit ? edit.month : curM;
  const amt = edit ? edit.amount : '';
  const note = edit ? (edit.note || '') : '';
  const dealerOpts = enabled.map(d => `<option value="${d.id}"${String(d.id) === String(selDealer) ? ' selected' : ''}>${escapeHtml(d.name)}</option>`).join('');
  const yearOpts = [curY - 2, curY - 1, curY, curY + 1].map(y => `<option value="${y}"${y === selYear ? ' selected' : ''}>${y} 年</option>`).join('');
  const monthOpts = Array.from({ length: 12 }, (_, i) => i + 1).map(m => `<option value="${m}"${m === selMonth ? ' selected' : ''}>${m} 月</option>`).join('');

  body.innerHTML = `
    <div class="df-card">
      <h3>${edit ? '编辑费用记录' : '登记月度费用'}</h3>
      <div class="df-form">
        <div class="wt-field"><label>经销商</label><select id="dfRecDealer">${dealerOpts ? dealerOpts : '<option value="">（无启用经销商）</option>'}</select></div>
        <div class="wt-field"><label>年份</label><select id="dfRecYear">${yearOpts}</select></div>
        <div class="wt-field"><label>月份</label><select id="dfRecMonth">${monthOpts}</select></div>
        <div class="wt-field"><label>费用金额（元）</label><input type="number" step="any" min="0" id="dfRecAmount" placeholder="自动带出设置金额" value="${amt}"/></div>
        <div class="wt-field" style="grid-column:1/-1;"><label>备注（选填）</label><input type="text" id="dfRecNote" placeholder="如 8月货架费" value="${escapeHtml(note)}"/></div>
      </div>
      <div class="df-actions">
        <button class="btn-add" id="dfRecSave">${edit ? '保存修改' : '添加费用'}</button>
        ${edit ? '<button class="btn-ghost" id="dfRecCancel">取消</button>' : ''}
      </div>
      <div class="df-empty" id="dfRecHint"></div>
    </div>
    <div class="df-card">
      <h3>费用记录（${dealerFeeRecords.length}）</h3>
      <div id="dfRecList"></div>
    </div>
  `;

  const dealerSel = body.querySelector('#dfRecDealer');
  const amtInput = body.querySelector('#dfRecAmount');
  const hint = body.querySelector('#dfRecHint');
  const refreshHint = () => {
    const v = dealerSel.value;
    if (!v) { hint.textContent = ''; return; }
    if (dealerFeeSettings[v] != null) hint.textContent = '已自动带出 ' + dfDealerName(v) + ' 的每月固定费用 ' + saMoney(dealerFeeSettings[v]) + '（可修改）';
    else hint.textContent = '该经销商尚未设置每月费用，请手动输入，或先到「经销商设置」填写。';
  };
  if (dealerSel) {
    dealerSel.addEventListener('change', () => { if (amtInput && dealerSel.value && dealerFeeSettings[dealerSel.value] != null) amtInput.value = dealerFeeSettings[dealerSel.value]; refreshHint(); });
    refreshHint();
  }
  body.querySelector('#dfRecSave').addEventListener('click', dfSaveRec);
  const cancel = body.querySelector('#dfRecCancel');
  if (cancel) cancel.addEventListener('click', () => { dealerFeeRecEditing = null; dfRender(); });
  dfRenderRecList(body);
}
function dfSaveRec() {
  const body = dfContent.querySelector('#dfBody');
  const dealerId = body.querySelector('#dfRecDealer').value;
  const year = Number(body.querySelector('#dfRecYear').value);
  const month = Number(body.querySelector('#dfRecMonth').value);
  const amount = Number(body.querySelector('#dfRecAmount').value) || 0;
  const note = body.querySelector('#dfRecNote').value.trim();
  if (!dealerId) { showToast('请选择经销商'); return; }
  if (!(amount >= 0)) { showToast('请输入有效金额'); return; }
  const editId = dealerFeeRecEditing;
  if (editId) {
    const r = dealerFeeRecords.find(x => x.id === editId);
    if (r) { r.dealerId = dealerId; r.year = year; r.month = month; r.amount = amount; r.note = note; }
    dealerFeeRecEditing = null;
  } else {
    const exist = dealerFeeRecords.find(x => x.dealerId === dealerId && x.year === year && x.month === month);
    if (exist) { exist.amount = amount; exist.note = note; showToast('该月记录已存在，已更新金额'); }
    else dealerFeeRecords.push({ id: uid(), dealerId, year, month, amount, note, createdAt: Date.now() });
  }
  saveDealerFeeRecords();
  showToast('已保存');
  dfRender();
}
function dfRenderRecList(body) {
  const el = body.querySelector('#dfRecList');
  if (!el) return;
  const recs = dealerFeeRecords.slice().sort((a, b) => b.year - a.year || b.month - a.month);
  if (recs.length === 0) { el.innerHTML = `<div class="wt-empty">还没有费用记录，先在上方登记。</div>`; return; }
  el.innerHTML = `<table class="wt-cat"><thead><tr><th>经销商</th><th>状态</th><th>月份</th><th>费用金额</th><th>备注</th><th>操作</th></tr></thead><tbody>` +
    recs.map(r => {
      const st = dfDealerEnabled(r.dealerId) ? '<span class="df-status on">启用</span>' : '<span class="df-status off">禁用</span>';
      return `<tr>
        <td>${escapeHtml(dfDealerName(r.dealerId))}</td>
        <td>${st}</td>
        <td>${dfMonthLabel(r.year, r.month)}</td>
        <td>${saMoney(r.amount)}</td>
        <td>${escapeHtml(r.note || '')}</td>
        <td>
          <button class="df-btn" data-act="edit" data-id="${r.id}">编辑</button>
          <button class="df-btn df-del" data-act="del" data-id="${r.id}">删除</button>
        </td></tr>`;
    }).join('') + `</tbody></table>`;
  el.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id;
    if (b.dataset.act === 'edit') { dealerFeeRecEditing = id; dfRender(); }
    else if (confirm('确定删除该费用记录？')) { dealerFeeRecords = dealerFeeRecords.filter(x => x.id !== id); saveDealerFeeRecords(); dfRender(); }
  }));
}

// ---- 经销商管理 ----
function dfRenderDealer(body) {
  const edit = dealerFeeDealerEditing ? dfDealerById(dealerFeeDealerEditing) : null;
  const name = edit ? edit.name : '';
  const fee = edit ? (dealerFeeSettings[edit.id] != null ? dealerFeeSettings[edit.id] : '') : '';
  body.innerHTML = `
    <div class="df-card">
      <h3>${edit ? '编辑经销商' : '添加经销商'}</h3>
      <div class="df-form">
        <div class="wt-field"><label>名称</label><input type="text" id="dfDName" placeholder="如 旺旺食品" value="${escapeHtml(name)}"/></div>
        <div class="wt-field"><label>每月固定费用（元）</label><input type="number" step="any" min="0" id="dfDFee" placeholder="如 2000" value="${fee}"/></div>
      </div>
      <div class="df-actions">
        <button class="btn-add" id="dfDSave">${edit ? '保存修改' : '添加经销商'}</button>
        ${edit ? '<button class="btn-ghost" id="dfDCancel">取消</button>' : ''}
      </div>
    </div>
    <div class="df-card">
      <h3>经销商列表（${dealerFeeDealers.length}）</h3>
      <div id="dfDList"></div>
    </div>
  `;
  body.querySelector('#dfDSave').addEventListener('click', dfSaveDealer);
  const cancel = body.querySelector('#dfDCancel');
  if (cancel) cancel.addEventListener('click', () => { dealerFeeDealerEditing = null; dfRender(); });
  dfRenderDealerList(body);
}
function dfSaveDealer() {
  const body = dfContent.querySelector('#dfBody');
  const name = body.querySelector('#dfDName').value.trim();
  const fee = Number(body.querySelector('#dfDFee').value) || 0;
  if (!name) { showToast('请输入经销商名称'); return; }
  let id;
  if (dealerFeeDealerEditing) {
    const d = dfDealerById(dealerFeeDealerEditing);
    if (d) { d.name = name; id = d.id; }
    dealerFeeDealerEditing = null;
  } else {
    id = uid();
    dealerFeeDealers.push({ id, name, enabled: true, createdAt: Date.now() });
  }
  dealerFeeSettings[id] = fee;
  saveDealerFeeDealers(); saveDealerFeeSettings();
  showToast('已保存');
  dfRender();
}
function dfRenderDealerList(body) {
  const el = body.querySelector('#dfDList');
  if (!el) return;
  if (dealerFeeDealers.length === 0) { el.innerHTML = `<div class="wt-empty">还没有经销商，先在上方添加。</div>`; return; }
  const feeOf = d => dealerFeeSettings[d.id] != null ? (Number(dealerFeeSettings[d.id]) || 0) : 0;
  const sorted = dealerFeeDealers.slice().sort((a, b) => feeOf(b) - feeOf(a));
  const total = sorted.reduce((s, d) => s + feeOf(d), 0);
  el.innerHTML = `<table class="wt-cat"><thead><tr><th>名称</th><th>状态 / 月固定费用</th><th>操作</th></tr></thead><tbody>` +
    sorted.map(d => {
      const st = d.enabled ? '<span class="df-status on">启用</span>' : '<span class="df-status off">禁用</span>';
      const fee = dealerFeeSettings[d.id];
      const feeTxt = fee != null ? saMoney(fee) + '/月' : '未设置';
      return `<tr>
        <td>${escapeHtml(d.name)}</td>
        <td>${st} · ${feeTxt}</td>
        <td>
          <button class="df-btn" data-act="toggle" data-id="${d.id}">${d.enabled ? '禁用' : '启用'}</button>
          <button class="df-btn" data-act="edit" data-id="${d.id}">编辑</button>
          <button class="df-btn df-del" data-act="del" data-id="${d.id}">删除</button>
        </td></tr>`;
    }).join('') +
    `</tbody><tfoot><tr><td colspan="2">合计（${dealerFeeDealers.length} 个经销商 · 每月固定费用）</td><td>${saMoney(total)}/月</td></tr></tfoot></table>`;
  el.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id, act = b.dataset.act;
    if (act === 'toggle') {
      const d = dfDealerById(id);
      if (d) { d.enabled = !d.enabled; saveDealerFeeDealers(); showToast(d.enabled ? '已启用' : '已禁用（费用录入中不可再选，已有费用不受影响）'); dfRender(); }
    } else if (act === 'edit') { dealerFeeDealerEditing = id; dfRender(); }
    else if (act === 'del') {
      if (confirm('删除经销商将同时清除其费用设置；已登记的费用记录保留（显示「已删除经销商」）。确定？')) {
        dealerFeeDealers = dealerFeeDealers.filter(x => x.id !== id);
        delete dealerFeeSettings[id];
        saveDealerFeeDealers(); saveDealerFeeSettings();
        if (dealerFeeDealerEditing === id) dealerFeeDealerEditing = null;
        dfRender();

// 按经销商柱状图：单列，启用=蓝、禁用=灰，柱顶标注金额，经销商名旋转避免重叠
function buildDealerFeeBarChart(rows) {
  if (!rows.length) return '';
  const padL = 58, padR = 16, padT = 18, padB = 72, plotH = 320;
  const n = rows.length;
  const groupW = Math.max(54, 720 / Math.min(n, 12));
  const innerW = padL + groupW * n + padR;
  const H = padT + plotH + padB;
  const baseY = padT + plotH;
  const maxV = Math.max(1, ...rows.map(r => r.amt));
  const niceMax = niceCeil(maxV);
  const yOf = v => baseY - (Math.abs(v) / niceMax) * plotH;
  const ticks = 4;
  let grid = '';
  for (let i = 0; i <= ticks; i++) {
    const v = niceMax * i / ticks, y = yOf(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${innerW - padR}" y2="${y}" stroke="var(--border)" stroke-width="1" opacity="0.55"/>`;
    grid += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--text-muted,#6b7280)">${saMoneyShort(v)}</text>`;
  }
  const barW = Math.min(40, groupW * 0.5);
  let bars = '';
  rows.forEach((r, i) => {
    const cx = padL + groupW * i + groupW / 2;
    const x = cx - barW / 2;
    const h = Math.max(0, baseY - yOf(r.amt));
    const color = r.enabled ? '#2563eb' : '#94a3b8';
    bars += `<rect x="${x}" y="${yOf(r.amt)}" width="${barW}" height="${h}" rx="3" fill="${color}"><title>${escapeHtml(r.name)}（${r.enabled ? '启用' : '禁用'}）：${saMoney(r.amt)}</title></rect>`;
    if (h >= 12) bars += `<text x="${cx}" y="${yOf(r.amt) - 5}" text-anchor="middle" font-size="10.5" fill="${color}" font-weight="700">${saMoneyShort(r.amt)}</text>`;
    const ly = baseY + 14;
    bars += `<text x="${cx}" y="${ly}" text-anchor="end" font-size="11" fill="var(--text)" transform="rotate(-28 ${cx} ${ly})">${escapeHtml(r.name)}</text>`;
  });
  return `<svg class="df-chart-bar" viewBox="0 0 ${innerW} ${H}" role="img" aria-label="按经销商费用柱状图">${grid}${bars}</svg>`;
}

  const yearTable = yearRows.length ? `<table class="wt-cat"><thead><tr><th>年份</th><th>笔数</th><th>费用合计</th></tr></thead><tbody>` +
    yearRows.map(r => `<tr><td>${r.year} 年</td><td>${r.cnt}</td><td>${saMoney(r.amt)}</td></tr>`).join('') + `</tbody></table>` : `<div class="wt-empty">暂无数据</div>`;

           <div class="df-chart-wrap">${buildDealerFeeBarChart(dealerRows.map(r => ({ name: r.name, amt: r.amt, enabled: r.enabled })))}</div>`
