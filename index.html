// 旧版纯文本笔记 -> 活动（首行作标题，其余作详情，归为日常活动）
function migrateActivities() {
  const oldKey = 'liumo_subnotes_fresh';
  let old = [];
  try { old = JSON.parse(localStorage.getItem(oldKey) || '[]'); } catch (e) {}
  if (Array.isArray(old) && old.length && !localStorage.getItem(ACT_KEY)) {
    const migrated = old.map(n => {
      const text = (n.text || '').trim();
      const idx = text.indexOf('\n');
      const title = (idx > 0 ? text.slice(0, idx) : text).trim() || '未命名活动';
      const detail = idx > 0 ? text.slice(idx + 1).trim() : '';
      return {
        id: n.id || uid(), title, category: 'daily', detail,
        images: [], createdAt: n.createdAt || Date.now(), updatedAt: n.updatedAt || Date.now()
      };
    });
    writeActivities(migrated);
    localStorage.removeItem(oldKey);
  }
}

// 图片压缩：最长边 ~1000px，输出 JPEG（quality≈0.8），便于持久化到 localStorage
function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 1000; quality = quality || 0.8;
  return new Promise((resolve, reject) => {
    if (!file || !file.type || file.type.indexOf('image/') !== 0) { reject(new Error('not-image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('read'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('img'));
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext && canvas.getContext('2d');
        if (!ctx) { reject(new Error('ctx')); return; }
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch (err) { reject(err); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// 活动图片放大预览（点击卡片图片弹出，可左右切换、保存到本地）
let actLightbox = null;
let actLbImages = [];
let actLbIndex = 0;
function openActLightbox(images, index) {
  if (!actLightbox) {
    actLightbox = document.createElement('div');
    actLightbox.className = 'act-lightbox';
    actLightbox.innerHTML = `
      <div class="act-lightbox-backdrop" data-close="1"></div>
      <div class="act-lightbox-panel">
        <div class="act-lightbox-stage">
          <button type="button" class="act-lb-nav act-lb-prev" data-nav="-1" aria-label="上一张">‹</button>
          <img class="act-lightbox-img" alt="活动图片预览" />
          <button type="button" class="act-lb-nav act-lb-next" data-nav="1" aria-label="下一张">›</button>
        </div>
        <div class="act-lightbox-bar">
          <span class="act-lb-counter">1 / 1</span>
          <button type="button" class="act-lb-save">💾 保存到本地</button>
          <button type="button" class="act-lb-close" data-close="1">✕ 关闭</button>
        </div>
      </div>`;
    document.body.appendChild(actLightbox);
    actLightbox.addEventListener('click', e => {
      if (e.target.dataset.close) { closeActLightbox(); return; }
      const nav = e.target.closest('[data-nav]');
      if (nav) { stepActLightbox(parseInt(nav.dataset.nav, 10)); }
    });
    actLightbox.querySelector('.act-lb-save').addEventListener('click', () => {
      const img = actLightbox.querySelector('.act-lightbox-img');
      if (!img || !img.src) return;
      const a = document.createElement('a');
      a.href = img.src;
      a.download = '活动图片_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.jpg';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    document.addEventListener('keydown', e => {
      if (!actLightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeActLightbox();
      else if (e.key === 'ArrowLeft') stepActLightbox(-1);
      else if (e.key === 'ArrowRight') stepActLightbox(1);
    });
  }
  actLbImages = images || [];
  actLbIndex = Math.max(0, Math.min(index || 0, Math.max(0, actLbImages.length - 1)));
  actLightbox.classList.toggle('single', actLbImages.length <= 1);
  renderActLightbox();
  actLightbox.classList.add('open');
}
function renderActLightbox() {
  if (!actLightbox) return;
  actLightbox.querySelector('.act-lightbox-img').src = actLbImages[actLbIndex] || '';
  actLightbox.querySelector('.act-lb-counter').textContent = (actLbImages.length ? (actLbIndex + 1) : 0) + ' / ' + actLbImages.length;
}
function stepActLightbox(delta) {
  if (!actLbImages.length) return;
  actLbIndex = (actLbIndex + delta + actLbImages.length) % actLbImages.length;
  renderActLightbox();
}
function closeActLightbox() {
  if (actLightbox) actLightbox.classList.remove('open');
}

function syncSegUI() {
  const seg = document.getElementById('act-seg');
  if (!seg) return;
  seg.querySelectorAll('.act-seg-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === actSelectedCat));
}

function actResetForm() {
  actEditingId = null;
  actDraftImages = [];
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  if (t) t.value = '';
  if (d) d.value = '';
  actSelectedCat = ACT_CATEGORIES[0].id;

  renderActThumbs();
  const save = document.getElementById('act-save'), cancel = document.getElementById('act-cancel');
  if (save) save.textContent = '添加活动';
  if (cancel) cancel.hidden = true;
}

function openActModal() {
  const modal = document.getElementById('actModal');
  if (!modal) return;
  renderActForm();
  const titleEl = document.getElementById('actModalTitle');
  if (titleEl) titleEl.textContent = actEditingId ? '编辑活动' : '添加活动';
  modal.classList.add('open');
  const dlg = modal.querySelector('.act-modal-dialog');
  if (dlg) dlg.focus();
}

function closeActForm() {
  const modal = document.getElementById('actModal');
  if (modal) modal.classList.remove('open');
  actResetForm();
}

function actOpenAdd() {
  actResetForm();
  if (actTab !== 'all') actSelectedCat = actTab;
  syncSegUI();
  openActModal();
}

function actSave() {
  const wasEdit = !!actEditingId;
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  const title = t.value.trim();
  if (!title) { showToast('请填写标题'); if (t) t.focus(); return; }
  const detail = d.value.trim();
  const list = readActivities();
  if (actEditingId) {
    const a = list.find(x => x.id === actEditingId);
    if (a) { a.title = title; a.category = actSelectedCat; a.detail = detail; a.images = actDraftImages.slice(); a.updatedAt = Date.now(); }
  } else {
    list.unshift({ id: uid(), title, category: actSelectedCat, detail, images: actDraftImages.slice(), createdAt: Date.now(), updatedAt: Date.now() });
  }
  writeActivities(list);
  actResetForm();
  renderActTabs();
  renderActList();
  closeActForm();
  showToast(wasEdit ? '已更新' : '已添加');
}

function actStartEdit(id) {
  const a = readActivities().find(x => x.id === id);
  if (!a) return;
  // 先置状态，再渲染（renderActForm 会重建表单，必须在渲染后回填）
  actEditingId = id;
  actDraftImages = (a.images || []).slice();
  actSelectedCat = a.category;
  openActModal();
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  if (t) t.value = a.title;
  if (d) d.value = a.detail || '';
  syncSegUI();
  renderActThumbs();
  const save = document.getElementById('act-save'), cancel = document.getElementById('act-cancel');
  if (save) save.textContent = '保存修改';
  if (cancel) cancel.hidden = false;
  if (t) t.focus();
}

function bindActivities() {
  const tabs = document.getElementById('act-tabs');
  const form = document.getElementById('act-form-container');
  const list = document.getElementById('act-list');
  const addBtn = document.getElementById('actAddBtn');
  const modal = document.getElementById('actModal');

  if (tabs) {
    tabs.addEventListener('click', e => {
      const t = e.target.closest('.act-tab');
      if (!t) return;
      actTab = t.dataset.tab;
      if (actTab !== 'all') actSelectedCat = actTab;
      renderActTabs();
      syncSegUI();
      renderActList();
    });
  }

  if (addBtn) addBtn.addEventListener('click', actOpenAdd);

  if (modal) {
    modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeActForm(); });
    modal.addEventListener('keydown', e => { if (e.key === 'Escape') closeActForm(); });
  }

  if (form) {
    form.addEventListener('click', e => {
      const segBtn = e.target.closest('.act-seg-btn');
      if (segBtn) { actSelectedCat = segBtn.dataset.cat; syncSegUI(); return; }
      if (e.target.closest('#act-img-add')) { const f = document.getElementById('act-file'); if (f) f.click(); return; }
      const rm = e.target.closest('.act-thumb-remove');
      if (rm) {
        const i = parseInt(rm.dataset.idx, 10);
        if (!isNaN(i)) { actDraftImages.splice(i, 1); renderActThumbs(); }
        return;
      }
      if (e.target.closest('#act-save')) { actSave(); return; }
      if (e.target.closest('#act-cancel')) { closeActForm(); return; }
    });

    const fileEl = document.getElementById('act-file');
    if (fileEl) {
      fileEl.addEventListener('change', async e => {
        const files = Array.from(e.target.files || []);
        for (const f of files) {
          try { const d = await compressImage(f); actDraftImages.push(d); }
          catch (err) { showToast('图片处理失败'); }
        }
        renderActThumbs();
        e.target.value = '';
      });
    }
  }

  if (list) {
    list.addEventListener('click', e => {
      const img = e.target.closest('.act-card-img');
      if (img) {
        const card = img.closest('.act-card');
        const imgs = card ? [...card.querySelectorAll('.act-card-img')].map(i => i.getAttribute('src')) : [img.getAttribute('src')];
        const idx = imgs.indexOf(img.getAttribute('src'));
        openActLightbox(imgs, idx < 0 ? 0 : idx);
        return;
      }
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const id = btn.dataset.id, act = btn.dataset.act;
      if (act === 'edit') { actStartEdit(id); }
      else if (act === 'delete') {
        if (typeof confirm === 'function' && !confirm('确定删除该活动？')) return;
        const arr = readActivities().filter(x => x.id !== id);
        writeActivities(arr);
        if (actEditingId === id) actResetForm();
        renderActTabs();
        renderActList();
        showToast('已删除');
      }
    });
  }
}

    list.innerHTML = '<li class="dc-empty">还没有检查项，点「＋ 添加检查项」开始记录</li>';
  } else {
    list.innerHTML = dailyCheckList.map(it => `
      <li class="dc-item ${it.done ? 'done' : ''}" data-id="${it.id}">
        <button class="dc-check" data-act="toggle" title="标记完成">${it.done ? '✅' : '⬜'}</button>
        <span class="dc-text">${escapeHtml(it.text)}</span>
        <button class="dc-del" data-act="del" title="删除">✕</button>
      </li>`).join('');
  }
  const total = dailyCheckList.length;
  const done = dailyCheckList.filter(i => i.done).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const fill = document.getElementById('dcFill');
  if (fill) fill.style.width = pct + '%';
  const pt = document.getElementById('dcProgressText');
  if (pt) pt.textContent = '已完成 ' + done + '/' + total;
}
function bindDailyCheck() {
  const list = document.getElementById('dcList');
  const addBtn = document.getElementById('dcAdd');
  const addRow = document.getElementById('dcAddRow');
  const input = document.getElementById('dcInput');
  const addConfirm = document.getElementById('dcAddConfirm');
  const resetBtn = document.getElementById('dcReset');
  if (addBtn) addBtn.addEventListener('click', () => { if (addRow) addRow.hidden = !addRow.hidden; if (input) input.focus(); });
  if (addConfirm) addConfirm.addEventListener('click', () => {
    const v = (input && input.value || '').trim();
    if (!v) { if (input) input.focus(); return; }
    dailyCheckList.push({ id: uid(), text: v, done: false });
    saveDailyCheck(); renderDailyCheckList();
    if (input) input.value = '';
    if (addRow) addRow.hidden = true;
  });
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') addConfirm.click(); });
  if (resetBtn) resetBtn.addEventListener('click', () => {
    dailyCheckList.forEach(i => i.done = false); saveDailyCheck(); renderDailyCheckList(); showToast('已重置为未完成');
  });
  if (list) list.addEventListener('click', e => {
    const li = e.target.closest('.dc-item'); if (!li) return;
    const id = li.dataset.id;
    const actEl = e.target.closest('[data-act]');
    const act = actEl && actEl.dataset.act;
    const it = dailyCheckList.find(x => x.id === id); if (!it) return;
    if (act === 'toggle') { it.done = !it.done; saveDailyCheck(); renderDailyCheckList(); }
    else if (act === 'del') { dailyCheckList = dailyCheckList.filter(x => x.id !== id); saveDailyCheck(); renderDailyCheckList(); }
  });
}

function getFilteredTodos() {
  let list = todos;
  if (filter === 'active') list = list.filter(t => !t.done);
  else if (filter === 'done') list = list.filter(t => t.done);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    list = list.filter(t => (t.title || '').toLowerCase().includes(q));
  }
  const prioOrder = { high: 3, medium: 2, low: 1 };
  const sorted = [...list];
  if (memoSortMode === 'custom') {
    // 自定义顺序:按手动拖拽的 order 升序
    sorted.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  } else {
    // 按优先级:未完成在前,高优先级在前,再按创建时间
    sorted.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (prioOrder[b.priority] !== prioOrder[a.priority]) return prioOrder[b.priority] - prioOrder[a.priority];
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
  }
  return sorted;
}

function setMemoSortMode(mode) {
  memoSortMode = mode;
  localStorage.setItem('liumo_memo_sort', mode);
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
  renderTodoList();
}

function reorderTodos(fromId, toId) {
  const fromIdx = todos.findIndex(t => t.id === fromId);
  const toIdx = todos.findIndex(t => t.id === toId);
  if (fromIdx < 0 || toIdx < 0) return;
  const [moved] = todos.splice(fromIdx, 1);
  todos.splice(toIdx, 0, moved);
  todos.forEach((t, i) => { t.order = i; });
  saveTodos();
  renderTodoList();
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ---------- 事件绑定 ----------
function bindTodoEvents() {
  // 添加备忘录
  const input = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const prioritySelect = document.getElementById('prioritySelect');

  function addTodo() {
    const title = input.value.trim();
    if (!title) {
      showToast('请输入备忘内容');
      input.focus();
      return;
    }
    const maxOrder = todos.reduce((m, t) => Math.max(m, typeof t.order === 'number' ? t.order : 0), -1);
    todos.unshift({
      id: uid(),
      title,
      done: false,
      priority: prioritySelect.value,
      order: maxOrder + 1,
      createdAt: Date.now()
    });
    saveTodos();
    input.value = '';
    prioritySelect.value = 'medium';
    renderStats();
    renderTodoList();
    input.focus();
  }

  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  // 筛选(仅带 data-filter 的按钮)
  document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.toggle('active', b === btn));
      renderTodoList();
    });
  });

  // 排序模式切换:按优先级 / 自定义顺序(可拖拽)
  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => setMemoSortMode(btn.dataset.sort));
  });

  // 搜索
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', () => {
    search = searchInput.value;
    renderTodoList();
  });

  // 清除已完成
  document.getElementById('clearDoneBtn').addEventListener('click', () => {
    const doneCount = todos.filter(t => t.done).length;
    if (doneCount === 0) {
      showToast('没有已完成的备忘');
      return;
    }
    todos = todos.filter(t => !t.done);
    saveTodos();
    renderStats();
    renderTodoList();
    showToast(`已清除 ${doneCount} 条已完成备忘`);
  });

  // 拖拽排序(仅自定义顺序模式)
  const listEl = document.getElementById('todoList');
  let dragId = null;
  listEl.addEventListener('dragstart', e => {
    const item = e.target.closest('.todo-item');
    if (!item || !item.hasAttribute('draggable')) return;
    dragId = item.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragId);
    setTimeout(() => item.classList.add('dragging'), 0);
  });
  listEl.addEventListener('dragend', e => {
    const item = e.target.closest('.todo-item');
    if (item) item.classList.remove('dragging');
    listEl.querySelectorAll('.todo-item').forEach(el => el.classList.remove('drag-over'));
    dragId = null;
  });
  listEl.addEventListener('dragover', e => {
    e.preventDefault();
    const item = e.target.closest('.todo-item');
    if (!item || !dragId || item.dataset.id === dragId) return;
    item.classList.add('drag-over');
  });
  listEl.addEventListener('dragleave', e => {
    const item = e.target.closest('.todo-item');
    if (item) item.classList.remove('drag-over');
  });
  listEl.addEventListener('drop', e => {
    e.preventDefault();
    const item = e.target.closest('.todo-item');
    if (!item || !dragId) return;
    const targetId = item.dataset.id;
    item.classList.remove('drag-over');
    if (targetId && targetId !== dragId) reorderTodos(dragId, targetId);
    dragId = null;
  });

  // 列表事件委托
  document.getElementById('todoList').addEventListener('click', e => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    const id = target.dataset.id;
    const todo = todos.find(t => t.id === id);
    if (!todo) return;

    if (action === 'toggle') {
      todo.done = !todo.done;
      saveTodos();
      renderStats();
      renderTodoList();
    } else if (action === 'edit') {
      editingId = id;
      renderTodoList();
      const editInput = document.getElementById(`editInput-${id}`);
      if (editInput) {
        editInput.focus();
        editInput.setSelectionRange(editInput.value.length, editInput.value.length);
      }
    } else if (action === 'delete') {
      todos = todos.filter(t => t.id !== id);
      saveTodos();
      renderStats();
      renderTodoList();
      showToast('已删除');
    } else if (action === 'save-edit') {
      const editInput = document.getElementById(`editInput-${id}`);
      const newTitle = editInput.value.trim();
      if (newTitle) {
        todo.title = newTitle;
        saveTodos();
      }
      editingId = null;
      renderTodoList();
    } else if (action === 'cancel-edit') {
      editingId = null;
      renderTodoList();
    }
  });

  // 编辑框回车保存、ESC 取消
  document.getElementById('todoList').addEventListener('keydown', e => {
    if (e.target.classList.contains('todo-edit-input')) {
      const id = e.target.id.replace('editInput-', '');
      if (e.key === 'Enter') {
        const todo = todos.find(t => t.id === id);
        const newTitle = e.target.value.trim();
        if (newTitle && todo) {
          todo.title = newTitle;
          saveTodos();
        }
        editingId = null;
        renderTodoList();
      } else if (e.key === 'Escape') {
        editingId = null;
        renderTodoList();
      }
    }
  });
}

// ===================== 云端同步（GitHub Gist） =====================
let SKIP_SYNC = false;
let syncTimer = null;
const SYNC_PREFIX = 'liumo_sync_';
const SYNC_TOKEN_KEY = SYNC_PREFIX + 'token';
const SYNC_GIST_KEY = SYNC_PREFIX + 'gist';
const SYNC_AUTO_KEY = SYNC_PREFIX + 'auto';
const SYNC_FILE = 'liumo-workbench-data.json';
const SYNC_LASTPUSH_CONTENT = SYNC_PREFIX + 'lastpush';

// 规范化序列化（排序键），用于比较本地/云端/基线内容是否一致
function canon(obj){
  if(!obj || typeof obj !== 'object') return JSON.stringify(obj);
  const o = {};
  for(const k of Object.keys(obj).sort()) o[k] = obj[k];
  return JSON.stringify(o);
}

// 解析云端快照：兼容新格式 {updatedAt,data} 与旧格式（裸平铺 JSON）
function safeParseSnapshot(content){
  try {
    const o = JSON.parse(content);
    if(o && typeof o === 'object' && o.data && typeof o.data === 'object') return o;
    return { updatedAt: null, data: (o && typeof o === 'object') ? o : {} };
  } catch(e){ return null; }
}

// 把云端快照写入本地（保留同步配置键），可选回写 lastpush 时间戳
async function applyCloudSnapshot(snap, opts){
  opts = opts || {};
  const data = snap && snap.data ? snap.data : {};
  SKIP_SYNC = true;
  try {
    clearLocalUserData();
    for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
    reloadAllData();
    renderContent();
    if(opts.setLastPush && snap) localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(snap.data || {}));
  } finally {
    SKIP_SYNC = false; // 任何异常都必须释放，否则自动同步会永久失效
  }
}

// 拦截 setItem, 实现改动后防抖自动同步
(function(){
  const _set = Storage.prototype.setItem;
  Storage.prototype.setItem = function(k, v){
    _set.call(this, k, v);
    if(!SKIP_SYNC && typeof k === 'string' && !k.startsWith(SYNC_PREFIX)) scheduleSync();
  };
})();

function scheduleSync(){
  if(localStorage.getItem(SYNC_AUTO_KEY) !== '1') return;
  if(!localStorage.getItem(SYNC_TOKEN_KEY) || !localStorage.getItem(SYNC_GIST_KEY)) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncPushNow(true); }, 2000);
}

function gatherLocal(){
  const o = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && !k.startsWith(SYNC_PREFIX)) o[k] = localStorage.getItem(k);
  }
  return o;
}

// 同步超限降级：去掉活动图片（仅保留标题/类别/详情等文字），让其余数据仍可备份
function stripActivityImages(data){
  const out = {};
  for(const k in data){
    if(k === 'liumo_activities_fresh'){
      try {
        const arr = JSON.parse(data[k] || '[]');
        out[k] = JSON.stringify(arr.map(a => { const c = Object.assign({}, a); delete c.images; return c; }));
      } catch(e){ out[k] = data[k]; }
    } else {
      out[k] = data[k];
    }
  }
  return out;
}

function timeStr(){
  const d = new Date();
  return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
}
function setSyncStatus(t){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = t;
}

async function syncPushNow(silent, opts){
  opts = opts || {};
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  if(!tok){ if(!silent) showToast('请先在云端同步面板填入 GitHub Token'); return; }
  // 首次同步且无 GID 时，复用账号下最新的备份 Gist（避免不断新建孤儿 Gist）
  if(!gid){ const fg = await findSyncGist(tok); if(fg){ gid = fg; localStorage.setItem(SYNC_GIST_KEY, fg); } }
  const now = new Date().toISOString();
  const localData = gatherLocal();
  let content = JSON.stringify({ updatedAt: now, data: localData });
  // 守卫 + 降级：GitHub Gist 单文件上限约 1MB。活动图片为 base64 易超限，
  // 超限时先尝试「仅同步文字、跳过活动图片」让其余数据仍可备份，仍超限才中止。
  if (content.length > 950000) {
    const reduced = stripActivityImages(localData);
    const reducedContent = JSON.stringify({ updatedAt: now, data: reduced });
    if (reducedContent.length <= 950000) {
      setSyncStatus('已同步(跳过图片)');
      if (!silent) showToast('活动图片过大已跳过，已同步其余数据（标题/类别/详情）');
      content = reducedContent;
    } else {
      setSyncStatus('数据过大');
      if (!silent) showToast('同步失败：本地数据过大，已超过 GitHub Gist 单文件上限，建议精简数据后再同步');
      return;
    }
  }

  // 冲突感知（三路）：云端自我们上次同步后若被改过，则拉取云端而不是覆盖它
  if(gid && !opts.force){
    const base = localStorage.getItem(SYNC_LASTPUSH_CONTENT);
    if(base !== null && base !== undefined){
      try {
        const cres = await fetch('https://api.github.com/gists/' + gid, {
          headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
        });
        if(cres.ok){
          const cj = await cres.json();
          const cf = cj.files && cj.files[SYNC_FILE];
          if(cf){
            const cs = safeParseSnapshot(cf.content);
            const remoteData = cs ? (cs.data || {}) : {};
            if(canon(remoteData) !== base){
              await applyCloudSnapshot(cs, { setLastPush:true });
              setSyncStatus('已合并云端更新 ' + timeStr());
              if(!silent) showToast('云端有更新，已合并（未覆盖）');
              return;
            }
          }
        }
      } catch(e){ /* 忽略，继续推送 */ }
    }
  }
  const payload = JSON.stringify({ public:false, files: { [SYNC_FILE]: { content: content } } });
  async function doPush(g){
    let url = 'https://api.github.com/gists', method = 'POST';
    if(g){ url = 'https://api.github.com/gists/' + g; method = 'PATCH'; }
    return fetch(url, { method: method, headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body: payload });
  }
  try {
    let res = await doPush(gid);
    if(res.status === 401){ showToast('同步失败: Token 无效/无权限（401），请确认填入的是带 gist 权限的 Token'); return; }
    if(res.status === 404 && gid){            // Gist 已不存在（被删除等），清空 GID 重建
      localStorage.removeItem(SYNC_GIST_KEY);
      gid = null;
      res = await doPush(null);
      if(res.status === 401){ showToast('同步失败: Token 无效/无权限（401），请确认填入的是带 gist 权限的 Token'); return; }
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if(!gid && j.id){
      SKIP_SYNC = true;
      localStorage.setItem(SYNC_GIST_KEY, j.id);
      SKIP_SYNC = false;
    }
    localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(localData));
    setSyncStatus('已同步 ' + timeStr());
    if(!silent) showToast('已同步到云端');
  } catch(e){
    setSyncStatus('同步失败');
    if(!silent) showToast('同步失败: ' + e.message);
  }
}

async function restoreFromCloud(){
  clearTimeout(syncTimer); // 取消可能待推送的本地改动，避免把云端覆盖掉
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  if(!tok){ showToast('请先配置云端同步（填入 Token）'); return; }
  if(!gid){ gid = await findSyncGist(tok); if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); } }
  if(!gid){ showToast('未找到云端备份 Gist，请先「立即同步」'); return; }
  if(!confirm('从云端恢复将覆盖本地当前数据，确定继续？')) return;
  try {
    let res = await fetch('https://api.github.com/gists/' + gid, {
      headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
    });
    if(res.status === 404){            // GID 失效，重新查找最新备份
      localStorage.removeItem(SYNC_GIST_KEY);
      gid = await findSyncGist(tok);
      if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); res = await fetch('https://api.github.com/gists/'+gid, { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } }); }
      else { showToast('未找到云端备份 Gist，请先「立即同步」'); return; }
    }
    if(res.status === 401){ showToast('恢复失败: Token 无效/无权限，请确认填入的是带 gist 权限的 Token'); return; }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const f = j.files && j.files[SYNC_FILE];
    if(!f){ showToast('云端暂无数据'); return; }
    const snap = safeParseSnapshot(f.content);
    if(!snap){ showToast('云端数据格式异常'); return; }
    await applyCloudSnapshot(snap, { setLastPush:true });
    showToast('已从云端恢复数据');
    setSyncStatus('已配置');
  } catch(e){ showToast('恢复失败: ' + e.message); }
}

async function findSyncGist(tok){
  try {
    const u = await fetch('https://api.github.com/user', { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } });
    if(!u.ok) return null;
    const me = await u.json();
    const r = await fetch('https://api.github.com/users/'+me.login+'/gists?per_page=100', { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } });
    if(!r.ok) return null;
    const list = await r.json();
    // 选 updated_at 最新的那份备份（列表不含文件内容，故以 Gist 更新时间为准）
    let best = null, bestScore = -1;
    for(const g of list){
      if(!(g.files && g.files[SYNC_FILE])) continue;
      const score = Date.parse(g.updated_at || g.created_at || 0);
      if(score > bestScore){ bestScore = score; best = g.id; }
    }
    return best;
  } catch(e){ return null; }
}

function clearLocalUserData(){
  const keep = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SYNC_PREFIX) === 0) keep[k] = localStorage.getItem(k);
  }
  localStorage.clear();
  for(const k in keep) localStorage.setItem(k, keep[k]);
}

async function tryCloudRestoreFirst(){
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  if(!tok) return false;
  if(!gid){ gid = await findSyncGist(tok); if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); } }
  if(!gid) return false;
  try {
    const res = await fetch('https://api.github.com/gists/' + gid, {
      headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
    });
    if(!res.ok) return false;
    const j = await res.json();
    const f = j.files && j.files[SYNC_FILE];
    if(!f) return false;
    const snap = safeParseSnapshot(f.content);
    if(!snap) return false;
    const data = snap.data || {};
    if(Object.keys(data).length === 0) return false;
    let hasLocal = false;
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && !k.startsWith(SYNC_PREFIX) && k!=='liumo_workbench_initialized'){ hasLocal=true; break; } }
    if(hasLocal) return false;
    SKIP_SYNC = true;
    try {
      for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
      reloadAllData();
      if(snap.updatedAt) localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(snap.data || {}));
    } finally {
      SKIP_SYNC = false; // 异常也必须释放，避免自动同步永久失效
    }
    return Object.keys(data).length > 0;
  } catch(e){ return false; }
}

  loadTodos(); loadQuotes(); loadStudyRecords(); loadStudyConfig(); loadStudyPoints(); loadWorkTasks(); loadWorkDone();
}

function exportBackup(){
  const data = gatherLocal();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const ds = d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
  a.href = url; a.download = 'liumo-backup-'+ds+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  showToast('已导出备份文件');
}

function importBackupFromFile(file){
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const data = JSON.parse(reader.result);
      SKIP_SYNC = true;
      try {
        for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
        reloadAllData();
        renderContent();
      } finally {
        SKIP_SYNC = false; // 导入异常也必须释放，避免自动同步永久失效
      }
      showToast('已从备份文件恢复数据');
      if(localStorage.getItem(SYNC_AUTO_KEY) === '1') syncPushNow(true);
    } catch(e){ showToast('导入失败: 文件格式错误'); }
  };
  reader.readAsText(file);
}

function bindSyncUI(){
  const btn = document.getElementById('syncBtn');
  if(!btn) return;
  const panel = document.getElementById('syncPanel');
  btn.onclick = function(){ panel.hidden = !panel.hidden; };
  const tokEl = document.getElementById('syncToken');
  const autoEl = document.getElementById('syncAuto');
  tokEl.value = localStorage.getItem(SYNC_TOKEN_KEY) || '';
  autoEl.checked = localStorage.getItem(SYNC_AUTO_KEY) === '1';
  tokEl.oninput = function(){ localStorage.setItem(SYNC_TOKEN_KEY, tokEl.value.trim()); };
  autoEl.onchange = function(){
    localStorage.setItem(SYNC_AUTO_KEY, autoEl.checked ? '1' : '0');
    if(autoEl.checked) syncPushNow(true);
  };
  document.getElementById('syncNow').onclick = function(){ syncPushNow(false, { force: true }); };
  document.getElementById('syncRestore').onclick = function(){ restoreFromCloud(); };
  document.getElementById('syncDisconnect').onclick = function(){
    localStorage.removeItem(SYNC_TOKEN_KEY);
    localStorage.removeItem(SYNC_GIST_KEY);
    localStorage.removeItem(SYNC_AUTO_KEY);
    setSyncStatus('未配置'); tokEl.value=''; autoEl.checked=false;
    showToast('已断开云端同步');
  };
  document.getElementById('syncExport').onclick = exportBackup;
  document.getElementById('syncImport').onclick = function(){ document.getElementById('syncImportFile').click(); };
  document.getElementById('syncImportFile').onchange = function(e){
    const f = e.target.files && e.target.files[0];
    if(f) importBackupFromFile(f);
    e.target.value = '';
  };
}

function initCloudSync(){
  bindSyncUI();
  if(localStorage.getItem(SYNC_GIST_KEY) && localStorage.getItem(SYNC_TOKEN_KEY)) setSyncStatus('已配置');
  else setSyncStatus('未配置');
}

// 获取今天日期字符串 YYYY-MM-DD
function wlTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 判断任务在今天是否应该出现
function wlIsTaskDueToday(task, dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDate();
  const wd = d.getDay(); // 0=周日
  const month = d.getMonth() + 1;
  const r = task.repeat || { type: 'daily' };
  switch (r.type) {
    case 'daily': return true;
    case 'once': return r.date === dateStr;
    case 'weekly': return (r.weekdays || []).includes(wd);
    case 'monthly': return (r.days || []).includes(day);
    case 'quarterly': return month % 3 === 1 && day <= 3; // 每季度首月前3天
    case 'yearly': return r.date && r.date.slice(5) === dateStr.slice(5);
    default: return true;
  }
}

// 获取今天的任务列表(含完成状态)
function wlGetTodayTasks() {
  const today = wlTodayStr();
  return workTasks
    .filter(t => wlIsTaskDueToday(t, today))
    .map(t => {
      const doneKey = `${today}:${t.id}`;
      return { ...t, done: !!workDone[doneKey], doneKey };
    })
    .sort((a, b) => {
      // 未完成排前面，再按象限优先级(重要紧急最前)
      if (a.done !== b.done) return a.done ? 1 : -1;
      const qa = (a.important?2:0) + (a.urgent?1:0);
      const qb = (b.important?2:0) + (b.urgent?1:0);
      return qb - qa;
    });
}

// 获取象限分类
function wlGetQuadrant(task) {
  if (task.important && task.urgent) return 'iq';      // 重要紧急
  if (task.important && !task.urgent) return 'inq';    // 重要不紧急
  if (!task.important && task.urgent) return 'uq';     // 紧急不重要
  return 'nuq';                                         // 不重要不紧急
}

// 循环规则文字
function wlRepeatText(r) {
  r = r || { type: 'daily' };
  switch (r.type) {
    case 'daily': return '每日';
    case 'weekly': return '每周 ' + (r.weekdays||[]).map(w => WEEKDAY_NAMES[w]).join('、');
    case 'monthly': return '每月 ' + (r.days||[]).join('、') + ' 号';
    case 'quarterly': return '每季度';
    case 'yearly': return '每年 ' + (r.date||'').slice(5);
    case 'once': return '一次性 ' + (r.date||'');
    default: return '每日';
  }
}

// 渲染循环规则详情输入
function wlRenderRepeatDetail() {
  const sel = document.getElementById('wlRepeatType');
  if (!sel) return;
  const type = sel.value;
  const detailEl = document.getElementById('wlRepeatDetail');
  if (!detailEl) return;

  if (type === 'weekly') {
    detailEl.innerHTML = '<div class="wl-weekdays">' + WEEKDAY_NAMES.map((n,i) =>
      `<label class="wl-wd"><input type="checkbox" value="${i}" ${i>=1&&i<=5?'checked':''}/> ${n.slice(1)}</label>`
    ).join('') + '</div>';
  } else if (type === 'monthly') {
    detailEl.innerHTML = '<input type="text" class="wl-input" id="wlDays" placeholder="输入日期,多个用逗号分隔 如 1,15,30" />';
  } else if (type === 'once' || type === 'yearly') {
    detailEl.innerHTML = '<input type="date" class="wl-input" id="wlDate" />';
  } else {
    detailEl.innerHTML = '';
  }
}

// 保存任务
function wlSaveTask() {
  const title = document.getElementById('wlTaskTitle').value.trim();
  if (!title) { showToast('请输入任务内容'); return; }

  const important = document.getElementById('wlImportant').checked;
  const urgent = document.getElementById('wlUrgent').checked;
  const note = document.getElementById('wlNote').value.trim();
  const type = document.getElementById('wlRepeatType').value;

  let repeat = { type };
  if (type === 'weekly') {
    const wds = Array.from(document.querySelectorAll('#wlRepeatDetail input:checked')).map(c => parseInt(c.value));
    repeat.weekdays = wds.length ? wds : [1,2,3,4,5];
  } else if (type === 'monthly') {
    const daysStr = document.getElementById('wlDays').value.trim();
    const days = daysStr ? daysStr.split(/[,，\s]+/).map(Number).filter(n => n>=1 && n<=31) : [1];
    repeat.days = days;
  } else if (type === 'once' || type === 'yearly') {
    const dateVal = document.getElementById('wlDate').value;
    repeat.date = dateVal || wlTodayStr();
  }

  if (workEditingTaskId) {
    const task = workTasks.find(t => t.id === workEditingTaskId);
    if (task) {
      task.title = title; task.important = important; task.urgent = urgent;
      task.note = note; task.repeat = repeat;
    }
    showToast('任务已更新');
  } else {
    workTasks.push({ id: uid(), title, repeat, important, urgent, note });
    showToast('任务已添加');
  }

  workShowAddForm = false;
  workEditingTaskId = null;
  saveWorkTasks();
  renderWorkListModule(document.getElementById('content'), MODULES.find(m => m.id === 'worklist'));
}

// 删除任务
function wlDeleteTask(id) {
  if (!confirm('确定删除该任务?')) return;
  workTasks = workTasks.filter(t => t.id !== id);
  saveWorkTasks();
  renderWorkListModule(document.getElementById('content'), MODULES.find(m => m.id === 'worklist'));
  showToast('任务已删除');
}

// 切换完成状态
function wlToggleDone(id) {
  const today = wlTodayStr();
  const key = `${today}:${id}`;
  if (workDone[key]) {
    delete workDone[key];
  } else {
    workDone[key] = true;
    // 完成后检查是否全部完成，发通知
    const all = wlGetTodayTasks();
    if (all.every(t => t.done)) {
      wlNotify('🎉 今日任务全部完成！', '你今天的所有清单任务都已完成。');
    }
  }
  saveWorkDone();
  renderWorkListModule(document.getElementById('content'), MODULES.find(m => m.id === 'worklist'));
}

// 浏览器通知
function wlNotify(title, body) {
  try {
    if ('Notification' in window) {
      if (Notification.permission === 'granted') {
        new Notification(title, { body });
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(p => {
          if (p === 'granted') new Notification(title, { body });
        });
      }
    }
  } catch (e) {}
}

// 工作清单事件绑定(在 init 末尾调用)
function bindWorkListEvents() {
  const container = document.getElementById('content');

  // 象限筛选点击
  container.addEventListener('click', (e) => {
    const quadEl = e.target.closest('[data-wl-quad]');
    if (quadEl) {
      const q = quadEl.getAttribute('data-wl-quad');
      workFilterQuadrant = (workFilterQuadrant === q) ? 'all' : q;
      renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
      return;
    }

    const filterBtn = e.target.closest('[data-wl-filter]');
    if (filterBtn) {
      workFilterQuadrant = filterBtn.getAttribute('data-wl-filter');
      renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
      return;
    }

    const viewBtn = e.target.closest('[data-wl-view]');
    if (viewBtn) {
      workView = viewBtn.getAttribute('data-wl-view');
      renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
      return;
    }

    const actionEl = e.target.closest('[data-wl-action]');
    if (!actionEl) return;
    const action = actionEl.getAttribute('data-wl-action');
    const id = actionEl.getAttribute('data-wl-id');

    switch (action) {
      case 'toggle-add':
        workShowAddForm = !workShowAddForm;
        workEditingTaskId = null;
        renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
        if (workShowAddForm) setTimeout(wlRenderRepeatDetail, 50);
        break;
      case 'cancel-form':
        workShowAddForm = false;
        workEditingTaskId = null;
        renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
        break;
      case 'save-task':
        wlSaveTask();
        break;
      case 'toggle-done':
        wlToggleDone(id);
        break;
      case 'edit':
        workShowAddForm = true;
        workEditingTaskId = id;
        renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
        setTimeout(wlRenderRepeatDetail, 50);
        break;
      case 'delete':
        wlDeleteTask(id);
        break;
      case 'notify':
        wlNotify('工作清单提醒', `今日还有任务待完成，加油！`);
        showToast('已发送提醒通知');
        break;
    }
  });

  // 循环类型变化时更新详情
  container.addEventListener('change', (e) => {
    if (e.target.id === 'wlRepeatType') {
      wlRenderRepeatDetail();
    }
  });
}

// 工作清单提醒检查(页面加载时)
function wlCheckReminderOnLoad() {
  const all = wlGetTodayTasks();
  const pending = all.filter(t => !t.done);
  if (pending.length > 0) {
    setTimeout(() => {
      showToast(`今日有 ${pending.length} 项任务待完成`);
    }, 1500);
  }
}

</script>
