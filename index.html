// 按月时间轴多线图：xLabels 为 ['2026年1月',...]，series 为 [{name,color,values}]
function bakeTrendSVG(xLabels, series) {
  const W = 660, H = 250, padL = 60, padR = 14, padT = 22, padB = 40;
  const allVals = [];
  series.forEach(s => s.values.forEach(v => { if (isFinite(v)) allVals.push(v); }));
  if (allVals.length === 0) return `<div class="wt-empty">暂无数据</div>`;
  let vMax = Math.max.apply(null, allVals), vMin = Math.min.apply(null, allVals);
  if (vMin > 0) vMin = 0;
  if (vMax <= vMin) vMax = vMin + Math.max(1, Math.abs(vMin) || 1);
  const vRange = vMax - vMin;
  const n = xLabels.length;
  const xOf = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
  const yOf = v => H - padB - (v - vMin) / vRange * (H - padT - padB);
  let grid = '';
  for (let k = 0; k <= 4; k++) {
    const gy = padT + k * (H - padT - padB) / 4;
    const val = vMax - (k / 4) * vRange;
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${Math.round(val)}</text>`;
  }
  const stepLbl = Math.max(1, Math.ceil(n / 8));
  let xlab = '';
  for (let i = 0; i < n; i++) {
    if (i % stepLbl === 0 || i === n - 1) {
      const x = xOf(i);
      xlab += `<text x="${x.toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="9" fill="#9ca3af">${xLabels[i]}</text>`;
    }
  }
  const showText = n <= 18;
  let lines = '', dots = '', labels = '', legend = '';
  series.forEach(s => {
    let poly = '', prev = false;
    s.values.forEach((v, i) => {
      if (!isFinite(v)) { prev = false; return; }
      const x = xOf(i), y = yOf(v);
      poly += (prev ? ' ' : '') + x.toFixed(1) + ',' + y.toFixed(1);
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${s.color}" stroke="#fff" stroke-width="1.3"><title>${s.name} ${xLabels[i]} ${v}</title></circle>`;
      if (showText) {
        let ty = y - 7; if (ty < 10) ty = y + 13; if (ty > H - 8) ty = y - 11;
        labels += `<text x="${x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${s.color}">${v}</text>`;
      }
      prev = true;
    });
    lines += `<polyline points="${poly}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
    legend += `<span class="ce-legend-item"><i style="background:${s.color};height:12px;border-radius:3px;"></i>${s.name}</span>`;
  });
  return `<div class="ce-chart-legend" style="display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 8px;">${legend}</div><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}${lines}${dots}${xlab}${labels}</svg>`;
}

// ---- 每月电费（按电表读数自动计算）----
function bakeryElecRows() {
  const meters = bakeryMeters.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (Number(a.degree) - Number(b.degree)));
  if (meters.length === 0) return [];
  const dayOf = d => { const p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  const first = meters[0];
  let y = +first.date.slice(0, 4), m = +first.date.slice(5, 7);
  const now = new Date();
  const endY = now.getFullYear(), endM = now.getMonth() + 1;
  const dayMs = 86400000;
  const out = [];
  while (y < endY || (y === endY && m <= endM)) {
    const inMonth = meters.filter(r => { const ry = +r.date.slice(0, 4), rm = +r.date.slice(5, 7); return ry === y && rm === m; });
    let consumption = null, method = '—', src = '无基准';
    if (inMonth.length > 0) {
      const lastDeg = Number(inMonth[inMonth.length - 1].degree) || 0;
      const prevArr = meters.filter(r => dayOf(r.date) < new Date(y, m - 1, 1));
      const prevR = prevArr.length ? prevArr[prevArr.length - 1] : null;
      if (prevR) { consumption = lastDeg - (Number(prevR.degree) || 0); method = '实际'; src = '当月读数 − 上期读数'; }
      else { method = '无基准'; src = '首次读数，无上期基准'; }
    } else {
      const raArr = meters.filter(r => dayOf(r.date) < new Date(y, m - 1, 1));
      const rA = raArr.length ? raArr[raArr.length - 1] : null;
      if (rA) {
        const rbArr = meters.filter(r => dayOf(r.date) < dayOf(rA.date));
        const rB = rbArr.length ? rbArr[rbArr.length - 1] : null;
        if (rB) {
          const dBetween = Math.max(1, Math.round((dayOf(rA.date) - dayOf(rB.date)) / dayMs));
          const daily = ((Number(rA.degree) || 0) - (Number(rB.degree) || 0)) / dBetween;
          const daysInM = new Date(y, m, 0).getDate();
          consumption = daily * daysInM; method = '估算'; src = '日均 × ' + daysInM + '天';
        } else { method = '无基准'; src = '无上期读数'; }
      } else { method = '无基准'; src = '无上期读数'; }
    }
    if (consumption !== null && consumption < 0) consumption = 0;
    const fee = consumption === null ? null : consumption * BAKERY_ELEC_PRICE;
    out.push({ year: y, month: m, consumption, fee, method, src, hasData: inMonth.length > 0 });
    m++; if (m > 12) { m = 1; y++; }
  }
  return out;
}

// ---- 毛利分析 ----
function bakeRenderAnalysis(body) {
  const rate = bakeryMargin;
  const marginPct = Math.round(rate * 1000) / 10;
  // 合并三个月度数据为 (年-月) 主键
  const map = {};
  const add = (arr, kind) => arr.forEach(r => {
    const k = r.year + '-' + r.month;
    if (!map[k]) map[k] = { year: r.year, month: r.month };
    map[k][kind] = (kind === 'hours' ? Number(r.hours) : Number(r.amount)) || 0;
  });
  add(bakeryRevenue, 'revenue'); add(bakerySalary, 'wage'); add(bakeryHours, 'hours');
  const rows = Object.values(map).sort((a, b) => b.year - a.year || b.month - a.month).map(r => {
    const rev = r.revenue || 0, wage = r.wage || 0, hrs = r.hours || 0;
    const gp = rev * rate, net = gp - wage;
    const hrly = hrs > 0 ? wage / hrs : 0, perHr = hrs > 0 ? rev / hrs : 0;
    return { year: r.year, month: r.month, rev, wage, hrs, gp, net, hrly, perHr };
  });
  const totRev = rows.reduce((s, r) => s + r.rev, 0);
  const totWage = rows.reduce((s, r) => s + r.wage, 0);
  const totHrs = rows.reduce((s, r) => s + r.hrs, 0);
  const totGp = totRev * rate;
  const totNet = totGp - totWage;
  const avgHrly = totHrs > 0 ? totWage / totHrs : 0;

  const stats = `
    <div class="wt-stats">
      ${statCard('总营业额', saMoney(totRev), '')}
      ${statCard('总工资', saMoney(totWage), '')}
      ${statCard('总毛利(' + marginPct + '%)', saMoney(totGp), '')}
      ${statCard('总净毛利', saMoney(totNet), totNet >= 0 ? 'gp-pos' : 'gp-neg')}
      ${statCard('总工时', totHrs + ' h', '')}
      ${statCard('平均时薪', saMoney(avgHrly), '')}
    </div>`;

  const setting = `
    <div class="df-card">
      <h3>毛利率设置</h3>
      <div class="df-form">
        <div class="wt-field"><label>毛利率（%）</label><input type="number" step="any" min="0" max="100" id="bakeMargin" value="${marginPct}" placeholder="如 60"/></div>
      </div>
      <div class="df-actions"><button class="btn-add" id="bakeMarginSave">保存毛利率</button></div>
      <div class="df-empty">毛利 = 营业额 × 毛利率；净毛利 = 毛利 − 工资。修改后下方分析立即重算。</div>
    </div>`;

  const tableRows = rows.length ? rows.map(r => `<tr>
      <td>${bakeMonthLabel(r.year, r.month)}</td>
      <td>${saMoney(r.rev)}</td>
      <td>${saMoney(r.wage)}</td>
      <td>${r.hrs ? Number(r.hrs) + ' h' : '—'}</td>
      <td>${saMoney(r.gp)}</td>
      <td class="${r.net >= 0 ? 'gp-pos' : 'gp-neg'}">${saMoney(r.net)}</td>
      <td>${r.hrs ? saMoney(r.hrly) : '—'}</td>
      <td>${r.hrs ? saMoney(r.perHr) : '—'}</td>
    </tr>`).join('')
    : `<tr><td colspan="8"><div class="wt-empty">还没有任何月份数据，请先在「每月工资 / 每月工时 / 每月营业额」录入。</div></td></tr>`;

  const table = `
    <div class="df-card">
      <h3>按月利润分析（${rows.length} 个月）</h3>
      <table class="wt-cat"><thead><tr><th>月份</th><th>营业额</th><th>工资</th><th>工时</th><th>毛利</th><th>净毛利</th><th>时薪</th><th>人效</th></tr></thead><tbody>${tableRows}</tbody></table>
    </div>`;

  const trendRowsAsc = rows.slice().sort((a, b) => a.year - b.year || a.month - b.month);
  const trendX = trendRowsAsc.map(r => r.year + '年' + r.month + '月');
  const trendLines = [
    { name: '毛利', color: '#2563eb', values: trendRowsAsc.map(r => Math.round(r.gp)) },
    { name: '工资', color: '#f59e0b', values: trendRowsAsc.map(r => Math.round(r.wage)) },
  ];
  const trendCard = `<div class="df-card">
      <h3>月度利润趋势（毛利 vs 工资）</h3>
      <div class="wt-chart-subnote">按月时间轴，圆点标注金额；悬停查看明细</div>
      <div id="bakeTrendChart">${bakeTrendSVG(trendX, trendLines)}</div>
    </div>`;

  body.innerHTML = stats + setting + trendCard + table;
  const mSave = body.querySelector('#bakeMarginSave');
  if (mSave) mSave.addEventListener('click', () => {
    const v = Number(body.querySelector('#bakeMargin').value);
    if (isNaN(v) || v < 0 || v > 100) { showToast('请输入 0–100 的毛利率'); return; }
    bakeryMargin = v / 100; saveBakeryMargin();
    showToast('毛利率已设为 ' + (Math.round(bakeryMargin * 1000) / 10) + '%');
    bakeRender();
  });
}

        <div class="iv-clear-cats">
          <label class="iv-clear-cat"><input type="checkbox" id="ivClearCat-cigarette" value="cigarette" /> 香烟 <span class="iv-clear-cnt" id="ivClearCnt-cigarette"></span></label>
          <label class="iv-clear-cat"><input type="checkbox" id="ivClearCat-liquor" value="liquor" /> 酒水 <span class="iv-clear-cnt" id="ivClearCnt-liquor"></span></label>
        </div>
        <div class="iv-modal-actions">
          <button class="btn-ghost" id="ivClearCancel">取消</button>

}

function renderInventoryStats() {
  const el = document.getElementById('ivStats');
  if (!el) return;
  const catItems = cat => inventoryItems.filter(i => i.category === cat);
  const sumStock = arr => arr.reduce((s, i) => s + (Number(i.stock) || 0), 0);
  const sumAmount = arr => arr.reduce((s, i) => s + ((Number(i.stock) || 0) * (Number(i.price) || 0)), 0);
  const cigItems = catItems('cigarette');
  const liqItems = catItems('liquor');
  const cigStock = sumStock(cigItems);
  const cigAmount = sumAmount(cigItems);
  const liqStock = sumStock(liqItems);
  const liqAmount = sumAmount(liqItems);
  const warn = inventoryItems.filter(i => isItemWarned(i)).length;
  el.innerHTML = [
    statCard('香烟库存数', cigStock + ' 条', ''),
    statCard('香烟库存金额', saMoney(cigAmount), ''),
    statCard('酒水库存数', liqStock + ' 件', ''),
    statCard('酒水库存金额', saMoney(liqAmount), ''),
    `<div class="stat-card iv-warn-card ${warn ? 'iv-warn-active' : ''}"><div class="stat-label">库存预警</div><div class="stat-value ${warn ? 'warning' : 'success'}">${warn} 种</div></div>`
  ].join('');
  const wc = document.getElementById('ivWarnCount');
  if (wc) wc.textContent = warn;
}

function ivItemRow(it) {
  const cat = IV_CAT[it.category] || { name: it.category, cls: '' };
  const stock = Number(it.stock) || 0;
  const needWarn = itemNeedWarn(it);
  const warn = Number(it.warn) || 0;
  const isWarn = needWarn && stock <= warn;
  const sub = needWarn ? ('预警 ≤ ' + warn) : '不预警';
  return `<div class="iv-item ${cat.cls}">
    <div class="iv-item-main">
      <div class="iv-item-name">${escapeHtml(it.name)}</div>
      <div class="iv-item-sub">${sub}</div>
    </div>
    <div class="iv-item-stock ${isWarn ? 'iv-warn' : ''}">
      <div class="iv-stock-num">${stock}${it.unit ? ' <span class="iv-stock-unit">' + escapeHtml(it.unit) + '</span>' : ''}</div>
    </div>
    <div class="iv-item-amount">
      <div class="iv-amount-label">库存金额</div>
      <div class="iv-amount-val">${saMoney(stock * (Number(it.price) || 0))}</div>
    </div>
    <div class="iv-item-actions">
      <button class="iv-btn iv-in" data-id="${it.id}" data-act="in">入库</button>
      <button class="iv-btn iv-out" data-id="${it.id}" data-act="out">出库</button>
      <button class="iv-btn iv-edit" data-id="${it.id}" data-act="edit">编辑</button>
      <button class="iv-btn iv-del" data-id="${it.id}" data-act="del">删除</button>
    </div>
  </div>`;
}

function renderInventoryList() {
  const el = document.getElementById('ivList');
  if (!el) return;
  const backAllBtn = document.getElementById('ivBackAll');
  if (backAllBtn) backAllBtn.style.display = inventoryFilter === 'warn' ? '' : 'none';
  const lc = document.getElementById('ivListCount');
  if (lc) lc.textContent = inventoryItems.length;
  const kw = (inventorySearch || '').trim().toLowerCase();
  let items = inventoryItems.slice();
  if (kw) items = items.filter(i => (i.name || '').toLowerCase().includes(kw));
  if (inventoryFilter === 'warn') items = items.filter(i => isItemWarned(i));
  else if (inventoryFilter !== 'all') items = items.filter(i => i.category === inventoryFilter);
  // 按库存从高到低
  items.sort((a, b) => (Number(b.stock) || 0) - (Number(a.stock) || 0));
  if (items.length === 0) {
    let tip;
    if (kw) tip = '未找到匹配「' + inventorySearch.trim() + '」的商品';
    else if (inventoryFilter === 'warn') tip = '当前没有处于预警状态的商品 🎉';
    else tip = '还没有商品，先在上方「商品信息」添加。';
    el.innerHTML = `<div class="wt-empty">${tip}</div>`; return;
  }
  // 全部 / 预警 视图下，香烟、酒水分组显示
  const groupByCat = inventoryFilter === 'all' || inventoryFilter === 'warn';
  if (groupByCat) {
    const groups = [['cigarette', '香烟'], ['liquor', '酒水']];
    let html = '';
    groups.forEach(([cat, catName]) => {
      const g = items.filter(i => i.category === cat);
      if (g.length === 0) return;
      html += `<div class="iv-group-title">${catName}（${g.length}）</div>` + g.map(ivItemRow).join('');
    });
    el.innerHTML = html;
  } else {
    el.innerHTML = items.map(ivItemRow).join('');
  }
}

function renderInventoryLogs() {
  const el = document.getElementById('ivLogs');
  if (!el) return;
  if (inventoryLogs.length === 0) { el.innerHTML = `<div class="wt-empty" style="padding:14px 0;">暂无出入库记录</div>`; return; }
  const itemsMap = {};
  inventoryItems.forEach(i => { itemsMap[i.id] = i; });
  el.innerHTML = inventoryLogs.slice().reverse().map(l => {
    const sign = l.type === 'in' ? '+' : '−';
    const cls = l.type === 'in' ? 'iv-log-in' : 'iv-log-out';
    const tag = l.type === 'in' ? '入库' : '出库';
    const d = new Date(l.createdAt || Date.now());
    const p = n => ('0' + n).slice(-2);
    const dt = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    return `<div class="iv-log-row">
      <span class="iv-log-tag ${cls}">${tag}</span>
      <span class="iv-log-name">${escapeHtml(l.itemName || '')}</span>
      <span class="iv-log-qty ${cls}">${sign}${l.qty}${l.unit ? ' ' + escapeHtml(l.unit) : ''}</span>
      ${l.note ? '<span class="iv-log-note">' + escapeHtml(l.note) + '</span>' : ''}
      <span class="iv-log-time">${dt}</span>
    </div>`;
  }).join('');
}

function bindInventoryEvents() {
  const nameEl = document.getElementById('ivName');
  const catEl = document.getElementById('ivCat');
  const priceEl = document.getElementById('ivPrice');
  const stockEl = document.getElementById('ivStock');
  const unitEl = document.getElementById('ivUnit');
  const warnEl = document.getElementById('ivWarn');
  const needWarnEl = document.getElementById('ivNeedWarn');
  const warnField = document.getElementById('ivWarnField');
  const saveBtn = document.getElementById('ivSaveBtn');
  const saveLabel = document.getElementById('ivSaveLabel');
  const cancelBtn = document.getElementById('ivCancelBtn');
  if (!saveBtn) return;

  function syncWarnField() {
    const on = needWarnEl.checked;
    warnField.style.opacity = on ? '1' : '0.5';
    warnEl.disabled = !on;
    if (on && !warnEl.value) warnEl.value = '2';
  }
  needWarnEl.addEventListener('change', syncWarnField);

  function resetForm() {
    inventoryEditingId = null;
    nameEl.value = ''; priceEl.value = '';
    stockEl.value = ''; catEl.value = 'cigarette';
    needWarnEl.checked = true;
    warnEl.disabled = false;
    warnEl.value = '2';
    saveLabel.textContent = '添加商品';
    cancelBtn.style.display = 'none';
  }

  catEl.addEventListener('change', () => { /* 进价与库存与分类无关，无需联动 */ });

  const searchEl = document.getElementById('ivSearch');
  if (searchEl) searchEl.addEventListener('input', () => { inventorySearch = searchEl.value; renderInventoryList(); });

  const catFilterEl = document.getElementById('ivCatFilter');
  if (catFilterEl) catFilterEl.addEventListener('change', () => {
    inventoryFilter = catFilterEl.value;
    renderInventoryList();
  });

  const backAllBtn = document.getElementById('ivBackAll');
  if (backAllBtn) backAllBtn.addEventListener('click', () => {
    inventoryFilter = 'all';
    inventorySearch = '';
    if (searchEl) searchEl.value = '';
    if (catFilterEl) catFilterEl.value = 'all';
    renderInventoryList();
  });

  const statsEl = document.getElementById('ivStats');
  if (statsEl) statsEl.addEventListener('click', e => {
    const card = e.target.closest('.iv-warn-card');
    if (!card) return;
    inventoryFilter = 'warn';
    inventorySearch = '';
    if (searchEl) searchEl.value = '';
    if (catFilterEl) catFilterEl.value = 'all';
    const listCard = document.getElementById('ivListCard');
    if (listCard && listCard.classList.contains('co-collapsed')) {
      listCard.classList.remove('co-collapsed');
      const listToggle = document.getElementById('ivListToggle');
      if (listToggle) listToggle.setAttribute('aria-expanded', 'true');
    }
    renderInventoryList();
  });

  saveBtn.addEventListener('click', () => {
    const name = nameEl.value.trim();
    if (!name) { showToast('请填写商品名称'); nameEl.focus(); return; }
    const category = catEl.value;
    const price = parseFloat(priceEl.value);
    const stock = parseFloat(stockEl.value);
    const needWarn = needWarnEl.checked;
    const warnRaw = parseFloat(warnEl.value);
    const unit = unitEl.value.trim();
    const rec = {
      name, category,
      price: isNaN(price) ? 0 : price,
      stock: isNaN(stock) ? 0 : stock,
      unit: unit,
      needWarn: needWarn,
      warn: needWarn ? (isNaN(warnRaw) ? 2 : warnRaw) : 0,
      updatedAt: Date.now()
    };
    if (inventoryEditingId) {
      const idx = inventoryItems.findIndex(i => i.id === inventoryEditingId);
      if (idx >= 0) inventoryItems[idx] = Object.assign({}, inventoryItems[idx], rec);
      showToast('已修改：' + name);
    } else {
      rec.id = uid();
      rec.createdAt = Date.now();
      inventoryItems.push(rec);
      showToast('已添加：' + name);
    }
    saveInventory();
    resetForm();
    renderInventoryStats();
    renderInventoryList();
  });

  cancelBtn.addEventListener('click', resetForm);

  const list = document.getElementById('ivList');
  list.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;
    if (act === 'edit') startInventoryEdit(id, { nameEl, catEl, priceEl, stockEl, unitEl, warnEl, needWarnEl, saveLabel, cancelBtn });
    else if (act === 'del') deleteInventoryItem(id);
    else openInventoryModal(id, act);   // in / out
  });

  const logToggle = document.getElementById('ivLogToggle');
  if (logToggle) {
    logToggle.addEventListener('click', () => {
      const card = logToggle.closest('.co-admin-card');
      const collapsed = card.classList.toggle('co-collapsed');
      logToggle.setAttribute('aria-expanded', String(!collapsed));
    });
  }

  const formToggle = document.getElementById('ivFormToggle');
  if (formToggle) formToggle.addEventListener('click', () => {
    const card = formToggle.closest('.co-admin-card');
    const collapsed = card.classList.toggle('co-collapsed');
    formToggle.setAttribute('aria-expanded', String(!collapsed));
  });

  const listToggle = document.getElementById('ivListToggle');
  if (listToggle) listToggle.addEventListener('click', () => {
    const card = listToggle.closest('.co-admin-card');
    const collapsed = card.classList.toggle('co-collapsed');
    listToggle.setAttribute('aria-expanded', String(!collapsed));
  });

  const clearBtn = document.getElementById('ivClearBtn');
  if (clearBtn) clearBtn.addEventListener('click', openInventoryClearModal);
  bindInventoryClearModal();
  bindInventoryModal();
}

function startInventoryEdit(id, refs) {
  const it = inventoryItems.find(i => i.id === id);
  if (!it) return;
  inventoryEditingId = id;
  refs.nameEl.value = it.name;
  refs.catEl.value = it.category;
  refs.priceEl.value = it.price || '';
  refs.stockEl.value = it.stock;
  refs.unitEl.value = it.unit || '';
  const needWarn = it.needWarn !== undefined ? it.needWarn : (Number(it.warn) > 0);
  refs.needWarnEl.checked = needWarn;
  refs.warnEl.value = needWarn ? (it.warn || '') : '';
  refs.warnEl.disabled = !needWarn;
  refs.saveLabel.textContent = '保存修改';
  refs.cancelBtn.style.display = '';
  const formCard = document.getElementById('ivFormCard');
  if (formCard && formCard.classList.contains('co-collapsed')) {
    formCard.classList.remove('co-collapsed');
    const ft = document.getElementById('ivFormToggle');
    if (ft) ft.setAttribute('aria-expanded', 'true');
  }
  refs.nameEl.focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteInventoryItem(id) {
  const it = inventoryItems.find(i => i.id === id);
  if (!it) return;
  if (!window.confirm('确定删除商品「' + it.name + '」？相关出入库流水也会一并删除。')) return;
  inventoryItems = inventoryItems.filter(i => i.id !== id);
  inventoryLogs = inventoryLogs.filter(l => l.itemId !== id);
  saveInventory();
  saveInventoryLogs();
  if (inventoryEditingId === id) inventoryEditingId = null;
  renderInventoryStats();
  renderInventoryList();
  renderInventoryLogs();
  showToast('已删除：' + it.name);
}

function openInventoryModal(id, type) {
  const it = inventoryItems.find(i => i.id === id);
  if (!it) return;
  ivModalItemId = id; ivModalType = type;
  const mask = document.getElementById('ivModalMask');
  const title = document.getElementById('ivModalTitle');
  const qty = document.getElementById('ivModalQty');
  const note = document.getElementById('ivModalNote');
  title.textContent = (type === 'in' ? '入库 · ' : '出库 · ') + it.name;
  qty.value = ''; note.value = '';
  mask.style.display = 'flex';
  setTimeout(() => qty.focus(), 50);
}

function bindInventoryModal() {
  const mask = document.getElementById('ivModalMask');
  const qty = document.getElementById('ivModalQty');
  const note = document.getElementById('ivModalNote');
  document.getElementById('ivModalCancel').addEventListener('click', () => { mask.style.display = 'none'; });
  mask.addEventListener('click', e => { if (e.target === mask) mask.style.display = 'none'; });
  document.getElementById('ivModalOk').addEventListener('click', () => {
    const v = parseFloat(qty.value);
    if (isNaN(v) || v <= 0) { showToast('请输入大于 0 的数量'); qty.focus(); return; }
    const it = inventoryItems.find(i => i.id === ivModalItemId);
    if (!it) { mask.style.display = 'none'; return; }
    const delta = ivModalType === 'in' ? v : -v;
    const newStock = (Number(it.stock) || 0) + delta;
    if (newStock < 0) { showToast('出库数量超过当前库存'); return; }
    it.stock = newStock;
    it.updatedAt = Date.now();
    inventoryLogs.push({
      id: uid(), itemId: it.id, itemName: it.name, category: it.category,
      type: ivModalType, qty: v, note: note.value.trim(), unit: it.unit || '',
      createdAt: Date.now()
    });
    saveInventory();
    saveInventoryLogs();
    mask.style.display = 'none';
    renderInventoryStats();
    renderInventoryList();
    renderInventoryLogs();
    showToast((ivModalType === 'in' ? '已入库 ' : '已出库 ') + v + ' · 余 ' + newStock);
  });
}

function openInventoryClearModal() {
  const mask = document.getElementById('ivClearMask');
  if (!mask) return;
  // 默认只勾选存在库存的分类
  ['cigarette', 'liquor'].forEach(cat => {
    const items = inventoryItems.filter(i => i.category === cat);
    const withStock = items.filter(i => (Number(i.stock) || 0) > 0).length;
    const span = document.getElementById('ivClearCnt-' + cat);
    if (span) span.textContent = items.length + ' 种（' + withStock + ' 个有库存）';
    const cb = document.getElementById('ivClearCat-' + cat);
    if (cb) cb.checked = withStock > 0;
  });
  mask.style.display = 'flex';
}

function bindInventoryClearModal() {
  const mask = document.getElementById('ivClearMask');
  if (!mask) return;
  const ok = document.getElementById('ivClearOk');
  const cancel = document.getElementById('ivClearCancel');
  if (cancel) cancel.addEventListener('click', () => { mask.style.display = 'none'; });
  mask.addEventListener('click', e => { if (e.target === mask) mask.style.display = 'none'; });
  if (ok) ok.addEventListener('click', () => {
    const cats = ['cigarette', 'liquor'].filter(cat => {
      const cb = document.getElementById('ivClearCat-' + cat);
      return cb && cb.checked;
    });
    if (cats.length === 0) { showToast('请至少选择一个分类'); return; }
    const targets = inventoryItems.filter(i => cats.includes(i.category) && (Number(i.stock) || 0) > 0);
    if (targets.length === 0) { showToast('选中分类暂无库存可清空'); mask.style.display = 'none'; return; }
    if (!window.confirm('确定清空选中分类的库存（' + targets.length + ' 项将归零）？此操作不可撤销。')) return;
    targets.forEach(it => {
      const old = Number(it.stock) || 0;
      it.stock = 0;
      it.updatedAt = Date.now();
      inventoryLogs.push({
        id: uid(), itemId: it.id, itemName: it.name, category: it.category,
        type: 'out', qty: old, note: '清空库存', unit: it.unit || '',
        createdAt: Date.now()
      });
    });
    saveInventory();
    saveInventoryLogs();
    mask.style.display = 'none';
    renderInventoryStats();
    renderInventoryList();
    renderInventoryLogs();

function bindCostEntryEvents() {
  const addBtn = document.getElementById('ceAddBtn');
  const dateEl = document.getElementById('ceDate');
  const itemSel = document.getElementById('ceItem');
  const amountEl = document.getElementById('ceAmount');
  const noteEl = document.getElementById('ceNote');
  const entryTotalEl = document.getElementById('ceEntryTotal');
  const getSalaryBtn = document.getElementById('ceGetSalaryBtn');
  const adminList = document.getElementById('ceItemList');
  const addItemBtn = document.getElementById('ceItemAddBtn');
  const adminToggle = document.getElementById('ceAdminToggle');
  const list = document.getElementById('ceList');

  function refreshAll() {
    renderCeStats(); renderCeCharts(); renderCeList();
  }
  function updateTotal() {
    if (!entryTotalEl || !amountEl) return;
    const v = parseFloat(amountEl.value);
    entryTotalEl.textContent = saMoney(isNaN(v) ? 0 : v);
  }

  if (adminToggle) {
    adminToggle.addEventListener('click', () => {
      const card = adminToggle.closest('.co-admin-card');
      const collapsed = card.classList.toggle('co-collapsed');
      adminToggle.setAttribute('aria-expanded', String(!collapsed));
    });
  }

  const listToggle = document.getElementById('ceListToggle');
  if (listToggle) {
    listToggle.addEventListener('click', () => {
      const card = listToggle.closest('.co-admin-card');
      const collapsed = card.classList.toggle('co-collapsed');
      listToggle.setAttribute('aria-expanded', String(!collapsed));
    });
  }

  if (addItemBtn) {
    addItemBtn.addEventListener('click', () => {
      costEntryItems.push({ id: uid(), name: '新成本项' });
      saveCostEntryItems();
      renderCeItemAdmin();
      renderCeItemSelect();
      const card = addItemBtn.closest('.co-admin-card');
      if (card && card.classList.contains('co-collapsed')) {
        card.classList.remove('co-collapsed');
        adminToggle.setAttribute('aria-expanded', 'true');
      }
      const rows = adminList.querySelectorAll('.co-admin-row');
      const last = rows[rows.length - 1];
      if (last) { const inp = last.querySelector('.co-admin-name'); inp.focus(); inp.select(); }
    });
  }

  if (adminList) {
    adminList.addEventListener('click', e => {
      const del = e.target.closest('.co-admin-del');
      if (del) {
        const id = del.dataset.id;
        const used = costEntryLogs.some(l => l.itemId === id);
        if (used) { showToast('该成本项已有记录，请先删除相关记录'); return; }
        const it = costEntryItems.find(x => x.id === id);
        costEntryItems = costEntryItems.filter(x => x.id !== id);
        saveCostEntryItems();
        renderCeItemAdmin();
        renderCeItemSelect();
        refreshAll();
        showToast('已删除成本项' + (it ? '「' + it.name + '」' : ''));
      }
    });
    adminList.addEventListener('change', e => {
      const nameInp = e.target.closest('.co-admin-name');
      if (nameInp) {
        const id = nameInp.dataset.id;
        const newName = (nameInp.value || '').trim() || '未命名';
        nameInp.value = newName;
        const it = costEntryItems.find(x => x.id === id);
        if (it) {
          it.name = newName;
          saveCostEntryItems();
          costEntryLogs.forEach(l => { if (l.itemId === id) l.itemName = newName; });
          saveCostEntryLogs();
          renderCeItemSelect();
          refreshAll();
        }
      }
    });
  }

  if (itemSel) itemSel.addEventListener('change', () => { updateCeSalaryBtn(); });
  if (amountEl) amountEl.addEventListener('input', updateTotal);

  if (getSalaryBtn) {
    getSalaryBtn.addEventListener('click', () => {
      const date = (dateEl && dateEl.value) || ceTodayStr();
      const month = date.slice(0, 7);
      let logs = [];
      try { const raw = localStorage.getItem('liumo_salary_logs'); logs = raw ? JSON.parse(raw) : []; } catch (e) { logs = []; }
      if (!Array.isArray(logs)) logs = [];
      const rec = logs.find(l => String(l.date) === String(month));
      if (!rec) { showToast('工资管理中未找到 ' + month + ' 的记录'); return; }
      const total = Number(rec.total) || 0;
      if (amountEl) { amountEl.value = total > 0 ? total : ''; updateTotal(); }
      showToast('已填入 ' + month + ' 总工资：' + saMoney(total));
    });
  }

  function addLog() {
    const date = (dateEl && dateEl.value) || ceTodayStr();
    const itemId = itemSel ? itemSel.value : null;
    const it = costEntryItems.find(x => x.id === itemId);
    if (!it) { showToast('请先添加成本项'); return; }
    const amount = parseFloat(amountEl.value);
    if (isNaN(amount) || amount < 0) { showToast('请输入有效金额'); if (amountEl) amountEl.focus(); return; }
    const note = (noteEl && noteEl.value || '').trim();
    if (ceEditingId) {
      const rec = costEntryLogs.find(l => l.id === ceEditingId);
      if (rec) { rec.date = date; rec.itemId = itemId; rec.itemName = it.name; rec.amount = amount; rec.note = note; rec.updatedAt = Date.now(); }
      ceEditingId = null;
      setCeAddLabel('保存记录');
      showToast('已更新记录');
    } else {
      costEntryLogs.push({ id: uid(), date, itemId, itemName: it.name, amount, note, createdAt: Date.now(), updatedAt: Date.now() });
      showToast('已保存记录');
    }
    saveCostEntryLogs();
    if (amountEl) amountEl.value = '';
    if (noteEl) noteEl.value = '';
    updateTotal();
    refreshAll();
  }

  if (addBtn) addBtn.addEventListener('click', addLog);
  if (amountEl) amountEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });

  if (list) {
    list.addEventListener('click', e => {
      const delBtn = e.target.closest('[data-action="ce-del"]');
      const editBtn = e.target.closest('[data-action="ce-edit"]');
      if (delBtn) {
        const id = delBtn.dataset.id;
        costEntryLogs = costEntryLogs.filter(l => l.id !== id);
        if (ceEditingId === id) { ceEditingId = null; setCeAddLabel('保存记录'); }
        saveCostEntryLogs();
        refreshAll();
        showToast('已删除该记录');
        return;
      }
      if (editBtn) {
        const rec = costEntryLogs.find(l => l.id === editBtn.dataset.id);
        if (rec) {
          ceEditingId = rec.id;
          if (dateEl) dateEl.value = rec.date;
          if (itemSel && costEntryItems.some(x => x.id === rec.itemId)) itemSel.value = rec.itemId;
          if (amountEl) amountEl.value = rec.amount;
          if (noteEl) noteEl.value = rec.note || '';
          updateTotal();
          updateCeSalaryBtn();
          setCeAddLabel('更新记录');
          if (dateEl) dateEl.focus();
          showToast('已载入记录，修改后点「更新记录」即可保存');
          refreshAll();
        }
      }
    });
  }

  // 页签切换：成本录入 / 固定成本设置（挪入的超市成本核算页面）
  const tabBtns = document.querySelectorAll('.ce-tab');
  const panelEntry = document.getElementById('ceTabEntry');
  const panelCost = document.getElementById('ceTabCost');
  const costMod = MODULES.find(m => m.id === 'cost');
  let costRendered = false;
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      tabBtns.forEach(b => b.classList.toggle('active', b === btn));
      if (panelEntry) panelEntry.style.display = (tab === 'entry') ? '' : 'none';
      if (panelCost) panelCost.style.display = (tab === 'cost') ? '' : 'none';
      if (tab === 'cost' && panelCost && costMod && !costRendered) {
        renderCostModule(panelCost, costMod, { noHeader: true });
        costRendered = true;
      }
    });
  });
}

// ==================== 废品记录模块 ====================
const SCRAP_LOGS_KEY = 'liumo_scrap_logs';
const SCRAP_SETTLED_KEY = 'liumo_scrap_settled';

function loadScrap() {
  try {
    const d = localStorage.getItem(SCRAP_LOGS_KEY);
    scrapLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(scrapLogs)) scrapLogs = [];
  } catch (e) { scrapLogs = []; }
  try {
    const d = localStorage.getItem(SCRAP_SETTLED_KEY);
    scrapSettled = d ? JSON.parse(d) : {};
    if (typeof scrapSettled !== 'object' || !scrapSettled) scrapSettled = {};
  } catch (e) { scrapSettled = {}; }
  // 兼容旧版“整月快照”格式: 没有 date 字段的视为结算到月末(保持已结算状态)
  let migrated = false;
  Object.keys(scrapSettled).forEach(m => {
    const raw = scrapSettled[m];
    if (raw && typeof raw === 'object') {
      if (!raw.date) { raw.date = scrapMonthEndStr(m); migrated = true; }
      // 旧数据无 ts: 以“截止日当天 00:00”为快照(与加载时间无关, 刷新稳定),
      // 结算后新增(createdAt 晚于该时刻)一律算未结算, 修复“刷新后未结算变已结算”
      if (typeof raw.ts !== 'number') { raw.ts = tsForCutoffStart(raw.date); migrated = true; }
    }
  });
  // 固化迁移结果(把推导出的 ts 写回), 避免每次加载重新推导造成的潜在漂移
  if (migrated) saveScrapSettled();
  scrapLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function saveScrapLogs() { localStorage.setItem(SCRAP_LOGS_KEY, JSON.stringify(scrapLogs)); }
function saveScrapSettled() { localStorage.setItem(SCRAP_SETTLED_KEY, JSON.stringify(scrapSettled)); }
function scrapAsc() { return [...scrapLogs].sort((a, b) => (a.date || '').localeCompare(b.date || '')); }
function scrapDesc() { return [...scrapLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
function monthOf(d) { return (d || '').slice(0, 7); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

// 各月汇总: { 'YYYY-MM': { count, total } }
function scrapMonthMap() {
  const map = {};
  scrapAsc().forEach(l => {
    const m = monthOf(l.date);
    if (!map[m]) map[m] = { count: 0, total: 0 };
    map[m].count++;
    map[m].total += (l.amount || 0);
  });
  return map;
}
// 月份最后一天, 如 '2026-02' -> '2026-02-28'
function scrapMonthEndStr(m) {
  const [y, mo] = m.split('-').map(Number);
  const last = new Date(y, mo, 0).getDate();
  return m + '-' + ('0' + last).slice(-2);
}
// 旧结算数据缺 ts 时, 用截止日当天 00:00:00 作为结算快照:
// 结算发生在截止日当天或之后, 因此“结算后新增(createdAt 晚于截止日 00:00)”一律算未结算,
// 且与加载时间无关, 刷新后稳定, 不会出现“刷新后未结算变已结算”的漂移。
function tsForCutoffStart(cutoff) {
  const p = (cutoff || '').split('-').map(Number);
  if (p.length !== 3 || p.some(isNaN)) return 0;
  return new Date(p[0], p[1] - 1, p[2], 0, 0, 0, 0).getTime();
}
// 结算截止日默认: 当月=今天; 过去月=月末(整月结清); 未来月=月初
function scrapSettleDefaultDate(m) {
  const now = new Date();
  const cur = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
  if (m === cur) return todayStr();
  if (m < cur) return scrapMonthEndStr(m);
  return m + '-01';
}
// 某月在结算口径下的拆分: 以结算截止日(date)为准, 截止日及之前的记录算已结算;
// 此外,结算之后新增(createdAt 晚于结算快照 ts)的记录也一律算「未结算」
function scrapMonthSettledParts(m) {
  const recs = scrapLogs.filter(l => monthOf(l.date) === m);
  let total = 0, count = 0;
  recs.forEach(l => { total += (l.amount || 0); count++; });
  const raw = scrapSettled[m];
  if (!raw || !raw.date) {
    return { isSettled: false, settleDate: '', settledTotal: 0, settledCount: 0, unsettledTotal: total, unsettledCount: count };
  }
  const cutoff = raw.date;
  const ts = (typeof raw.ts === 'number') ? raw.ts : null; // 旧数据无 ts 时退化为纯按日期
  let unsettledTotal = 0, unsettledCount = 0;
  recs.forEach(l => {
    const afterSettle = (ts !== null && (l.createdAt || 0) > ts) || (l.date > cutoff);
    if (afterSettle) { unsettledTotal += (l.amount || 0); unsettledCount++; }
  });
  return {
    isSettled: true, settleDate: cutoff,
    settledTotal: total - unsettledTotal, settledCount: count - unsettledCount,
    unsettledTotal, unsettledCount
  };
}

function renderScrapStats() {
  const el = document.getElementById('scStats');
  if (!el) return;
  const all = scrapAsc();
  const now = new Date();
  const curMonth = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
  const start = new Date(now.getFullYear(), now.getMonth() - 11, 1);
  const cutoffStr = start.getFullYear() + '-' + ('0' + (start.getMonth() + 1)).slice(-2);
  const last12 = all.filter(l => monthOf(l.date) >= cutoffStr);
  const curRecs = all.filter(l => monthOf(l.date) === curMonth);
  const curSum = curRecs.reduce((s, l) => s + (l.amount || 0), 0);

  // 未结算金额（按结算日期口径, 结算后新增更晚记录算未结算）
  const monthSet = {};
  last12.forEach(l => { monthSet[monthOf(l.date)] = true; });
  let unsettledSum = 0;
  Object.keys(monthSet).forEach(m => {
    const p = scrapMonthSettledParts(m);
    unsettledSum += p.unsettledTotal;
  });

  const money = v => Math.round(v).toLocaleString() + ' 元';
  const cards = [];
  cards.push(statCard('本月金额', money(curSum), 'success'));
  cards.push(statCard('未结算金额', money(unsettledSum), unsettledSum > 0 ? 'warning' : 'success'));
  el.innerHTML = cards.join('');
}

function renderScrapChart() {
  const el = document.getElementById('scChart');
  if (!el) return;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 23, 1); // 近两年 = 24 个月
  const map = scrapMonthMap();
  // 构造连续 24 个月序列（缺月补 0）, 便于看趋势
  const series = [];
  for (let i = 0; i < 24; i++) {
    const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
    const key = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    const rec = map[key];
    series.push({ date: key, total: rec ? rec.total : 0 });
  }
  series.sort((a, b) => a.date.localeCompare(b.date));
  if (series.every(s => s.total === 0)) {
    el.innerHTML = `<div class="wt-empty">还没有废品记录,先在上方登记一笔吧</div>`;
    return;
  }
  const lastLog = series[series.length - 1];
  const lastDate = lastLog.date;
  const [ly, lm] = lastDate.split('-').map(Number);
  const yoyStr = (ly - 1) + '-' + ('0' + lm).slice(-2);
  const yoyIdx = series.findIndex(l => l.date === yoyStr);
  el.innerHTML = buildSalaryLineSVG(series, l => l.total, '#f59e0b', '元', { last: series.length - 1, yoy: yoyIdx >= 0 ? yoyIdx : null })
    + `<div class="wt-chart-subnote">最新 <b style="color:#f59e0b">${lastDate}</b> · 同比 <b style="color:#dc2626">${yoyStr}</b>${yoyIdx >= 0 ? '' : '（暂无数据）'}</div>`;
}

function renderScrapMonth() {
  const el = document.getElementById('scMonth');
  if (!el) return;
  const map = scrapMonthMap();
  const months = Object.keys(map).sort((a, b) => b.localeCompare(a));

    const p = scrapMonthSettledParts(m);

    const editing = scrapSettleMonth === m;

      return `<tr>

        <td class="sc-actions" colspan="2">

          <button class="wt-settle on" data-action="sc-settle-confirm" data-month="${m}">确认</button>
          <button class="wt-settle" data-action="sc-settle-cancel" data-month="${m}">取消</button>
        </td>
      </tr>`;
    }

    return `<tr>
      <td>${m}</td>
      <td>${p.settledCount + p.unsettledCount}</td>
      <td class="sc-amt settled">${settledTxt}</td>
      <td class="sc-amt unsettled">${unsettledTxt}</td>
      <td class="sc-settle-date-col"${p.isSettled ? ' title="' + p.settleDate + '"' : ''}>${settleDateTxt}</td>
      <td class="sc-actions">

        <button class="wt-settle ${p.isSettled ? 'on' : ''}" data-action="sc-unsettle" data-month="${m}" ${p.isSettled ? '' : 'disabled'}>取消结算</button>
      </td>
    </tr>`;
  }).join('');
  el.innerHTML = `<div class="wt-cat-wrap"><table class="wt-cat">
      <thead><tr><th>月份</th><th>笔数</th><th>已结算</th><th>未结算</th><th>结算日</th><th>操作</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function bindScrapEvents() {
  const addBtn = document.getElementById('scrapAddBtn');
  const dateEl = document.getElementById('scrapDate');
  const amountEl = document.getElementById('scrapAmount');
  const noteEl = document.getElementById('scrapNote');
  const list = document.getElementById('scList');
  const monthEl = document.getElementById('scMonth');

  const ADD_LABEL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="sc-add-label">记录废品</span>';
  const EDIT_LABEL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="sc-add-label">更新记录</span>';

  function refreshAll() {
    renderScrapStats();
    renderScrapChart();
    renderScrapMonth();
    renderScrapList();
  }

  function addLog() {
    const date = dateEl.value || todayStr();
    const amount = parseFloat(amountEl.value);
    const note = (noteEl.value || '').trim();
    if (isNaN(amount) || amount < 0) { showToast('请输入有效金额'); amountEl.focus(); return; }
    // 去重时排除正在编辑的记录本身
    const dup = scrapLogs.find(l => l.id !== scrapEditingId && l.date === date && l.amount === amount && ((l.note || '') === note));
    if (dup) { showToast('该日期已存在相同记录'); return; }

    if (scrapEditingId) {
      const rec = scrapLogs.find(l => l.id === scrapEditingId);
      if (rec) {
        rec.date = date; rec.amount = amount; rec.note = note; rec.updatedAt = Date.now();
        saveScrapLogs();
        showToast('已更新该记录');
      }
      scrapEditingId = null;
      addBtn.innerHTML = ADD_LABEL;
    } else {
      scrapLogs.push({ id: uid(), date, amount, note, createdAt: Date.now(), updatedAt: Date.now() });
      saveScrapLogs();
      showToast('已记录废品');
    }
    scrapLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    amountEl.value = ''; noteEl.value = '';
    refreshAll();
  }

  addBtn.addEventListener('click', addLog);
  amountEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });

  if (list) {
    list.addEventListener('click', e => {
      const delBtn = e.target.closest('[data-action="sc-del"]');
      const editBtn = e.target.closest('[data-action="sc-edit"]');
      if (delBtn) {
        const id = delBtn.dataset.id;
        scrapLogs = scrapLogs.filter(l => l.id !== id);
        saveScrapLogs();
        refreshAll();
        showToast('已删除该记录');
        return;
      }
      if (editBtn) {
        const rec = scrapLogs.find(l => l.id === editBtn.dataset.id);
        if (rec) {
          scrapEditingId = rec.id;
          dateEl.value = rec.date;
          amountEl.value = rec.amount;
          noteEl.value = rec.note || '';
          addBtn.innerHTML = EDIT_LABEL;
          amountEl.focus();
          showToast('已载入该记录,修改后点「更新记录」即可');
        }
      }
    });
  }

  if (monthEl) {
    monthEl.addEventListener('click', e => {
      // 开始结算: 进入该月截止日选择(结算始终可点, 用于设置/修改截止日)
      const settleBtn = e.target.closest('[data-action="sc-settle"]');
      if (settleBtn && !settleBtn.disabled) {
        scrapSettleMonth = settleBtn.dataset.month;
        renderScrapMonth();
        return;
      }
      // 取消选择截止日
      const cancelBtn = e.target.closest('[data-action="sc-settle-cancel"]');
      if (cancelBtn) {
        scrapSettleMonth = null;
        renderScrapMonth();
        return;
      }
      // 确认结算: 以所选截止日结算(截止日及之前的当月记录算已结算)
      const confirmBtn = e.target.closest('[data-action="sc-settle-confirm"]');
      if (confirmBtn && !confirmBtn.disabled) {
        const m = confirmBtn.dataset.month;
        const input = monthEl.querySelector('.sc-settle-date[data-month="' + m + '"]');
        const d = input ? input.value : '';
        if (!d || !d.startsWith(m)) { showToast('结算日期需在 ' + m + ' 当月内'); return; }
        // 记录结算快照时间戳:此后新增的记录算「未结算」
        scrapSettled[m] = { date: d, ts: Date.now() };
        scrapSettleMonth = null;
        saveScrapSettled();
        refreshAll();
        showToast('已结算 ' + m + ' 截止 ' + d);
        return;
      }
      // 取消结算: 清除该月结算状态
      const unsettleBtn = e.target.closest('[data-action="sc-unsettle"]');
      if (unsettleBtn && !unsettleBtn.disabled) {
        const m = unsettleBtn.dataset.month;
        delete scrapSettled[m];
        scrapSettleMonth = null;
        saveScrapSettled();
        refreshAll();
        showToast('已取消结算 ' + m);
        return;
      }
    });
  }
}

const ROPE_LOGS_KEY = 'liumo_rope_logs';
let ropeLogs = [];  // { id, date:'YYYY-MM-DD', count:Number, createdAt, updatedAt }

function loadRope() {
  try {
    const d = localStorage.getItem(ROPE_LOGS_KEY);
    ropeLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(ropeLogs)) ropeLogs = [];
  } catch (e) { ropeLogs = []; }
  ropeLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function saveRopeLogs() { localStorage.setItem(ROPE_LOGS_KEY, JSON.stringify(ropeLogs)); }
function ropeAsc() { return [...ropeLogs].sort((a, b) => (a.date || '').localeCompare(b.date || '')); }
function ropeDesc() { return [...ropeLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
function ropeMonthPrefix() {
  const d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
}

function renderRopeStats() {
  const el = document.getElementById('rpStats');
  if (!el) return;
  const monthPrefix = ropeMonthPrefix();
  const thisMonth = ropeLogs.filter(l => (l.date || '').slice(0, 7) === monthPrefix);
  const days = new Set(thisMonth.map(l => l.date)).size;
  const avg = thisMonth.length ? Math.round(thisMonth.reduce((s, l) => s + (l.count || 0), 0) / thisMonth.length) : null;
  const best = ropeLogs.length ? Math.max.apply(null, ropeLogs.map(l => l.count || 0)) : null;
  const total = ropeLogs.reduce((s, l) => s + (l.count || 0), 0);
  const cards = [];
  cards.push(statCard('本月记录天数', days + ' 天', 'primary'));
  cards.push(statCard('本月平均个数', avg != null ? avg + ' 个' : '—', ''));
  cards.push(statCard('历史最好成绩', best != null ? best + ' 个' : '—', best != null ? 'success' : ''));
  cards.push(statCard('累计跳绳个数', total > 0 ? total.toLocaleString() + ' 个' : '—', ''));
  el.innerHTML = cards.join('');
}

function buildRopeChartSVG(logs) {
  const W = 620, H = 260, padL = 44, padR = 24, padT = 18, padB = 34;
  const counts = logs.map(l => l.count);
  let cMin = Math.min.apply(null, counts), cMax = Math.max.apply(null, counts);
  if (cMin === cMax) { cMin = Math.max(0, cMin - 20); cMax += 20; }
  const cRange = cMax - cMin;
  const n = logs.length;
  const xOf = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
  const yOf = v => H - padB - ((v - cMin) / cRange) * (H - padT - padB);
  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const gy = padT + k * (H - padT - padB) / 3;
    const val = cMax - (k / 3) * cRange;
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${Math.round(val)}</text>`;
  }
  const best = Math.max.apply(null, counts);
  const pts = logs.map((l, i) => ({ x: xOf(i), y: yOf(l.count), l }));
  const line = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.l.count === best ? 4.5 : 3.5}" fill="${p.l.count === best ? '#f43f5e' : '#10b981'}" stroke="#fff" stroke-width="2"><title>${escapeHtml(p.l.date)} ${p.l.count}个${p.l.count === best ? ' · 最好成绩' : ''}</title></circle>`).join('');
  let xlab = '';
  const step = Math.max(1, Math.ceil(n / 6));
  logs.forEach((l, i) => {
    if (i % step === 0 || i === n - 1) {
      const x = xOf(i);
      xlab += `<text x="${x.toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#9ca3af">${escapeHtml(l.date.slice(5))}</text>`;
    }
  });
  const legend = `<g font-size="11"><rect x="${padL}" y="0" width="10" height="10" rx="2" fill="#10b981"/><text x="${padL + 14}" y="9" fill="#6b7280">跳绳(个)</text><rect x="${padL + 110}" y="0" width="10" height="10" rx="2" fill="#f43f5e"/><text x="${padL + 124}" y="9" fill="#6b7280">最好成绩</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}${legend}<polyline points="${line}" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xlab}</svg>`;
}

function renderRopeChart() {
  const el = document.getElementById('rpChart');

// ==================== 去哪儿玩模块 ====================
const PLACES_KEY = 'liumo_places';
const PLACE_CATS_KEY = 'liumo_place_cats';

let places = [];
let placeCats = [];   // 用户自定义分类清单(初始为空,完全由用户定义)
let placeSortMode = localStorage.getItem('liumo_place_sort') || 'custom'; // custom | name | category | time
let placeCatFilter = 'all'; // all | <category>  (唯一筛选维度:按分类)
let placeEditingId = null;
let placeDragId = null;

function loadPlaces() {
  try {
    const d = localStorage.getItem(PLACES_KEY);
    places = d ? JSON.parse(d) : [];
    if (!Array.isArray(places)) places = [];
  } catch (e) { places = []; }
  // 归一化:visited 必须为布尔;清掉历史遗留的 priority 字段
  places.forEach(p => {
    if (typeof p.visited !== 'boolean') p.visited = false;
    if ('priority' in p) delete p.priority;
  });
}
function savePlaces() { localStorage.setItem(PLACES_KEY, JSON.stringify(places)); }

function loadPlaceCats() {
  try {
    const d = localStorage.getItem(PLACE_CATS_KEY);
    placeCats = d ? JSON.parse(d) : [];
    if (!Array.isArray(placeCats)) placeCats = [];
  } catch (e) { placeCats = []; }
}
function savePlaceCats() { localStorage.setItem(PLACE_CATS_KEY, JSON.stringify(placeCats)); }
function addPlaceCat(name) {
  name = (name || '').trim();
  if (!name || placeCats.includes(name)) return false;
  placeCats.push(name);
  savePlaceCats();
  return true;
}
// 重命名分类(同时同步已用该分类的地点);重名或空返回 false
function renamePlaceCat(oldName, newName) {
  oldName = (oldName || '').trim();
  newName = (newName || '').trim();
  if (!oldName || !newName) return false;
  if (newName !== oldName && placeCats.includes(newName)) return false;
  placeCats = placeCats.map(c => c === oldName ? newName : c);
  places.forEach(p => { if ((p.category || '') === oldName) p.category = newName; });
  savePlaceCats(); savePlaces();
  if (placeCatFilter === oldName) placeCatFilter = newName;
  renderCatChips(); refreshFormCatSelect(); renderPlacesList();
  return true;
}
// 删除分类(使用过该分类的地点降级为未分类);返回受影响的地点数
function deletePlaceCat(name) {
  name = (name || '').trim();
  if (!name || !placeCats.includes(name)) return 0;
  placeCats = placeCats.filter(c => c !== name);
  let n = 0;
  places.forEach(p => { if ((p.category || '') === name) { p.category = ''; n++; } });
  savePlaceCats(); savePlaces();
  if (placeCatFilter === name) placeCatFilter = 'all';
  renderCatChips(); refreshFormCatSelect(); renderPlacesList();
  return n;
}

// 按当前「筛选 + 排序」返回展示用列表(不改变 underlying 数组顺序)
function placesSorted() {
  let list = [...places];
  if (placeCatFilter !== 'all') list = list.filter(p => (p.category || '未分类') === placeCatFilter);
  if (placeSortMode === 'name') {
    list.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh'));
  } else if (placeSortMode === 'category') {
    list.sort((a, b) => (a.category || '未分类').localeCompare(b.category || '未分类', 'zh') || (a.name || '').localeCompare(b.name || '', 'zh'));
  } else if (placeSortMode === 'time') {
    list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }
  // 'custom' 保持数组原顺序
  return list;
}

// 分类选择框(表单)的 option HTML
function catSelectOptionsHtml(sel) {
  const opts = placeCats.map(c => `<option value="${escapeHtml(c)}"${c === sel ? ' selected' : ''}>${escapeHtml(c)}</option>`).join('');
  return `<option value=""${sel === '' ? ' selected' : ''}>未分类</option>` + opts;

// 分类筛选 chips HTML(全部 + 每个自定义分类)
function placeCatChipsHtml() {
  const chips = placeCats.map(c => `<button type="button" class="filter-btn ${placeCatFilter === c ? 'active' : ''}" data-pcat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
  return `<button type="button" class="filter-btn ${placeCatFilter === 'all' ? 'active' : ''}" data-pcat="all">全部</button>` + chips;
}

// 重新渲染「管理分类」面板

          <input type="text" class="pl-cat-rename" value="${escapeHtml(c)}" />
          <button type="button" class="pl-cat-del" data-action="pl-cat-del">删除</button>

      </div>

  // 绑定面板内事件

  const inputM = document.getElementById('plNewCatInputM');

      const n = deletePlaceCat(name);
      if (placeCatFilter === name) placeCatFilter = 'all';
      showToast(n > 0 ? `已删除分类「${name}」,${n} 个地点改为未分类` : `已删除分类「${name}」`);
      renderCatChips(); renderCatManage(); renderPlacesList(); refreshFormCatSelect();
    });
  });
}
// 从输入框新增分类(通用:表单内/管理面板都可用)
function addCatFromInput(input) {

  const name = input.value.trim();

function bindPlacesEvents() {
  const nameEl = document.getElementById('plName');
  const catEl = document.getElementById('plCat');
  const noteEl = document.getElementById('plNote');
  const addBtn = document.getElementById('plAddBtn');
  const cancelBtn = document.getElementById('plCancelBtn');
  const listEl = document.getElementById('plList');
  const addCatBtn = document.getElementById('plAddCatBtn');
  const newCatRow = document.getElementById('plNewCatRow');
  const newCatInput = document.getElementById('plNewCatInput');
  const newCatOk = document.getElementById('plNewCatOk');
  const newCatCancel = document.getElementById('plNewCatCancel');

  function refreshAll() { renderPlacesStats(); renderPlacesList(); }

  function openNewCat() {
    if (!newCatRow) return;
    newCatRow.style.display = '';
    if (newCatInput) { newCatInput.value = ''; newCatInput.focus(); }
  }
  function closeNewCat() { if (newCatRow) newCatRow.style.display = 'none'; if (newCatInput) newCatInput.value = ''; }
  function confirmNewCat() {
    if (!newCatInput) return;
    addCatFromInput(newCatInput);
    closeNewCat();
  }

  function loadForm(p) {
    nameEl.value = p.name || '';
    catEl.value = p.category || '';
    noteEl.value = p.note || '';
  }
  function clearForm() {
    nameEl.value = ''; catEl.value = ''; noteEl.value = '';
    placeEditingId = null;
    addBtn.textContent = '添加地点';
    cancelBtn.style.display = 'none';
  }

  function save() {
    const name = (nameEl.value || '').trim();
    if (!name) { showToast('请输入地点名称'); nameEl.focus(); return; }
    const data = {
      name,
      category: (catEl.value || '').trim(),
      note: (noteEl.value || '').trim()
    };
    if (placeEditingId) {
      const rec = places.find(p => p.id === placeEditingId);
      if (rec) {
        rec.name = data.name; rec.category = data.category; rec.note = data.note; rec.updatedAt = Date.now();
        savePlaces();
        showToast('已更新地点');
      }
      clearForm();
      refreshAll();
    } else {
      const dup = places.find(p => (p.name || '').trim() === name && ((p.category || '') === data.category));
      if (dup) { showToast('该地点已存在'); return; }
      places.push({ id: uid(), name: data.name, category: data.category, note: data.note, visited: false, createdAt: Date.now(), updatedAt: Date.now() });
      savePlaces();
      clearForm();
      refreshAll();
      showToast('已添加地点');
    }
  }

  addBtn.textContent = placeEditingId ? '更新地点' : '添加地点';
  addBtn.addEventListener('click', save);
  cancelBtn.addEventListener('click', clearForm);
  nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  noteEl.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });

  // 自定义分类
  if (addCatBtn) addCatBtn.addEventListener('click', openNewCat);
  if (newCatOk) newCatOk.addEventListener('click', confirmNewCat);
  if (newCatCancel) newCatCancel.addEventListener('click', closeNewCat);
  if (newCatInput) newCatInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmNewCat(); else if (e.key === 'Escape') closeNewCat(); });

  // 按分类筛选 + 排序
  const filterBar = document.querySelector('.pl-filter-bar');
  if (filterBar) {
    filterBar.addEventListener('click', e => {
      const cb = e.target.closest('[data-pcat]');
      if (cb) {
        placeCatFilter = cb.dataset.pcat;
        renderCatChips();
        renderPlacesList();
        return;
      }
      const sb = e.target.closest('[data-psort]');
      if (sb) {
        placeSortMode = sb.dataset.psort;
        localStorage.setItem('liumo_place_sort', placeSortMode);
        filterBar.querySelectorAll('[data-psort]').forEach(b => b.classList.toggle('active', b === sb));
        renderPlacesList();
        return;
      }
    });
  }
  // 管理分类面板开合
  const mgrBtn = document.getElementById('plManageCatsBtn');
  if (mgrBtn) mgrBtn.addEventListener('click', () => {
    const box = document.getElementById('plCatManage');
    if (!box) return;
    const open = box.style.display === 'none' || box.style.display === '';
    box.style.display = open ? '' : 'none';
    if (open) renderCatManage();
  });

  // 列表操作:删除 / 修改 / 标记去过
  if (listEl) {
    listEl.addEventListener('click', e => {
      const delBtn = e.target.closest('[data-action="pl-del"]');
      if (delBtn) {
        const id = delBtn.dataset.id;
        places = places.filter(p => p.id !== id);
        savePlaces();
        refreshAll();
        showToast('已删除地点');
        return;
      }
      const editBtn = e.target.closest('[data-action="pl-edit"]');
      if (editBtn) {
        const rec = places.find(p => p.id === editBtn.dataset.id);
        if (rec) {
          placeEditingId = rec.id;
          loadForm(rec);
          addBtn.textContent = '更新地点';
          cancelBtn.style.display = '';
          nameEl.focus();
          showToast('已载入,修改后点「更新地点」即可');
        }
        return;
      }
      const doneBtn = e.target.closest('[data-action="pl-done"]');
      if (doneBtn) {
        const rec = places.find(p => p.id === doneBtn.dataset.id);
        if (rec) {
          rec.visited = !rec.visited;
          rec.updatedAt = Date.now();
          savePlaces();
          refreshAll();
          showToast(rec.visited ? '已标记去过 🎉' : '已取消去过标记');
        }
        return;
      }
    });

    // 拖拽排序(仅「自定义顺序」生效)
    listEl.addEventListener('dragstart', e => {
      const item = e.target.closest('.pl-item');
      if (!item || item.getAttribute('draggable') !== 'true') return;
      placeDragId = item.dataset.id;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    listEl.addEventListener('dragend', e => {
      const item = e.target.closest('.pl-item');
      if (item) item.classList.remove('dragging');
      listEl.querySelectorAll('.pl-item').forEach(el => el.classList.remove('drag-over'));
      placeDragId = null;
    });
    listEl.addEventListener('dragover', e => {
      if (placeSortMode !== 'custom') return;
      e.preventDefault();
      const item = e.target.closest('.pl-item');
      listEl.querySelectorAll('.pl-item').forEach(el => el.classList.remove('drag-over'));
      if (item && item.dataset.id !== placeDragId) item.classList.add('drag-over');
    });
    listEl.addEventListener('drop', e => {
      if (placeSortMode !== 'custom') return;
      e.preventDefault();
      const target = e.target.closest('.pl-item');
      if (!target || !placeDragId || target.dataset.id === placeDragId) return;
      const fromIdx = places.findIndex(p => p.id === placeDragId);
      const toIdx = places.findIndex(p => p.id === target.dataset.id);
      if (fromIdx < 0 || toIdx < 0) return;
      const [moved] = places.splice(fromIdx, 1);
      places.splice(toIdx, 0, moved);
      savePlaces();
      renderPlacesList();
      showToast('已调整顺序');
    });
  }
}

// ==================== 销售数据管理模块 ====================
const SALES_KEY = 'liumo_sales_logs';
let salesLogs = [];   // { id, date:'YYYY-MM', retail, dailySales, dailyOrders, avgTicket, note, createdAt, updatedAt }

function loadSales() {
  try {
    const d = localStorage.getItem(SALES_KEY);
    salesLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(salesLogs)) salesLogs = [];
  } catch (e) { salesLogs = []; }
  salesLogs.forEach(l => {
    l.retail = Number(l.retail) || 0;
    l.dailySales = Number(l.dailySales) || 0;
    l.dailyOrders = Number(l.dailyOrders) || 0;
    l.avgTicket = Number(l.avgTicket) || 0;
    if (typeof l.note !== 'string') l.note = '';
  });
  salesLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function saveSalesLogs() { localStorage.setItem(SALES_KEY, JSON.stringify(salesLogs)); }
function salesAsc() { return [...salesLogs].sort((a, b) => (a.date || '').localeCompare(b.date || '')); }
function salesDesc() { return [...salesLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
function daysInMonth(m) { const p = (m || '').split('-').map(Number); return (p[0] && p[1]) ? new Date(p[0], p[1], 0).getDate() : null; }

const saMoney = v => (Math.round(Number(v) || 0)).toLocaleString() + ' 元';
const saNum = v => { const n = Number(v) || 0; return (Math.round(n * 100) / 100).toString(); };


// ---------- 渲染:销售数据管理模块 ----------
function renderSalesModule(content, mod) {

function renderSalesStats() {
  const el = document.getElementById('saStats');
  if (!el) return;
  const logs = salesLogs;
  const months = logs.length;
  const totalRetail = logs.reduce((s, l) => s + (l.retail || 0), 0);
  const avgRetail = months ? totalRetail / months : 0;
  const avgDaily = months ? logs.reduce((s, l) => s + (l.dailySales || 0), 0) / months : 0;
  const avgOrders = months ? logs.reduce((s, l) => s + (l.dailyOrders || 0), 0) / months : 0;
  const avgTicket = months ? logs.reduce((s, l) => s + (l.avgTicket || 0), 0) / months : 0;
  const last = salesDesc()[0];
  const lastRetail = last ? last.retail : 0;
  const cards = [
    statCard('累计零售额', saMoney(totalRetail), ''),
    statCard('月均零售额', saMoney(avgRetail), ''),
    statCard('月均日均销售额', saMoney(avgDaily), ''),
    statCard('月均客单量', (Math.round(avgOrders * 10) / 10) + ' 单', ''),
    statCard('月均客单价', '¥' + saNum(avgTicket), ''),
    statCard('记录月份', months + ' 个月', 'success')
  ];
  el.innerHTML = cards.join('');
}


// 独立模块：年度增长率（日均销售额 / 月均客单量 / 月均客单价）
function renderYearGrowthModule(content, mod) {
  loadSales();
  content.innerHTML = `
    <div class="page-header">
      <div class="page-title">${mod.name}</div>
      <div class="page-desc">${mod.desc}</div>
    </div>
    <div class="wt-note">
      数据来源：<b>销售数据管理</b>模块中已录入的月度历史。按年对三项指标求各月均值，并计算<b>年度同比增长</b>（=(本年−上年)÷上年）。高亮行为「去年」。
    </div>
    <div class="wt-list" id="ygBody"></div>
  `;
  paintYearGrowth();
}

function paintYearGrowth() {
  const el = document.getElementById('ygBody');
  if (!el) return;
  const logs = salesAsc();
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">还没有销售历史，请先在「销售数据管理」模块录入月份数据</div>`;
    return;
  }
  // 按年份分组
  const groups = {};
  logs.forEach(l => {
    const y = (l.date || '').slice(0, 4);
    if (!/^\d{4}$/.test(y)) return;
    (groups[y] = groups[y] || []).push(l);
  });
  const years = Object.keys(groups).sort();
  // 三个指标：均为当年各录入月份对应值的平均
  const metrics = [
    { t: '日均销售额', fmt: saMoney, get: l => Number(l.dailySales) || 0, note: '各月日均值平均' },
    { t: '月均客单量', fmt: v => (Math.round(v * 10) / 10) + ' 单', get: l => Number(l.dailyOrders) || 0, note: '各月日均值平均' },
    { t: '月均客单价', fmt: v => '¥' + (Math.round(v * 100) / 100), get: l => Number(l.avgTicket) || 0, note: '各月日均值平均' },
  ];
  const metricSeries = metrics.map(m => years.map(y => {
    const a = groups[y];
    return a.reduce((s, l) => s + m.get(l), 0) / a.length;
  }));
  const lastYear = new Date().getFullYear() - 1;
  const cards = metrics.map((m, mi) => {
    const series = metricSeries[mi];
    const rows = years.map((y, i) => {
      const val = series[i];
      let g = null;
      if (i > 0) { const p = series[i - 1]; g = p > 0 ? (val - p) / p * 100 : null; }
      const gTxt = g === null ? '—' : (g >= 0 ? '+' : '') + g.toFixed(1) + '%';
      const gCls = g === null ? '' : (g >= 0 ? 'sp-up' : 'sp-down');
      const hi = (y === String(lastYear)) ? ' class="sp-hl"' : '';
      return `<tr${hi}><td>${y} 年</td><td>${m.fmt(val)}</td><td class="${gCls}">${gTxt}</td></tr>`;
    }).join('');
    return `<div class="sp-card">
      <div class="sp-card-t">${m.t}<span class="sp-tag">${m.note}</span></div>
      <table class="wt-cat"><thead><tr><th>年度</th><th>数值</th><th>同比增长</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;

function paintQuarterGrowth() {
  const el = document.getElementById('qgBody');
  if (!el) return;
  const logs = salesAsc();
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">还没有销售历史，请先在「销售数据管理」模块录入月份数据</div>`;
    return;
  }
  // 按 年份 → 季度(1-4) 分组
  const groups = {};
  logs.forEach(l => {
    const y = (l.date || '').slice(0, 4);
    const m = Number((l.date || '').split('-')[1]);
    if (!/^\d{4}$/.test(y) || !m) return;
    const q = Math.ceil(m / 3);
    (groups[y] = groups[y] || { 1: [], 2: [], 3: [], 4: [] });
    groups[y][q].push(l);
  });
  const years = Object.keys(groups).sort();
  const quarters = [1, 2, 3, 4];
  const metrics = [
    { t: '日均销售额', fmt: saMoney, get: l => Number(l.dailySales) || 0, note: '季度内各月日均值平均' },
    { t: '月均客单量', fmt: v => (Math.round(v * 10) / 10) + ' 单', get: l => Number(l.dailyOrders) || 0, note: '季度内各月日均值平均' },
    { t: '月均客单价', fmt: v => '¥' + (Math.round(v * 100) / 100), get: l => Number(l.avgTicket) || 0, note: '季度内各月日均值平均' },
  ];
  const lastYear = new Date().getFullYear() - 1;
  const cards = metrics.map(m => {
    // 每年每季度的值（季度内各月对应值平均；无录入则为 null）
    const valM = years.map(y => quarters.map(q => {
      const arr = groups[y][q];
      if (!arr || arr.length === 0) return null;
      return arr.reduce((s, l) => s + m.get(l), 0) / arr.length;
    }));
    const rows = years.map((y, i) => {
      const cells = quarters.map((q, qi) => {
        const v = valM[i][qi];
        let g = null;
        if (i > 0) {
          const pv = valM[i - 1][qi];
          if (pv != null && pv > 0 && v != null) g = (v - pv) / pv * 100;
        }
        const valTxt = v == null ? '<span class="qg-empty">—</span>' : m.fmt(v);
        const gTxt = g == null ? '—' : (g >= 0 ? '+' : '') + g.toFixed(1) + '%';
        const gCls = g == null ? 'qg-g' : (g >= 0 ? 'qg-g sp-up' : 'qg-g sp-down');
        return `<td class="qg-cell">${valTxt}<div class="${gCls}">${gTxt}</div></td>`;
      }).join('');
      const hi = (y === String(lastYear)) ? ' class="sp-hl"' : '';
      return `<tr${hi}><td>${y} 年</td>${cells}</tr>`;
    }).join('');
    return `<div class="sp-card">
      <div class="sp-card-t">${m.t}<span class="sp-tag">${m.note}</span></div>
      <table class="wt-cat"><thead><tr><th>年度</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="sp-grid">${cards}</div>
    <div class="sp-note">口径：季度指标 = 该季度内各录入月份的对应值平均。单元格上方为季度数值，下方为<b>同季度同比</b>（今年该季度 ÷ 去年同季度 − 1）；首年或无去年同季度数据时显示「—」。某季度无录入则数值栏显示「—」。高亮行为「去年」。</div>`;
}

/* ===== 销售年度曲线：横轴=月份(1-12)，一年一条曲线 ===== */
const YEAR_COLORS = ['#6366f1', '#14b8a6', '#f59e0b', '#ec4899', '#3b82f6', '#10b981',
  '#ef4444', '#8b5cf6', '#f97316', '#0ea5e9', '#a855f7', '#22c55e'];

// years: [{ year:'2025', data:[12 个数值或 null] }]  unit: 单位字符串
function buildYearLineChart(years, unit) {
  const W = 720, H = 330;
  const padL = 56, padR = 16, padT = 30, padB = 36;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = 12;
  const xOf = i => padL + (n <= 1 ? plotW / 2 : plotW * i / (n - 1));
  let vmin = Infinity, vmax = -Infinity, any = false;
  years.forEach(y => y.data.forEach(v => {
    if (v != null && isFinite(v)) { any = true; vmin = Math.min(vmin, v); vmax = Math.max(vmax, v); }
  }));
  if (!any) { vmin = 0; vmax = 1; }
  const span = (vmax - vmin) || 1;
  vmin = vmin - span * 0.08; vmax = vmax + span * 0.08;
  if (vmin === vmax) { vmin -= 1; vmax += 1; }
  const yOf = v => padT + plotH * (1 - (v - vmin) / (vmax - vmin));
  const fmt = v => (Math.round(Number(v) * 100) / 100).toLocaleString() + (unit ? (' ' + unit) : '');
  const fmtShort = v => (Math.round(Number(v) * 100) / 100).toLocaleString();
  // 横向网格 + Y 轴刻度
  const rows = 4;
  let grid = '';
  for (let r = 0; r <= rows; r++) {
    const gy = (padT + plotH * r / rows).toFixed(1);
    const gv = vmax - (vmax - vmin) * r / rows;
    grid += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="#eef1f6" stroke-width="1"/>`;
    grid += `<text x="${padL - 6}" y="${(Number(gy) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#9aa3b2">${fmt(gv)}</text>`;
  }
  // 月份轴
  let xlab = '';
  for (let i = 0; i < n; i++) {
    xlab += `<text x="${xOf(i).toFixed(1)}" y="${H - padB + 16}" text-anchor="middle" font-size="9" fill="#9aa3b2">${i + 1}月</text>`;
  }
  // 年份曲线（分层绘制：先全部折线 → 再全部圆点 → 最后全部标签，避免后画系列遮挡先画标签）
  let polyLayer = '', dotLayer = '', labelLayer = '';
  const Y = years.length;
  years.forEach((y, yi) => {
    const color = YEAR_COLORS[yi % YEAR_COLORS.length];
    // 按年份做轻微纵向错位，避免同月多年度数值接近时标签互相压住
    const off = (yi - (Y - 1) / 2) * 9;
    let seg = [];
    const flush = () => {
      if (seg.length) {
        polyLayer += `<polyline points="${seg.map(p => p[0] + ',' + p[1]).join(' ')}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
        seg = [];
      }
    };
    const pts = [];
    for (let i = 0; i < n; i++) {
      const v = y.data[i];
      if (v == null || !isFinite(v)) { flush(); continue; }
      const x = xOf(i), yy = yOf(v);
      seg.push([x.toFixed(1), yy.toFixed(1)]);
      pts.push({ i, x, yy, v });
    }
    flush();
    // 圆点 + 悬停提示(所有年份均可查)
    pts.forEach(p => {
      dotLayer += `<circle cx="${p.x.toFixed(1)}" cy="${p.yy.toFixed(1)}" r="2.8" fill="${color}"><title>${y.year}年${p.i + 1}月: ${fmt(p.v)}</title></circle>`;
    });
    // 各年各点都常驻标注数值；白底描边保证接近时仍可读；越界则反向避让
    pts.forEach(p => {
      let ty = p.yy + off;
      if (ty - 8 < padT) ty = p.yy + 12;
      else if (ty + 4 > H - padB) ty = p.yy - 10;
      labelLayer += `<text x="${p.x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="8" fill="${color}" paint-order="stroke" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round">${fmtShort(p.v)}</text>`;
    });
  });
  // 图例
  let legend = '';
  years.forEach((y, yi) => {
    const color = YEAR_COLORS[yi % YEAR_COLORS.length];
    legend += `<span style="display:inline-flex;align-items:center;margin-right:14px;font-size:11px;color:#4b5563;"><span style="display:inline-block;width:14px;height:3px;background:${color};border-radius:2px;margin-right:5px;"></span>${y.year}年</span>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}${polyLayer}${dotLayer}${labelLayer}${xlab}</svg>
    <div class="yy-legend">${legend || '（暂无数据）'}</div>`;
}

      将<b>销售数据管理</b>模块录入的数据，以<b>月份为横坐标、年份为曲线</b>重新绘制：<b>同一个月的不同年份并排对比</b>，

function bindSalesEvents() {
  const addBtn = document.getElementById('saAddBtn');
  const cancelBtn = document.getElementById('saCancelBtn');
  const monthEl = document.getElementById('saMonth');
  const retailEl = document.getElementById('saRetail');
  const dailyEl = document.getElementById('saDailySales');
  const ordersEl = document.getElementById('saDailyOrders');
  const ticketEl = document.getElementById('saAvgTicket');
  const noteEl = document.getElementById('saNote');
  const list = document.getElementById('saList');
  let editingId = null;

  function refreshAll() { renderSalesStats(); renderSalesList(); }

  function clearForm() {
    monthEl.value = currentMonthStr();
    retailEl.value = ''; dailyEl.value = ''; ordersEl.value = ''; ticketEl.value = ''; noteEl.value = '';
    editingId = null;
    addBtn.textContent = '保存记录';
    cancelBtn.style.display = 'none';
  }

  function save() {
    const date = (monthEl.value || '').trim();
    if (!date || !/^\d{4}-\d{2}$/.test(date)) { showToast('请选择月份'); monthEl.focus(); return; }
    const rec = {
      retail: parseFloat(retailEl.value) || 0,
      dailySales: parseFloat(dailyEl.value) || 0,
      dailyOrders: parseFloat(ordersEl.value) || 0,
      avgTicket: parseFloat(ticketEl.value) || 0,
      note: (noteEl.value || '').trim()
    };
    if (!rec.retail && !rec.dailySales && !rec.dailyOrders && !rec.avgTicket) { showToast('请至少填写一项数值'); return; }
    const exist = salesLogs.find(l => l.date === date);
    if (exist) {
      Object.assign(exist, rec, { updatedAt: Date.now() });
      showToast('已更新 ' + date);
    } else {
      salesLogs.push({ id: uid(), date, ...rec, createdAt: Date.now(), updatedAt: Date.now() });
      showToast('已保存 ' + date);
    }
    salesLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveSalesLogs();
    clearForm();
    refreshAll();
  }

  addBtn.addEventListener('click', save);
  cancelBtn.addEventListener('click', clearForm);
  noteEl.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });

  if (list) list.addEventListener('click', e => {
    const delBtn = e.target.closest('[data-action="sa-del"]');
    const editBtn = e.target.closest('[data-action="sa-edit"]');
    if (delBtn) {
      const id = delBtn.dataset.id;
      const rec = salesLogs.find(l => l.id === id);
      salesLogs = salesLogs.filter(l => l.id !== id);
      saveSalesLogs();
      refreshAll();
      showToast('已删除 ' + (rec ? rec.date : '记录'));
      return;
    }
    if (editBtn) {
      const rec = salesLogs.find(l => l.id === editBtn.dataset.id);
      if (rec) {
        monthEl.value = rec.date;
        retailEl.value = rec.retail || '';
        dailyEl.value = rec.dailySales || '';
        ordersEl.value = rec.dailyOrders || '';
        ticketEl.value = rec.avgTicket || '';
        noteEl.value = rec.note || '';
        editingId = rec.id;
        addBtn.textContent = '更新记录';
        cancelBtn.style.display = '';
        monthEl.focus();
        showToast('已载入 ' + rec.date + '，修改后点「更新记录」');
      }
    }
  });
}

// ==================== 销售计划模块 ====================
const SALES_PLAN_KEY = 'liumo_sales_plan';
let salesPlan = null;
let planStrategy = 'yoy';
let planGrowth = 0.10;
let planLoaded = false;
let planCurrentBasis = { ds: 0, q: 0 };

function loadSalesPlan() {
  try {
    const d = localStorage.getItem(SALES_PLAN_KEY);
    const arr = d ? JSON.parse(d) : [];
    salesPlan = (Array.isArray(arr) && arr.find(p => p.month === currentMonthStr())) || null;
  } catch (e) { salesPlan = null; }
}

function saveSalesPlanStore() {
  try {
    const d = localStorage.getItem(SALES_PLAN_KEY);
    let arr = d ? JSON.parse(d) : [];
    if (!Array.isArray(arr)) arr = [];
    const cur = currentMonthStr();
    arr = arr.filter(p => p.month !== cur);
    if (salesPlan) arr.push(salesPlan);
    localStorage.setItem(SALES_PLAN_KEY, JSON.stringify(arr));
  } catch (e) {}
}

function planBasis(strategy, growth) {
  const hist = salesAsc();
  if (hist.length === 0) return { ds: 0, q: 0 };
  const [cy, cm] = currentMonthStr().split('-').map(Number);
  const yoyKey = (cy - 1) + '-' + ('0' + cm).slice(-2);
  const avg = (a, k) => a.reduce((s, r) => s + (r[k] || 0), 0) / (a.length || 1);
  if (strategy === 'yoy') {
    const y = hist.find(r => r.date === yoyKey) || hist[hist.length - 1];
    return { ds: y.dailySales || 0, q: y.dailyOrders || 0 };
  }
  if (strategy === 'm3')  { const a = hist.slice(-3); return { ds: avg(a,'dailySales'), q: avg(a,'dailyOrders') }; }
  if (strategy === 'm6')  { const a = hist.slice(-6); return { ds: avg(a,'dailySales'), q: avg(a,'dailyOrders') }; }
  if (strategy === 'm12') { const a = hist;           return { ds: avg(a,'dailySales'), q: avg(a,'dailyOrders') }; }
  if (strategy === 'grow'){ const a = hist.slice(-3); return { ds: avg(a,'dailySales')*(1+growth), q: avg(a,'dailyOrders')*(1+growth) }; }
  return { ds: 0, q: 0 };
}

const SP_STRATS = [
  { id:'yoy',  t:'去年同月', d:'取去年同期实际值' },
  { id:'m3',   t:'近 3 月均值', d:'最近一季度平均' },
  { id:'m6',   t:'近 6 月均值', d:'半年度平均' },
  { id:'m12',  t:'近 12 月均值', d:'全年平均' },
  { id:'grow', t:'自定义增长', d:'近 3 月 ×(1+增长)' },
];

function renderSalesPlanModule(content, mod) {
  loadSales();
  loadSalesPlan();
  const cur = currentMonthStr();
  const days = daysInMonth(cur) || 30;
  planLoaded = !!salesPlan;
  const basis = salesPlan ? { ds: salesPlan.ds, q: salesPlan.q } : planBasis(planStrategy, planGrowth);
  content.innerHTML = `
    <div class="page-header">
      <div class="page-title">${mod.name}</div>
      <div class="page-desc">${mod.desc}</div>
    </div>
    <div class="wt-note">
      数据来源：<b>销售数据管理</b>模块中已录入的月度历史。按所选策略推算 <b>${cur}（${days}天）</b> 的计划销售数据，四项指标自动保持内部一致。
    </div>
    <div id="spBody"></div>
  `;
  paintPlanBody(basis, cur, days);
}

function paintPlanBody(basis, cur, days) {
  const el = document.getElementById('spBody');
  if (!el) return;
  const hist = salesAsc();
  if (hist.length === 0) { el.innerHTML = `<div class="wt-empty">还没有销售历史，请先在「销售数据管理」模块录入月份数据</div>`; return; }

  const [cy, cm] = cur.split('-').map(Number);
  const yoyKey = (cy - 1) + '-' + ('0' + cm).slice(-2);
  const recentKeys = hist.slice(-3).map(r => r.date);
  const rows = hist.slice(-12).map(r => {
    const tag = r.date === yoyKey ? '<span class="sp-badge sp-yoy">同</span>'
              : recentKeys.includes(r.date) ? '<span class="sp-badge sp-re">近</span>' : '';
    const tick = (r.dailySales && r.dailyOrders) ? r.dailySales / r.dailyOrders : 0;
    const ret = (r.dailySales || 0) * (daysInMonth(r.date) || days);
    return `<tr><td>${escapeHtml(r.date)}${tag}</td><td>${saMoney(r.dailySales)}</td><td>${(r.dailyOrders||0)} 单</td><td>${tick? tick.toFixed(2):'—'}</td><td>${saMoney(ret)}</td></tr>`;

  const stratHtml = SP_STRATS.map(s => `

  el.innerHTML = `

  if (growEl) growEl.addEventListener('input', () => {
