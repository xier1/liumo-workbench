function bindPlacesEvents() {
  const nameEl = document.getElementById('plName');
  const catEl = document.getElementById('plCat');
  const noteEl = document.getElementById('plNote');
  const addBtn = document.getElementById('plAddBtn');
  const cancelBtn = document.getElementById('plCancelBtn');
  const listEl = document.getElementById('plList');
  const addCatBtn = document.getElementById('plAddCatBtn');
  const newCatRow = document.getElementById('plNewCatRow');
  const newCatInput = document.getElementById('plNewCatInput');
  const newCatOk = document.getElementById('plNewCatOk');
  const newCatCancel = document.getElementById('plNewCatCancel');

  function refreshAll() { renderPlacesStats(); renderPlacesList(); }

  function openNewCat() {
    if (!newCatRow) return;
    newCatRow.style.display = '';
    if (newCatInput) { newCatInput.value = ''; newCatInput.focus(); }
  }
  function closeNewCat() { if (newCatRow) newCatRow.style.display = 'none'; if (newCatInput) newCatInput.value = ''; }
  function confirmNewCat() {
    if (!newCatInput) return;
    addCatFromInput(newCatInput);
    closeNewCat();
  }

  function loadForm(p) {
    nameEl.value = p.name || '';
    catEl.value = p.category || '';
    noteEl.value = p.note || '';
  }
  function clearForm() {
    nameEl.value = ''; catEl.value = ''; noteEl.value = '';
    placeEditingId = null;
    addBtn.textContent = '添加地点';
    cancelBtn.style.display = 'none';
  }

  function save() {
    const name = (nameEl.value || '').trim();
    if (!name) { showToast('请输入地点名称'); nameEl.focus(); return; }
    const data = {
      name,
      category: (catEl.value || '').trim(),
      note: (noteEl.value || '').trim()
    };
    if (placeEditingId) {
      const rec = places.find(p => p.id === placeEditingId);
      if (rec) {
        rec.name = data.name; rec.category = data.category; rec.note = data.note; rec.updatedAt = Date.now();
        savePlaces();
        showToast('已更新地点');
      }
      clearForm();
      refreshAll();
    } else {
      const dup = places.find(p => (p.name || '').trim() === name && ((p.category || '') === data.category));
      if (dup) { showToast('该地点已存在'); return; }
      places.push({ id: uid(), name: data.name, category: data.category, note: data.note, visited: false, createdAt: Date.now(), updatedAt: Date.now() });
      savePlaces();
      clearForm();
      refreshAll();
      showToast('已添加地点');
    }
  }

  addBtn.textContent = placeEditingId ? '更新地点' : '添加地点';
  addBtn.addEventListener('click', save);
  cancelBtn.addEventListener('click', clearForm);
  nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  noteEl.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });

  // 自定义分类
  if (addCatBtn) addCatBtn.addEventListener('click', openNewCat);
  if (newCatOk) newCatOk.addEventListener('click', confirmNewCat);
  if (newCatCancel) newCatCancel.addEventListener('click', closeNewCat);
  if (newCatInput) newCatInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmNewCat(); else if (e.key === 'Escape') closeNewCat(); });

  // 按分类筛选 + 排序
  const filterBar = document.querySelector('.pl-filter-bar');
  if (filterBar) {
    filterBar.addEventListener('click', e => {
      const cb = e.target.closest('[data-pcat]');
      if (cb) {
        placeCatFilter = cb.dataset.pcat;
        renderCatChips();
        renderPlacesList();
        return;
      }
      const sb = e.target.closest('[data-psort]');
      if (sb) {
        placeSortMode = sb.dataset.psort;
        localStorage.setItem('liumo_place_sort', placeSortMode);
        filterBar.querySelectorAll('[data-psort]').forEach(b => b.classList.toggle('active', b === sb));
        renderPlacesList();
        return;
      }
    });
  }
  // 管理分类面板开合
  const mgrBtn = document.getElementById('plManageCatsBtn');
  if (mgrBtn) mgrBtn.addEventListener('click', () => {
    const box = document.getElementById('plCatManage');
    if (!box) return;
    const open = box.style.display === 'none' || box.style.display === '';
    box.style.display = open ? '' : 'none';
    if (open) renderCatManage();
  });

  // 列表操作:删除 / 修改 / 标记去过
  if (listEl) {
    listEl.addEventListener('click', e => {
      const delBtn = e.target.closest('[data-action="pl-del"]');
      if (delBtn) {
        const id = delBtn.dataset.id;
        places = places.filter(p => p.id !== id);
        savePlaces();
        refreshAll();
        showToast('已删除地点');
        return;
      }
      const editBtn = e.target.closest('[data-action="pl-edit"]');
      if (editBtn) {
        const rec = places.find(p => p.id === editBtn.dataset.id);
        if (rec) {
          placeEditingId = rec.id;
          loadForm(rec);
          addBtn.textContent = '更新地点';
          cancelBtn.style.display = '';
          nameEl.focus();
          showToast('已载入,修改后点「更新地点」即可');
        }
        return;
      }
      const doneBtn = e.target.closest('[data-action="pl-done"]');
      if (doneBtn) {
        const rec = places.find(p => p.id === doneBtn.dataset.id);
        if (rec) {
          rec.visited = !rec.visited;
          rec.updatedAt = Date.now();
          savePlaces();
          refreshAll();
          showToast(rec.visited ? '已标记去过 🎉' : '已取消去过标记');
        }
        return;
      }
    });

    // 拖拽排序(仅「自定义顺序」生效)
    listEl.addEventListener('dragstart', e => {
      const item = e.target.closest('.pl-item');
      if (!item || item.getAttribute('draggable') !== 'true') return;
      placeDragId = item.dataset.id;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    listEl.addEventListener('dragend', e => {
      const item = e.target.closest('.pl-item');
      if (item) item.classList.remove('dragging');
      listEl.querySelectorAll('.pl-item').forEach(el => el.classList.remove('drag-over'));
      placeDragId = null;
    });
    listEl.addEventListener('dragover', e => {
      if (placeSortMode !== 'custom') return;
      e.preventDefault();
      const item = e.target.closest('.pl-item');
      listEl.querySelectorAll('.pl-item').forEach(el => el.classList.remove('drag-over'));
      if (item && item.dataset.id !== placeDragId) item.classList.add('drag-over');
    });
    listEl.addEventListener('drop', e => {
      if (placeSortMode !== 'custom') return;
      e.preventDefault();
      const target = e.target.closest('.pl-item');
      if (!target || !placeDragId || target.dataset.id === placeDragId) return;
      const fromIdx = places.findIndex(p => p.id === placeDragId);
      const toIdx = places.findIndex(p => p.id === target.dataset.id);
      if (fromIdx < 0 || toIdx < 0) return;
      const [moved] = places.splice(fromIdx, 1);
      places.splice(toIdx, 0, moved);
      savePlaces();
      renderPlacesList();
      showToast('已调整顺序');
    });
  }
}

// ==================== 销售数据管理模块 ====================
const SALES_KEY = 'liumo_sales_logs';
let salesLogs = [];   // { id, date:'YYYY-MM', retail, dailySales, dailyOrders, avgTicket, note, createdAt, updatedAt }

function loadSales() {
  try {
    const d = localStorage.getItem(SALES_KEY);
    salesLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(salesLogs)) salesLogs = [];
  } catch (e) { salesLogs = []; }
  salesLogs.forEach(l => {
    l.retail = Number(l.retail) || 0;
    l.dailySales = Number(l.dailySales) || 0;
    l.dailyOrders = Number(l.dailyOrders) || 0;
    l.avgTicket = Number(l.avgTicket) || 0;
    if (typeof l.note !== 'string') l.note = '';
  });
  salesLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function saveSalesLogs() { localStorage.setItem(SALES_KEY, JSON.stringify(salesLogs)); }
function salesAsc() { return [...salesLogs].sort((a, b) => (a.date || '').localeCompare(b.date || '')); }
function salesDesc() { return [...salesLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
function daysInMonth(m) { const p = (m || '').split('-').map(Number); return (p[0] && p[1]) ? new Date(p[0], p[1], 0).getDate() : null; }

const saMoney = v => (Math.round(Number(v) || 0)).toLocaleString() + ' 元';
const saNum = v => { const n = Number(v) || 0; return (Math.round(n * 100) / 100).toString(); };

// 独立模块：年度增长率（日均销售额 / 月均客单量 / 月均客单价）
function renderYearGrowthModule(content, mod) {
  loadSales();
  content.innerHTML = `
    <div class="page-header">
      <div class="page-title">${mod.name}</div>
      <div class="page-desc">${mod.desc}</div>
    </div>
    <div class="wt-note">
      数据来源：<b>销售数据管理</b>模块中已录入的月度历史。按年对三项指标求各月均值，并计算<b>年度同比增长</b>（=(本年−上年)÷上年）。高亮行为「去年」。
    </div>
    <div class="wt-list" id="ygBody"></div>
  `;
  paintYearGrowth();
}

function paintYearGrowth() {
  const el = document.getElementById('ygBody');
  if (!el) return;
  const logs = salesAsc();
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">还没有销售历史，请先在「销售数据管理」模块录入月份数据</div>`;
    return;
  }
  // 按年份分组
  const groups = {};
  logs.forEach(l => {
    const y = (l.date || '').slice(0, 4);
    if (!/^\d{4}$/.test(y)) return;
    (groups[y] = groups[y] || []).push(l);
  });
  const years = Object.keys(groups).sort();
  // 三个指标：均为当年各录入月份对应值的平均
  const metrics = [
    { t: '日均销售额', fmt: saMoney, get: l => Number(l.dailySales) || 0, note: '各月日均值平均' },
    { t: '月均客单量', fmt: v => (Math.round(v * 10) / 10) + ' 单', get: l => Number(l.dailyOrders) || 0, note: '各月日均值平均' },
    { t: '月均客单价', fmt: v => '¥' + (Math.round(v * 100) / 100), get: l => Number(l.avgTicket) || 0, note: '各月日均值平均' },
  ];
  const metricSeries = metrics.map(m => years.map(y => {
    const a = groups[y];
    return a.reduce((s, l) => s + m.get(l), 0) / a.length;
  }));
  const lastYear = new Date().getFullYear() - 1;
  const cards = metrics.map((m, mi) => {
    const series = metricSeries[mi];
    const rows = years.map((y, i) => {
      const val = series[i];
      let g = null;
      if (i > 0) { const p = series[i - 1]; g = p > 0 ? (val - p) / p * 100 : null; }
      const gTxt = g === null ? '—' : (g >= 0 ? '+' : '') + g.toFixed(1) + '%';
      const gCls = g === null ? '' : (g >= 0 ? 'sp-up' : 'sp-down');
      const hi = (y === String(lastYear)) ? ' class="sp-hl"' : '';
      return `<tr${hi}><td>${y} 年</td><td>${m.fmt(val)}</td><td class="${gCls}">${gTxt}</td></tr>`;
    }).join('');
    return `<div class="sp-card">
      <div class="sp-card-t">${m.t}<span class="sp-tag">${m.note}</span></div>
      <table class="wt-cat"><thead><tr><th>年度</th><th>数值</th><th>同比增长</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="sp-grid">${cards}</div>
    <div class="sp-note">口径：三项指标均为当年各录入月份对应值的平均。日均销售额 = 各月日均销售额平均；月均客单量 / 客单价 = 各月日均客单量 / 客单价平均。同比增长 = (本年 − 上年) ÷ 上年。高亮行即为「去年」。</div>`;
}

/* ===== 季度增长率：年度 × 季度(Q1-Q4) 矩阵，含同季度同比 ===== */
function renderQuarterGrowthModule(content, mod) {
  loadSales();
  content.innerHTML = `
    <div class="page-header">
      <div class="page-title">${mod.name}</div>
      <div class="page-desc">${mod.desc}</div>
    </div>
    <div class="wt-note">
      数据来源：<b>销售数据管理</b>模块已录入的月度历史。按季度拆分（Q1=1-3月、Q2=4-6月、Q3=7-9月、Q4=10-12月），对各指标求季度内月均值，并计算<b>同季度同比增长</b>（今年当季 ÷ 去年同季 − 1）。高亮行为「去年」。
    </div>
    <div class="wt-list" id="qgBody"></div>
  `;
  paintQuarterGrowth();
}

function paintQuarterGrowth() {
  const el = document.getElementById('qgBody');
  if (!el) return;
  const logs = salesAsc();
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">还没有销售历史，请先在「销售数据管理」模块录入月份数据</div>`;
    return;
  }
  // 按 年份 → 季度(1-4) 分组
  const groups = {};
  logs.forEach(l => {
    const y = (l.date || '').slice(0, 4);
    const m = Number((l.date || '').split('-')[1]);
    if (!/^\d{4}$/.test(y) || !m) return;
    const q = Math.ceil(m / 3);
    (groups[y] = groups[y] || { 1: [], 2: [], 3: [], 4: [] });
    groups[y][q].push(l);
  });
  const years = Object.keys(groups).sort();
  const quarters = [1, 2, 3, 4];
  const metrics = [
    { t: '日均销售额', fmt: saMoney, get: l => Number(l.dailySales) || 0, note: '季度内各月日均值平均' },
    { t: '月均客单量', fmt: v => (Math.round(v * 10) / 10) + ' 单', get: l => Number(l.dailyOrders) || 0, note: '季度内各月日均值平均' },
    { t: '月均客单价', fmt: v => '¥' + (Math.round(v * 100) / 100), get: l => Number(l.avgTicket) || 0, note: '季度内各月日均值平均' },
  ];
  const lastYear = new Date().getFullYear() - 1;
  const cards = metrics.map(m => {
    // 每年每季度的值（季度内各月对应值平均；无录入则为 null）
    const valM = years.map(y => quarters.map(q => {
      const arr = groups[y][q];
      if (!arr || arr.length === 0) return null;
      return arr.reduce((s, l) => s + m.get(l), 0) / arr.length;
    }));
    const rows = years.map((y, i) => {
      const cells = quarters.map((q, qi) => {
        const v = valM[i][qi];
        let g = null;
        if (i > 0) {
          const pv = valM[i - 1][qi];
          if (pv != null && pv > 0 && v != null) g = (v - pv) / pv * 100;
        }
        const valTxt = v == null ? '<span class="qg-empty">—</span>' : m.fmt(v);
        const gTxt = g == null ? '—' : (g >= 0 ? '+' : '') + g.toFixed(1) + '%';
        const gCls = g == null ? 'qg-g' : (g >= 0 ? 'qg-g sp-up' : 'qg-g sp-down');
        return `<td class="qg-cell">${valTxt}<div class="${gCls}">${gTxt}</div></td>`;
      }).join('');
      const hi = (y === String(lastYear)) ? ' class="sp-hl"' : '';
      return `<tr${hi}><td>${y} 年</td>${cells}</tr>`;
    }).join('');
    return `<div class="sp-card">
      <div class="sp-card-t">${m.t}<span class="sp-tag">${m.note}</span></div>
      <table class="wt-cat"><thead><tr><th>年度</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="sp-grid">${cards}</div>
    <div class="sp-note">口径：季度指标 = 该季度内各录入月份的对应值平均。单元格上方为季度数值，下方为<b>同季度同比</b>（今年该季度 ÷ 去年同季度 − 1）；首年或无去年同季度数据时显示「—」。某季度无录入则数值栏显示「—」。高亮行为「去年」。</div>`;
}

/* ===== 销售年度曲线：横轴=月份(1-12)，一年一条曲线 ===== */
const YEAR_COLORS = ['#6366f1', '#14b8a6', '#f59e0b', '#ec4899', '#3b82f6', '#10b981',
  '#ef4444', '#8b5cf6', '#f97316', '#0ea5e9', '#a855f7', '#22c55e'];

// years: [{ year:'2025', data:[12 个数值或 null] }]  unit: 单位字符串
function buildYearLineChart(years, unit) {
  const W = 720, H = 330;
  const padL = 56, padR = 16, padT = 30, padB = 36;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = 12;
  const xOf = i => padL + (n <= 1 ? plotW / 2 : plotW * i / (n - 1));
  let vmin = Infinity, vmax = -Infinity, any = false;
  years.forEach(y => y.data.forEach(v => {
    if (v != null && isFinite(v)) { any = true; vmin = Math.min(vmin, v); vmax = Math.max(vmax, v); }
  }));
  if (!any) { vmin = 0; vmax = 1; }
  const span = (vmax - vmin) || 1;
  vmin = vmin - span * 0.08; vmax = vmax + span * 0.08;
  if (vmin === vmax) { vmin -= 1; vmax += 1; }
  const yOf = v => padT + plotH * (1 - (v - vmin) / (vmax - vmin));
  const fmt = v => (Math.round(Number(v) * 100) / 100).toLocaleString() + (unit ? (' ' + unit) : '');
  const fmtShort = v => (Math.round(Number(v) * 100) / 100).toLocaleString();
  // 横向网格 + Y 轴刻度
  const rows = 4;
  let grid = '';
  for (let r = 0; r <= rows; r++) {
    const gy = (padT + plotH * r / rows).toFixed(1);
    const gv = vmax - (vmax - vmin) * r / rows;
    grid += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="#eef1f6" stroke-width="1"/>`;
    grid += `<text x="${padL - 6}" y="${(Number(gy) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#9aa3b2">${fmt(gv)}</text>`;
  }
  // 月份轴
  let xlab = '';
  for (let i = 0; i < n; i++) {
    xlab += `<text x="${xOf(i).toFixed(1)}" y="${H - padB + 16}" text-anchor="middle" font-size="9" fill="#9aa3b2">${i + 1}月</text>`;
  }
  // 年份曲线（分层绘制：先全部折线 → 再全部圆点 → 最后全部标签，避免后画系列遮挡先画标签）
  let polyLayer = '', dotLayer = '', labelLayer = '';
  const Y = years.length;
  years.forEach((y, yi) => {
    const color = YEAR_COLORS[yi % YEAR_COLORS.length];
    // 按年份做轻微纵向错位，避免同月多年度数值接近时标签互相压住
    const off = (yi - (Y - 1) / 2) * 9;
    let seg = [];
    const flush = () => {
      if (seg.length) {
        polyLayer += `<polyline points="${seg.map(p => p[0] + ',' + p[1]).join(' ')}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
        seg = [];
      }
    };
    const pts = [];
    for (let i = 0; i < n; i++) {
      const v = y.data[i];
      if (v == null || !isFinite(v)) { flush(); continue; }
      const x = xOf(i), yy = yOf(v);
      seg.push([x.toFixed(1), yy.toFixed(1)]);
      pts.push({ i, x, yy, v });
    }
    flush();
    // 圆点 + 悬停提示(所有年份均可查)
    pts.forEach(p => {
      dotLayer += `<circle cx="${p.x.toFixed(1)}" cy="${p.yy.toFixed(1)}" r="2.8" fill="${color}"><title>${y.year}年${p.i + 1}月: ${fmt(p.v)}</title></circle>`;
    });
    // 各年各点都常驻标注数值；白底描边保证接近时仍可读；越界则反向避让
    pts.forEach(p => {
      let ty = p.yy + off;
      if (ty - 8 < padT) ty = p.yy + 12;
      else if (ty + 4 > H - padB) ty = p.yy - 10;
      labelLayer += `<text x="${p.x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="8" fill="${color}" paint-order="stroke" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round">${fmtShort(p.v)}</text>`;
    });
  });
  // 图例
  let legend = '';
  years.forEach((y, yi) => {
    const color = YEAR_COLORS[yi % YEAR_COLORS.length];
    legend += `<span style="display:inline-flex;align-items:center;margin-right:14px;font-size:11px;color:#4b5563;"><span style="display:inline-block;width:14px;height:3px;background:${color};border-radius:2px;margin-right:5px;"></span>${y.year}年</span>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}${polyLayer}${dotLayer}${labelLayer}${xlab}</svg>
    <div class="yy-legend">${legend || '（暂无数据）'}</div>`;
}

function bindSalesEvents() {
  const addBtn = document.getElementById('saAddBtn');
  const cancelBtn = document.getElementById('saCancelBtn');
  const monthEl = document.getElementById('saMonth');
  const retailEl = document.getElementById('saRetail');
  const dailyEl = document.getElementById('saDailySales');
  const ordersEl = document.getElementById('saDailyOrders');
  const ticketEl = document.getElementById('saAvgTicket');
  const noteEl = document.getElementById('saNote');
  const list = document.getElementById('saList');
  let editingId = null;

  function refreshAll() { renderSalesStats(); renderSalesList(); }

  function clearForm() {
    monthEl.value = currentMonthStr();
    retailEl.value = ''; dailyEl.value = ''; ordersEl.value = ''; ticketEl.value = ''; noteEl.value = '';
    editingId = null;
    addBtn.textContent = '保存记录';
    cancelBtn.style.display = 'none';
  }

  function save() {
    const date = (monthEl.value || '').trim();
    if (!date || !/^\d{4}-\d{2}$/.test(date)) { showToast('请选择月份'); monthEl.focus(); return; }
    const rec = {
      retail: parseFloat(retailEl.value) || 0,
      dailySales: parseFloat(dailyEl.value) || 0,
      dailyOrders: parseFloat(ordersEl.value) || 0,
      avgTicket: parseFloat(ticketEl.value) || 0,
      note: (noteEl.value || '').trim()
    };
    if (!rec.retail && !rec.dailySales && !rec.dailyOrders && !rec.avgTicket) { showToast('请至少填写一项数值'); return; }
    const exist = salesLogs.find(l => l.date === date);
    if (exist) {
      Object.assign(exist, rec, { updatedAt: Date.now() });
      showToast('已更新 ' + date);
    } else {
      salesLogs.push({ id: uid(), date, ...rec, createdAt: Date.now(), updatedAt: Date.now() });
      showToast('已保存 ' + date);
    }
    salesLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveSalesLogs();
    clearForm();
    refreshAll();
  }

  addBtn.addEventListener('click', save);
  cancelBtn.addEventListener('click', clearForm);
  noteEl.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });

  if (list) list.addEventListener('click', e => {
    const delBtn = e.target.closest('[data-action="sa-del"]');
    const editBtn = e.target.closest('[data-action="sa-edit"]');
    if (delBtn) {
      const id = delBtn.dataset.id;
      const rec = salesLogs.find(l => l.id === id);
      salesLogs = salesLogs.filter(l => l.id !== id);
      saveSalesLogs();
      refreshAll();
      showToast('已删除 ' + (rec ? rec.date : '记录'));
      return;
    }
    if (editBtn) {
      const rec = salesLogs.find(l => l.id === editBtn.dataset.id);
      if (rec) {
        monthEl.value = rec.date;
        retailEl.value = rec.retail || '';
        dailyEl.value = rec.dailySales || '';
        ordersEl.value = rec.dailyOrders || '';
        ticketEl.value = rec.avgTicket || '';
        noteEl.value = rec.note || '';
        editingId = rec.id;
        addBtn.textContent = '更新记录';
        cancelBtn.style.display = '';
        monthEl.focus();
        showToast('已载入 ' + rec.date + '，修改后点「更新记录」');
      }
    }
  });
}

// ==================== 销售计划模块 ====================
const SALES_PLAN_KEY = 'liumo_sales_plan';
let salesPlan = null;
let planStrategy = 'yoy';
let planGrowth = 0.10;
let planLoaded = false;
let planCurrentBasis = { ds: 0, q: 0 };

function loadSalesPlan() {
  try {
    const d = localStorage.getItem(SALES_PLAN_KEY);
    const arr = d ? JSON.parse(d) : [];
    salesPlan = (Array.isArray(arr) && arr.find(p => p.month === currentMonthStr())) || null;
  } catch (e) { salesPlan = null; }
}

function saveSalesPlanStore() {
  try {
    const d = localStorage.getItem(SALES_PLAN_KEY);
    let arr = d ? JSON.parse(d) : [];
    if (!Array.isArray(arr)) arr = [];
    const cur = currentMonthStr();
    arr = arr.filter(p => p.month !== cur);
    if (salesPlan) arr.push(salesPlan);
    localStorage.setItem(SALES_PLAN_KEY, JSON.stringify(arr));
  } catch (e) {}
}

function planBasis(strategy, growth) {
  const hist = salesAsc();
  if (hist.length === 0) return { ds: 0, q: 0 };
  const [cy, cm] = currentMonthStr().split('-').map(Number);
  const yoyKey = (cy - 1) + '-' + ('0' + cm).slice(-2);
  const avg = (a, k) => a.reduce((s, r) => s + (r[k] || 0), 0) / (a.length || 1);
  if (strategy === 'yoy') {
    const y = hist.find(r => r.date === yoyKey) || hist[hist.length - 1];
    return { ds: y.dailySales || 0, q: y.dailyOrders || 0 };
  }
  if (strategy === 'm3')  { const a = hist.slice(-3); return { ds: avg(a,'dailySales'), q: avg(a,'dailyOrders') }; }
  if (strategy === 'm6')  { const a = hist.slice(-6); return { ds: avg(a,'dailySales'), q: avg(a,'dailyOrders') }; }
  if (strategy === 'm12') { const a = hist;           return { ds: avg(a,'dailySales'), q: avg(a,'dailyOrders') }; }
  if (strategy === 'grow'){ const a = hist.slice(-3); return { ds: avg(a,'dailySales')*(1+growth), q: avg(a,'dailyOrders')*(1+growth) }; }
  return { ds: 0, q: 0 };
}

const SP_STRATS = [
  { id:'yoy',  t:'去年同月', d:'取去年同期实际值' },
  { id:'m3',   t:'近 3 月均值', d:'最近一季度平均' },
  { id:'m6',   t:'近 6 月均值', d:'半年度平均' },
  { id:'m12',  t:'近 12 月均值', d:'全年平均' },
  { id:'grow', t:'自定义增长', d:'近 3 月 ×(1+增长)' },
];

function renderSalesPlanModule(content, mod) {
  loadSales();
  loadSalesPlan();
  const cur = currentMonthStr();
  const days = daysInMonth(cur) || 30;
  planLoaded = !!salesPlan;
  const basis = salesPlan ? { ds: salesPlan.ds, q: salesPlan.q } : planBasis(planStrategy, planGrowth);
  content.innerHTML = `
    <div class="page-header">
      <div class="page-title">${mod.name}</div>
      <div class="page-desc">${mod.desc}</div>
    </div>
    <div class="wt-note">
      数据来源：<b>销售数据管理</b>模块中已录入的月度历史。按所选策略推算 <b>${cur}（${days}天）</b> 的计划销售数据，四项指标自动保持内部一致。
    </div>
    <div id="spBody"></div>
  `;
  paintPlanBody(basis, cur, days);
}

function paintPlanBody(basis, cur, days) {
  const el = document.getElementById('spBody');
  if (!el) return;
  const hist = salesAsc();
  if (hist.length === 0) { el.innerHTML = `<div class="wt-empty">还没有销售历史，请先在「销售数据管理」模块录入月份数据</div>`; return; }

  const [cy, cm] = cur.split('-').map(Number);
  const yoyKey = (cy - 1) + '-' + ('0' + cm).slice(-2);
  const recentKeys = hist.slice(-3).map(r => r.date);
  const rows = hist.slice(-12).map(r => {
    const tag = r.date === yoyKey ? '<span class="sp-badge sp-yoy">同</span>'
              : recentKeys.includes(r.date) ? '<span class="sp-badge sp-re">近</span>' : '';
    const tick = (r.dailySales && r.dailyOrders) ? r.dailySales / r.dailyOrders : 0;
    const ret = (r.dailySales || 0) * (daysInMonth(r.date) || days);
    return `<tr><td>${escapeHtml(r.date)}${tag}</td><td>${saMoney(r.dailySales)}</td><td>${(r.dailyOrders||0)} 单</td><td>${tick? tick.toFixed(2):'—'}</td><td>${saMoney(ret)}</td></tr>`;
  }).join('');

  const stratHtml = SP_STRATS.map(s => `
    <div class="sp-opt ${s.id===planStrategy?'active':''}" data-s="${s.id}">
      <div class="sp-opt-t">${s.t}</div><div class="sp-opt-d">${s.d}</div>
    </div>`).join('');

  el.innerHTML = `
    <div class="sp-card">
      <div class="sp-card-t">② 计划生成策略</div>
      <div class="sp-strat">${stratHtml}</div>
      <div class="sp-growth ${planStrategy==='grow'?'show':''}" id="spGrowth">
        <span>增长率</span>
        <input type="range" id="spGrow" min="-20" max="50" value="${Math.round(planGrowth*100)}" step="1" />
        <b id="spGrowVal">${planGrowth>=0?'+':''}${Math.round(planGrowth*100)}%</b>
      </div>
    </div>
    <div class="sp-card">
      <div class="sp-card-t">③ ${cur} 计划销售数据<span class="sp-tag" id="spBasis"></span></div>
      <div class="wt-stats" id="spStats"></div>
      <div class="sp-note" id="spCons"></div>
    </div>
    <div class="sp-card">
      <div class="sp-card-t">④ 计划 vs 实际</div>
      <div id="spCompare"></div>
    </div>
    <div style="margin-top:4px;">
      <button class="btn-add" id="spSave">保存本月计划</button>
    </div>
    <div class="sp-card" style="margin-top:16px;">
      <div class="sp-card-t">① 历史数据来源<span class="sp-tag">来自销售数据管理</span></div>
      <table class="wt-cat"><thead><tr><th>月份</th><th>日均销售额</th><th>日均客单量</th><th>日均客单价</th><th>零售总额</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="sp-note">高亮：<span class="sp-badge sp-yoy">同</span> 去年同月；<span class="sp-badge sp-re">近</span> 近 3 月</div>
    </div>
  `;

  el.querySelectorAll('.sp-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      planStrategy = opt.dataset.s;
      planLoaded = false;
      el.querySelectorAll('.sp-opt').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      document.getElementById('spGrowth').classList.toggle('show', planStrategy === 'grow');
      paintStats(planBasis(planStrategy, planGrowth), cur, days);
    });
  });
  const growEl = document.getElementById('spGrow');
  if (growEl) growEl.addEventListener('input', () => {
    planGrowth = (+growEl.value) / 100;
    document.getElementById('spGrowVal').textContent = (planGrowth>=0?'+':'') + Math.round(planGrowth*100) + '%';
    paintStats(planBasis('grow', planGrowth), cur, days);
  });
  document.getElementById('spSave').addEventListener('click', () => {
    const b = planCurrentBasis;
    salesPlan = {
      month: cur, ds: Math.round(b.ds), q: Math.round(b.q),
      note: '', createdAt: salesPlan ? salesPlan.createdAt : Date.now(), updatedAt: Date.now()
    };
    saveSalesPlanStore();
    showToast('已保存 ' + cur + ' 计划：零售 ' + saMoney(b.ds * days));
  });

  paintStats(basis, cur, days);
}

function paintStats(basis, cur, days) {
  planCurrentBasis = basis;
  const statsEl = document.getElementById('spStats');
  if (!statsEl) return;
  const ticket = (basis.ds && basis.q) ? basis.ds / basis.q : 0;
  const retail = basis.ds * days;
  const basisLabel = planLoaded ? '已保存计划' : { yoy:'去年同月', m3:'近3月均值', m6:'近6月均值', m12:'近12月均值', grow:'近3月×(1+增长)' }[planStrategy];
  const be = document.getElementById('spBasis'); if (be) be.textContent = '基准：' + basisLabel;
  statsEl.innerHTML = `
    ${statCard('计划零售总额', saMoney(retail), '')}
    ${statCard('计划日均销售额 (元/天)', `<input id="spDs" type="number" class="sp-input" value="${Math.round(basis.ds)}">`, '')}
    ${statCard('计划日均客单量 (单/天)', `<input id="spQ" type="number" class="sp-input" value="${Math.round(basis.q)}">`, '')}
    ${statCard('计划日均客单价 (元)', ticket.toFixed(2), '')}
  `;
  const dsEl = document.getElementById('spDs');
  const qEl = document.getElementById('spQ');
  if (dsEl) dsEl.addEventListener('input', () => { planCurrentBasis.ds = +dsEl.value || 0; paintDerived(cur, days); });
  if (qEl) qEl.addEventListener('input', () => { planCurrentBasis.q = +qEl.value || 0; paintDerived(cur, days); });
  paintDerived(cur, days);
}

function paintDerived(cur, days) {
  const b = planCurrentBasis;
  const ticket = (b.ds && b.q) ? b.ds / b.q : 0;
  const retail = b.ds * days;
  const statsEl = document.getElementById('spStats');
  if (!statsEl) return;
  const cards = statsEl.children;
  if (cards[0] && cards[0].querySelector('.stat-value')) cards[0].querySelector('.stat-value').textContent = saMoney(retail);
  if (cards[3] && cards[3].querySelector('.stat-value')) cards[3].querySelector('.stat-value').textContent = ticket.toFixed(2);
  const cons = document.getElementById('spCons');
  if (cons) cons.innerHTML = (b.ds>0 && b.q>0)
    ? `四项指标<b class="sp-ok">自洽</b>：零售 = ${saMoney(b.ds)} × ${days}天 = ${saMoney(retail)}；客单价 = ${saMoney(b.ds)} ÷ ${Math.round(b.q)} = ${ticket.toFixed(2)} 元。`
    : '请填写日均销售额与客单量。';
  paintCompare(retail, cur);
}

function paintCompare(planRetail, cur) {
  const el = document.getElementById('spCompare');
  if (!el) return;
  const actual = salesLogs.find(l => l.date === cur);
  if (actual) {
    const aRet = (actual.dailySales||0) * (daysInMonth(cur)||30);
    const rate = planRetail ? Math.min(100, aRet / planRetail * 100) : 0;
    const aTick = (actual.dailySales && actual.dailyOrders) ? actual.dailySales/actual.dailyOrders : 0;
    const dsOk = (actual.dailySales||0) >= (planCurrentBasis.ds||0);
    el.innerHTML = `
      <div class="sp-compare-row"><span>零售总额达成率</span><span>${rate.toFixed(1)}%</span></div>
      <div class="sp-bar"><i style="width:${rate}%"></i></div>
      <div class="sp-compare-row" style="margin-top:12px;"><span>实际日均销售额</span><span>${saMoney(actual.dailySales)} <span class="sp-pill ${dsOk?'g':'r'}">${dsOk?'达标':'未达'}</span></span></div>
      <div class="sp-compare-row"><span>实际日均客单量</span><span>${actual.dailyOrders||0} 单</span></div>
      <div class="sp-compare-row"><span>实际日均客单价</span><span>${aTick? aTick.toFixed(2):'—'} 元</span></div>`;
  } else {
    el.innerHTML = `<div class="wt-note" style="margin:0;">本月「销售数据管理」中尚无实际录入，保存计划后可在此对比达成情况。</div>`;
  }
}

// ---------- 事件绑定 ----------
function bindTodoEvents() {
  // 添加待办(点击「添加待办」按钮弹出表单)
  const input = document.getElementById('todoInput');
  const addBtn = document.getElementById('todoAddBtn');
  const saveBtn = document.getElementById('todoSaveBtn');
  const cancelBtn = document.getElementById('todoCancelBtn');
  const prioritySelect = document.getElementById('prioritySelect');
  const modal = document.getElementById('todoModal');

  function openTodoModal() {
    modal.classList.add('open');
    input.value = '';
    prioritySelect.value = 'inq';
    setTimeout(() => input.focus(), 50);
  }
  function closeTodoModal() {
    modal.classList.remove('open');
  }

  function addTodo() {
    const title = input.value.trim();
    if (!title) {
      showToast('请输入待办内容');
      input.focus();
      return;
    }
    const maxOrder = todos.reduce((m, t) => Math.max(m, typeof t.order === 'number' ? t.order : 0), -1);
    todos.unshift({
      id: uid(),
      title,
      done: false,
      priority: prioritySelect.value,
      order: maxOrder + 1,
      createdAt: Date.now()
    });
    saveTodos();
    closeTodoModal();
    renderStats();
    renderTodoList();
  }

  addBtn.addEventListener('click', openTodoModal);
  saveBtn.addEventListener('click', addTodo);
  cancelBtn.addEventListener('click', closeTodoModal);
  modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeTodoModal(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
    if (e.key === 'Escape') closeTodoModal();
  });
  if (!_todoEscapeBound) {
    _todoEscapeBound = true;
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const m = document.getElementById('todoModal');
        if (m && m.classList.contains('open')) m.classList.remove('open');
      }
    });
  }

  // 筛选(仅带 data-filter 的按钮)
  document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.toggle('active', b === btn));
      renderTodoList();
    });
  });

  // 排序模式切换:按优先级 / 自定义顺序(可拖拽)
  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => setMemoSortMode(btn.dataset.sort));
  });

  // 搜索
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', () => {
    search = searchInput.value;
    renderTodoList();
  });

  // 清除已完成
  document.getElementById('clearDoneBtn').addEventListener('click', () => {
    const doneCount = todos.filter(t => t.done).length;
    if (doneCount === 0) {
      showToast('没有已完成的待办');
      return;
    }
    todos = todos.filter(t => !t.done);
    saveTodos();
    renderStats();
    renderTodoList();
    showToast(`已清除 ${doneCount} 条已完成待办`);
  });

  // 拖拽排序(仅自定义顺序模式)
  const listEl = document.getElementById('todoList');
  let dragId = null;
  listEl.addEventListener('dragstart', e => {
    const item = e.target.closest('.todo-item');
    if (!item || !item.hasAttribute('draggable')) return;
    dragId = item.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragId);
    setTimeout(() => item.classList.add('dragging'), 0);
  });
  listEl.addEventListener('dragend', e => {
    const item = e.target.closest('.todo-item');
    if (item) item.classList.remove('dragging');
    listEl.querySelectorAll('.todo-item').forEach(el => el.classList.remove('drag-over'));
    dragId = null;
  });
  listEl.addEventListener('dragover', e => {
    e.preventDefault();
    const item = e.target.closest('.todo-item');
    if (!item || !dragId || item.dataset.id === dragId) return;
    item.classList.add('drag-over');
  });
  listEl.addEventListener('dragleave', e => {
    const item = e.target.closest('.todo-item');
    if (item) item.classList.remove('drag-over');
  });
  listEl.addEventListener('drop', e => {
    e.preventDefault();
    const item = e.target.closest('.todo-item');
    if (!item || !dragId) return;
    const targetId = item.dataset.id;
    item.classList.remove('drag-over');
    if (targetId && targetId !== dragId) reorderTodos(dragId, targetId);
    dragId = null;
  });

  // 列表事件委托
  document.getElementById('todoList').addEventListener('click', e => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    const id = target.dataset.id;
    const todo = todos.find(t => t.id === id);
    if (!todo) return;

    if (action === 'toggle') {
      todo.done = !todo.done;
      saveTodos();
      renderStats();
      renderTodoList();
    } else if (action === 'edit') {
      editingId = id;
      renderTodoList();
      const editInput = document.getElementById(`editInput-${id}`);
      if (editInput) {
        editInput.focus();
        editInput.setSelectionRange(editInput.value.length, editInput.value.length);
      }
    } else if (action === 'delete') {
      todos = todos.filter(t => t.id !== id);
      saveTodos();
      renderStats();
      renderTodoList();
      showToast('已删除');
    } else if (action === 'save-edit') {
      const editInput = document.getElementById(`editInput-${id}`);
      const prioSel = document.getElementById(`editPriority-${id}`);
      const newTitle = editInput.value.trim();
      if (newTitle) {
        todo.title = newTitle;
        if (prioSel) todo.priority = prioSel.value;
        saveTodos();
      }
      editingId = null;
      renderTodoList();
    } else if (action === 'cancel-edit') {
      editingId = null;
      renderTodoList();
    }
  });

  // 编辑框回车保存、ESC 取消
  document.getElementById('todoList').addEventListener('keydown', e => {
    if (e.target.classList.contains('todo-edit-input')) {
      const id = e.target.id.replace('editInput-', '');
      if (e.key === 'Enter') {
        const todo = todos.find(t => t.id === id);
        const newTitle = e.target.value.trim();
        const prioSel = document.getElementById(`editPriority-${id}`);
        if (newTitle && todo) {
          todo.title = newTitle;
          if (prioSel) todo.priority = prioSel.value;
          saveTodos();
        }
        editingId = null;
        renderTodoList();
      } else if (e.key === 'Escape') {
        editingId = null;
        renderTodoList();
      }
    }
  });
}

// ===================== 云端同步（GitHub Gist） =====================
let SKIP_SYNC = false;
let syncTimer = null;
const SYNC_PREFIX = 'liumo_sync_';
const SYNC_TOKEN_KEY = SYNC_PREFIX + 'token';
const SYNC_GIST_KEY = SYNC_PREFIX + 'gist';
const SYNC_AUTO_KEY = SYNC_PREFIX + 'auto';
const SYNC_FILE = 'liumo-workbench-data.json';
const SYNC_LASTPUSH_CONTENT = SYNC_PREFIX + 'lastpush';

// 规范化序列化（排序键），用于比较本地/云端/基线内容是否一致
function canon(obj){
  if(!obj || typeof obj !== 'object') return JSON.stringify(obj);
  const o = {};
  for(const k of Object.keys(obj).sort()) o[k] = obj[k];
  return JSON.stringify(o);
}

// 解析云端快照：兼容新格式 {updatedAt,data} 与旧格式（裸平铺 JSON）
function safeParseSnapshot(content){
  try {
    const o = JSON.parse(content);
    if(o && typeof o === 'object' && o.data && typeof o.data === 'object') return o;
    return { updatedAt: null, data: (o && typeof o === 'object') ? o : {} };
  } catch(e){ return null; }
}

// 把云端快照写入本地（保留同步配置键），可选回写 lastpush 时间戳
async function applyCloudSnapshot(snap, opts){
  opts = opts || {};
  const data = snap && snap.data ? snap.data : {};
  SKIP_SYNC = true;
  try {
    clearLocalUserData();
    for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
    reloadAllData();
    renderContent();
    if(opts.setLastPush && snap) localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(snap.data || {}));
  } finally {
    SKIP_SYNC = false; // 任何异常都必须释放，否则自动同步会永久失效
  }
}

// 拦截 setItem, 实现改动后防抖自动同步
(function(){
  const _set = Storage.prototype.setItem;
  Storage.prototype.setItem = function(k, v){
    _set.call(this, k, v);
    if(!SKIP_SYNC && typeof k === 'string' && !k.startsWith(SYNC_PREFIX)) scheduleSync();
  };
})();

function scheduleSync(){
  if(localStorage.getItem(SYNC_AUTO_KEY) !== '1') return;
  if(!localStorage.getItem(SYNC_TOKEN_KEY) || !localStorage.getItem(SYNC_GIST_KEY)) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncPushNow(true); }, 2000);
}

function gatherLocal(){
  const o = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && !k.startsWith(SYNC_PREFIX)) o[k] = localStorage.getItem(k);
  }
  return o;
}

// 同步超限降级：去掉活动图片（仅保留标题/类别/详情等文字），让其余数据仍可备份
function stripActivityImages(data){
  const out = {};
  for(const k in data){
    if(k === 'liumo_activities_fresh'){
      try {
        const arr = JSON.parse(data[k] || '[]');
        out[k] = JSON.stringify(arr.map(a => { const c = Object.assign({}, a); delete c.images; return c; }));
      } catch(e){ out[k] = data[k]; }
    } else {
      out[k] = data[k];
    }
  }
  return out;
}

function timeStr(){
  const d = new Date();
  return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
}
function setSyncStatus(t){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = t;
}

async function syncPushNow(silent, opts){
  opts = opts || {};
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  if(!tok){ if(!silent) showToast('请先在云端同步面板填入 GitHub Token'); return; }
  // 首次同步且无 GID 时，复用账号下最新的备份 Gist（避免不断新建孤儿 Gist）
  if(!gid){ const fg = await findSyncGist(tok); if(fg){ gid = fg; localStorage.setItem(SYNC_GIST_KEY, fg); } }
  const now = new Date().toISOString();
  const localData = gatherLocal();
  let content = JSON.stringify({ updatedAt: now, data: localData });
  // 守卫 + 降级：GitHub Gist 单文件上限约 1MB。活动图片为 base64 易超限，
  // 超限时先尝试「仅同步文字、跳过活动图片」让其余数据仍可备份，仍超限才中止。
  if (content.length > 950000) {
    const reduced = stripActivityImages(localData);
    const reducedContent = JSON.stringify({ updatedAt: now, data: reduced });
    if (reducedContent.length <= 950000) {
      setSyncStatus('已同步(跳过图片)');
      if (!silent) showToast('活动图片过大已跳过，已同步其余数据（标题/类别/详情）');
      content = reducedContent;
    } else {
      setSyncStatus('数据过大');
      if (!silent) showToast('同步失败：本地数据过大，已超过 GitHub Gist 单文件上限，建议精简数据后再同步');
      return;
    }
  }

  // 冲突感知（三路）：云端自我们上次同步后若被改过，则拉取云端而不是覆盖它
  if(gid && !opts.force){
    const base = localStorage.getItem(SYNC_LASTPUSH_CONTENT);
    if(base !== null && base !== undefined){
      try {
        const cres = await fetch('https://api.github.com/gists/' + gid, {
          headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
        });
        if(cres.ok){
          const cj = await cres.json();
          const cf = cj.files && cj.files[SYNC_FILE];
          if(cf){
            const cs = safeParseSnapshot(cf.content);
            const remoteData = cs ? (cs.data || {}) : {};
            if(canon(remoteData) !== base){
              await applyCloudSnapshot(cs, { setLastPush:true });
              setSyncStatus('已合并云端更新 ' + timeStr());
              if(!silent) showToast('云端有更新，已合并（未覆盖）');
              return;
            }
          }
        }
      } catch(e){ /* 忽略，继续推送 */ }
    }
  }
  const payload = JSON.stringify({ public:false, files: { [SYNC_FILE]: { content: content } } });
  async function doPush(g){
    let url = 'https://api.github.com/gists', method = 'POST';
    if(g){ url = 'https://api.github.com/gists/' + g; method = 'PATCH'; }
    return fetch(url, { method: method, headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body: payload });
  }
  try {
    let res = await doPush(gid);
    if(res.status === 401){ showToast('同步失败: Token 无效/无权限（401），请确认填入的是带 gist 权限的 Token'); return; }
    if(res.status === 404 && gid){            // Gist 已不存在（被删除等），清空 GID 重建
      localStorage.removeItem(SYNC_GIST_KEY);
      gid = null;
      res = await doPush(null);
      if(res.status === 401){ showToast('同步失败: Token 无效/无权限（401），请确认填入的是带 gist 权限的 Token'); return; }
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if(!gid && j.id){
      SKIP_SYNC = true;
      localStorage.setItem(SYNC_GIST_KEY, j.id);
      SKIP_SYNC = false;
    }
    localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(localData));
    setSyncStatus('已同步 ' + timeStr());
    if(!silent) showToast('已同步到云端');
  } catch(e){
    setSyncStatus('同步失败');
    if(!silent) showToast('同步失败: ' + e.message);
  }
}

async function restoreFromCloud(){
  clearTimeout(syncTimer); // 取消可能待推送的本地改动，避免把云端覆盖掉
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  if(!tok){ showToast('请先配置云端同步（填入 Token）'); return; }
  if(!gid){ gid = await findSyncGist(tok); if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); } }
  if(!gid){ showToast('未找到云端备份 Gist，请先「立即同步」'); return; }
  if(!confirm('从云端恢复将覆盖本地当前数据，确定继续？')) return;
  try {
    let res = await fetch('https://api.github.com/gists/' + gid, {
      headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
    });
    if(res.status === 404){            // GID 失效，重新查找最新备份
      localStorage.removeItem(SYNC_GIST_KEY);
      gid = await findSyncGist(tok);
      if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); res = await fetch('https://api.github.com/gists/'+gid, { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } }); }
      else { showToast('未找到云端备份 Gist，请先「立即同步」'); return; }
    }
    if(res.status === 401){ showToast('恢复失败: Token 无效/无权限，请确认填入的是带 gist 权限的 Token'); return; }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const f = j.files && j.files[SYNC_FILE];
    if(!f){ showToast('云端暂无数据'); return; }
    const snap = safeParseSnapshot(f.content);
    if(!snap){ showToast('云端数据格式异常'); return; }
    await applyCloudSnapshot(snap, { setLastPush:true });
    showToast('已从云端恢复数据');
    setSyncStatus('已配置');
  } catch(e){ showToast('恢复失败: ' + e.message); }
}

async function findSyncGist(tok){
  try {
    const u = await fetch('https://api.github.com/user', { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } });
    if(!u.ok) return null;
    const me = await u.json();
    const r = await fetch('https://api.github.com/users/'+me.login+'/gists?per_page=100', { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } });
    if(!r.ok) return null;
    const list = await r.json();
    // 选 updated_at 最新的那份备份（列表不含文件内容，故以 Gist 更新时间为准）
    let best = null, bestScore = -1;
    for(const g of list){
      if(!(g.files && g.files[SYNC_FILE])) continue;
      const score = Date.parse(g.updated_at || g.created_at || 0);
      if(score > bestScore){ bestScore = score; best = g.id; }
    }
    return best;
  } catch(e){ return null; }
}

function clearLocalUserData(){
  const keep = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SYNC_PREFIX) === 0) keep[k] = localStorage.getItem(k);
  }
  localStorage.clear();
  for(const k in keep) localStorage.setItem(k, keep[k]);
}

async function tryCloudRestoreFirst(){
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  if(!tok) return false;
  if(!gid){ gid = await findSyncGist(tok); if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); } }
  if(!gid) return false;
  try {
    const res = await fetch('https://api.github.com/gists/' + gid, {
      headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
    });
    if(!res.ok) return false;
    const j = await res.json();
    const f = j.files && j.files[SYNC_FILE];
    if(!f) return false;
    const snap = safeParseSnapshot(f.content);
    if(!snap) return false;
    const data = snap.data || {};
    if(Object.keys(data).length === 0) return false;
    let hasLocal = false;
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && !k.startsWith(SYNC_PREFIX) && k!=='liumo_workbench_initialized'){ hasLocal=true; break; } }
    if(hasLocal) return false;
    SKIP_SYNC = true;
    try {
      for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
      reloadAllData();
      if(snap.updatedAt) localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(snap.data || {}));
    } finally {
      SKIP_SYNC = false; // 异常也必须释放，避免自动同步永久失效
    }
    return Object.keys(data).length > 0;
  } catch(e){ return false; }
}

function reloadAllData(){
  loadTodos(); loadQuotes(); loadStudyRecords(); loadStudyConfig(); loadStudyPoints(); loadWorkTasks(); loadWorkDone(); loadWeight(); loadSalary(); loadCost(); loadCostItems(); loadScrap(); loadRope(); loadSales();
}

function exportBackup(){
  const data = gatherLocal();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const ds = d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
  a.href = url; a.download = 'liumo-backup-'+ds+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  showToast('已导出备份文件');
}

function importBackupFromFile(file){
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const data = JSON.parse(reader.result);
      SKIP_SYNC = true;
      try {
        for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
        reloadAllData();
        renderContent();
      } finally {
        SKIP_SYNC = false; // 导入异常也必须释放，避免自动同步永久失效
      }
      showToast('已从备份文件恢复数据');
      if(localStorage.getItem(SYNC_AUTO_KEY) === '1') syncPushNow(true);
    } catch(e){ showToast('导入失败: 文件格式错误'); }
  };
  reader.readAsText(file);
}

function bindSyncUI(){
  const btn = document.getElementById('syncBtn');
  if(!btn) return;
  const panel = document.getElementById('syncPanel');
  btn.onclick = function(){ panel.hidden = !panel.hidden; };
  const tokEl = document.getElementById('syncToken');
  const autoEl = document.getElementById('syncAuto');
  tokEl.value = localStorage.getItem(SYNC_TOKEN_KEY) || '';
  autoEl.checked = localStorage.getItem(SYNC_AUTO_KEY) === '1';
  tokEl.oninput = function(){ localStorage.setItem(SYNC_TOKEN_KEY, tokEl.value.trim()); };
  autoEl.onchange = function(){
    localStorage.setItem(SYNC_AUTO_KEY, autoEl.checked ? '1' : '0');
    if(autoEl.checked) syncPushNow(true);
  };
  document.getElementById('syncNow').onclick = function(){ syncPushNow(false, { force: true }); };
  document.getElementById('syncRestore').onclick = function(){ restoreFromCloud(); };
  document.getElementById('syncDisconnect').onclick = function(){
    localStorage.removeItem(SYNC_TOKEN_KEY);
    localStorage.removeItem(SYNC_GIST_KEY);
    localStorage.removeItem(SYNC_AUTO_KEY);
    setSyncStatus('未配置'); tokEl.value=''; autoEl.checked=false;
    showToast('已断开云端同步');
  };
  document.getElementById('syncExport').onclick = exportBackup;
  document.getElementById('syncImport').onclick = function(){ document.getElementById('syncImportFile').click(); };
  document.getElementById('syncImportFile').onchange = function(e){

}

function initCloudSync(){
  bindSyncUI();
  if(localStorage.getItem(SYNC_GIST_KEY) && localStorage.getItem(SYNC_TOKEN_KEY)) setSyncStatus('已配置');
  else setSyncStatus('未配置');
}

// ============================================================
// 工作清单模块
// ============================================================

// 获取今天日期字符串 YYYY-MM-DD
function wlTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 判断任务在今天是否应该出现
function wlIsTaskDueToday(task, dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDate();
  const wd = d.getDay(); // 0=周日
  const month = d.getMonth() + 1;
  const r = task.repeat || { type: 'daily' };
  switch (r.type) {
    case 'daily': return true;
    case 'once': return r.date === dateStr;
    case 'weekly': return (r.weekdays || []).includes(wd);
    case 'monthly': return (r.days || []).includes(day);
    case 'quarterly': return month % 3 === 1 && day <= 3; // 每季度首月前3天
    case 'yearly': return r.date && r.date.slice(5) === dateStr.slice(5);
    default: return true;
  }
}

// 获取今天的任务列表(含完成状态)
function wlGetTodayTasks() {
  const today = wlTodayStr();
  return workTasks
    .filter(t => wlIsTaskDueToday(t, today))
    .map(t => {
      const doneKey = `${today}:${t.id}`;
      return { ...t, done: !!workDone[doneKey], doneKey };
    })
    .sort((a, b) => {
      // 未完成排前面，再按象限优先级(重要紧急最前)
      if (a.done !== b.done) return a.done ? 1 : -1;
      const qa = (a.important?2:0) + (a.urgent?1:0);
      const qb = (b.important?2:0) + (b.urgent?1:0);
      return qb - qa;
    });
}

// 获取象限分类
function wlGetQuadrant(task) {
  if (task.important && task.urgent) return 'iq';      // 重要紧急
  if (task.important && !task.urgent) return 'inq';    // 重要不紧急
  if (!task.important && task.urgent) return 'uq';     // 紧急不重要
  return 'nuq';                                         // 不重要不紧急
}

// 渲染工作清单模块
function renderWorkListModule(content, mod) {
  const today = wlTodayStr();
  const weekday = WEEKDAY_NAMES[new Date().getDay()];
  const allToday = (workView === 'today')
    ? wlGetTodayTasks()
    : workTasks.map(t => {
        const dk = today + ':' + t.id;
        return Object.assign({}, t, { done: !!workDone[dk], doneKey: dk });
      });

  const doneCount = allToday.filter(t => t.done).length;
  const total = allToday.length;
  const rate = total === 0 ? 0 : Math.round(doneCount / total * 100);

  // 象限分组
  const quadTasks = { iq:[], inq:[], uq:[], nuq:[] };
  allToday.forEach(t => { quadTasks[wlGetQuadrant(t)].push(t); });

  content.innerHTML = `
    <div class="page-header">
      <div class="page-title">${mod.name}</div>
      <div class="page-desc">${mod.desc} · ${today} ${weekday}</div>
    </div>

    <!-- 进度概览 -->
    <div class="wl-progress-card">
      <div class="wl-progress-main">
        <div class="wl-progress-rate">${rate}%</div>
        <div class="wl-progress-text">${workView==='today'?'今日':'全部'}完成 ${doneCount}/${total} 项</div>
      </div>
      <div class="wl-progress-bar">
        <div class="wl-progress-fill" style="width:${rate}%;background:linear-gradient(90deg,#3b82f6,#6366f1);"></div>
      </div>
      <div class="wl-quad-stats">
        ${['iq','inq','uq','nuq'].map(q => `
          <div class="wl-quad-stat" data-wl-quad="${q}" style="border-left:3px solid ${QUADRANT_INFO[q].color};">
            <div class="wl-quad-name">${QUADRANT_INFO[q].name}</div>
            <div class="wl-quad-num">${quadTasks[q].filter(t=>t.done).length}/${quadTasks[q].length}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- 工具栏 -->
    <div class="wl-toolbar">
      <div class="wl-view-seg">
        <button class="wl-view-btn ${workView==='today'?'active':''}" data-wl-view="today">当日任务</button>
        <button class="wl-view-btn ${workView==='all'?'active':''}" data-wl-view="all">全部任务</button>
      </div>
      <button class="wl-add-btn" data-wl-action="toggle-add">+ 添加任务</button>
    </div>

    <!-- 添加/编辑表单 -->
    ${workShowAddForm ? wlRenderForm() : ''}

    <!-- 四象限任务清单 -->
    <div class="wl-quad-grid">
      ${['iq','inq','uq','nuq'].map(q => `
        <div class="wl-quad-cell" style="border-top:3px solid ${QUADRANT_INFO[q].color};">
          <div class="wl-quad-head">
            <div class="wl-quad-title" style="color:${QUADRANT_INFO[q].color};">${QUADRANT_INFO[q].name}</div>
            <div class="wl-quad-sub">${QUADRANT_INFO[q].desc} · ${quadTasks[q].length} 项</div>
          </div>
          <div class="wl-quad-list">
            ${quadTasks[q].length === 0 ? `<div class="wl-quad-empty">暂无任务</div>` : quadTasks[q].map(t => wlRenderTask(t)).join('')}
          </div>
        </div>
      `).join('')}
    </div>

    <!-- 提醒区 -->
    ${doneCount < total ? `
      <div class="wl-reminder">
        ⏰ 今日还有 <strong>${total - doneCount}</strong> 项任务待完成
        <button class="wl-remind-btn" data-wl-action="notify">发送提醒通知</button>
      </div>
    ` : ''}
  `;
}

// 渲染单个任务
function wlRenderTask(t) {
  const q = wlGetQuadrant(t);
  const qInfo = QUADRANT_INFO[q];
  return `
    <div class="wl-task ${t.done ? 'done' : ''}" data-wl-id="${t.id}">
      <div class="wl-check ${t.done ? 'checked' : ''}" data-wl-action="toggle-done" data-wl-id="${t.id}">
        ${t.done ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
      </div>
      <div class="wl-task-body">
        <div class="wl-task-title ${t.done ? 'done' : ''}">${escapeHtml(t.title)}</div>
        <div class="wl-task-meta">
          <span class="wl-repeat-tag">${wlRepeatText(t.repeat)}</span>
          <span class="wl-quad-tag" style="background:${qInfo.color}1a;color:${qInfo.color};">${qInfo.name}</span>
          ${t.note ? `<span class="wl-note-tag">📝 ${escapeHtml(t.note)}</span>` : ''}
        </div>
      </div>
      <div class="wl-task-actions">
        <button class="wl-task-btn" data-wl-action="edit" data-wl-id="${t.id}" title="编辑">✏️</button>
        <button class="wl-task-btn" data-wl-action="delete" data-wl-id="${t.id}" title="删除">🗑️</button>
      </div>
    </div>
  `;
}

// 渲染添加/编辑表单
function wlRenderForm() {
  const editing = workEditingTaskId ? workTasks.find(t => t.id === workEditingTaskId) : null;
  const r = editing ? (editing.repeat || {type:'daily'}) : {type:'daily'};
  const isEdit = !!editing;
  return `
    <div class="wl-form">
      <div class="wl-form-title">${isEdit ? '编辑任务' : '添加任务'}</div>
      <input type="text" class="wl-input" id="wlTaskTitle" placeholder="任务内容" value="${isEdit ? escapeAttr(editing.title) : ''}" />
      <div class="wl-form-row">
        <label class="wl-check-label">
          <input type="checkbox" id="wlImportant" ${editing && editing.important ? 'checked' : ''} /> 重要
        </label>
        <label class="wl-check-label">
          <input type="checkbox" id="wlUrgent" ${editing && editing.urgent ? 'checked' : ''} /> 紧急
        </label>
      </div>
      <div class="wl-form-row">
        <select class="wl-select" id="wlRepeatType">
          <option value="daily" ${r.type==='daily'?'selected':''}>每天</option>
          <option value="weekly" ${r.type==='weekly'?'selected':''}>每周固定星期</option>
          <option value="monthly" ${r.type==='monthly'?'selected':''}>每月固定日期</option>
          <option value="quarterly" ${r.type==='quarterly'?'selected':''}>每季度</option>
          <option value="yearly" ${r.type==='yearly'?'selected':''}>每年</option>
          <option value="once" ${r.type==='once'?'selected':''}>一次性</option>
        </select>
      </div>
      <div class="wl-form-row" id="wlRepeatDetail"></div>
      <input type="text" class="wl-input" id="wlNote" placeholder="备注(可选)" value="${isEdit ? escapeAttr(editing.note||'') : ''}" />
      <div class="wl-form-actions">
        <button class="wl-btn-cancel" data-wl-action="cancel-form">取消</button>
        <button class="wl-btn-save" data-wl-action="save-task">${isEdit ? '保存' : '添加'}</button>
      </div>
    </div>
  `;
}

// 循环规则文字
function wlRepeatText(r) {
  r = r || { type: 'daily' };
  switch (r.type) {
    case 'daily': return '每日';
    case 'weekly': return '每周 ' + (r.weekdays||[]).map(w => WEEKDAY_NAMES[w]).join('、');
    case 'monthly': return '每月 ' + (r.days||[]).join('、') + ' 号';
    case 'quarterly': return '每季度';
    case 'yearly': return '每年 ' + (r.date||'').slice(5);
    case 'once': return '一次性 ' + (r.date||'');
    default: return '每日';
  }
}

// 渲染循环规则详情输入
function wlRenderRepeatDetail() {
  const sel = document.getElementById('wlRepeatType');
  if (!sel) return;
  const type = sel.value;
  const detailEl = document.getElementById('wlRepeatDetail');
  if (!detailEl) return;

  if (type === 'weekly') {
    detailEl.innerHTML = '<div class="wl-weekdays">' + WEEKDAY_NAMES.map((n,i) =>
      `<label class="wl-wd"><input type="checkbox" value="${i}" ${i>=1&&i<=5?'checked':''}/> ${n.slice(1)}</label>`
    ).join('') + '</div>';
  } else if (type === 'monthly') {
    detailEl.innerHTML = '<input type="text" class="wl-input" id="wlDays" placeholder="输入日期,多个用逗号分隔 如 1,15,30" />';
  } else if (type === 'once' || type === 'yearly') {
    detailEl.innerHTML = '<input type="date" class="wl-input" id="wlDate" />';
  } else {
    detailEl.innerHTML = '';
  }
}

// 保存任务
function wlSaveTask() {
  const title = document.getElementById('wlTaskTitle').value.trim();
  if (!title) { showToast('请输入任务内容'); return; }

  const important = document.getElementById('wlImportant').checked;
  const urgent = document.getElementById('wlUrgent').checked;
  const note = document.getElementById('wlNote').value.trim();
  const type = document.getElementById('wlRepeatType').value;

  let repeat = { type };
  if (type === 'weekly') {
    const wds = Array.from(document.querySelectorAll('#wlRepeatDetail input:checked')).map(c => parseInt(c.value));
    repeat.weekdays = wds.length ? wds : [1,2,3,4,5];
  } else if (type === 'monthly') {
    const daysStr = document.getElementById('wlDays').value.trim();
    const days = daysStr ? daysStr.split(/[,，\s]+/).map(Number).filter(n => n>=1 && n<=31) : [1];
    repeat.days = days;
  } else if (type === 'once' || type === 'yearly') {
    const dateVal = document.getElementById('wlDate').value;
    repeat.date = dateVal || wlTodayStr();
  }

  if (workEditingTaskId) {
    const task = workTasks.find(t => t.id === workEditingTaskId);
    if (task) {
      task.title = title; task.important = important; task.urgent = urgent;
      task.note = note; task.repeat = repeat;
    }
    showToast('任务已更新');
  } else {
    workTasks.push({ id: uid(), title, repeat, important, urgent, note });
    showToast('任务已添加');
  }

  workShowAddForm = false;
  workEditingTaskId = null;
  saveWorkTasks();
  renderWorkListModule(document.getElementById('content'), MODULES.find(m => m.id === 'worklist'));
}

// 删除任务
function wlDeleteTask(id) {
  if (!confirm('确定删除该任务?')) return;
  workTasks = workTasks.filter(t => t.id !== id);
  saveWorkTasks();
  renderWorkListModule(document.getElementById('content'), MODULES.find(m => m.id === 'worklist'));
  showToast('任务已删除');
}

// 切换完成状态
function wlToggleDone(id) {
  const today = wlTodayStr();
  const key = `${today}:${id}`;
  if (workDone[key]) {
    delete workDone[key];
  } else {
    workDone[key] = true;
    // 完成后检查是否全部完成，发通知
    const all = wlGetTodayTasks();
    if (all.every(t => t.done)) {
      wlNotify('🎉 今日任务全部完成！', '你今天的所有清单任务都已完成。');
    }
  }
  saveWorkDone();
  renderWorkListModule(document.getElementById('content'), MODULES.find(m => m.id === 'worklist'));
}

// 浏览器通知
function wlNotify(title, body) {
  try {
    if ('Notification' in window) {
      if (Notification.permission === 'granted') {
        new Notification(title, { body });
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(p => {
          if (p === 'granted') new Notification(title, { body });
        });
      }
    }
  } catch (e) {}
}

// 工作清单事件绑定(在 init 末尾调用)
function bindWorkListEvents() {
  const container = document.getElementById('content');

  // 象限筛选点击
  container.addEventListener('click', (e) => {
    const quadEl = e.target.closest('[data-wl-quad]');
    if (quadEl) {
      const q = quadEl.getAttribute('data-wl-quad');
      workFilterQuadrant = (workFilterQuadrant === q) ? 'all' : q;
      renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
      return;
    }

    const filterBtn = e.target.closest('[data-wl-filter]');
    if (filterBtn) {
      workFilterQuadrant = filterBtn.getAttribute('data-wl-filter');
      renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
      return;
    }

    const viewBtn = e.target.closest('[data-wl-view]');
    if (viewBtn) {
      workView = viewBtn.getAttribute('data-wl-view');
      renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
      return;
    }

    const actionEl = e.target.closest('[data-wl-action]');
    if (!actionEl) return;
    const action = actionEl.getAttribute('data-wl-action');
    const id = actionEl.getAttribute('data-wl-id');

    switch (action) {
      case 'toggle-add':
        workShowAddForm = !workShowAddForm;
        workEditingTaskId = null;
        renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
        if (workShowAddForm) setTimeout(wlRenderRepeatDetail, 50);
        break;
      case 'cancel-form':
        workShowAddForm = false;
        workEditingTaskId = null;
        renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
        break;
      case 'save-task':
        wlSaveTask();
        break;
      case 'toggle-done':
        wlToggleDone(id);
        break;
      case 'edit':
        workShowAddForm = true;
        workEditingTaskId = id;
        renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
        setTimeout(wlRenderRepeatDetail, 50);
        break;
      case 'delete':
        wlDeleteTask(id);
        break;
      case 'notify':
        wlNotify('工作清单提醒', `今日还有任务待完成，加油！`);
        showToast('已发送提醒通知');
        break;
    }
  });

  // 循环类型变化时更新详情
  container.addEventListener('change', (e) => {
    if (e.target.id === 'wlRepeatType') {
      wlRenderRepeatDetail();
    }
  });
}

// 工作清单提醒检查(页面加载时)
function wlCheckReminderOnLoad() {
  const all = wlGetTodayTasks();
  const pending = all.filter(t => !t.done);
  if (pending.length > 0) {
    setTimeout(() => {
      showToast(`今日有 ${pending.length} 项任务待完成`);
    }, 1500);
  }
}
