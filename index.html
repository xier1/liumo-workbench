// ---------- 页签二：销售数据（日历视图） ----------
function renderDsDataTab(body) {
  const now = new Date();
  if (!dsCalY) { dsCalY = now.getFullYear(); dsCalM = now.getMonth() + 1; const dm = dsDetectMonthMode(dsCalY, dsCalM); if (dm) dsEntryMode = dm; }
  const y = dsCalY, m = dsCalM;
  const prefix = y + '-' + ('0' + m).slice(-2);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDow = (new Date(y, m - 1, 1).getDay() + 6) % 7;  // 周一为第一列
  const monthAmt = dsLogs.filter(l => (l.date || '').slice(0, 7) === prefix).reduce((s, l) => s + (Number(l.amount) || 0), 0);
  const filledSet = new Set(dsLogs.filter(l => (l.date || '').slice(0, 7) === prefix).map(l => l.date));
  const lastAvg = dsLastMonthAvg(y, m);

  // 日历网格：按日模式显示日期格子（低于上月均值标绿）；按月模式仅显示「填写」按钮
  const wdHead = ['一', '二', '三', '四', '五', '六', '日'].map(w => `<div class="ds-cal-h">${w}</div>`).join('');
  let gridInner;
  if (dsEntryMode === 'day') {
    let cells = '';
    for (let i = 0; i < firstDow; i++) cells += '<div class="ds-cal-cell blank"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const date = prefix + '-' + ('0' + d).slice(-2);
      const amt = dsSumAmt(date);
      const filled = filledSet.has(date);
      const isToday = date === todayStr();
      const lowCls = (filled && lastAvg > 0 && amt < lastAvg) ? ' below' : '';
      cells += `<div class="ds-cal-cell ${filled ? 'filled' : 'empty'}${isToday ? ' today' : ''}" data-date="${date}">
          <div class="ds-cal-day">${d}</div>
          ${filled ? `<div class="ds-cal-amt${lowCls}">${saMoney(amt)}</div>` : `<div class="ds-cal-hint">待填</div>`}
        </div>`;
    }
    const pad = (7 - ((firstDow + daysInMonth) % 7)) % 7;
    for (let i = 0; i < pad; i++) cells += '<div class="ds-cal-cell blank"></div>';
    gridInner = wdHead + cells;
  } else {
    gridInner = `<div class="ds-mth-fill-wrap"><button class="btn-add ds-mth-fill-btn" id="dsMthFillBtn" type="button">填写本月销售数据</button></div>`;
  }

  body.innerHTML = `
    <div class="wt-note">${dsEntryMode === 'day' ? '点击下方任意日期填写 / 修改当日各分类营业额。低于上月均值的日期会以绿色标注。' : '按月填写：点击下方「填写本月销售数据」一次性录入本月各类别金额。'}</div>
    <div class="ds-cal-bar">
      <div class="ds-cal-bar-top">
        <div class="ds-cal-title">${y} 年 ${m} 月</div>
        <div class="ds-mode-seg">
          <button class="ds-mode-btn ${dsEntryMode === 'day' ? 'active' : ''}" data-mode="day" type="button">按日填写</button>
          <button class="ds-mode-btn ${dsEntryMode === 'month' ? 'active' : ''}" data-mode="month" type="button">按月填写</button>
        </div>
      </div>
      <div class="ds-cal-bar-nav">
        <button class="ds-cal-nav" id="dsCalPrev" type="button">‹</button>
        <button class="ds-cal-today" id="dsCalToday" type="button">今天</button>
        <button class="ds-cal-nav" id="dsCalNext" type="button">›</button>
      </div>
      <div class="ds-cal-summary">本月合计 <b>${saMoney(monthAmt)}</b> · 已填 ${filledSet.size} / ${daysInMonth} 天 · 上月平均值 <b>${saMoney(lastAvg)}</b></div>
    </div>
    <div class="ds-cal-grid">${gridInner}</div>
  `;

  body.querySelector('#dsCalPrev').addEventListener('click', () => { let py = dsCalY, pm = dsCalM - 1; if (pm < 1) { pm = 12; py--; } dsShowMonth(body, py, pm); });
  body.querySelector('#dsCalNext').addEventListener('click', () => { let py = dsCalY, pm = dsCalM + 1; if (pm > 12) { pm = 1; py++; } dsShowMonth(body, py, pm); });
  body.querySelector('#dsCalToday').addEventListener('click', () => { const n = new Date(); dsShowMonth(body, n.getFullYear(), n.getMonth() + 1); });
  body.querySelectorAll('.ds-mode-btn').forEach(b => b.addEventListener('click', () => {
    dsEntryMode = b.dataset.mode;
    try { localStorage.setItem(DS_MODE_KEY, dsEntryMode); } catch (e) {}
    renderDsDataTab(body);
  }));
  if (dsEntryMode === 'day') {
    body.querySelectorAll('.ds-cal-cell[data-date]').forEach(cell => {
      cell.addEventListener('click', () => dsOpenDayModal(body, cell.getAttribute('data-date')));
    });
  } else {
    const fb = body.querySelector('#dsMthFillBtn');
    if (fb) fb.addEventListener('click', () => dsOpenMonthModal(body, y, m));
  }
}

// ---------- 页签：数据分析（本月销售数据明细，可展开小类） ----------
function renderDsAnaTab(body) {
  const now = new Date();
  if (!dsCalY) { dsCalY = now.getFullYear(); dsCalM = now.getMonth() + 1; }
  const y = dsCalY, m = dsCalM;
  const daysInMonth = new Date(y, m, 0).getDate();
  const tbl = buildDsCatDateTable(y, m, dsAnaExpanded);
  const expandLabel = dsAnaExpanded ? '收起' : '展开明细';
  const note = tbl.monthly
    ? `本月为「按月填写」，明细以各大类本月日均（本月均值）展示。点击表格右上角「${expandLabel}」可展开 / 收起各大类下的小类明细。`
    : `本月各大类销售数据明细。点击表格右上角「${expandLabel}」可展开 / 收起各大类下的小类明细。本月均值低于上月均值、或最后一天数据低于本月均值时，数值以绿色标注。`;
  const summary = tbl.monthly
    ? `按月填写 · 大类 <b>${tbl.catCount}</b> · 月合计 <b>${saMoney(tbl.totalSum)}</b>`
    : `已填 <b>${tbl.totalFilled}</b> / ${daysInMonth} 天 · 大类 <b>${tbl.catCount}</b> · 月合计 <b>${saMoney(tbl.totalSum)}</b>`;
  body.innerHTML = `
    <div class="wt-note">${note}</div>
    <div class="ds-cal-bar">
      <div class="ds-cal-bar-top">
        <div class="ds-cal-title">${y} 年 ${m} 月</div>
        <div class="ds-mode-seg">
          <button class="ds-cal-nav" id="dsAnaPrev" type="button">‹</button>
          <button class="ds-cal-today" id="dsAnaToday" type="button">今天</button>
          <button class="ds-cal-nav" id="dsAnaNext" type="button">›</button>
        </div>
      </div>
      <div class="ds-cal-summary">${summary}</div>
    </div>
    <div class="ds-tbl-card">
      <div class="ds-tbl-head">
        <div class="ds-tbl-title">本月销售数据明细 · ${y} 年 ${m} 月</div>
        <div class="ds-tbl-head-right">
          <span class="ds-tbl-meta">${dsAnaExpanded ? '已展开小类' : '仅显示大类'}</span>
          <button class="btn-add ds-ana-expand" id="dsAnaExpand" type="button">${expandLabel}</button>
        </div>
      </div>
      <div class="ds-tbl-wrap">${tbl.html}</div>
    </div>
    ${renderDsCmpCard(y, m)}
  `;
  body.querySelector('#dsAnaExpand').addEventListener('click', () => { dsAnaExpanded = !dsAnaExpanded; renderDsAnaTab(body); });
  body.querySelector('#dsAnaPrev').addEventListener('click', () => { let py = dsCalY, pm = dsCalM - 1; if (pm < 1) { pm = 12; py--; } dsSetMonth(py, pm); renderDsAnaTab(body); });
  body.querySelector('#dsAnaNext').addEventListener('click', () => { let py = dsCalY, pm = dsCalM + 1; if (pm > 12) { pm = 1; py++; } dsSetMonth(py, pm); renderDsAnaTab(body); });
  body.querySelector('#dsAnaToday').addEventListener('click', () => { const n = new Date(); dsSetMonth(n.getFullYear(), n.getMonth() + 1); renderDsAnaTab(body); });
  wireDsCmpCard(body, y, m);
}

// 数据分析：对比分析区块（返回 HTML）
function renderDsCmpCard(baseY, baseM) {
  if (!dsCmpBaseDate) dsCmpBaseDate = todayStr();
  if (!dsCmpCmpDate) dsCmpCmpDate = dsShiftDate(todayStr(), -1);
  const baseLabel = baseY + ' 年 ' + baseM + ' 月';
  let ctrlHtml, tableHtml;
  if (dsCmpMode === 'month') {
    // 对比月份选项：上月 / 去年同月份 / 有数据的其它月份
    let ly = baseY, lm = baseM - 1; if (lm < 1) { lm = 12; ly--; }
    const lastKey = ly + '-' + ('0' + lm).slice(-2);
    let yy = baseY - 1, ym = baseM;
    const lyKey = yy + '-' + ('0' + ym).slice(-2);
    const opts = [
      { key: 'last', label: '上月（' + ly + ' 年 ' + lm + ' 月）' },
      { key: 'lastyear', label: '去年同月份（' + yy + ' 年 ' + ym + ' 月）' }
    ];
    const dataMonths = [...new Set(dsLogs.map(l => (l.date || '').slice(0, 7)))]
      .filter(p => p && p !== (baseY + '-' + ('0' + baseM).slice(-2)))
      .sort().reverse();
    dataMonths.forEach(p => { if (p === lastKey || p === lyKey) return; opts.push({ key: p, label: p.slice(0, 4) + ' 年 ' + Number(p.slice(5, 7)) + ' 月' }); });
    if (!opts.some(o => o.key === dsCmpMonthSel)) dsCmpMonthSel = 'last';
    let cmpY = ly, cmpM = lm;
    if (dsCmpMonthSel === 'lastyear') { cmpY = yy; cmpM = ym; }
    else if (dsCmpMonthSel !== 'last') { const pr = dsCmpMonthSel.split('-'); cmpY = Number(pr[0]); cmpM = Number(pr[1]); }
    const cmpLabel = cmpY + ' 年 ' + cmpM + ' 月';
    ctrlHtml = `
      <div class="ds-cmp-ctrl">
        <span class="ds-cmp-ctrl-label">对比月份</span>
        <select class="ds-cmp-sel" id="dsCmpMonthSel">${opts.map(o => `<option value="${o.key}"${o.key === dsCmpMonthSel ? ' selected' : ''}>${o.label}</option>`).join('')}</select>
      </div>
      <div class="ds-cmp-note">对比各分类「月日均」。基准为当前月时，日均 = 今天以前已填合计 ÷ 已填天数（不含当日）；其它月份按整月天数。基准：<b>${baseLabel}</b> · 对比：<b>${cmpLabel}</b></div>`;
    tableHtml = buildDsCmpTable(
      c => dsCatMonthAvg(c, baseY, baseM),
      c => dsCatMonthAvg(c, cmpY, cmpM),
      dsCmpExpanded, baseLabel + ' 日均', cmpLabel + ' 日均'
    );
  } else {
    ctrlHtml = `
      <div class="ds-cmp-ctrl">
        <span class="ds-cmp-ctrl-label">基准日</span>
        <input type="date" class="ds-cmp-date" id="dsCmpBaseDate" value="${dsCmpBaseDate}" />
      </div>
      <div class="ds-cmp-ctrl">
        <span class="ds-cmp-ctrl-label">对比日</span>
        <select class="ds-cmp-sel" id="dsCmpDayQuick">
          <option value="yesterday"${dsCmpCmpDate === dsShiftDate(dsCmpBaseDate, -1) ? ' selected' : ''}>昨天</option>
          <option value="daybefore"${dsCmpCmpDate === dsShiftDate(dsCmpBaseDate, -2) ? ' selected' : ''}>前天</option>
        </select>
        <input type="date" class="ds-cmp-date" id="dsCmpCmpDate" value="${dsCmpCmpDate}" />
      </div>`;
    tableHtml = buildDsCmpTable(
      c => dsCatDayAmt(c, dsCmpBaseDate),
      c => dsCatDayAmt(c, dsCmpCmpDate),
      dsCmpExpanded, dsCmpBaseDate, dsCmpCmpDate
    );
  }
  const expandLabel = dsCmpExpanded ? '收起' : '展开明细';
  return `
    <div class="ds-tbl-card ds-cmp-card">
      <div class="ds-tbl-head">
        <div class="ds-tbl-title">对比分析</div>
        <div class="ds-mode-seg">
          <button class="ds-mode-btn ${dsCmpMode === 'month' ? 'active' : ''}" data-cmp="month" type="button">按月对比</button>
          <button class="ds-mode-btn ${dsCmpMode === 'day' ? 'active' : ''}" data-cmp="day" type="button">按天对比</button>
        </div>
      </div>
      ${ctrlHtml}
      <div class="ds-tbl-head ds-cmp-subhead">
        <span class="ds-tbl-meta">${dsCmpExpanded ? '已展开小类' : '仅显示大类'}</span>
        <button class="btn-add ds-ana-expand" id="dsCmpExpand" type="button">${expandLabel}</button>
      </div>
      <div class="ds-tbl-wrap">${tableHtml}</div>
    </div>`;
}

// 数据分析：对比分析区块（绑定事件）
function wireDsCmpCard(body, baseY, baseM) {
  body.querySelectorAll('.ds-mode-btn[data-cmp]').forEach(b => b.addEventListener('click', () => {
    dsCmpMode = b.dataset.cmp; renderDsAnaTab(body);
  }));
  const exBtn = body.querySelector('#dsCmpExpand');
  if (exBtn) exBtn.addEventListener('click', () => { dsCmpExpanded = !dsCmpExpanded; renderDsAnaTab(body); });
  const mSel = body.querySelector('#dsCmpMonthSel');
  if (mSel) mSel.addEventListener('change', () => { dsCmpMonthSel = mSel.value; renderDsAnaTab(body); });
  const baseInp = body.querySelector('#dsCmpBaseDate');
  if (baseInp) baseInp.addEventListener('change', () => { if (baseInp.value) { dsCmpBaseDate = baseInp.value; renderDsAnaTab(body); } });
  const quick = body.querySelector('#dsCmpDayQuick');
  if (quick) quick.addEventListener('change', () => {
    if (quick.value === 'yesterday') dsCmpCmpDate = dsShiftDate(dsCmpBaseDate, -1);
    else if (quick.value === 'daybefore') dsCmpCmpDate = dsShiftDate(dsCmpBaseDate, -2);
    renderDsAnaTab(body);
  });
  const cmpInp = body.querySelector('#dsCmpCmpDate');
  if (cmpInp) cmpInp.addEventListener('change', () => { if (cmpInp.value) dsCmpCmpDate = cmpInp.value; renderDsAnaTab(body); });
}

// 点击某一天：弹窗加载类别表单，逐类填金额，底部总额 + 保存
function dsOpenDayModal(body, date) {
  const ex = document.getElementById('dsCalMask'); if (ex) ex.remove();
  const recMap = {};
  dsLogs.filter(l => l.date === date).forEach(l => { recMap[l.catId] = l; });

  const leafRow = (c) => {
    const r = recMap[c.id];
    return `<div class="ds-cal-row">
        <div class="ds-cal-cat">${escapeHtml(c.name)}</div>
        <div class="ds-cal-vals">
          <div class="ds-cal-field"><span>营业额(元)</span><input type="number" step="0.01" min="0" class="ds-cal-amt" data-id="${c.id}" value="${r ? (r.amount != null ? r.amount : '') : ''}" placeholder="0" /></div>
        </div>
      </div>`;
  };
  let rowsHtml;
  if (dsTopCats().length === 0) {
    rowsHtml = '<div class="wt-empty">尚未添加类别，请先到「类别管理」添加</div>';
  } else {
    rowsHtml = dsTopCats().map(top => {
      const kids = dsChildren(top.id);
      if (kids.length === 0) return leafRow(top);
      const head = `<div class="ds-cal-group"><span>${escapeHtml(top.name)}</span><span class="ds-cal-group-sum" data-gid="${top.id}"></span></div>`;
      return head + kids.map(leafRow).join('');
    }).join('');
  }

  const dObj = new Date(date + 'T00:00:00');
  const wd = ['日', '一', '二', '三', '四', '五', '六'][dObj.getDay()];

  const mask = document.createElement('div');
  mask.className = 'ds-cal-mask';
  mask.id = 'dsCalMask';
  mask.innerHTML = `
    <div class="ds-cal-modal">
      <div class="ds-cal-modal-head">
        <div class="ds-cal-modal-title">
          <label class="ds-cal-date-label">日期</label>
          <input type="date" id="dsCalDate" class="ds-cal-date-input" value="${date}" />
          <span class="ds-cal-weekday" id="dsCalWd">周${wd}</span>
        </div>
        <button class="ds-cal-close" id="dsCalClose" type="button">×</button>
      </div>
      <div class="ds-cal-modal-body" id="dsCalBody">${rowsHtml}</div>
      <div class="ds-cal-modal-foot">
        <div class="ds-cal-total">总金额 <b id="dsCalTotal">${saMoney(0)}</b></div>
        <button class="btn-add" id="dsCalSave" type="button">保存</button>
      </div>
    </div>`;
  body.appendChild(mask);

  const recalc = () => {
    let s = 0;
    mask.querySelectorAll('.ds-cal-amt').forEach(inp => { s += Number(inp.value) || 0; });
    const t = mask.querySelector('#dsCalTotal');
    if (t) t.textContent = saMoney(s);
    // 每个一级分组的实时小计（其下二级小类之和）
    mask.querySelectorAll('.ds-cal-group-sum[data-gid]').forEach(sp => {
      const gid = sp.getAttribute('data-gid');
      let g = 0;
      dsChildren(gid).forEach(k => {
        const inp = mask.querySelector('.ds-cal-amt[data-id="' + k.id + '"]');
        if (inp) g += Number(inp.value) || 0;
      });
      sp.textContent = saMoney(g);
    });
  };
  mask.querySelectorAll('.ds-cal-amt').forEach(inp => inp.addEventListener('input', recalc));
  recalc();

  mask.querySelector('#dsCalClose').addEventListener('click', () => mask.remove());
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
  // 切换日期时实时更新星期
  const dsCalDateInp = mask.querySelector('#dsCalDate');
  const dsCalWd = mask.querySelector('#dsCalWd');
  if (dsCalDateInp && dsCalWd) {
    dsCalDateInp.addEventListener('change', () => {
      const v = dsCalDateInp.value;
      if (v) {
        const w = ['日', '一', '二', '三', '四', '五', '六'][new Date(v + 'T00:00:00').getDay()];
        dsCalWd.textContent = '周' + w;
      }
    });
  }
  mask.querySelector('#dsCalSave').addEventListener('click', () => {
    const newDate = (dsCalDateInp ? dsCalDateInp.value : '').trim();
    if (!newDate) { showToast('请选择日期'); return; }
    const dateChanged = newDate !== date;
    // 若修改了日期，先清除原日期的全部记录（将数据迁移到新日期）
    if (dateChanged) {
      dsLogs = dsLogs.filter(l => l.date !== date);
    }
    dsCats.filter(dsIsLeaf).forEach(c => {
      const amtInp = mask.querySelector('.ds-cal-amt[data-id="' + c.id + '"]');
      const amt = amtInp ? (Number(amtInp.value) || 0) : 0;
      dsUpsert(c.id, newDate, amt);
    });
    mask.remove();
    showToast(dateChanged ? '已保存（日期已调整）' : '已保存');
    // 若新日期不在当前查看的月份，则跳转到该月，方便查看
    const ny = Number(newDate.slice(0, 4)), nm = Number(newDate.slice(5, 7));
    if (ny !== dsCalY || nm !== dsCalM) { dsCalY = ny; dsCalM = nm; }
    renderDsDataTab(body);
  });
}

// 按月填写：弹窗录入本月各类别合计金额
function dsOpenMonthModal(body, y, m) {
  const ex = document.getElementById('dsCalMask'); if (ex) ex.remove();
  const prefix = y + '-' + ('0' + m).slice(-2);
  let mRows;
  if (dsTopCats().length === 0) {
    mRows = '<div class="wt-empty">尚未添加类别，请先到「类别管理」添加</div>';
  } else {
    mRows = dsTopCats().map(top => {
      const kids = dsChildren(top.id);
      if (kids.length === 0) {
        const val = dsMonthCatAmt(top.id, y, m);
        return `<div class="ds-mth-row">
            <div class="ds-mth-cat">${escapeHtml(top.name)}</div>
            <div class="ds-mth-field"><input type="number" step="0.01" min="0" class="ds-mth-amt" data-id="${top.id}" value="${val}" placeholder="0" /></div>
          </div>`;
      }
      const head = `<div class="ds-cal-group"><span>${escapeHtml(top.name)}</span><span class="ds-cal-group-sum" data-gid="${top.id}"></span></div>`;
      const childRows = kids.map(k => {
        const val = dsMonthCatAmt(k.id, y, m);
        return `<div class="ds-mth-row ds-mth-sub">
            <div class="ds-mth-cat">${escapeHtml(k.name)}</div>
            <div class="ds-mth-field"><input type="number" step="0.01" min="0" class="ds-mth-amt" data-id="${k.id}" value="${val}" placeholder="0" /></div>
          </div>`;
      }).join('');
      return head + childRows;
    }).join('');
  }
  const mTotal = dsLogs.filter(l => (l.date || '').slice(0, 7) === prefix).reduce((s, l) => s + (Number(l.amount) || 0), 0);

  const mask = document.createElement('div');
  mask.className = 'ds-cal-mask';
  mask.id = 'dsCalMask';
  mask.innerHTML = `
    <div class="ds-cal-modal">
      <div class="ds-cal-modal-head">
        <div class="ds-cal-modal-title">本月各类别录入 · ${y} 年 ${m} 月</div>
        <button class="ds-cal-close" id="dsMthClose" type="button">×</button>
      </div>
      <div class="ds-cal-modal-body">${mRows}</div>
      <div class="ds-cal-modal-foot">
        <div class="ds-cal-total">总金额 <b id="dsMthTotal">${saMoney(mTotal)}</b></div>
        <button class="btn-add" id="dsMthSave" type="button">保存</button>
      </div>
    </div>`;
  body.appendChild(mask);

  mask.querySelector('#dsMthClose').addEventListener('click', () => mask.remove());
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });

  const recalcMth = () => {
    let s = 0;
    mask.querySelectorAll('.ds-mth-amt').forEach(inp => { s += Number(inp.value) || 0; });
    const t = mask.querySelector('#dsMthTotal'); if (t) t.textContent = saMoney(s);
    mask.querySelectorAll('.ds-cal-group-sum[data-gid]').forEach(sp => {
      const gid = sp.getAttribute('data-gid'); let g = 0;
      dsChildren(gid).forEach(k => { const inp = mask.querySelector('.ds-mth-amt[data-id="' + k.id + '"]'); if (inp) g += Number(inp.value) || 0; });
      sp.textContent = saMoney(g);
    });
  };
  mask.querySelectorAll('.ds-mth-amt').forEach(inp => inp.addEventListener('input', recalcMth));
  recalcMth();

  mask.querySelector('#dsMthSave').addEventListener('click', () => {
    // 覆盖本月：先清除本月全部按日明细，再以每月 1 号为汇总日写入
    dsLogs = dsLogs.filter(l => (l.date || '').slice(0, 7) !== prefix);
    const d1 = prefix + '-01';
    dsCats.filter(dsIsLeaf).forEach(c => {
      const inp = mask.querySelector('.ds-mth-amt[data-id="' + c.id + '"]');
      const amt = inp ? (Number(inp.value) || 0) : 0;
      dsUpsert(c.id, d1, amt);
    });
    mask.remove();
    showToast('已保存（本月已按月汇总）');
    renderDsDataTab(body);
  });
}

/* ========================================================
   心灵鸡汤模块
   ======================================================== */

// ---------- 心灵鸡汤状态 ----------
let quotes = [];
let quoteFilter = 'all';       // all | starred
let quoteSearch = '';
let quoteEditingId = null;

const QUOTES_STORAGE_KEY = 'liumo_workbench_quotes';

function loadQuotes() {
  try {
    const data = localStorage.getItem(QUOTES_STORAGE_KEY);
    quotes = data ? JSON.parse(data) : [];
  } catch (e) {
    quotes = [];
  }
  normalizeQuotes();
}

// 迁移:旧版带 category 字段的记录去掉该字段
function normalizeQuotes() {
  let changed = false;
  quotes.forEach(q => {
    if ('category' in q) { delete q.category; changed = true; }
  });
  if (changed) saveQuotes();
}

function saveQuotes() {
  localStorage.setItem(QUOTES_STORAGE_KEY, JSON.stringify(quotes));
}

function escapeAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---------- 渲染:心灵鸡汤模块 ----------
function renderQuotesModule(content, mod) {
  content.innerHTML = `
    <div class="page-header">
      <div class="page-title">${mod.name}</div>
      <div class="page-desc">${mod.desc}</div>
    </div>

    <!-- 统计 -->
    <div class="quotes-stats" id="quotesStats"></div>

    <!-- 添加工具栏 -->
    <div class="toolbar" style="flex-direction:column;align-items:stretch;gap:10px;">
      <textarea class="quote-edit-text" id="quoteInput" placeholder="写下你收藏的心灵鸡汤..." rows="3" style="border:1px solid var(--border);box-shadow:none;background:var(--bg);"></textarea>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <input type="text" class="quote-edit-input" id="quoteSourceInput" placeholder="来源(作者 / 书名 / 出处,可选)" style="flex:1;min-width:160px;" />
        <button class="btn-add" id="quoteAddBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          收藏
        </button>
      </div>
    </div>

    <!-- 筛选与搜索 -->
    <div class="filter-bar" style="margin-top:16px;">
      <div class="filter-group" id="quoteFilterGroup">
        <button class="filter-btn ${quoteFilter==='all'?'active':''}" data-qfilter="all">全部</button>
        <button class="filter-btn ${quoteFilter==='starred'?'active':''}" data-qfilter="starred">⭐ 收藏</button>
      </div>
      <div class="search-box" style="max-width:260px;margin-left:auto;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="quoteSearchInput" placeholder="搜索词句或来源..." value="${escapeAttr(quoteSearch)}" />
      </div>
    </div>

    <!-- 心灵鸡汤列表 -->
    <div class="quote-grid" id="quoteGrid"></div>
  `;

  bindQuoteEvents();
  renderQuotesStats();
  renderQuoteGrid();
}

// ---------- 渲染:心灵鸡汤统计 ----------
function renderQuotesStats() {
  const statsEl = document.getElementById('quotesStats');
  if (!statsEl) return;
  const total = quotes.length;
  const starred = quotes.filter(q => q.starred).length;
  const recent = quotes.filter(q => Date.now() - q.createdAt < 7 * 86400000).length;

  document.getElementById('quotesStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">收藏总数</div>
      <div class="stat-value primary">${total}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">⭐ 星标</div>
      <div class="stat-value warning">${starred}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">近 7 天新增</div>
      <div class="stat-value success">${recent}</div>
    </div>
  `;
}

// ---------- 渲染:心灵鸡汤列表 ----------
function getFilteredQuotes() {
  let list = quotes;
  if (quoteFilter === 'starred') list = list.filter(q => q.starred);
  if (quoteSearch.trim()) {
    const s = quoteSearch.trim().toLowerCase();
    list = list.filter(q => (q.text || '').toLowerCase().includes(s) || (q.source || '').toLowerCase().includes(s));
  }
  // 星标优先,再按创建时间倒序
  return [...list].sort((a, b) => {
    if (a.starred !== b.starred) return a.starred ? -1 : 1;
    return b.createdAt - a.createdAt;
  });
}

function renderQuoteGrid() {
  const list = getFilteredQuotes();
  const el = document.getElementById('quoteGrid');

  if (list.length === 0) {
    el.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/>
            <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/>
          </svg>
        </div>
        <div class="empty-title">${quoteSearch ? '没有找到匹配的句子' : (quoteFilter === 'starred' ? '还没有星标句子' : '暂无收藏的心灵鸡汤')}</div>
        <div class="empty-desc">${quoteSearch ? '试试其他关键词' : '在上方输入框记录你的第一条心灵鸡汤吧'}</div>
      </div>
    `;
    return;
  }

  el.innerHTML = list.map(q => {
    const isEditing = quoteEditingId === q.id;

    if (isEditing) {
      return `
        <div class="quote-card" data-id="${q.id}">
          <div class="quote-edit-area">
            <textarea class="quote-edit-text" id="qedit-text-${q.id}" rows="3">${escapeHtml(q.text)}</textarea>
            <div class="quote-edit-row">
              <input type="text" class="quote-edit-input" id="qedit-source-${q.id}" placeholder="来源(可选)" value="${escapeAttr(q.source || '')}" />
            </div>
            <div class="quote-edit-actions">
              <button class="quote-edit-btn save" data-qaction="save" data-id="${q.id}">保存</button>
              <button class="quote-edit-btn cancel" data-qaction="cancel" data-id="${q.id}">取消</button>
            </div>
          </div>
        </div>
      `;
    }

    return `

// ---------- 心灵鸡汤事件绑定 ----------
function bindQuoteEvents() {
  const input = document.getElementById('quoteInput');
  const sourceInput = document.getElementById('quoteSourceInput');
  const addBtn = document.getElementById('quoteAddBtn');

  function addQuote() {
    const text = input.value.trim();
    if (!text) {
      showToast('请输入词句内容');
      input.focus();
      return;
    }
    quotes.unshift({
      id: uid(),
      text,
      source: sourceInput.value.trim(),
      starred: false,
      createdAt: Date.now()
    });
    saveQuotes();
    input.value = '';
    sourceInput.value = '';
    renderQuotesStats();
    renderQuoteGrid();
    input.focus();
    showToast('已收藏');
  }

  addBtn.addEventListener('click', addQuote);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      addQuote();
    }
  });

  // 筛选
  document.querySelectorAll('[data-qfilter]').forEach(btn => {
    btn.addEventListener('click', () => {
      quoteFilter = btn.dataset.qfilter;
      document.querySelectorAll('[data-qfilter]').forEach(b => b.classList.toggle('active', b === btn));
      renderQuoteGrid();
    });
  });

  // 搜索
  const searchInput = document.getElementById('quoteSearchInput');
  searchInput.addEventListener('input', () => {
    quoteSearch = searchInput.value;
    renderQuoteGrid();
  });

  // 列表事件委托
  const grid = document.getElementById('quoteGrid');
  grid.addEventListener('click', e => {
    const target = e.target.closest('[data-qaction]');
    if (!target) return;
    const action = target.dataset.qaction;
    const id = target.dataset.id;
    const q = quotes.find(q => q.id === id);
    if (!q) return;

    if (action === 'star') {
      q.starred = !q.starred;
      saveQuotes();
      renderQuotesStats();
      renderQuoteGrid();
    } else if (action === 'edit') {
      quoteEditingId = id;
      renderQuoteGrid();
      const ta = document.getElementById(`qedit-text-${id}`);
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    } else if (action === 'delete') {
      quotes = quotes.filter(q => q.id !== id);
      saveQuotes();
      renderQuotesStats();
      renderQuoteGrid();
      showToast('已删除');
    } else if (action === 'save') {
      const newText = document.getElementById(`qedit-text-${id}`).value.trim();
      if (!newText) {
        showToast('内容不能为空');
        return;
      }
      q.text = newText;
      q.source = document.getElementById(`qedit-source-${id}`).value.trim();
      saveQuotes();
      quoteEditingId = null;
      renderQuotesStats();
      renderQuoteGrid();
      showToast('已保存');
    } else if (action === 'cancel') {
      quoteEditingId = null;
      renderQuoteGrid();
    }
  });

  // 编辑框快捷键
  grid.addEventListener('keydown', e => {
    if (e.target.classList.contains('quote-edit-text') || e.target.classList.contains('quote-edit-input')) {
      const id = e.target.id && e.target.id.includes('-') ? e.target.id.split('-').pop() : null;
      if (!id) return;
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.shiftKey) {
        e.preventDefault();
        const q = quotes.find(q => q.id === id);
        if (q) {
          const newText = document.getElementById(`qedit-text-${id}`).value.trim();
          if (!newText) { showToast('内容不能为空'); return; }
          q.text = newText;
          q.source = document.getElementById(`qedit-source-${id}`).value.trim();
          saveQuotes();
          quoteEditingId = null;
          renderQuotesStats();
          renderQuoteGrid();
          showToast('已保存');
        }
      } else if (e.key === 'Escape') {
        quoteEditingId = null;
        renderQuoteGrid();
      }
    }
  });
}

/* ========================================================
   学习管理模块（v2 · 任务明细 / 计划明细）
   数据模型：
     科目 subjects: [{id, name, icon, color}]
     任务 tasks:    [{id, subjectId, title, note,
                      planMode:'none'|'date'|'weekly',
                      planDate:'YYYY-MM-DD', weekday:1-7,
                      continueAfterOverdue:bool, createdAt, updatedAt}]
     计划完成 studyPlan: { done:{ 'taskId__YYYY-MM-DD':true }, allCycle:{ taskId:true } }
   计划明细 = 由「任务 + 计划设置」推导生成，按日期聚合未完成的计划项。
   ======================================================== */

// ---------- 存储键 ----------
const STUDY_CONFIG_KEY = 'liumo_study_v2_config';   // 科目 + 任务
const STUDY_STORAGE_KEY = 'liumo_study_v2_plan';    // 计划完成记录
const STUDY_POINTS_KEY  = 'liumo_study_v2_points';  // 兼容占位（v2 不再启用积分）

// ---------- 状态 ----------
let studySubjects = [];
let studyTasks = [];
let studyPlan = { done: {}, allCycle: {} };
let studyTab = 'tasks';            // 'tasks' | 'plans'
let studySubjectFilter = '';       // 任务明细页签的科目筛选
let studyEdit = null;              // {type:'subject'} | {type:'subject',id} | {type:'task',subjectId?} | {type:'task',id}
let studyEventsBound = false;

// ---------- 工具 ----------
function studyTodayStr() {
  const d = new Date();
  const m = (d.getMonth() + 1).toString().padStart(2, '0');
  const day = d.getDate().toString().padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}
function studyFmtDate(d) {
  const m = (d.getMonth() + 1).toString().padStart(2, '0');
  const day = d.getDate().toString().padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}
function studyAddDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); x.setHours(0, 0, 0, 0); return x; }
function studyWeekdayName(n) { return ['周一','周二','周三','周四','周五','周六','周日'][n - 1]; }
function studyGetSubject(id) { return studySubjects.find(s => s.id === id) || null; }
function studyPlanKey(taskId, date) { return taskId + '__' + date; }

// ---------- 加载 / 保存 ----------
function loadStudyConfig() {

  const now = Date.now();
  studyTasks = [

    { id: uid(), subjectId: sid('数学'), title: '错题整理',     note: '', planMode: 'weekly', planDate: '', weekday: 3, continueAfterOverdue: false, createdAt: now, updatedAt: now },

function saveStudyConfig() {

}
function loadStudyRecords() {
  try {
    const raw = localStorage.getItem(STUDY_STORAGE_KEY);
    studyPlan = raw ? JSON.parse(raw) : { done: {}, allCycle: {} };
  } catch (e) { studyPlan = { done: {}, allCycle: {} }; }
  if (!studyPlan.done) studyPlan.done = {};
  if (!studyPlan.allCycle) studyPlan.allCycle = {};
}
function saveStudyRecords() {
  localStorage.setItem(STUDY_STORAGE_KEY, JSON.stringify(studyPlan));
}
function loadStudyPoints() { /* 兼容占位：v2 不启用积分系统 */ }

// ---------- 计划推导 ----------
// 计算某个每周任务「当前应显示的这一期」日期
function studyComputeWeekly(task) {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const todayJs = now.getDay();                 // 0=周日 .. 6=周六
  const targetJs = task.weekday === 7 ? 0 : task.weekday;
  let diff = (targetJs - todayJs + 7) % 7;       // 距下一个该星期几的天数（0=今天）
  let occ = studyAddDays(now, diff);
  const occStr = studyFmtDate(occ);
  if (studyPlan.done[studyPlanKey(task.id, occStr)]) {
    // 本期已完成 → 顺延到下一周期
    occ = studyAddDays(occ, 7);
    return { date: studyFmtDate(occ), overdue: false };
  }
  // 本期未完成：若开启「超期续显」且本周该日已过去 → 显示已逾期的那一期
  if (diff > 0 && task.continueAfterOverdue) {
    const past = studyAddDays(now, diff - 7);
    const pastStr = studyFmtDate(past);
    if (!studyPlan.done[studyPlanKey(task.id, pastStr)]) {
      return { date: pastStr, overdue: true };
    }
  }
  return { date: occStr, overdue: false };
}

// 汇总所有未完成的计划项，按日期升序
function studyGetPlanItems() {
  const today = studyTodayStr();
  const items = [];
  studyTasks.forEach(task => {
    if (task.planMode === 'none') return;
    const subject = studyGetSubject(task.subjectId);
    if (task.planMode === 'date') {
      const d = task.planDate;
      if (!d) return;
      if (studyPlan.done[studyPlanKey(task.id, d)]) return;        // 已完成 → 隐藏
      const overdue = d < today;
      if (overdue && !task.continueAfterOverdue) return;           // 逾期未续显 → 丢弃
      items.push({ task, subject, date: d, kind: 'date', overdue });
    } else if (task.planMode === 'weekly') {
      if (studyPlan.allCycle[task.id]) return;                     // 已全周期完成 → 隐藏
      const o = studyComputeWeekly(task);
      items.push({ task, subject, date: o.date, kind: 'weekly', overdue: o.overdue });
    }
  });
  items.sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (b.overdue ? 1 : 0) - (a.overdue ? 1 : 0);
  });
  return items;
}

// 计划方式切换时联动显示子字段（不重渲染，保留已输入内容）
function bindModalToggle() {
  const pm = document.getElementById('tk-planmode');
  if (!pm) return;
  pm.addEventListener('change', () => {
    const v = pm.value;
    const fDate = document.querySelector('.study2-field-date');
    const fWeek = document.querySelector('.study2-field-weekly');
    const fCont = document.querySelector('.study2-field.cont');
    if (fDate) fDate.style.display = v === 'date' ? '' : 'none';
    if (fWeek) fWeek.style.display = v === 'weekly' ? '' : 'none';
    if (fCont) fCont.classList.toggle('study2-hidden', !(v === 'date' || v === 'weekly'));
  });
}

// ---------- 事件绑定（在 #content 上委托，整模块只绑定一次） ----------
function bindStudyEvents() {
  if (studyEventsBound) return;
  studyEventsBound = true;
  const content = document.getElementById('content');

  content.addEventListener('click', (e) => {
    const t = e.target.closest('[data-study-action]');
    if (!t) return;
    const action = t.dataset.studyAction;
    const id = t.dataset.id;

    if (action === 'tab') { studyTab = t.dataset.tab; renderStudyTab(); return; }
    if (action === 'filter-subject') return; // 由 change 事件处理

    // 关闭弹窗：仅当直接点击遮罩本身时生效（点卡片内不关闭）
    if (action === 'modal-cancel') {
      // 仅当直接点击遮罩本身时关闭；点击卡片内部元素不触发任何动作（避免误重渲染弹窗、丢失输入）
      if (e.target === t) { studyEdit = null; renderStudyTab(); }
      return;
    }

    if (action === 'add-subject') { studyEdit = { type: 'subject' }; renderStudyTab(); return; }
    if (action === 'edit-subject') { studyEdit = { type: 'subject', id }; renderStudyTab(); return; }
    if (action === 'del-subject') { delSubject(id); return; }

    if (action === 'add-task') { studyEdit = { type: 'task', subjectId: t.dataset.subject || (studySubjects[0] && studySubjects[0].id) || '' }; renderStudyTab(); return; }
    if (action === 'edit-task') { studyEdit = { type: 'task', id }; renderStudyTab(); return; }
    if (action === 'del-task') { delTask(id); return; }

    if (action === 'save-subject') { saveSubject(id); return; }
    if (action === 'save-task') { saveTask(id); return; }

    if (action === 'plan-done') { markPlanDone(id, t.dataset.date); return; }
    if (action === 'plan-allcycle') { markAllCycle(id); return; }
  });

  content.addEventListener('change', (e) => {
    const t = e.target.closest('[data-study-action]');
    if (t && t.dataset.studyAction === 'filter-subject') {
      studySubjectFilter = t.value;
      renderStudyTab();
    }
  });
}

// ---------- 操作：科目 ----------
function saveSubject(id) {
  const name = (document.getElementById('se-name').value || '').trim();
  if (!name) { showToast('请输入科目名称'); return; }
  const icon = (document.getElementById('se-icon').value || '').trim();
  const color = document.getElementById('se-color').value;
  if (id) {
    const sub = studyGetSubject(id);
    if (sub) { sub.name = name; sub.icon = icon; sub.color = color; }
  } else {
    studySubjects.push({ id: uid(), name, icon, color });
  }
  saveStudyConfig();
  studyEdit = null;
  renderStudyTab();
  showToast('已保存');
}

function delSubject(id) {
  const sub = studyGetSubject(id);
  if (!sub) return;
  const cnt = studyTasks.filter(t => t.subjectId === id).length;
  if (!confirm(`删除科目「${sub.name}」？该科目下的 ${cnt} 个任务也会一并删除。`)) return;
  studyTasks = studyTasks.filter(t => t.subjectId !== id);
  studySubjects = studySubjects.filter(s => s.id !== id);
  saveStudyConfig();
  renderStudyTab();
  showToast('科目已删除');
}

// ---------- 操作：任务 ----------
function saveTask(id) {
  const subjectId = document.getElementById('tk-subject').value;
  const title = (document.getElementById('tk-title').value || '').trim();
  if (!subjectId) { showToast('请先添加科目'); return; }
  if (!title) { showToast('请输入任务名称'); return; }
  const note = (document.getElementById('tk-note').value || '').trim();
  const planMode = document.getElementById('tk-planmode').value;
  const planDate = document.getElementById('tk-date').value;
  const weekday = parseInt(document.getElementById('tk-weekday').value, 10) || 1;
  const cont = document.getElementById('tk-cont').checked;
  if (id) {
    const t = studyTasks.find(x => x.id === id);
    if (t) Object.assign(t, { subjectId, title, note, planMode, planDate, weekday, continueAfterOverdue: cont, updatedAt: Date.now() });
  } else {
    studyTasks.push({ id: uid(), subjectId, title, note, planMode, planDate, weekday, continueAfterOverdue: cont, createdAt: Date.now(), updatedAt: Date.now() });
  }
  saveStudyConfig();
  studyEdit = null;
  renderStudyTab();
  showToast('已保存');
}

function delTask(id) {
  const t = studyTasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`删除任务「${t.title}」？对应的计划也会消失。`)) return;
  studyTasks = studyTasks.filter(x => x.id !== id);
  delete studyPlan.allCycle[id];
  Object.keys(studyPlan.done).forEach(k => { if (k.indexOf(id + '__') === 0) delete studyPlan.done[k]; });
  saveStudyConfig();
  saveStudyRecords();
  renderStudyTab();
  showToast('任务已删除');
}

// ---------- 操作：计划完成 ----------
function markPlanDone(id, date) {
  studyPlan.done[studyPlanKey(id, date)] = true;
  saveStudyRecords();
  renderStudyTab();
  showToast('已完成');
}

function markAllCycle(id) {
  if (!confirm('将该周期任务标记为「全部周期完成」？之后不再生成计划。')) return;
  studyPlan.allCycle[id] = true;
  saveStudyRecords();
  renderStudyTab();
  showToast('已全部周期完成');
}

// 今日数据(静态注入,打开即显示)

// ========================================================
//   通用二级类目能力（侧边栏树形展开）
//   任何模块只要在 MODULES 里声明 children: [{id,name,icon}...]，
//   左侧导航就会自动成为可展开分组：点击父级在侧边栏内展开/收起子分类，
//   点击子分类进入对应视图（状态由 currentSub / expandedModules 管理）。
//   下方 subNotes 系列是可在任意二级类目中复用的「笔记 / 活动列表」子面板。
// ========================================================

// ========================================================
//   通用「笔记 / 活动列表」子面板（任意模块的二级类目都可复用）
//   数据按 moduleId 隔离存储（localStorage key: liumo_subnotes_<moduleId>）。
//   用法：
//     <textarea class="subnote-input" id="subnote-input-<moduleId>">
//     <button id="subnote-add-<moduleId>">添加</button>
//     <div class="subnote-list" id="subnote-list-<moduleId>"></div>
//     bindSubNotes(moduleId); renderSubNotes(moduleId);
// ========================================================
let subNotesEditingId = null;

function readSubNotes(moduleId) {
  try { return JSON.parse(localStorage.getItem('liumo_subnotes_' + moduleId) || '[]'); }
  catch (e) { return []; }
}

function writeSubNotes(moduleId, arr) {
  localStorage.setItem('liumo_subnotes_' + moduleId, JSON.stringify(arr));
}

function renderSubNotes(moduleId) {
  const el = document.getElementById('subnote-list-' + moduleId);
  if (!el) return;
  const list = readSubNotes(moduleId);

  if (list.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="empty-title">还没有笔记</div>
        <div class="empty-desc">在上方写下第一条记录吧</div>
      </div>`;
    return;
  }

  el.innerHTML = list.map(a => {
    if (subNotesEditingId === a.id) {
      return `
        <div class="subnote-item" data-id="${a.id}">
          <textarea class="subnote-input" id="subnote-edit-${moduleId}-${a.id}" rows="3">${escapeHtml(a.text)}</textarea>
          <div class="subnote-actions">
            <button class="subnote-btn save" data-act="save" data-id="${a.id}">保存</button>
            <button class="subnote-btn cancel" data-act="cancel" data-id="${a.id}">取消</button>
          </div>
        </div>`;
    }
    return `
      <div class="subnote-item" data-id="${a.id}">
        <div class="subnote-text">${escapeHtml(a.text)}</div>
        <div class="subnote-meta">${formatDate(a.createdAt)}${a.updatedAt && a.updatedAt !== a.createdAt ? ' · 已编辑' : ''}</div>
        <div class="subnote-actions">
          <button class="action-btn" data-act="edit" data-id="${a.id}" title="编辑">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="action-btn delete" data-act="delete" data-id="${a.id}" title="删除">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          </button>
        </div>
      </div>`;
  }).join('');
}

function bindSubNotes(moduleId) {
  const input = document.getElementById('subnote-input-' + moduleId);
  const addBtn = document.getElementById('subnote-add-' + moduleId);

  function add() {
    const text = input.value.trim();
    if (!text) { showToast('请输入内容'); input.focus(); return; }
    const list = readSubNotes(moduleId);
    list.unshift({ id: uid(), text, createdAt: Date.now(), updatedAt: Date.now() });
    writeSubNotes(moduleId, list);
    input.value = '';
    renderSubNotes(moduleId);
    input.focus();
    showToast('已添加');
  }

  if (addBtn && input) {
    addBtn.addEventListener('click', add);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); add(); }
    });
  }

  const listEl = document.getElementById('subnote-list-' + moduleId);
  if (listEl) {
    listEl.addEventListener('click', e => {
      const t = e.target.closest('[data-act]');
      if (!t) return;
      const act = t.dataset.act, id = t.dataset.id;
      const list = readSubNotes(moduleId);
      const a = list.find(x => x.id === id);
      if (!a) return;

      if (act === 'edit') {
        subNotesEditingId = id;
        renderSubNotes(moduleId);
        const ta = document.getElementById('subnote-edit-' + moduleId + '-' + id);
        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      } else if (act === 'delete') {
        writeSubNotes(moduleId, list.filter(x => x.id !== id));
        renderSubNotes(moduleId);
        showToast('已删除');
      } else if (act === 'save') {
        const v = document.getElementById('subnote-edit-' + moduleId + '-' + id).value.trim();
        if (!v) { showToast('内容不能为空'); return; }
        a.text = v; a.updatedAt = Date.now();
        writeSubNotes(moduleId, list);
        subNotesEditingId = null;
        renderSubNotes(moduleId);
        showToast('已保存');
      } else if (act === 'cancel') {
        subNotesEditingId = null;
        renderSubNotes(moduleId);
      }
    });
  }
}

      <input class="note-search" id="note-search" placeholder="搜索笔记标题或内容…" />
    </div>
    <div class="notes-new">
      <input class="note-title-input" id="note-title-input" placeholder="标题（可选）" />
      <textarea class="subnote-input note-content-input" id="note-content-input" rows="4" placeholder="写点什么…（Ctrl / ⌘ + Enter 发布）"></textarea>
      <div class="notes-new-actions">
        <button class="subnote-btn" id="note-clear">清空</button>
        <button class="subnote-btn save" id="note-add">发布笔记</button>
      </div>
    </div>
    <div class="subnote-list" id="note-list"></div>
  `;
  renderNoteList();
  bindNotes();
}

function renderNoteList() {
  const el = document.getElementById('note-list');
  if (!el) return;
  const all = loadNotes();
  const kw = (noteSearch || '').trim().toLowerCase();
  const list = kw ? all.filter(n => ((n.title || '') + ' ' + (n.body || '').replace(/<[^>]+>/g, '')).toLowerCase().includes(kw)) : all;
  if (all.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="empty-title">还没有笔记</div>
        <div class="empty-desc">在上方写下第一篇记录吧</div>
      </div>`;
    return;
  }
  if (list.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="empty-title">没有匹配的笔记</div>
        <div class="empty-desc">换个关键词试试</div>
      </div>`;
    return;
  }
  const editSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
  const delSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
  el.innerHTML = list.map(n => {
    if (noteEditingId === n.id) {
      return `
        <div class="subnote-item" data-id="${n.id}">
          <input class="note-title-input" id="note-edit-title-${n.id}" value="${escapeHtml(n.title || '')}" placeholder="标题（可选）" />
          <textarea class="subnote-input" id="note-edit-body-${n.id}" rows="4">${escapeHtml(n.body)}</textarea>
          <div class="subnote-actions">
            <button class="subnote-btn save" data-act="save" data-id="${n.id}">保存</button>
            <button class="subnote-btn cancel" data-act="cancel" data-id="${n.id}">取消</button>
          </div>
        </div>`;
    }
    return `
      <div class="subnote-item" data-id="${n.id}">
        ${n.title ? `<div class="note-title">${escapeHtml(n.title)}</div>` : ''}
        <div class="note-body${n.html ? '' : ' note-body--text'}">${n.html ? n.body : escapeHtml(n.body)}</div>
        <div class="subnote-meta">${formatDate(n.createdAt)}${n.updatedAt && n.updatedAt !== n.createdAt ? ' · 已编辑' : ''}</div>
        <div class="subnote-actions">
          ${n.html ? '' : `<button class="action-btn" data-act="edit" data-id="${n.id}" title="编辑">${editSvg}</button>`}
          <button class="action-btn delete" data-act="delete" data-id="${n.id}" title="删除">${delSvg}</button>
        </div>
      </div>`;
  }).join('');
}

function bindNotes() {
  const addBtn = document.getElementById('note-add');
  const clearBtn = document.getElementById('note-clear');
  const titleInput = document.getElementById('note-title-input');
  const bodyInput = document.getElementById('note-content-input');

  function add() {
    const body = bodyInput.value.trim();
    if (!body) { showToast('请输入内容'); bodyInput.focus(); return; }
    const list = loadNotes();
    list.unshift({ id: uid(), title: titleInput.value.trim(), body, html: false, createdAt: Date.now(), updatedAt: Date.now() });
    saveNotes(list);
    titleInput.value = '';
    bodyInput.value = '';
    renderNoteList();
    showToast('已发布');
  }

  if (addBtn && bodyInput) {
    addBtn.addEventListener('click', add);
    bodyInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); add(); }
    });
  }
  if (clearBtn && titleInput) {
    clearBtn.addEventListener('click', () => { titleInput.value = ''; bodyInput.value = ''; titleInput.focus(); });
  }

  const searchInput = document.getElementById('note-search');
  if (searchInput) {
    searchInput.addEventListener('input', e => { noteSearch = e.target.value; renderNoteList(); });
  }

  const listEl = document.getElementById('note-list');
  if (listEl) {
    listEl.addEventListener('click', e => {
      const t = e.target.closest('[data-act]');
      if (!t) return;
      const act = t.dataset.act, id = t.dataset.id;
      const list = loadNotes();
      const n = list.find(x => x.id === id);
      if (!n) return;

      if (act === 'edit') {
        noteEditingId = id;
        renderNoteList();
        const ta = document.getElementById('note-edit-body-' + id);
        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      } else if (act === 'delete') {
        saveNotes(list.filter(x => x.id !== id));
        noteEditingId = null;
        renderNoteList();
        showToast('已删除');
      } else if (act === 'save') {
        const v = document.getElementById('note-edit-body-' + id).value.trim();
        if (!v) { showToast('内容不能为空'); return; }
        n.title = document.getElementById('note-edit-title-' + id).value.trim();
        n.body = v; n.updatedAt = Date.now(); n.html = false;
        saveNotes(list);
        noteEditingId = null;
        renderNoteList();
        showToast('已保存');
      } else if (act === 'cancel') {
        noteEditingId = null;
        renderNoteList();
      }
    });
  }
}

const ACT_KEY = 'liumo_activities_fresh';

// 活动类别配置（单一数据源）：新增类别只需在此追加一项
const ACT_CATEGORIES = [
  { id: 'daily',    name: '日常活动', color: '#2563eb', bg: 'rgba(59,130,246,.12)' },
  { id: 'festival', name: '节日活动', color: '#ea580c', bg: 'rgba(249,115,22,.14)' },
  { id: 'group',    name: '群活动',   color: '#16a34a', bg: 'rgba(34,197,94,.13)' }
];
function actCat(id) { return ACT_CATEGORIES.find(c => c.id === id) || ACT_CATEGORIES[0]; }

function readActivities() {
  try { return JSON.parse(localStorage.getItem(ACT_KEY) || '[]'); } catch (e) { return []; }
}
function writeActivities(arr) {
  localStorage.setItem(ACT_KEY, JSON.stringify(arr));
}

// 旧版纯文本笔记 -> 活动（首行作标题，其余作详情，归为日常活动）
function migrateActivities() {
  const oldKey = 'liumo_subnotes_fresh';
  let old = [];
  try { old = JSON.parse(localStorage.getItem(oldKey) || '[]'); } catch (e) {}
  if (Array.isArray(old) && old.length && !localStorage.getItem(ACT_KEY)) {
    const migrated = old.map(n => {
      const text = (n.text || '').trim();
      const idx = text.indexOf('\n');
      const title = (idx > 0 ? text.slice(0, idx) : text).trim() || '未命名活动';
      const detail = idx > 0 ? text.slice(idx + 1).trim() : '';
      return {
        id: n.id || uid(), title, category: 'daily', detail,
        images: [], createdAt: n.createdAt || Date.now(), updatedAt: n.updatedAt || Date.now()
      };
    });
    writeActivities(migrated);
    localStorage.removeItem(oldKey);
  }
}

// 图片压缩：最长边 ~1000px，输出 JPEG（quality≈0.8），便于持久化到 localStorage
function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 1000; quality = quality || 0.8;
  return new Promise((resolve, reject) => {
    if (!file || !file.type || file.type.indexOf('image/') !== 0) { reject(new Error('not-image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('read'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('img'));
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext && canvas.getContext('2d');
        if (!ctx) { reject(new Error('ctx')); return; }
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch (err) { reject(err); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function actCounts() {
  const list = readActivities();
  const out = {};
  ACT_CATEGORIES.forEach(c => { out[c.id] = 0; });
  list.forEach(a => { if (out[a.category] !== undefined) out[a.category]++; });
  return out;
}

// 活动图片放大预览（点击卡片图片弹出，可左右切换、保存到本地）
let actLightbox = null;
let actLbImages = [];
let actLbIndex = 0;
function openActLightbox(images, index) {
  if (!actLightbox) {
    actLightbox = document.createElement('div');
    actLightbox.className = 'act-lightbox';
    actLightbox.innerHTML = `
      <div class="act-lightbox-backdrop" data-close="1"></div>
      <div class="act-lightbox-panel">
        <div class="act-lightbox-stage">
          <button type="button" class="act-lb-nav act-lb-prev" data-nav="-1" aria-label="上一张">‹</button>
          <img class="act-lightbox-img" alt="活动图片预览" />
          <button type="button" class="act-lb-nav act-lb-next" data-nav="1" aria-label="下一张">›</button>
        </div>
        <div class="act-lightbox-bar">
          <span class="act-lb-counter">1 / 1</span>
          <button type="button" class="act-lb-save">💾 保存到本地</button>
          <button type="button" class="act-lb-close" data-close="1">✕ 关闭</button>
        </div>
      </div>`;
    document.body.appendChild(actLightbox);
    actLightbox.addEventListener('click', e => {
      if (e.target.dataset.close) { closeActLightbox(); return; }
      const nav = e.target.closest('[data-nav]');
      if (nav) { stepActLightbox(parseInt(nav.dataset.nav, 10)); }
    });
    actLightbox.querySelector('.act-lb-save').addEventListener('click', () => {
      const img = actLightbox.querySelector('.act-lightbox-img');
      if (!img || !img.src) return;
      const a = document.createElement('a');
      a.href = img.src;
      a.download = '活动图片_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.jpg';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    document.addEventListener('keydown', e => {
      if (!actLightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeActLightbox();
      else if (e.key === 'ArrowLeft') stepActLightbox(-1);
      else if (e.key === 'ArrowRight') stepActLightbox(1);
    });
  }
  actLbImages = images || [];
  actLbIndex = Math.max(0, Math.min(index || 0, Math.max(0, actLbImages.length - 1)));
  actLightbox.classList.toggle('single', actLbImages.length <= 1);
  renderActLightbox();
  actLightbox.classList.add('open');
}
function renderActLightbox() {
  if (!actLightbox) return;
  actLightbox.querySelector('.act-lightbox-img').src = actLbImages[actLbIndex] || '';
  actLightbox.querySelector('.act-lb-counter').textContent = (actLbImages.length ? (actLbIndex + 1) : 0) + ' / ' + actLbImages.length;
}
function stepActLightbox(delta) {
  if (!actLbImages.length) return;
  actLbIndex = (actLbIndex + delta + actLbImages.length) % actLbImages.length;
  renderActLightbox();
}
function closeActLightbox() {
  if (actLightbox) actLightbox.classList.remove('open');
}

function syncSegUI() {
  const seg = document.getElementById('act-seg');
  if (!seg) return;
  seg.querySelectorAll('.act-seg-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === actSelectedCat));
}

function actResetForm() {
  actEditingId = null;
  actDraftImages = [];
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  if (t) t.value = '';
  if (d) d.value = '';
  actSelectedCat = ACT_CATEGORIES[0].id;
  syncSegUI();
  renderActThumbs();
  const save = document.getElementById('act-save'), cancel = document.getElementById('act-cancel');
  if (save) save.textContent = '添加活动';
  if (cancel) cancel.hidden = true;
}

function openActModal() {
  const modal = document.getElementById('actModal');
  if (!modal) return;
  renderActForm();
  const titleEl = document.getElementById('actModalTitle');
  if (titleEl) titleEl.textContent = actEditingId ? '编辑活动' : '添加活动';
  modal.classList.add('open');
  const dlg = modal.querySelector('.act-modal-dialog');
  if (dlg) dlg.focus();
}

function closeActForm() {
  const modal = document.getElementById('actModal');
  if (modal) modal.classList.remove('open');
  actResetForm();
}

function actOpenAdd() {
  actResetForm();
  if (actTab !== 'all') actSelectedCat = actTab;
  syncSegUI();
  openActModal();
}

function actSave() {
  const wasEdit = !!actEditingId;
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  const title = t.value.trim();
  if (!title) { showToast('请填写标题'); if (t) t.focus(); return; }
  const detail = d.value.trim();
  const list = readActivities();
  if (actEditingId) {
    const a = list.find(x => x.id === actEditingId);
    if (a) { a.title = title; a.category = actSelectedCat; a.detail = detail; a.images = actDraftImages.slice(); a.updatedAt = Date.now(); }
  } else {
    list.unshift({ id: uid(), title, category: actSelectedCat, detail, images: actDraftImages.slice(), createdAt: Date.now(), updatedAt: Date.now() });
  }
  writeActivities(list);
  actResetForm();
  renderActTabs();
  renderActList();
  closeActForm();
  showToast(wasEdit ? '已更新' : '已添加');
}

function actStartEdit(id) {
  const a = readActivities().find(x => x.id === id);
  if (!a) return;
  // 先置状态，再渲染（renderActForm 会重建表单，必须在渲染后回填）
  actEditingId = id;
  actDraftImages = (a.images || []).slice();
  actSelectedCat = a.category;
  openActModal();
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  if (t) t.value = a.title;
  if (d) d.value = a.detail || '';
  syncSegUI();
  renderActThumbs();
  const save = document.getElementById('act-save'), cancel = document.getElementById('act-cancel');
  if (save) save.textContent = '保存修改';
  if (cancel) cancel.hidden = false;
  if (t) t.focus();
}

function bindActivities() {
  const tabs = document.getElementById('act-tabs');
  const form = document.getElementById('act-form-container');
  const list = document.getElementById('act-list');
  const addBtn = document.getElementById('actAddBtn');
  const modal = document.getElementById('actModal');

  if (tabs) {
    tabs.addEventListener('click', e => {
      const t = e.target.closest('.act-tab');
      if (!t) return;
      actTab = t.dataset.tab;
      if (actTab !== 'all') actSelectedCat = actTab;
      renderActTabs();
      syncSegUI();
      renderActList();
    });
  }

  if (addBtn) addBtn.addEventListener('click', actOpenAdd);

  if (modal) {
    modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeActForm(); });
    modal.addEventListener('keydown', e => { if (e.key === 'Escape') closeActForm(); });
  }

  if (form) {
    form.addEventListener('click', e => {
      const segBtn = e.target.closest('.act-seg-btn');
      if (segBtn) { actSelectedCat = segBtn.dataset.cat; syncSegUI(); return; }
      if (e.target.closest('#act-img-add')) { const f = document.getElementById('act-file'); if (f) f.click(); return; }
      const rm = e.target.closest('.act-thumb-remove');
      if (rm) {
        const i = parseInt(rm.dataset.idx, 10);
        if (!isNaN(i)) { actDraftImages.splice(i, 1); renderActThumbs(); }
        return;
      }
      if (e.target.closest('#act-save')) { actSave(); return; }
      if (e.target.closest('#act-cancel')) { closeActForm(); return; }
    });

    const fileEl = document.getElementById('act-file');
    if (fileEl) {
      fileEl.addEventListener('change', async e => {
        const files = Array.from(e.target.files || []);
        for (const f of files) {
          try { const d = await compressImage(f); actDraftImages.push(d); }
          catch (err) { showToast('图片处理失败'); }
        }
        renderActThumbs();
        e.target.value = '';
      });
    }
  }

  if (list) {
    list.addEventListener('click', e => {
      const img = e.target.closest('.act-card-img');
      if (img) {
        const card = img.closest('.act-card');
        const imgs = card ? [...card.querySelectorAll('.act-card-img')].map(i => i.getAttribute('src')) : [img.getAttribute('src')];
        const idx = imgs.indexOf(img.getAttribute('src'));
        openActLightbox(imgs, idx < 0 ? 0 : idx);
        return;
      }
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const id = btn.dataset.id, act = btn.dataset.act;
      if (act === 'edit') { actStartEdit(id); }
      else if (act === 'delete') {
        if (typeof confirm === 'function' && !confirm('确定删除该活动？')) return;
        const arr = readActivities().filter(x => x.id !== id);
        writeActivities(arr);
        if (actEditingId === id) actResetForm();
        renderActTabs();
        renderActList();
        showToast('已删除');
      }
    });
  }
}

function buildWeightChartSVG(logs) {
  const W = 600, H = 240, padL = 40, padR = 16, padT = 16, padB = 28;
  const weights = logs.map(l => l.weight);
  let min = Math.min(...weights), max = Math.max(...weights);
  if (weightSettings.target != null) { min = Math.min(min, weightSettings.target); max = Math.max(max, weightSettings.target); }
  if (min === max) { min -= 1; max += 1; }
  const range = max - min;
  const pad = range * 0.12;
  min -= pad; max += pad;
  const n = logs.length;
  const xOf = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
  const yOf = w => H - padB - ((w - min) / (max - min)) * (H - padT - padB);

  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const gy = padT + k * (H - padT - padB) / 3;
    const val = (max - (k / 3) * (max - min)).toFixed(1);
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${val}</text>`;
  }

  const pts = logs.map((l, i) => ({ x: xOf(i), y: yOf(l.weight), l }));
  const line = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => {
    const prev = i > 0 ? logs[i - 1].weight : null;
    const delta = prev != null ? (p.l.weight - prev) : null;
    const tip = `${escapeHtml(p.l.date)}  ${p.l.weight}kg` + (delta != null ? `  (${delta >= 0 ? '+' : ''}${delta.toFixed(1)})` : '');
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#6366f1" stroke="#fff" stroke-width="2"><title>${tip}</title></circle>`;
  }).join('');

  let targetLine = '';
  if (weightSettings.target != null) {
    const ty = yOf(weightSettings.target);
    targetLine = `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${W - padR}" y2="${ty.toFixed(1)}" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - padR}" y="${(ty - 6).toFixed(1)}" text-anchor="end" font-size="10" fill="#10b981">目标 ${weightSettings.target}kg</text>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}<polyline points="${line}" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round"/>${targetLine}${dots}</svg>`;
}

function renderWeightChart() {
  const el = document.getElementById('wtChart');

function renderWeightList() {

function bindWeightEvents() {
  const addBtn = document.getElementById('weightAddBtn');
  const setBtn = document.getElementById('weightSetBtn');
  const valEl = document.getElementById('weightValue');
  const list = document.getElementById('wtList');

  function addLog() {
    const dateEl = document.getElementById('weightDate');
    const date = dateEl.value || todayStr();
    const w = parseFloat(valEl.value);
    if (!(w > 0)) { showToast('请输入有效体重'); valEl.focus(); return; }
    const exist = weightLogs.find(l => l.date === date);
    if (exist) {
      exist.weight = w;
      exist.updatedAt = Date.now();
    } else {
      weightLogs.push({ id: uid(), date, weight: w, createdAt: Date.now(), updatedAt: Date.now() });
    }
    weightLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveWeightLogs();
    valEl.value = '';
    renderWeightStats();
    renderWeightChart();
    renderWeightMonthChart();
    renderWeightList();
    showToast(exist ? '已更新该日体重' : '已记录体重');
  }

  addBtn.addEventListener('click', addLog);
  valEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });

  setBtn.addEventListener('click', () => {
    const t = parseFloat(document.getElementById('weightTarget').value);

    weightSettings.target = (t > 0) ? t : null;
    weightSettings.height = (h > 0) ? h : null;
    saveWeightSettings();
    renderWeightStats();
    renderWeightChart();
    renderWeightMonthChart();
    showToast('目标已保存');
  });

  if (list) {
    list.addEventListener('click', e => {
      const btn = e.target.closest('[data-action="wt-del"]');
      if (!btn) return;
      const id = btn.dataset.id;
      weightLogs = weightLogs.filter(l => l.id !== id);
      saveWeightLogs();
      renderWeightStats();
      renderWeightChart();
      renderWeightMonthChart();
      renderWeightList();
      showToast('已删除该记录');
    });
  }
}
