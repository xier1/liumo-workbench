// 旧版纯文本笔记 -> 活动（首行作标题，其余作详情，归为日常活动）
function migrateActivities() {
  const oldKey = 'liumo_subnotes_fresh';
  let old = [];
  try { old = JSON.parse(localStorage.getItem(oldKey) || '[]'); } catch (e) {}
  if (Array.isArray(old) && old.length && !localStorage.getItem(ACT_KEY)) {
    const migrated = old.map(n => {
      const text = (n.text || '').trim();
      const idx = text.indexOf('\n');
      const title = (idx > 0 ? text.slice(0, idx) : text).trim() || '未命名活动';
      const detail = idx > 0 ? text.slice(idx + 1).trim() : '';
      return {
        id: n.id || uid(), title, category: 'daily', detail,
        images: [], createdAt: n.createdAt || Date.now(), updatedAt: n.updatedAt || Date.now()
      };
    });
    writeActivities(migrated);
    localStorage.removeItem(oldKey);
  }
}

// 图片压缩：最长边 ~1000px，输出 JPEG（quality≈0.8），便于持久化到 localStorage
function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 1000; quality = quality || 0.8;
  return new Promise((resolve, reject) => {
    if (!file || !file.type || file.type.indexOf('image/') !== 0) { reject(new Error('not-image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('read'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('img'));
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext && canvas.getContext('2d');
        if (!ctx) { reject(new Error('ctx')); return; }
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch (err) { reject(err); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function actCounts() {

// 活动图片放大预览（点击卡片图片弹出，可左右切换、保存到本地）
let actLightbox = null;
let actLbImages = [];
let actLbIndex = 0;
function openActLightbox(images, index) {
  if (!actLightbox) {
    actLightbox = document.createElement('div');
    actLightbox.className = 'act-lightbox';
    actLightbox.innerHTML = `
      <div class="act-lightbox-backdrop" data-close="1"></div>
      <div class="act-lightbox-panel">
        <div class="act-lightbox-stage">
          <button type="button" class="act-lb-nav act-lb-prev" data-nav="-1" aria-label="上一张">‹</button>
          <img class="act-lightbox-img" alt="活动图片预览" />
          <button type="button" class="act-lb-nav act-lb-next" data-nav="1" aria-label="下一张">›</button>
        </div>
        <div class="act-lightbox-bar">
          <span class="act-lb-counter">1 / 1</span>
          <button type="button" class="act-lb-save">💾 保存到本地</button>
          <button type="button" class="act-lb-close" data-close="1">✕ 关闭</button>
        </div>
      </div>`;
    document.body.appendChild(actLightbox);
    actLightbox.addEventListener('click', e => {
      if (e.target.dataset.close) { closeActLightbox(); return; }
      const nav = e.target.closest('[data-nav]');
      if (nav) { stepActLightbox(parseInt(nav.dataset.nav, 10)); }
    });
    actLightbox.querySelector('.act-lb-save').addEventListener('click', () => {
      const img = actLightbox.querySelector('.act-lightbox-img');
      if (!img || !img.src) return;
      const a = document.createElement('a');
      a.href = img.src;
      a.download = '活动图片_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.jpg';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    document.addEventListener('keydown', e => {
      if (!actLightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeActLightbox();
      else if (e.key === 'ArrowLeft') stepActLightbox(-1);
      else if (e.key === 'ArrowRight') stepActLightbox(1);
    });
  }
  actLbImages = images || [];
  actLbIndex = Math.max(0, Math.min(index || 0, Math.max(0, actLbImages.length - 1)));
  actLightbox.classList.toggle('single', actLbImages.length <= 1);
  renderActLightbox();
  actLightbox.classList.add('open');
}
function renderActLightbox() {
  if (!actLightbox) return;
  actLightbox.querySelector('.act-lightbox-img').src = actLbImages[actLbIndex] || '';
  actLightbox.querySelector('.act-lb-counter').textContent = (actLbImages.length ? (actLbIndex + 1) : 0) + ' / ' + actLbImages.length;
}
function stepActLightbox(delta) {
  if (!actLbImages.length) return;
  actLbIndex = (actLbIndex + delta + actLbImages.length) % actLbImages.length;
  renderActLightbox();
}
function closeActLightbox() {
  if (actLightbox) actLightbox.classList.remove('open');
}

function syncSegUI() {
  const seg = document.getElementById('act-seg');
  if (!seg) return;
  seg.querySelectorAll('.act-seg-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === actSelectedCat));
}

function actResetForm() {
  actEditingId = null;
  actDraftImages = [];
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  if (t) t.value = '';
  if (d) d.value = '';
  actSelectedCat = ACT_CATEGORIES[0].id;
  syncSegUI();
  renderActThumbs();
  const save = document.getElementById('act-save'), cancel = document.getElementById('act-cancel');
  if (save) save.textContent = '添加活动';
  if (cancel) cancel.hidden = true;
}

function openActModal() {
  const modal = document.getElementById('actModal');
  if (!modal) return;
  renderActForm();
  const titleEl = document.getElementById('actModalTitle');
  if (titleEl) titleEl.textContent = actEditingId ? '编辑活动' : '添加活动';
  modal.classList.add('open');
  const dlg = modal.querySelector('.act-modal-dialog');
  if (dlg) dlg.focus();
}

function closeActForm() {
  const modal = document.getElementById('actModal');
  if (modal) modal.classList.remove('open');
  actResetForm();
}

function actOpenAdd() {
  actResetForm();
  if (actTab !== 'all') actSelectedCat = actTab;
  syncSegUI();
  openActModal();
}

function actSave() {
  const wasEdit = !!actEditingId;
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  const title = t.value.trim();
  if (!title) { showToast('请填写标题'); if (t) t.focus(); return; }
  const detail = d.value.trim();
  const list = readActivities();
  if (actEditingId) {
    const a = list.find(x => x.id === actEditingId);
    if (a) { a.title = title; a.category = actSelectedCat; a.detail = detail; a.images = actDraftImages.slice(); a.updatedAt = Date.now(); }
  } else {
    list.unshift({ id: uid(), title, category: actSelectedCat, detail, images: actDraftImages.slice(), createdAt: Date.now(), updatedAt: Date.now() });
  }
  writeActivities(list);
  actResetForm();
  renderActTabs();
  renderActList();
  closeActForm();
  showToast(wasEdit ? '已更新' : '已添加');
}

function actStartEdit(id) {
  const a = readActivities().find(x => x.id === id);
  if (!a) return;
  // 先置状态，再渲染（renderActForm 会重建表单，必须在渲染后回填）
  actEditingId = id;
  actDraftImages = (a.images || []).slice();
  actSelectedCat = a.category;
  openActModal();
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  if (t) t.value = a.title;
  if (d) d.value = a.detail || '';
  syncSegUI();
  renderActThumbs();
  const save = document.getElementById('act-save'), cancel = document.getElementById('act-cancel');
  if (save) save.textContent = '保存修改';
  if (cancel) cancel.hidden = false;
  if (t) t.focus();
}

function bindActivities() {
  const tabs = document.getElementById('act-tabs');
  const form = document.getElementById('act-form-container');
  const list = document.getElementById('act-list');
  const addBtn = document.getElementById('actAddBtn');
  const modal = document.getElementById('actModal');

  if (tabs) {
    tabs.addEventListener('click', e => {
      const t = e.target.closest('.act-tab');
      if (!t) return;
      actTab = t.dataset.tab;
      if (actTab !== 'all') actSelectedCat = actTab;
      renderActTabs();
      syncSegUI();
      renderActList();
    });
  }

  if (addBtn) addBtn.addEventListener('click', actOpenAdd);

  if (modal) {
    modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeActForm(); });
    modal.addEventListener('keydown', e => { if (e.key === 'Escape') closeActForm(); });
  }

  if (form) {
    form.addEventListener('click', e => {
      const segBtn = e.target.closest('.act-seg-btn');
      if (segBtn) { actSelectedCat = segBtn.dataset.cat; syncSegUI(); return; }
      if (e.target.closest('#act-img-add')) { const f = document.getElementById('act-file'); if (f) f.click(); return; }
      const rm = e.target.closest('.act-thumb-remove');
      if (rm) {
        const i = parseInt(rm.dataset.idx, 10);
        if (!isNaN(i)) { actDraftImages.splice(i, 1); renderActThumbs(); }
        return;
      }
      if (e.target.closest('#act-save')) { actSave(); return; }
      if (e.target.closest('#act-cancel')) { closeActForm(); return; }
    });

    const fileEl = document.getElementById('act-file');
    if (fileEl) {
      fileEl.addEventListener('change', async e => {
        const files = Array.from(e.target.files || []);
        for (const f of files) {
          try { const d = await compressImage(f); actDraftImages.push(d); }
          catch (err) { showToast('图片处理失败'); }
        }
        renderActThumbs();
        e.target.value = '';
      });
    }
  }

  if (list) {
    list.addEventListener('click', e => {
      const img = e.target.closest('.act-card-img');
      if (img) {
        const card = img.closest('.act-card');
        const imgs = card ? [...card.querySelectorAll('.act-card-img')].map(i => i.getAttribute('src')) : [img.getAttribute('src')];
        const idx = imgs.indexOf(img.getAttribute('src'));
        openActLightbox(imgs, idx < 0 ? 0 : idx);
        return;
      }
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const id = btn.dataset.id, act = btn.dataset.act;
      if (act === 'edit') { actStartEdit(id); }
      else if (act === 'delete') {
        if (typeof confirm === 'function' && !confirm('确定删除该活动？')) return;
        const arr = readActivities().filter(x => x.id !== id);
        writeActivities(arr);
        if (actEditingId === id) actResetForm();
        renderActTabs();
        renderActList();
        showToast('已删除');
      }
    });
  }
}

// 二级类目：活动列表（标题 + 类别 + 详情 + 图片；全部/分类页签；弹窗新增）

      <div class="page-title">活动列表</div>
      <div class="page-desc">果然鲜 · 全品类活动记录（支持图片）</div>

function loadDailyCheck() {

function saveDailyCheck() {

function renderDailyCheckList() {
  const list = document.getElementById('dcList');
  if (!list) return;
  if (!dailyCheckList.length) {
    list.innerHTML = '<li class="dc-empty">还没有检查项，点「＋ 添加检查项」开始记录</li>';
  } else {
    list.innerHTML = dailyCheckList.map(it => `
      <li class="dc-item ${it.done ? 'done' : ''}" data-id="${it.id}">
        <button class="dc-check" data-act="toggle" title="标记完成">${it.done ? '✅' : '⬜'}</button>
        <span class="dc-text">${escapeHtml(it.text)}</span>
        <button class="dc-del" data-act="del" title="删除">✕</button>
      </li>`).join('');
  }
  const total = dailyCheckList.length;
  const done = dailyCheckList.filter(i => i.done).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const fill = document.getElementById('dcFill');
  if (fill) fill.style.width = pct + '%';
  const pt = document.getElementById('dcProgressText');
  if (pt) pt.textContent = '已完成 ' + done + '/' + total;
}
function bindDailyCheck() {
  const list = document.getElementById('dcList');
  const addBtn = document.getElementById('dcAdd');
  const addRow = document.getElementById('dcAddRow');
  const input = document.getElementById('dcInput');
  const addConfirm = document.getElementById('dcAddConfirm');
  const resetBtn = document.getElementById('dcReset');
  if (addBtn) addBtn.addEventListener('click', () => { if (addRow) addRow.hidden = !addRow.hidden; if (input) input.focus(); });
  if (addConfirm) addConfirm.addEventListener('click', () => {
    const v = (input && input.value || '').trim();
    if (!v) { if (input) input.focus(); return; }
    dailyCheckList.push({ id: uid(), text: v, done: false });
    saveDailyCheck(); renderDailyCheckList();
    if (input) input.value = '';
    if (addRow) addRow.hidden = true;
  });
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') addConfirm.click(); });
  if (resetBtn) resetBtn.addEventListener('click', () => {
    dailyCheckList.forEach(i => i.done = false); saveDailyCheck(); renderDailyCheckList(); showToast('已重置为未完成');
  });
  if (list) list.addEventListener('click', e => {
    const li = e.target.closest('.dc-item'); if (!li) return;
    const id = li.dataset.id;
    const actEl = e.target.closest('[data-act]');
    const act = actEl && actEl.dataset.act;
    const it = dailyCheckList.find(x => x.id === id); if (!it) return;
    if (act === 'toggle') { it.done = !it.done; saveDailyCheck(); renderDailyCheckList(); }
    else if (act === 'del') { dailyCheckList = dailyCheckList.filter(x => x.id !== id); saveDailyCheck(); renderDailyCheckList(); }
  });
}

// ---------- 渲染:待办列表 ----------
function getFilteredTodos() {
  let list = todos;
  if (filter === 'active') list = list.filter(t => !t.done);
  else if (filter === 'done') list = list.filter(t => t.done);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    list = list.filter(t => (t.title || '').toLowerCase().includes(q));
  }
  const prioOrder = { iq: 4, inq: 3, uq: 2, nuq: 1 };
  const sorted = [...list];
  if (memoSortMode === 'custom') {
    // 自定义顺序:按手动拖拽的 order 升序
    sorted.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  } else {
    // 按优先级:未完成在前,再按优先级(重要且紧急最前),同优先级按添加时间倒序(新添加的在前)
    sorted.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (prioOrder[b.priority] !== prioOrder[a.priority]) return prioOrder[b.priority] - prioOrder[a.priority];
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }
  return sorted;
}

function setMemoSortMode(mode) {
  memoSortMode = mode;
  localStorage.setItem('liumo_memo_sort', mode);

  renderTodoList();
}

function reorderTodos(fromId, toId) {
  const fromIdx = todos.findIndex(t => t.id === fromId);
  const toIdx = todos.findIndex(t => t.id === toId);
  if (fromIdx < 0 || toIdx < 0) return;
  const [moved] = todos.splice(fromIdx, 1);
  todos.splice(toIdx, 0, moved);
  todos.forEach((t, i) => { t.order = i; });
  saveTodos();
  renderTodoList();
}

function bindInspect() {
  const content = document.getElementById('content');
  if (!content) return;
  if (content._inspBound) { content.removeEventListener('click', content._inspClick); content.removeEventListener('change', content._inspChange); }
  content._inspClick = function(e) {
    const t = e.target;
    if (t.closest('[data-close]')) { const m = t.closest('.insp-modal'); if (m) m.classList.remove('open'); return; }
    const roleBtn = t.closest('.insp-role-btn'); if (roleBtn) { inspRole = roleBtn.dataset.role; document.querySelectorAll('.insp-role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === inspRole)); renderInspectBody(); return; }
    if (t.closest('#inspEmpManage')) { openInspEmp(); return; }
    if (t.closest('#inspNewBtn')) { openInspNew(); return; }
    if (t.closest('#inspNewImgAdd')) { const f = document.getElementById('inspNewFile'); if (f) f.click(); return; }
    if (t.closest('#inspNewSave')) { inspNewSave(); return; }
    const tr = t.closest('.insp-thumb-remove');
    if (tr) { const elId = tr.dataset.thumb, i = +tr.dataset.idx; if (elId==='inspNewThumbs') { inspDraftPhotos.splice(i,1); renderInspThumbs('inspNewThumbs', inspDraftPhotos); } else if (elId==='inspReplyThumbs') { inspReplyPhotos.splice(i,1); renderInspThumbs('inspReplyThumbs', inspReplyPhotos); } return; }
    const openBtn = t.closest('[data-act="open"]'); if (openBtn) { openInspDetail(openBtn.dataset.id); return; }
    const img = t.closest('.insp-card-img, .insp-detail-img, .insp-reply-img');
    if (img) { const tk = inspTickets.find(x => x.id === img.dataset.id); if (tk) openActLightbox(tk.photos, +img.dataset.idx); return; }
    if (t.closest('[data-act="confirm"]')) { inspConfirm(); return; }
    if (t.closest('[data-act="reject"]')) { inspReject(); return; }
    if (t.closest('[data-act="rectify"]')) { inspRectify(); return; }
    if (t.closest('#inspReplySend')) { inspReplySend(); return; }
    if (t.closest('#inspReplyImgAdd')) { const f = document.getElementById('inspReplyFile'); if (f) f.click(); return; }
    if (t.closest('#inspEmpAdd')) { inspAddEmp(); return; }
    const ed = t.closest('.insp-emp-del'); if (ed) { inspDelEmp(ed.dataset.emp); return; }
  };
  content._inspChange = function(e) {
    const t = e.target;
    if (t.id === 'inspFilterEmp') { inspFilterEmp = t.value; renderInspList(); }
    else if (t.id === 'inspFilterStatus') { inspFilterStatus = t.value; renderInspList(); }
    else if (t.id === 'inspEmpPick') { inspCurEmp = t.value; renderInspList(); }
  };
  content.addEventListener('click', content._inspClick);
  content.addEventListener('change', content._inspChange);
  if (!content._inspKey) {
    content._inspKey = function(e) { if (e.key === 'Escape') { const m = document.querySelector('.insp-modal.open'); if (m) m.classList.remove('open'); } };
    document.addEventListener('keydown', content._inspKey);
  }
  content._inspBound = true;
}

// ==================== 减肥打卡模块 ====================
const WEIGHT_LOGS_KEY = 'liumo_weight_logs';
const WEIGHT_SET_KEY = 'liumo_weight_settings';

function loadWeight() {
  try {
    const d = localStorage.getItem(WEIGHT_LOGS_KEY);
    weightLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(weightLogs)) weightLogs = [];
  } catch (e) { weightLogs = []; }
  try {
    const s = localStorage.getItem(WEIGHT_SET_KEY);
    if (s) {
      const o = JSON.parse(s);
      weightSettings = {
        target: (typeof o.target === 'number' && o.target > 0) ? o.target : null,
        height: (typeof o.height === 'number' && o.height > 0) ? o.height : null
      };
    }
  } catch (e) {}
  weightLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}

function saveWeightLogs() { localStorage.setItem(WEIGHT_LOGS_KEY, JSON.stringify(weightLogs)); }
function saveWeightSettings() { localStorage.setItem(WEIGHT_SET_KEY, JSON.stringify(weightSettings)); }

function weightAsc() { return [...weightLogs].sort((a, b) => (a.date || '').localeCompare(b.date || '')); }
function weightDesc() { return [...weightLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function bmiCategory(bmi) {
  if (bmi < 18.5) return '偏瘦';
  if (bmi < 24) return '正常';
  if (bmi < 28) return '偏胖';
  return '肥胖';
}
function statCard(label, value, cls) {
  return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value ${cls || ''}">${value}</div></div>`;
}

function renderWeightStats() {
  const el = document.getElementById('wtStats');
  if (!el) return;
  const asc = weightAsc();
  const desc = weightDesc();
  const current = desc.length ? desc[0].weight : null;
  const start = asc.length ? asc[0].weight : null;
  const target = weightSettings.target;
  const height = weightSettings.height;
  const lost = (start != null && current != null) ? +(start - current).toFixed(1) : null;
  const toTarget = (current != null && target != null) ? +(current - target).toFixed(1) : null;
  const bmi = (current != null && height) ? +(current / Math.pow(height / 100, 2)).toFixed(1) : null;

  const cards = [];
  cards.push(statCard('当前体重', current != null ? current + ' kg' : '—', 'primary'));
  cards.push(statCard('起始体重', start != null ? start + ' kg' : '—', ''));
  cards.push(statCard('已减', lost != null ? (lost >= 0 ? '−' : '+') + Math.abs(lost) + ' kg' : '—', lost != null && lost > 0 ? 'success' : ''));
  cards.push(statCard('距目标', toTarget != null ? (toTarget > 0 ? '还差 ' + toTarget + ' kg' : (toTarget < 0 ? '已超标 ' + Math.abs(toTarget) + ' kg' : '已达成 🎉')) : '—', target != null && toTarget <= 0 ? 'success' : 'warning'));
  if (bmi != null) cards.push(statCard('BMI', bmi + ' · ' + bmiCategory(bmi), ''));
  cards.push(statCard('记录天数', weightLogs.length + ' 天', ''));
  el.innerHTML = cards.join('');
}

function buildWeightChartSVG(logs) {
  const W = 600, H = 240, padL = 40, padR = 16, padT = 16, padB = 28;
  const weights = logs.map(l => l.weight);
  let min = Math.min(...weights), max = Math.max(...weights);
  if (weightSettings.target != null) { min = Math.min(min, weightSettings.target); max = Math.max(max, weightSettings.target); }
  if (min === max) { min -= 1; max += 1; }
  const range = max - min;
  const pad = range * 0.12;
  min -= pad; max += pad;
  const n = logs.length;
  const xOf = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
  const yOf = w => H - padB - ((w - min) / (max - min)) * (H - padT - padB);

  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const gy = padT + k * (H - padT - padB) / 3;
    const val = (max - (k / 3) * (max - min)).toFixed(1);
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${val}</text>`;
  }

  const pts = logs.map((l, i) => ({ x: xOf(i), y: yOf(l.weight), l }));
  const line = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => {
    const prev = i > 0 ? logs[i - 1].weight : null;
    const delta = prev != null ? (p.l.weight - prev) : null;
    const tip = `${escapeHtml(p.l.date)}  ${p.l.weight}kg` + (delta != null ? `  (${delta >= 0 ? '+' : ''}${delta.toFixed(1)})` : '');
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#6366f1" stroke="#fff" stroke-width="2"><title>${tip}</title></circle>`;
  }).join('');

  let targetLine = '';
  if (weightSettings.target != null) {
    const ty = yOf(weightSettings.target);
    targetLine = `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${W - padR}" y2="${ty.toFixed(1)}" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - padR}" y="${(ty - 6).toFixed(1)}" text-anchor="end" font-size="10" fill="#10b981">目标 ${weightSettings.target}kg</text>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}<polyline points="${line}" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round"/>${targetLine}${dots}</svg>`;
}

function renderWeightChart() {
  const el = document.getElementById('wtChart');
  if (!el) return;
  const logs = weightAsc();
  el.innerHTML = logs.length === 0
    ? `<div class="wt-empty">还没有体重记录,先在上方记录今天的体重吧</div>`
    : buildWeightChartSVG(logs);
}

function renderWeightMonthChart() {
  const el = document.getElementById('wtMonthChart');
  if (!el) return;
  const cutoff = new Date(Date.now() - 30 * 86400000);
  const cutoffStr = `${cutoff.getFullYear()}-${('0' + (cutoff.getMonth() + 1)).slice(-2)}-${('0' + cutoff.getDate()).slice(-2)}`;
  const logs = weightAsc().filter(l => l.date >= cutoffStr);
  el.innerHTML = logs.length === 0
    ? `<div class="wt-empty">近 30 天暂无体重记录</div>`
    : buildWeightChartSVG(logs);
}

function renderWeightList() {
  const el = document.getElementById('wtList');
  if (!el) return;
  const logs = weightDesc();
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">暂无记录</div>`;
    return;
  }
  el.innerHTML = logs.map((l, i) => {
    const prev = i < logs.length - 1 ? logs[i + 1].weight : null;
    const delta = prev != null ? (l.weight - prev) : null;
    const deltaHtml = delta == null ? '<span class="wt-delta neutral">—</span>'
      : delta === 0 ? '<span class="wt-delta neutral">±0</span>'
      : delta < 0 ? `<span class="wt-delta down">▼ ${Math.abs(delta).toFixed(1)}</span>`
      : `<span class="wt-delta up">▲ ${delta.toFixed(1)}</span>`;
    return `
      <div class="wt-item" data-id="${l.id}">
        <div class="wt-item-date">${escapeHtml(l.date)}</div>
        <div class="wt-item-weight">${l.weight}<span class="wt-unit">kg</span></div>

function buildSalaryLineSVG(logs, getVal, color, unit) {
  const W = 640, H = 210, padL = 54, padR = 14, padT = 12, padB = 28;
  const all = logs.map(getVal).filter(v => v != null && isFinite(v));
  if (all.length === 0) return `<div class="wt-empty" style="padding:18px 0;">暂无数据</div>`;
  let vMin = Math.min.apply(null, all), vMax = Math.max.apply(null, all);
  if (vMin === vMax) { const pad = Math.max(1, Math.abs(vMax) * 0.1 || 1); vMin -= pad; vMax += pad; }
  const vRange = vMax - vMin;
  const n = logs.length;
  const xOf = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
  const yOf = v => H - padB - ((v - vMin) / vRange) * (H - padT - padB);
  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const gy = padT + k * (H - padT - padB) / 3;
    const val = vMax - (k / 3) * vRange;
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${Math.round(val)}</text>`;
  }
  let line = '', dots = '', prev = false;
  logs.forEach((l, i) => {
    const v = getVal(l);
    if (v == null || !isFinite(v)) { prev = false; return; }
    const x = xOf(i), y = yOf(v);
    line += (prev ? ' ' : '') + x.toFixed(1) + ',' + y.toFixed(1);
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}" stroke="#fff" stroke-width="1.5"><title>${escapeHtml(l.date)} ${Math.round(v)}${unit}</title></circle>`;
    prev = true;
  });
  let xlab = '';
  const step = Math.max(1, Math.ceil(n / 6));
  logs.forEach((l, i) => {
    if (i % step === 0 || i === n - 1) {
      const x = xOf(i);
      xlab += `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#9ca3af">${escapeHtml(l.date.slice(5))}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}<polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xlab}</svg>`;
}

function renderCostStats() {
  const el = document.getElementById('coStats');
  if (!el) return;
  const w = costWindowLogs();
  const desc = costDesc();
  const last = desc.length ? desc[0] : null;
  const sumSale = w.reduce((s, l) => s + (l.sale || 0), 0);
  const sumCost = w.reduce((s, l) => s + (l.cost || 0), 0);
  const sumLoss = w.reduce((s, l) => s + (l.loss || 0), 0);
  const sumGross = sumSale - sumCost - sumLoss;
  const avgMargin = sumSale > 0 ? sumGross / sumSale : null;
  // 上月：取最近一个自然月（可能含多条品类记录）汇总
  const lastMonth = last ? (last.date || '').slice(0, 7) : null;
  const lastRecs = lastMonth ? desc.filter(l => (l.date || '').slice(0, 7) === lastMonth) : [];
  const lastSale = lastRecs.reduce((s, l) => s + (l.sale || 0), 0);
  const lastGross = lastRecs.reduce((s, l) => s + grossOf(l), 0);
  const lastMargin = lastSale > 0 ? lastGross / lastSale : null;
  const money = v => Math.round(v).toLocaleString() + ' 元';
  const pct = v => v != null ? (v * 100).toFixed(1) + '%' : '—';
  const marginCls = v => (v != null && v >= 0) ? 'success' : 'warning';
  const cards = [];
  cards.push(statCard('上月销售额', lastSale != null ? money(lastSale) : '—', ''));
  cards.push(statCard('上月毛利', lastGross != null ? money(lastGross) : '—', 'success'));
  cards.push(statCard('上月毛利率', pct(lastMargin), lastMargin != null ? marginCls(lastMargin) : ''));

  cards.push(statCard('近一年平均毛利率', pct(avgMargin), avgMargin != null ? marginCls(avgMargin) : ''));
  cards.push(statCard('近一年总损耗', money(sumLoss), 'warning'));
  el.innerHTML = cards.join('');
}

function renderCostCategory() {
  const el = document.getElementById('coCat');
  if (!el) return;
  const w = costWindowLogs();
  const map = {};
  w.forEach(l => {
    const c = ((l.category || '').trim()) || '未分类';
    if (!map[c]) map[c] = { sale: 0, cost: 0, loss: 0 };
    map[c].sale += (l.sale || 0);
    map[c].cost += (l.cost || 0);
    map[c].loss += (l.loss || 0);
  });
  const rows = Object.keys(map).map(c => {
    const m = map[c];
    const gross = m.sale - m.cost - m.loss;
    const margin = m.sale > 0 ? gross / m.sale : null;
    return { c, sale: m.sale, cost: m.cost, loss: m.loss, gross, margin };
  }).sort((a, b) => b.gross - a.gross);
  if (rows.length === 0) {
    el.innerHTML = `<div class="wt-empty">暂无数据</div>`;
    return;
  }
  const maxAbs = Math.max.apply(null, rows.map(r => Math.abs(r.gross))) || 1;
  const money = v => Math.round(v).toLocaleString();
  const pct = v => v != null ? (v * 100).toFixed(1) + '%' : '—';
  el.innerHTML = `
    <table class="wt-cat">
      <thead><tr><th>品类</th><th>销售额</th><th>进货成本</th><th>损耗</th><th>毛利</th><th>毛利率</th></tr></thead>
      <tbody>
        ${rows.map(r => {
          const share = Math.max(0, r.gross) / maxAbs * 100;
          const color = r.gross >= 0 ? '#10b981' : '#ef4444';
          return `<tr>
            <td>${escapeHtml(r.c)}</td>
            <td>${money(r.sale)}</td>
            <td>${money(r.cost)}</td>
            <td>${money(r.loss)}</td>
            <td><div class="cat-gross"><span>${money(r.gross)}</span><span class="bar"><i style="width:${share.toFixed(1)}%;background:${color}"></i></span></div></td>
            <td>${pct(r.margin)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function bindCostEvents() {
  const addBtn = document.getElementById('costAddBtn');
  const monthEl = document.getElementById('costMonth');
  const catEl = document.getElementById('costCat');
  const costEl = document.getElementById('costCost');
  const saleEl = document.getElementById('costSale');
  const lossEl = document.getElementById('costLoss');
  const list = document.getElementById('coList');

  function addLog() {
    const date = monthEl.value || currentMonthStr();
    const category = (catEl.value || '').trim() || '未分类';
    const cost = parseFloat(costEl.value);
    const sale = parseFloat(saleEl.value);
    const loss = parseFloat(lossEl.value) || 0;
    if (isNaN(cost) || cost < 0) { showToast('请输入有效进货成本'); costEl.focus(); return; }
    if (isNaN(sale) || sale < 0) { showToast('请输入有效销售额'); saleEl.focus(); return; }
    if (loss < 0) { showToast('损耗金额不能为负'); lossEl.focus(); return; }
    // 同月同品类合并为一条
    const exist = costLogs.find(l => l.date === date && ((l.category || '未分类') === category));
    if (exist) {
      exist.cost = cost; exist.sale = sale; exist.loss = loss; exist.updatedAt = Date.now();
    } else {
      costLogs.push({ id: uid(), date, category, cost, sale, loss, createdAt: Date.now(), updatedAt: Date.now() });
    }
    costLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveCostLogs();
    costEl.value = ''; saleEl.value = ''; lossEl.value = '0'; catEl.value = '';
    renderCostStats();
    renderCostChart();
    renderCostCategory();
    renderCostList();
    showToast(exist ? '已更新该月该品类成本' : '已记录成本');
  }

  addBtn.addEventListener('click', addLog);
  [costEl, saleEl, lossEl].forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); }));

  if (list) {
    list.addEventListener('click', e => {
      const delBtn = e.target.closest('[data-action="co-del"]');
      const editBtn = e.target.closest('[data-action="co-edit"]');
      if (delBtn) {
        const id = delBtn.dataset.id;
        costLogs = costLogs.filter(l => l.id !== id);
        saveCostLogs();
        renderCostStats();
        renderCostChart();
        renderCostCategory();
        renderCostList();
        showToast('已删除该记录');
        return;
      }
      if (editBtn) {
        const rec = costLogs.find(l => l.id === editBtn.dataset.id);
        if (rec) {
          monthEl.value = rec.date;
          catEl.value = rec.category || '';
          costEl.value = rec.cost;
          saleEl.value = (rec.sale != null ? rec.sale : '');
          lossEl.value = (rec.loss != null ? rec.loss : 0);
          costEl.focus();
          renderCostList();
          showToast('已载入该记录,修改后点「记录成本」即可更新');
        }
      }
    });
  }
}

// ==================== 废品记录模块 ====================
const SCRAP_LOGS_KEY = 'liumo_scrap_logs';
const SCRAP_SETTLED_KEY = 'liumo_scrap_settled';

function loadScrap() {
  try {
    const d = localStorage.getItem(SCRAP_LOGS_KEY);
    scrapLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(scrapLogs)) scrapLogs = [];
  } catch (e) { scrapLogs = []; }
  try {
    const d = localStorage.getItem(SCRAP_SETTLED_KEY);
    scrapSettled = d ? JSON.parse(d) : {};
    if (typeof scrapSettled !== 'object' || !scrapSettled) scrapSettled = {};
  } catch (e) { scrapSettled = {}; }
  // 兼容旧版“整月快照”格式: 没有 date 字段的视为结算到月末(保持已结算状态)
  Object.keys(scrapSettled).forEach(m => {
    const raw = scrapSettled[m];
    if (raw && typeof raw === 'object' && !raw.date) raw.date = scrapMonthEndStr(m);
  });
  scrapLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function saveScrapLogs() { localStorage.setItem(SCRAP_LOGS_KEY, JSON.stringify(scrapLogs)); }
function saveScrapSettled() { localStorage.setItem(SCRAP_SETTLED_KEY, JSON.stringify(scrapSettled)); }
function scrapAsc() { return [...scrapLogs].sort((a, b) => (a.date || '').localeCompare(b.date || '')); }
function scrapDesc() { return [...scrapLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
function monthOf(d) { return (d || '').slice(0, 7); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

// 各月汇总: { 'YYYY-MM': { count, total } }
function scrapMonthMap() {
  const map = {};
  scrapAsc().forEach(l => {
    const m = monthOf(l.date);
    if (!map[m]) map[m] = { count: 0, total: 0 };
    map[m].count++;
    map[m].total += (l.amount || 0);
  });
  return map;
}
// 月份最后一天, 如 '2026-02' -> '2026-02-28'
function scrapMonthEndStr(m) {
  const [y, mo] = m.split('-').map(Number);
  const last = new Date(y, mo, 0).getDate();
  return m + '-' + ('0' + last).slice(-2);
}
// 结算截止日默认: 当月=今天; 过去月=月末(整月结清); 未来月=月初
function scrapSettleDefaultDate(m) {
  const now = new Date();
  const cur = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
  if (m === cur) return todayStr();
  if (m < cur) return scrapMonthEndStr(m);
  return m + '-01';
}
// 某月在结算口径下的拆分: 以结算截止日(date)为准, 截止日及之前的记录算已结算, 之后的留未结算
function scrapMonthSettledParts(m) {
  const recs = scrapLogs.filter(l => monthOf(l.date) === m);
  let total = 0, count = 0;
  recs.forEach(l => { total += (l.amount || 0); count++; });
  const raw = scrapSettled[m];
  if (!raw || !raw.date) {
    return { isSettled: false, settleDate: '', settledTotal: 0, settledCount: 0, unsettledTotal: total, unsettledCount: count };
  }
  const cutoff = raw.date;
  let st = 0, sc = 0;
  recs.forEach(l => { if (l.date <= cutoff) { st += (l.amount || 0); sc++; } });
  return { isSettled: true, settleDate: cutoff, settledTotal: st, settledCount: sc, unsettledTotal: total - st, unsettledCount: count - sc };
}

function renderScrapStats() {
  const el = document.getElementById('scStats');
  if (!el) return;
  const all = scrapAsc();
  const now = new Date();
  const curMonth = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
  const start = new Date(now.getFullYear(), now.getMonth() - 11, 1);
  const cutoffStr = start.getFullYear() + '-' + ('0' + (start.getMonth() + 1)).slice(-2);
  const last12 = all.filter(l => monthOf(l.date) >= cutoffStr);
  const curRecs = all.filter(l => monthOf(l.date) === curMonth);
  const curSum = curRecs.reduce((s, l) => s + (l.amount || 0), 0);
  const sum12 = last12.reduce((s, l) => s + (l.amount || 0), 0);

  // 已结算 / 未结算分离（按结算日期口径,结算后新增更晚记录算未结算）
  const monthSet = {};
  last12.forEach(l => { monthSet[monthOf(l.date)] = true; });
  let settledSum = 0, unsettledSum = 0, unsettledMonths = 0;
  Object.keys(monthSet).forEach(m => {
    const p = scrapMonthSettledParts(m);
    settledSum += p.settledTotal;
    unsettledSum += p.unsettledTotal;
    if (p.unsettledTotal > 0) unsettledMonths++;
  });

  const money = v => Math.round(v).toLocaleString() + ' 元';
  const cards = [];
  cards.push(statCard('本月金额', money(curSum), 'success'));
  cards.push(statCard('本月笔数', curRecs.length + ' 笔', ''));
  cards.push(statCard('近一年总金额', money(sum12), 'success'));
  cards.push(statCard('近一年笔数', last12.length + ' 笔', ''));
  cards.push(statCard('已结算金额', money(settledSum), 'success'));
  cards.push(statCard('未结算金额', money(unsettledSum), unsettledSum > 0 ? 'warning' : 'success'));
  cards.push(statCard('未结算月份', unsettledMonths + ' 个月', unsettledMonths > 0 ? 'warning' : 'success'));
  el.innerHTML = cards.join('');
}

  const el = document.getElementById('scMonth');

function bindScrapEvents() {
  const addBtn = document.getElementById('scrapAddBtn');
  const dateEl = document.getElementById('scrapDate');
  const amountEl = document.getElementById('scrapAmount');
  const noteEl = document.getElementById('scrapNote');
  const list = document.getElementById('scList');
  const monthEl = document.getElementById('scMonth');

  const ADD_LABEL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="sc-add-label">记录废品</span>';
  const EDIT_LABEL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="sc-add-label">更新记录</span>';

  function refreshAll() {
    renderScrapStats();
    renderScrapMonth();
    renderScrapList();
  }

  function addLog() {
    const date = dateEl.value || todayStr();
    const amount = parseFloat(amountEl.value);
    const note = (noteEl.value || '').trim();
    if (isNaN(amount) || amount < 0) { showToast('请输入有效金额'); amountEl.focus(); return; }
    // 去重时排除正在编辑的记录本身
    const dup = scrapLogs.find(l => l.id !== scrapEditingId && l.date === date && l.amount === amount && ((l.note || '') === note));
    if (dup) { showToast('该日期已存在相同记录'); return; }

    if (scrapEditingId) {
      const rec = scrapLogs.find(l => l.id === scrapEditingId);
      if (rec) {
        rec.date = date; rec.amount = amount; rec.note = note; rec.updatedAt = Date.now();
        saveScrapLogs();
        showToast('已更新该记录');
      }
      scrapEditingId = null;
      addBtn.innerHTML = ADD_LABEL;
    } else {
      scrapLogs.push({ id: uid(), date, amount, note, createdAt: Date.now(), updatedAt: Date.now() });
      saveScrapLogs();
      showToast('已记录废品');
    }
    scrapLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    amountEl.value = ''; noteEl.value = '';
    refreshAll();
  }

  addBtn.addEventListener('click', addLog);
  amountEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });

  if (list) {
    list.addEventListener('click', e => {
      const delBtn = e.target.closest('[data-action="sc-del"]');
      const editBtn = e.target.closest('[data-action="sc-edit"]');
      if (delBtn) {
        const id = delBtn.dataset.id;
        scrapLogs = scrapLogs.filter(l => l.id !== id);
        saveScrapLogs();
        refreshAll();
        showToast('已删除该记录');
        return;
      }
      if (editBtn) {
        const rec = scrapLogs.find(l => l.id === editBtn.dataset.id);
        if (rec) {
          scrapEditingId = rec.id;
          dateEl.value = rec.date;
          amountEl.value = rec.amount;
          noteEl.value = rec.note || '';
          addBtn.innerHTML = EDIT_LABEL;
          amountEl.focus();
          showToast('已载入该记录,修改后点「更新记录」即可');
        }
      }
    });
  }

  if (monthEl) {
    monthEl.addEventListener('click', e => {
      // 开始结算: 进入该月截止日选择(结算始终可点, 用于设置/修改截止日)
      const settleBtn = e.target.closest('[data-action="sc-settle"]');
      if (settleBtn && !settleBtn.disabled) {
        scrapSettleMonth = settleBtn.dataset.month;
        renderScrapMonth();
        return;
      }
      // 取消选择截止日
      const cancelBtn = e.target.closest('[data-action="sc-settle-cancel"]');
      if (cancelBtn) {
        scrapSettleMonth = null;
        renderScrapMonth();
        return;
      }
      // 确认结算: 以所选截止日结算(截止日及之前的当月记录算已结算)
      const confirmBtn = e.target.closest('[data-action="sc-settle-confirm"]');
      if (confirmBtn && !confirmBtn.disabled) {
        const m = confirmBtn.dataset.month;
        const input = monthEl.querySelector('.sc-settle-date[data-month="' + m + '"]');
        const d = input ? input.value : '';
        if (!d || !d.startsWith(m)) { showToast('结算日期需在 ' + m + ' 当月内'); return; }
        scrapSettled[m] = { date: d };
        scrapSettleMonth = null;
        saveScrapSettled();
        refreshAll();
        showToast('已结算 ' + m + ' 截止 ' + d);
        return;
      }
      // 取消结算: 清除该月结算状态
      const unsettleBtn = e.target.closest('[data-action="sc-unsettle"]');
      if (unsettleBtn && !unsettleBtn.disabled) {
        const m = unsettleBtn.dataset.month;
        delete scrapSettled[m];
        scrapSettleMonth = null;
        saveScrapSettled();
        refreshAll();
        showToast('已取消结算 ' + m);
        return;
      }
    });
  }
}

const ROPE_LOGS_KEY = 'liumo_rope_logs';
let ropeLogs = [];  // { id, date:'YYYY-MM-DD', count:Number, createdAt, updatedAt }

function loadRope() {
  try {
    const d = localStorage.getItem(ROPE_LOGS_KEY);
    ropeLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(ropeLogs)) ropeLogs = [];
  } catch (e) { ropeLogs = []; }
  ropeLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function saveRopeLogs() { localStorage.setItem(ROPE_LOGS_KEY, JSON.stringify(ropeLogs)); }
function ropeAsc() { return [...ropeLogs].sort((a, b) => (a.date || '').localeCompare(b.date || '')); }
function ropeDesc() { return [...ropeLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
function ropeMonthPrefix() {
  const d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
}

function renderRopeStats() {
  const el = document.getElementById('rpStats');
  if (!el) return;
  const monthPrefix = ropeMonthPrefix();
  const thisMonth = ropeLogs.filter(l => (l.date || '').slice(0, 7) === monthPrefix);
  const days = new Set(thisMonth.map(l => l.date)).size;
  const avg = thisMonth.length ? Math.round(thisMonth.reduce((s, l) => s + (l.count || 0), 0) / thisMonth.length) : null;
  const best = ropeLogs.length ? Math.max.apply(null, ropeLogs.map(l => l.count || 0)) : null;
  const total = ropeLogs.reduce((s, l) => s + (l.count || 0), 0);
  const cards = [];
  cards.push(statCard('本月记录天数', days + ' 天', 'primary'));
  cards.push(statCard('本月平均个数', avg != null ? avg + ' 个' : '—', ''));
  cards.push(statCard('历史最好成绩', best != null ? best + ' 个' : '—', best != null ? 'success' : ''));
  cards.push(statCard('累计跳绳个数', total > 0 ? total.toLocaleString() + ' 个' : '—', ''));
  el.innerHTML = cards.join('');
}

function buildRopeChartSVG(logs) {
  const W = 620, H = 260, padL = 44, padR = 24, padT = 18, padB = 34;
  const counts = logs.map(l => l.count);
  let cMin = Math.min.apply(null, counts), cMax = Math.max.apply(null, counts);
  if (cMin === cMax) { cMin = Math.max(0, cMin - 20); cMax += 20; }
  const cRange = cMax - cMin;
  const n = logs.length;
  const xOf = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
  const yOf = v => H - padB - ((v - cMin) / cRange) * (H - padT - padB);
  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const gy = padT + k * (H - padT - padB) / 3;
    const val = cMax - (k / 3) * cRange;
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${Math.round(val)}</text>`;
  }
  const best = Math.max.apply(null, counts);
  const pts = logs.map((l, i) => ({ x: xOf(i), y: yOf(l.count), l }));
  const line = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.l.count === best ? 4.5 : 3.5}" fill="${p.l.count === best ? '#f43f5e' : '#10b981'}" stroke="#fff" stroke-width="2"><title>${escapeHtml(p.l.date)} ${p.l.count}个${p.l.count === best ? ' · 最好成绩' : ''}</title></circle>`).join('');
  let xlab = '';
  const step = Math.max(1, Math.ceil(n / 6));
  logs.forEach((l, i) => {
    if (i % step === 0 || i === n - 1) {
      const x = xOf(i);
      xlab += `<text x="${x.toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#9ca3af">${escapeHtml(l.date.slice(5))}</text>`;
    }
  });
  const legend = `<g font-size="11"><rect x="${padL}" y="0" width="10" height="10" rx="2" fill="#10b981"/><text x="${padL + 14}" y="9" fill="#6b7280">跳绳(个)</text><rect x="${padL + 110}" y="0" width="10" height="10" rx="2" fill="#f43f5e"/><text x="${padL + 124}" y="9" fill="#6b7280">最好成绩</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}${legend}<polyline points="${line}" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xlab}</svg>`;
}

function renderRopeChart() {
  const el = document.getElementById('rpChart');
  if (!el) return;
  const logs = ropeAsc();
  el.innerHTML = logs.length === 0
    ? `<div class="wt-empty">还没有跳绳记录,先在上方记录一下吧</div>`
    : buildRopeChartSVG(logs);
}

function bindRopeEvents() {
  const addBtn = document.getElementById('ropeAddBtn');
  const dateEl = document.getElementById('ropeDate');
  const countEl = document.getElementById('ropeCount');
  const list = document.getElementById('rpList');

  function addLog() {
    const date = dateEl.value || todayStr();
    const count = parseFloat(countEl.value);
    if (isNaN(count) || count < 0) { showToast('请输入有效跳绳个数'); countEl.focus(); return; }
    const exist = ropeLogs.find(l => l.date === date);
    if (exist) {
      exist.count = count; exist.updatedAt = Date.now();
    } else {
      ropeLogs.push({ id: uid(), date, count, createdAt: Date.now(), updatedAt: Date.now() });
    }
    ropeLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveRopeLogs();
    countEl.value = '';
    renderRopeStats();
    renderRopeChart();
    renderRopeList();
    showToast(exist ? '已更新该日记录' : '已记录跳绳');
  }

  addBtn.addEventListener('click', addLog);
  countEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });

  if (list) {
    list.addEventListener('click', e => {
      const delBtn = e.target.closest('[data-action="rp-del"]');
      const editBtn = e.target.closest('[data-action="rp-edit"]');
      if (delBtn) {
        const id = delBtn.dataset.id;
        ropeLogs = ropeLogs.filter(l => l.id !== id);
        saveRopeLogs();
        renderRopeStats();
        renderRopeChart();
        renderRopeList();
        showToast('已删除该记录');
        return;
      }
      if (editBtn) {
        const rec = ropeLogs.find(l => l.id === editBtn.dataset.id);
        if (rec) {
          dateEl.value = rec.date;
          countEl.value = rec.count;
          countEl.focus();
          renderRopeList();
          showToast('已载入该记录,修改个数后点「记录跳绳」即可更新');
        }
      }
    });
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ---------- 事件绑定 ----------
function bindTodoEvents() {
  // 添加待办(点击「添加待办」按钮弹出表单)
  const input = document.getElementById('todoInput');
  const addBtn = document.getElementById('todoAddBtn');
  const saveBtn = document.getElementById('todoSaveBtn');
  const cancelBtn = document.getElementById('todoCancelBtn');
  const prioritySelect = document.getElementById('prioritySelect');
  const modal = document.getElementById('todoModal');

  function openTodoModal() {
    modal.classList.add('open');
    input.value = '';
    prioritySelect.value = 'inq';
    setTimeout(() => input.focus(), 50);
  }
  function closeTodoModal() {
    modal.classList.remove('open');
  }

  function addTodo() {
    const title = input.value.trim();
    if (!title) {
      showToast('请输入待办内容');
      input.focus();
      return;
    }
    const maxOrder = todos.reduce((m, t) => Math.max(m, typeof t.order === 'number' ? t.order : 0), -1);
    todos.unshift({
      id: uid(),
      title,
      done: false,
      priority: prioritySelect.value,
      order: maxOrder + 1,
      createdAt: Date.now()
    });
    saveTodos();
    closeTodoModal();
    renderStats();
    renderTodoList();
  }

  addBtn.addEventListener('click', openTodoModal);
  saveBtn.addEventListener('click', addTodo);
  cancelBtn.addEventListener('click', closeTodoModal);
  modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeTodoModal(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
    if (e.key === 'Escape') closeTodoModal();
  });
  if (!_todoEscapeBound) {
    _todoEscapeBound = true;
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const m = document.getElementById('todoModal');
        if (m && m.classList.contains('open')) m.classList.remove('open');
      }
    });
  }

  // 筛选(仅带 data-filter 的按钮)
  document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.toggle('active', b === btn));
      renderTodoList();
    });
  });

  // 排序模式切换:按优先级 / 自定义顺序(可拖拽)
  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => setMemoSortMode(btn.dataset.sort));
  });

  // 搜索
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', () => {
    search = searchInput.value;
    renderTodoList();
  });

  // 清除已完成
  document.getElementById('clearDoneBtn').addEventListener('click', () => {
    const doneCount = todos.filter(t => t.done).length;
    if (doneCount === 0) {
      showToast('没有已完成的待办');
      return;
    }
    todos = todos.filter(t => !t.done);
    saveTodos();
    renderStats();
    renderTodoList();
    showToast(`已清除 ${doneCount} 条已完成待办`);
  });

  // 拖拽排序(仅自定义顺序模式)
  const listEl = document.getElementById('todoList');
  let dragId = null;
  listEl.addEventListener('dragstart', e => {
    const item = e.target.closest('.todo-item');
    if (!item || !item.hasAttribute('draggable')) return;
    dragId = item.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragId);
    setTimeout(() => item.classList.add('dragging'), 0);
  });
  listEl.addEventListener('dragend', e => {
    const item = e.target.closest('.todo-item');
    if (item) item.classList.remove('dragging');
    listEl.querySelectorAll('.todo-item').forEach(el => el.classList.remove('drag-over'));
    dragId = null;
  });
  listEl.addEventListener('dragover', e => {
    e.preventDefault();
    const item = e.target.closest('.todo-item');
    if (!item || !dragId || item.dataset.id === dragId) return;
    item.classList.add('drag-over');
  });
  listEl.addEventListener('dragleave', e => {
    const item = e.target.closest('.todo-item');
    if (item) item.classList.remove('drag-over');
  });
  listEl.addEventListener('drop', e => {
    e.preventDefault();
    const item = e.target.closest('.todo-item');
    if (!item || !dragId) return;
    const targetId = item.dataset.id;
    item.classList.remove('drag-over');
    if (targetId && targetId !== dragId) reorderTodos(dragId, targetId);
    dragId = null;
  });

  // 列表事件委托
  document.getElementById('todoList').addEventListener('click', e => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    const id = target.dataset.id;
    const todo = todos.find(t => t.id === id);
    if (!todo) return;

    if (action === 'toggle') {
      todo.done = !todo.done;
      saveTodos();
      renderStats();
      renderTodoList();
    } else if (action === 'edit') {
      editingId = id;
      renderTodoList();
      const editInput = document.getElementById(`editInput-${id}`);
      if (editInput) {
        editInput.focus();
        editInput.setSelectionRange(editInput.value.length, editInput.value.length);
      }
    } else if (action === 'delete') {
      todos = todos.filter(t => t.id !== id);
      saveTodos();
      renderStats();
      renderTodoList();
      showToast('已删除');
    } else if (action === 'save-edit') {
      const editInput = document.getElementById(`editInput-${id}`);
      const prioSel = document.getElementById(`editPriority-${id}`);
      const newTitle = editInput.value.trim();
      if (newTitle) {
        todo.title = newTitle;
        if (prioSel) todo.priority = prioSel.value;
        saveTodos();
      }
      editingId = null;
      renderTodoList();
    } else if (action === 'cancel-edit') {
      editingId = null;
      renderTodoList();
    }
  });

  // 编辑框回车保存、ESC 取消
  document.getElementById('todoList').addEventListener('keydown', e => {
    if (e.target.classList.contains('todo-edit-input')) {
      const id = e.target.id.replace('editInput-', '');
      if (e.key === 'Enter') {
        const todo = todos.find(t => t.id === id);
        const newTitle = e.target.value.trim();
        const prioSel = document.getElementById(`editPriority-${id}`);
        if (newTitle && todo) {
          todo.title = newTitle;
          if (prioSel) todo.priority = prioSel.value;
          saveTodos();
        }
        editingId = null;
        renderTodoList();
      } else if (e.key === 'Escape') {
        editingId = null;
        renderTodoList();
      }
    }
  });
}

// ===================== 云端同步（GitHub Gist） =====================
let SKIP_SYNC = false;
let syncTimer = null;
const SYNC_PREFIX = 'liumo_sync_';
const SYNC_TOKEN_KEY = SYNC_PREFIX + 'token';
const SYNC_GIST_KEY = SYNC_PREFIX + 'gist';
const SYNC_AUTO_KEY = SYNC_PREFIX + 'auto';
const SYNC_FILE = 'liumo-workbench-data.json';
const SYNC_LASTPUSH_CONTENT = SYNC_PREFIX + 'lastpush';

// 规范化序列化（排序键），用于比较本地/云端/基线内容是否一致
function canon(obj){
  if(!obj || typeof obj !== 'object') return JSON.stringify(obj);
  const o = {};
  for(const k of Object.keys(obj).sort()) o[k] = obj[k];
  return JSON.stringify(o);
}

// 解析云端快照：兼容新格式 {updatedAt,data} 与旧格式（裸平铺 JSON）
function safeParseSnapshot(content){
  try {
    const o = JSON.parse(content);
    if(o && typeof o === 'object' && o.data && typeof o.data === 'object') return o;
    return { updatedAt: null, data: (o && typeof o === 'object') ? o : {} };
  } catch(e){ return null; }
}

// 把云端快照写入本地（保留同步配置键），可选回写 lastpush 时间戳
async function applyCloudSnapshot(snap, opts){
  opts = opts || {};
  const data = snap && snap.data ? snap.data : {};
  SKIP_SYNC = true;
  try {
    clearLocalUserData();
    for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
    reloadAllData();
    renderContent();
    if(opts.setLastPush && snap) localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(snap.data || {}));
  } finally {
    SKIP_SYNC = false; // 任何异常都必须释放，否则自动同步会永久失效
  }
}

// 拦截 setItem, 实现改动后防抖自动同步
(function(){
  const _set = Storage.prototype.setItem;
  Storage.prototype.setItem = function(k, v){
    _set.call(this, k, v);
    if(!SKIP_SYNC && typeof k === 'string' && !k.startsWith(SYNC_PREFIX)) scheduleSync();
  };
})();

function scheduleSync(){
  if(localStorage.getItem(SYNC_AUTO_KEY) !== '1') return;
  if(!localStorage.getItem(SYNC_TOKEN_KEY) || !localStorage.getItem(SYNC_GIST_KEY)) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncPushNow(true); }, 2000);
}

function gatherLocal(){
  const o = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && !k.startsWith(SYNC_PREFIX)) o[k] = localStorage.getItem(k);
  }
  return o;
}

// 同步超限降级：去掉活动图片（仅保留标题/类别/详情等文字），让其余数据仍可备份
function stripActivityImages(data){
  const out = {};
  for(const k in data){
    if(k === 'liumo_activities_fresh'){
      try {
        const arr = JSON.parse(data[k] || '[]');
        out[k] = JSON.stringify(arr.map(a => { const c = Object.assign({}, a); delete c.images; return c; }));
      } catch(e){ out[k] = data[k]; }
    } else {
      out[k] = data[k];
    }
  }
  return out;
}

function timeStr(){
  const d = new Date();
  return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
}
function setSyncStatus(t){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = t;
}

async function syncPushNow(silent, opts){
  opts = opts || {};
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  if(!tok){ if(!silent) showToast('请先在云端同步面板填入 GitHub Token'); return; }
  // 首次同步且无 GID 时，复用账号下最新的备份 Gist（避免不断新建孤儿 Gist）
  if(!gid){ const fg = await findSyncGist(tok); if(fg){ gid = fg; localStorage.setItem(SYNC_GIST_KEY, fg); } }
  const now = new Date().toISOString();
  const localData = gatherLocal();
  let content = JSON.stringify({ updatedAt: now, data: localData });
  // 守卫 + 降级：GitHub Gist 单文件上限约 1MB。活动图片为 base64 易超限，
  // 超限时先尝试「仅同步文字、跳过活动图片」让其余数据仍可备份，仍超限才中止。
  if (content.length > 950000) {
    const reduced = stripActivityImages(localData);
    const reducedContent = JSON.stringify({ updatedAt: now, data: reduced });
    if (reducedContent.length <= 950000) {
      setSyncStatus('已同步(跳过图片)');
      if (!silent) showToast('活动图片过大已跳过，已同步其余数据（标题/类别/详情）');
      content = reducedContent;
    } else {
      setSyncStatus('数据过大');
      if (!silent) showToast('同步失败：本地数据过大，已超过 GitHub Gist 单文件上限，建议精简数据后再同步');
      return;
    }
  }

  // 冲突感知（三路）：云端自我们上次同步后若被改过，则拉取云端而不是覆盖它
  if(gid && !opts.force){
    const base = localStorage.getItem(SYNC_LASTPUSH_CONTENT);
    if(base !== null && base !== undefined){
      try {
        const cres = await fetch('https://api.github.com/gists/' + gid, {
          headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
        });
        if(cres.ok){
          const cj = await cres.json();
          const cf = cj.files && cj.files[SYNC_FILE];
          if(cf){
            const cs = safeParseSnapshot(cf.content);
            const remoteData = cs ? (cs.data || {}) : {};
            if(canon(remoteData) !== base){
              await applyCloudSnapshot(cs, { setLastPush:true });
              setSyncStatus('已合并云端更新 ' + timeStr());
              if(!silent) showToast('云端有更新，已合并（未覆盖）');
              return;
            }
          }
        }
      } catch(e){ /* 忽略，继续推送 */ }
    }
  }
  const payload = JSON.stringify({ public:false, files: { [SYNC_FILE]: { content: content } } });
  async function doPush(g){
    let url = 'https://api.github.com/gists', method = 'POST';
    if(g){ url = 'https://api.github.com/gists/' + g; method = 'PATCH'; }
    return fetch(url, { method: method, headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body: payload });
  }
  try {
    let res = await doPush(gid);
    if(res.status === 401){ showToast('同步失败: Token 无效/无权限（401），请确认填入的是带 gist 权限的 Token'); return; }
    if(res.status === 404 && gid){            // Gist 已不存在（被删除等），清空 GID 重建
      localStorage.removeItem(SYNC_GIST_KEY);
      gid = null;
      res = await doPush(null);
      if(res.status === 401){ showToast('同步失败: Token 无效/无权限（401），请确认填入的是带 gist 权限的 Token'); return; }
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if(!gid && j.id){
      SKIP_SYNC = true;
      localStorage.setItem(SYNC_GIST_KEY, j.id);
      SKIP_SYNC = false;
    }
    localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(localData));
    setSyncStatus('已同步 ' + timeStr());
    if(!silent) showToast('已同步到云端');
  } catch(e){
    setSyncStatus('同步失败');
    if(!silent) showToast('同步失败: ' + e.message);
  }
}

async function restoreFromCloud(){
  clearTimeout(syncTimer); // 取消可能待推送的本地改动，避免把云端覆盖掉
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  if(!tok){ showToast('请先配置云端同步（填入 Token）'); return; }
  if(!gid){ gid = await findSyncGist(tok); if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); } }
  if(!gid){ showToast('未找到云端备份 Gist，请先「立即同步」'); return; }
  if(!confirm('从云端恢复将覆盖本地当前数据，确定继续？')) return;
  try {
    let res = await fetch('https://api.github.com/gists/' + gid, {
      headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
    });
    if(res.status === 404){            // GID 失效，重新查找最新备份
      localStorage.removeItem(SYNC_GIST_KEY);
      gid = await findSyncGist(tok);
      if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); res = await fetch('https://api.github.com/gists/'+gid, { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } }); }
      else { showToast('未找到云端备份 Gist，请先「立即同步」'); return; }
    }
    if(res.status === 401){ showToast('恢复失败: Token 无效/无权限，请确认填入的是带 gist 权限的 Token'); return; }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const f = j.files && j.files[SYNC_FILE];
    if(!f){ showToast('云端暂无数据'); return; }
    const snap = safeParseSnapshot(f.content);
    if(!snap){ showToast('云端数据格式异常'); return; }
    await applyCloudSnapshot(snap, { setLastPush:true });
    showToast('已从云端恢复数据');
    setSyncStatus('已配置');
  } catch(e){ showToast('恢复失败: ' + e.message); }
}

async function findSyncGist(tok){
  try {
    const u = await fetch('https://api.github.com/user', { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } });
    if(!u.ok) return null;
    const me = await u.json();
    const r = await fetch('https://api.github.com/users/'+me.login+'/gists?per_page=100', { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } });
    if(!r.ok) return null;
    const list = await r.json();
    // 选 updated_at 最新的那份备份（列表不含文件内容，故以 Gist 更新时间为准）
    let best = null, bestScore = -1;
    for(const g of list){
      if(!(g.files && g.files[SYNC_FILE])) continue;
      const score = Date.parse(g.updated_at || g.created_at || 0);
      if(score > bestScore){ bestScore = score; best = g.id; }
    }
    return best;
  } catch(e){ return null; }
}

function clearLocalUserData(){
  const keep = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SYNC_PREFIX) === 0) keep[k] = localStorage.getItem(k);
  }
  localStorage.clear();
  for(const k in keep) localStorage.setItem(k, keep[k]);
}

async function tryCloudRestoreFirst(){
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  if(!tok) return false;
  if(!gid){ gid = await findSyncGist(tok); if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); } }
  if(!gid) return false;
  try {
    const res = await fetch('https://api.github.com/gists/' + gid, {
      headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
    });
    if(!res.ok) return false;
    const j = await res.json();
    const f = j.files && j.files[SYNC_FILE];
    if(!f) return false;
    const snap = safeParseSnapshot(f.content);
    if(!snap) return false;
    const data = snap.data || {};
    if(Object.keys(data).length === 0) return false;
    let hasLocal = false;
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && !k.startsWith(SYNC_PREFIX) && k!=='liumo_workbench_initialized'){ hasLocal=true; break; } }
    if(hasLocal) return false;
    SKIP_SYNC = true;
    try {
      for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
      reloadAllData();
      if(snap.updatedAt) localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(snap.data || {}));
    } finally {
      SKIP_SYNC = false; // 异常也必须释放，避免自动同步永久失效
    }
    return Object.keys(data).length > 0;
  } catch(e){ return false; }
}

function exportBackup(){
  const data = gatherLocal();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const ds = d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
  a.href = url; a.download = 'liumo-backup-'+ds+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  showToast('已导出备份文件');
}

function importBackupFromFile(file){
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const data = JSON.parse(reader.result);
      SKIP_SYNC = true;
      try {
        for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
        reloadAllData();
        renderContent();
      } finally {
        SKIP_SYNC = false; // 导入异常也必须释放，避免自动同步永久失效
      }
      showToast('已从备份文件恢复数据');
      if(localStorage.getItem(SYNC_AUTO_KEY) === '1') syncPushNow(true);
    } catch(e){ showToast('导入失败: 文件格式错误'); }
  };
  reader.readAsText(file);
}

function bindSyncUI(){
  const btn = document.getElementById('syncBtn');
  if(!btn) return;
  const panel = document.getElementById('syncPanel');
  btn.onclick = function(){ panel.hidden = !panel.hidden; };
  const tokEl = document.getElementById('syncToken');
  const autoEl = document.getElementById('syncAuto');
  tokEl.value = localStorage.getItem(SYNC_TOKEN_KEY) || '';
  autoEl.checked = localStorage.getItem(SYNC_AUTO_KEY) === '1';
  tokEl.oninput = function(){ localStorage.setItem(SYNC_TOKEN_KEY, tokEl.value.trim()); };
  autoEl.onchange = function(){
    localStorage.setItem(SYNC_AUTO_KEY, autoEl.checked ? '1' : '0');
    if(autoEl.checked) syncPushNow(true);
  };
  document.getElementById('syncNow').onclick = function(){ syncPushNow(false, { force: true }); };
  document.getElementById('syncRestore').onclick = function(){ restoreFromCloud(); };
  document.getElementById('syncDisconnect').onclick = function(){
    localStorage.removeItem(SYNC_TOKEN_KEY);
    localStorage.removeItem(SYNC_GIST_KEY);
    localStorage.removeItem(SYNC_AUTO_KEY);
    setSyncStatus('未配置'); tokEl.value=''; autoEl.checked=false;
    showToast('已断开云端同步');
  };
  document.getElementById('syncExport').onclick = exportBackup;
  document.getElementById('syncImport').onclick = function(){ document.getElementById('syncImportFile').click(); };
  document.getElementById('syncImportFile').onchange = function(e){
    const f = e.target.files && e.target.files[0];
    if(f) importBackupFromFile(f);
    e.target.value = '';
  };
}

function initCloudSync(){
  bindSyncUI();
  if(localStorage.getItem(SYNC_GIST_KEY) && localStorage.getItem(SYNC_TOKEN_KEY)) setSyncStatus('已配置');
  else setSyncStatus('未配置');
}

// 获取今天日期字符串 YYYY-MM-DD
function wlTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 判断任务在今天是否应该出现
function wlIsTaskDueToday(task, dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDate();
  const wd = d.getDay(); // 0=周日
  const month = d.getMonth() + 1;
  const r = task.repeat || { type: 'daily' };
  switch (r.type) {
    case 'daily': return true;
    case 'once': return r.date === dateStr;
    case 'weekly': return (r.weekdays || []).includes(wd);
    case 'monthly': return (r.days || []).includes(day);
    case 'quarterly': return month % 3 === 1 && day <= 3; // 每季度首月前3天
    case 'yearly': return r.date && r.date.slice(5) === dateStr.slice(5);
    default: return true;
  }
}

// 获取今天的任务列表(含完成状态)
function wlGetTodayTasks() {
  const today = wlTodayStr();
  return workTasks
    .filter(t => wlIsTaskDueToday(t, today))
    .map(t => {
      const doneKey = `${today}:${t.id}`;
      return { ...t, done: !!workDone[doneKey], doneKey };
    })
    .sort((a, b) => {
      // 未完成排前面，再按象限优先级(重要紧急最前)
      if (a.done !== b.done) return a.done ? 1 : -1;
      const qa = (a.important?2:0) + (a.urgent?1:0);
      const qb = (b.important?2:0) + (b.urgent?1:0);
      return qb - qa;
    });
}

// 获取象限分类
function wlGetQuadrant(task) {
  if (task.important && task.urgent) return 'iq';      // 重要紧急
  if (task.important && !task.urgent) return 'inq';    // 重要不紧急
  if (!task.important && task.urgent) return 'uq';     // 紧急不重要
  return 'nuq';                                         // 不重要不紧急
}

// 渲染单个任务
function wlRenderTask(t) {
  const q = wlGetQuadrant(t);
  const qInfo = QUADRANT_INFO[q];
  return `
    <div class="wl-task ${t.done ? 'done' : ''}" data-wl-id="${t.id}">
      <div class="wl-check ${t.done ? 'checked' : ''}" data-wl-action="toggle-done" data-wl-id="${t.id}">
        ${t.done ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
      </div>
      <div class="wl-task-body">
        <div class="wl-task-title ${t.done ? 'done' : ''}">${escapeHtml(t.title)}</div>
        <div class="wl-task-meta">
          <span class="wl-repeat-tag">${wlRepeatText(t.repeat)}</span>
          <span class="wl-quad-tag" style="background:${qInfo.color}1a;color:${qInfo.color};">${qInfo.name}</span>
          ${t.note ? `<span class="wl-note-tag">📝 ${escapeHtml(t.note)}</span>` : ''}
        </div>
      </div>
      <div class="wl-task-actions">
        <button class="wl-task-btn" data-wl-action="edit" data-wl-id="${t.id}" title="编辑">✏️</button>
        <button class="wl-task-btn" data-wl-action="delete" data-wl-id="${t.id}" title="删除">🗑️</button>
      </div>
    </div>
  `;
}

// 渲染添加/编辑表单
function wlRenderForm() {
  const editing = workEditingTaskId ? workTasks.find(t => t.id === workEditingTaskId) : null;
  const r = editing ? (editing.repeat || {type:'daily'}) : {type:'daily'};
  const isEdit = !!editing;
  return `
    <div class="wl-form">
      <div class="wl-form-title">${isEdit ? '编辑任务' : '添加任务'}</div>
      <input type="text" class="wl-input" id="wlTaskTitle" placeholder="任务内容" value="${isEdit ? escapeAttr(editing.title) : ''}" />
      <div class="wl-form-row">
        <label class="wl-check-label">
          <input type="checkbox" id="wlImportant" ${editing && editing.important ? 'checked' : ''} /> 重要
        </label>
        <label class="wl-check-label">
          <input type="checkbox" id="wlUrgent" ${editing && editing.urgent ? 'checked' : ''} /> 紧急
        </label>
      </div>
      <div class="wl-form-row">
        <select class="wl-select" id="wlRepeatType">
          <option value="daily" ${r.type==='daily'?'selected':''}>每天</option>
          <option value="weekly" ${r.type==='weekly'?'selected':''}>每周固定星期</option>
          <option value="monthly" ${r.type==='monthly'?'selected':''}>每月固定日期</option>
          <option value="quarterly" ${r.type==='quarterly'?'selected':''}>每季度</option>
          <option value="yearly" ${r.type==='yearly'?'selected':''}>每年</option>
          <option value="once" ${r.type==='once'?'selected':''}>一次性</option>
        </select>
      </div>
      <div class="wl-form-row" id="wlRepeatDetail"></div>
      <input type="text" class="wl-input" id="wlNote" placeholder="备注(可选)" value="${isEdit ? escapeAttr(editing.note||'') : ''}" />
      <div class="wl-form-actions">
        <button class="wl-btn-cancel" data-wl-action="cancel-form">取消</button>
        <button class="wl-btn-save" data-wl-action="save-task">${isEdit ? '保存' : '添加'}</button>
      </div>
    </div>
  `;
}

// 循环规则文字
function wlRepeatText(r) {
  r = r || { type: 'daily' };
  switch (r.type) {
    case 'daily': return '每日';
    case 'weekly': return '每周 ' + (r.weekdays||[]).map(w => WEEKDAY_NAMES[w]).join('、');
    case 'monthly': return '每月 ' + (r.days||[]).join('、') + ' 号';
    case 'quarterly': return '每季度';
    case 'yearly': return '每年 ' + (r.date||'').slice(5);
    case 'once': return '一次性 ' + (r.date||'');
    default: return '每日';
  }
}

// 渲染循环规则详情输入
function wlRenderRepeatDetail() {
  const sel = document.getElementById('wlRepeatType');
  if (!sel) return;
  const type = sel.value;
  const detailEl = document.getElementById('wlRepeatDetail');
  if (!detailEl) return;

  if (type === 'weekly') {
    detailEl.innerHTML = '<div class="wl-weekdays">' + WEEKDAY_NAMES.map((n,i) =>
      `<label class="wl-wd"><input type="checkbox" value="${i}" ${i>=1&&i<=5?'checked':''}/> ${n.slice(1)}</label>`
    ).join('') + '</div>';
  } else if (type === 'monthly') {
    detailEl.innerHTML = '<input type="text" class="wl-input" id="wlDays" placeholder="输入日期,多个用逗号分隔 如 1,15,30" />';
  } else if (type === 'once' || type === 'yearly') {
    detailEl.innerHTML = '<input type="date" class="wl-input" id="wlDate" />';
  } else {
    detailEl.innerHTML = '';
  }
}

// 保存任务
function wlSaveTask() {
  const title = document.getElementById('wlTaskTitle').value.trim();
  if (!title) { showToast('请输入任务内容'); return; }

  const important = document.getElementById('wlImportant').checked;
  const urgent = document.getElementById('wlUrgent').checked;
  const note = document.getElementById('wlNote').value.trim();
  const type = document.getElementById('wlRepeatType').value;

  let repeat = { type };
  if (type === 'weekly') {
    const wds = Array.from(document.querySelectorAll('#wlRepeatDetail input:checked')).map(c => parseInt(c.value));
    repeat.weekdays = wds.length ? wds : [1,2,3,4,5];
  } else if (type === 'monthly') {
    const daysStr = document.getElementById('wlDays').value.trim();
    const days = daysStr ? daysStr.split(/[,，\s]+/).map(Number).filter(n => n>=1 && n<=31) : [1];
    repeat.days = days;
  } else if (type === 'once' || type === 'yearly') {
    const dateVal = document.getElementById('wlDate').value;
    repeat.date = dateVal || wlTodayStr();
  }

  if (workEditingTaskId) {
    const task = workTasks.find(t => t.id === workEditingTaskId);
    if (task) {
      task.title = title; task.important = important; task.urgent = urgent;
      task.note = note; task.repeat = repeat;
    }
    showToast('任务已更新');
  } else {
    workTasks.push({ id: uid(), title, repeat, important, urgent, note });
    showToast('任务已添加');
  }

  workShowAddForm = false;
  workEditingTaskId = null;
  saveWorkTasks();
  renderWorkListModule(document.getElementById('content'), MODULES.find(m => m.id === 'worklist'));
}

// 删除任务
function wlDeleteTask(id) {
  if (!confirm('确定删除该任务?')) return;
  workTasks = workTasks.filter(t => t.id !== id);
  saveWorkTasks();
  renderWorkListModule(document.getElementById('content'), MODULES.find(m => m.id === 'worklist'));
  showToast('任务已删除');
}

// 切换完成状态
function wlToggleDone(id) {
  const today = wlTodayStr();
  const key = `${today}:${id}`;
  if (workDone[key]) {
    delete workDone[key];
  } else {
    workDone[key] = true;
    // 完成后检查是否全部完成，发通知
    const all = wlGetTodayTasks();
    if (all.every(t => t.done)) {
      wlNotify('🎉 今日任务全部完成！', '你今天的所有清单任务都已完成。');
    }
  }
  saveWorkDone();
  renderWorkListModule(document.getElementById('content'), MODULES.find(m => m.id === 'worklist'));
}

// 浏览器通知
function wlNotify(title, body) {
  try {
    if ('Notification' in window) {
      if (Notification.permission === 'granted') {
        new Notification(title, { body });
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(p => {
          if (p === 'granted') new Notification(title, { body });
        });
      }
    }
  } catch (e) {}
}

// 工作清单事件绑定(在 init 末尾调用)
function bindWorkListEvents() {
  const container = document.getElementById('content');

  // 象限筛选点击
  container.addEventListener('click', (e) => {
    const quadEl = e.target.closest('[data-wl-quad]');
    if (quadEl) {
      const q = quadEl.getAttribute('data-wl-quad');
      workFilterQuadrant = (workFilterQuadrant === q) ? 'all' : q;
      renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
      return;
    }

    const filterBtn = e.target.closest('[data-wl-filter]');
    if (filterBtn) {
      workFilterQuadrant = filterBtn.getAttribute('data-wl-filter');
      renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
      return;
    }

    const viewBtn = e.target.closest('[data-wl-view]');
    if (viewBtn) {
      workView = viewBtn.getAttribute('data-wl-view');
      renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
      return;
    }

    const actionEl = e.target.closest('[data-wl-action]');
    if (!actionEl) return;
    const action = actionEl.getAttribute('data-wl-action');
    const id = actionEl.getAttribute('data-wl-id');

    switch (action) {
      case 'toggle-add':
        workShowAddForm = !workShowAddForm;
        workEditingTaskId = null;
        renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
        if (workShowAddForm) setTimeout(wlRenderRepeatDetail, 50);
        break;
      case 'cancel-form':
        workShowAddForm = false;
        workEditingTaskId = null;
        renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
        break;
      case 'save-task':
        wlSaveTask();
        break;
      case 'toggle-done':
        wlToggleDone(id);
        break;
      case 'edit':
        workShowAddForm = true;
        workEditingTaskId = id;
        renderWorkListModule(container, MODULES.find(m => m.id === 'worklist'));
        setTimeout(wlRenderRepeatDetail, 50);
        break;
      case 'delete':
        wlDeleteTask(id);
        break;
      case 'notify':
        wlNotify('工作清单提醒', `今日还有任务待完成，加油！`);
        showToast('已发送提醒通知');
        break;
    }
  });

  // 循环类型变化时更新详情
  container.addEventListener('change', (e) => {
    if (e.target.id === 'wlRepeatType') {
      wlRenderRepeatDetail();
    }
  });
}

// 工作清单提醒检查(页面加载时)
function wlCheckReminderOnLoad() {
  const all = wlGetTodayTasks();
  const pending = all.filter(t => !t.done);
  if (pending.length > 0) {
    setTimeout(() => {
      showToast(`今日有 ${pending.length} 项任务待完成`);
    }, 1500);
  }
}

</script>
