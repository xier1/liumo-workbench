// ---------- 学习管理:事件绑定 ----------
function studyRefreshAll() {
  renderPvzStats();
  renderPvzCategories();
  renderPvzCyclePanel();
  renderStudyHistory();
  renderStudyManagePanel();
}

function studyChangeDate(delta) {
  const d = new Date(studyDate);
  d.setDate(d.getDate() + delta);
  studyDate = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
  document.getElementById('studyDateInput').value = studyDate;
  studyRefreshAll();
}

function findTaskById(taskId) {
  for (const c of studyCategories) {
    const t = c.tasks.find(t => t.id === taskId);
    if (t) return { task: t, cat: c };
  }
  let t = studyExtraTasks.find(t => t.id === taskId);
  if (t) return { task: t, cat: null };
  t = studyCycleTasks.find(t => t.id === taskId);
  if (t) return { task: t, cat: null };
  return null;
}

function deleteTaskById(taskId, catId) {
  if (catId && catId !== '_extra' && catId !== '_cycle') {
    const cat = studyCategories.find(c => c.id === catId);
    if (cat) {
      cat.tasks = cat.tasks.filter(t => t.id !== taskId);
      return true;
    }
  }
  // 尝试从 extraTasks 删除
  const extraIdx = studyExtraTasks.findIndex(t => t.id === taskId);
  if (extraIdx >= 0) {
    studyExtraTasks.splice(extraIdx, 1);
    return true;
  }
  // 尝试从 cycleTasks 删除
  const cycIdx = studyCycleTasks.findIndex(t => t.id === taskId);
  if (cycIdx >= 0) {
    studyCycleTasks.splice(cycIdx, 1);
    return true;
  }
  return false;
}

function bindStudyEvents() {
  const container = document.getElementById('content');

  // 日期切换
  document.getElementById('studyPrevDay').addEventListener('click', () => studyChangeDate(-1));
  document.getElementById('studyNextDay').addEventListener('click', () => studyChangeDate(1));
  document.getElementById('studyToday').addEventListener('click', () => {
    studyDate = todayStr();
    document.getElementById('studyDateInput').value = studyDate;
    studyRefreshAll();
  });
  document.getElementById('studyDateInput').addEventListener('change', (e) => {
    studyDate = e.target.value || todayStr();
    studyRefreshAll();
  });

  // 打印
  document.getElementById('pvzPrintBtn').addEventListener('click', () => window.print());

  // 管理面板切换
  document.getElementById('pvzManageBtn').addEventListener('click', () => {
    studyManageVisible = !studyManageVisible;
    const btn = document.getElementById('pvzManageBtn');
    btn.innerHTML = studyManageVisible
      ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg> 取消管理`
      : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> 管理任务`;
    btn.classList.toggle('active', studyManageVisible);
    const restoreBtn = document.getElementById('pvzRestoreBtn');
    if (restoreBtn) restoreBtn.style.display = studyManageVisible ? '' : 'none';
    renderStudyManagePanel();
    renderPvzCategories();
    renderPvzCyclePanel();
  });

  // 恢复已删除分类
  document.getElementById('pvzRestoreBtn').addEventListener('click', () => {
    if (!confirm('恢复已删除的【打印任务】和【周期任务】分类吗？')) return;
    studyExtraHidden = false;
    studyCycleHidden = false;
    // 如果任务列表为空，恢复默认任务
    if (studyExtraTasks.length === 0) {
      studyExtraTasks = JSON.parse(JSON.stringify(DEFAULT_STUDY_EXTRA_TASKS));
    }
    if (studyCycleTasks.length === 0) {
      studyCycleTasks = JSON.parse(JSON.stringify(DEFAULT_STUDY_CYCLE_TASKS));
    }
    saveStudyConfig();
    renderPvzCategories();
    renderPvzCyclePanel();
    showToast('已恢复打印任务和周期任务分类');
  });

  // 刷新每日(清除今日打卡)
  document.getElementById('pvzRefreshBtn').addEventListener('click', () => {
    if (!confirm('刷新每日?将清除今天的所有打卡记录。')) return;
    const today = todayStr();
    delete studyRecords[today];
    saveStudyRecords();
    // 不清除积分总数,但重置今日获得
    studyPoints.todayEarned = 0;
    studyPoints.todayDate = today;
    saveStudyPoints();
    studyRefreshAll();
    showToast('每日已刷新');
  });

  // 添加任务(顶部按钮 -> 弹出选择)
  document.getElementById('pvzAddTaskBtn').addEventListener('click', () => {
    const type = confirm('点击"确定"添加每日任务,点击"取消"添加周期任务');
    const name = prompt('输入任务名称:');
    if (!name || !name.trim()) return;
    if (type) {
      // 每日任务 -> 放到第一个分类
      const targetCat = studyCategories[0];
      if (targetCat) {
        targetCat.tasks.push({ id: 't_' + uid(), name: name.trim(), type: 'daily', points: 20 });
      } else {
        studyExtraTasks.push({ id: 't_' + uid(), name: name.trim(), type: 'daily', points: 20 });
      }
    } else {
      // 周期任务 -> 放到独立周期任务
      const cycle = prompt('打卡周期(如:每周2次):', '每周2次');
      studyCycleTasks.push({ id: 'c_' + uid(), name: name.trim(), type: 'cycle', points: 30, cycle: cycle || '每周2次' });
    }
    saveStudyConfig();
    studyRefreshAll();
    showToast('任务已添加');
  });

  // 点击事件委托
  container.addEventListener('click', (e) => {
    const target = e.target.closest('[data-study-action]');
    if (!target) return;
    const action = target.dataset.studyAction;
    const taskId = target.dataset.taskId;
    const catId = target.dataset.catId;

    // 折叠/展开分类
    if (action === 'toggle-cat') {
      const id = target.dataset.catId;
      studyCollapsedCats[id] = !studyCollapsedCats[id];
      studyRefreshAll();
      return;
    }

    // 每日任务打卡切换
    if (action === 'toggle') {
      const rec = getDayRecord(studyDate);
      if (!rec[taskId]) rec[taskId] = { done: false, note: '' };
      rec[taskId].done = !rec[taskId].done;
      saveStudyRecords();
      const found = findTaskById(taskId);
      if (found && rec[taskId].done) {
        const pts = found.task.points || 20;
        if (studyDate === todayStr()) {
          addStudyPoints(pts);
          showPointsToast(pts);
        }
      }
      studyRefreshAll();
      return;
    }

    // 周期任务打卡(通过复选框)
    if (action === 'toggle-cycle') {
      const rec = getDayRecord(studyDate);
      if (!rec[taskId]) rec[taskId] = { done: false, note: '' };
      rec[taskId].done = !rec[taskId].done;
      saveStudyRecords();
      const found = findTaskById(taskId);
      if (found && rec[taskId].done && studyDate === todayStr()) {
        const pts = found.task.points || 30;
        addStudyPoints(pts);
        showPointsToast(pts);
      }
      studyRefreshAll();
      return;
    }

    // 周期任务打卡按钮
    if (action === 'punch-cycle') {
      const rec = getDayRecord(studyDate);
      if (!rec[taskId]) rec[taskId] = { done: false, note: '' };
      rec[taskId].done = !rec[taskId].done;
      saveStudyRecords();
      const found = findTaskById(taskId);
      if (found && rec[taskId].done && studyDate === todayStr()) {
        const pts = found.task.points || 30;
        addStudyPoints(pts);
        showPointsToast(pts);
        // 打卡动画
        target.classList.add('pvz-punch-anim');
        setTimeout(() => target.classList.remove('pvz-punch-anim'), 400);
      }
      studyRefreshAll();
      return;
    }

    // 跳转日期
    if (action === 'goto-date') {
      studyDate = target.dataset.date;
      document.getElementById('studyDateInput').value = studyDate;
      studyRefreshAll();
      return;
    }

    // 收起管理面板
    if (action === 'close-manage') {
      studyManageVisible = false;
      renderStudyManagePanel();
      return;
    }

    // 添加分类
    if (action === 'add-cat') {
      const name = document.getElementById('newCatName').value.trim();
      if (!name) { showToast('请输入分类名称'); return; }
      const icon = document.getElementById('newCatIcon').value;
      const color = document.getElementById('newCatColor').value;
      studyCategories.push({
        id: 'cat_' + uid(),
        name, icon, color,
        tasks: []
      });
      saveStudyConfig();
      document.getElementById('newCatName').value = '';
      studyRefreshAll();
      showToast('分类已添加');
      return;
    }

    // 添加每日任务到分类
    if (action === 'add-daily-task') {
      const cat = studyCategories.find(c => c.id === catId);
      if (!cat) return;
      const name = prompt('输入每日任务名称:');
      if (name && name.trim()) {
        cat.tasks.push({ id: 't_' + uid(), name: name.trim(), type: 'daily', points: 20 });
        saveStudyConfig();
        studyRefreshAll();
        showToast('任务已添加');
      }
      return;
    }

    // 添加周期任务到分类
    if (action === 'add-cycle-task') {
      const name = prompt('输入周期任务名称:');
      if (!name || !name.trim()) return;
      const cycle = prompt('打卡周期(如:每周2次):', '每周2次');
      const newTask = { id: 'c_' + uid(), name: name.trim(), type: 'cycle', points: 30, cycle: cycle || '每周2次' };
      if (catId && catId !== '_extra' && catId !== '_cycle') {
        const cat = studyCategories.find(c => c.id === catId);
        if (cat) {
          cat.tasks.push(newTask);
        }
      } else {
        studyCycleTasks.push(newTask);
      }
      saveStudyConfig();
      studyRefreshAll();
      showToast('周期任务已添加');
      return;
    }

    // 添加打印任务
    if (action === 'add-extra-task') {
      const name = prompt('输入每日任务名称:');
      if (name && name.trim()) {
        studyExtraTasks.push({ id: 't_' + uid(), name: name.trim(), type: 'daily', points: 20 });
        saveStudyConfig();
        studyRefreshAll();
        showToast('任务已添加');
      }
      return;
    }

    // 删除分类
    if (action === 'del-cat') {
      if (!confirm('删除该分类及其所有任务?历史打卡记录不受影响。')) return;
      studyCategories = studyCategories.filter(c => c.id !== catId);
      saveStudyConfig();
      studyRefreshAll();
      showToast('分类已删除');
      return;
    }

    // 清空打印任务分类下的所有任务
    if (action === 'del-extra-cat') {
      if (!confirm('确定删除【打印任务】分类吗？分类下的任务将被清空，历史打卡记录不受影响。')) return;
      studyExtraTasks = [];
      studyExtraHidden = true;
      saveStudyConfig();
      studyRefreshAll();
      showToast('打印任务分类已删除');
      return;
    }

    // 清空周期任务分类下的所有任务
    if (action === 'del-cycle-cat') {
      if (!confirm('确定删除【周期任务】分类吗？分类下的任务将被清空，历史打卡记录不受影响。')) return;
      studyCycleTasks = [];
      studyCycleHidden = true;
      saveStudyConfig();
      studyRefreshAll();
      showToast('周期任务分类已删除');
      return;
    }

    // 编辑打印任务分类名称
    if (action === 'edit-extra-cat') {
      const newName = prompt('分类名称:', '打印任务');
      if (newName === null) return;
      showToast('打印任务分类名称暂不支持修改');
      return;
    }

    // 恢复已删除的分类
    if (action === 'restore-cats') {
      studyExtraHidden = false;
      studyCycleHidden = false;
      if (studyExtraTasks.length === 0) {
        studyExtraTasks = JSON.parse(JSON.stringify(DEFAULT_STUDY_EXTRA_TASKS));
      }
      if (studyCycleTasks.length === 0) {
        studyCycleTasks = JSON.parse(JSON.stringify(DEFAULT_STUDY_CYCLE_TASKS));
      }
      saveStudyConfig();
      studyRefreshAll();
      showToast('已恢复打印任务和周期任务分类');
      return;
    }

    // 删除任务
    if (action === 'del-task') {
      deleteTaskById(taskId, catId);
      saveStudyConfig();
      studyRefreshAll();
      showToast('任务已删除');
      return;
    }

    // 编辑分类(弹窗)
    if (action === 'edit-cat') {
      const cat = studyCategories.find(c => c.id === catId);
      if (!cat) return;
      const newName = prompt('分类名称:', cat.name);
      if (newName === null) return;
      const newIcon = prompt('图标(emoji):', cat.icon);
      if (newIcon === null) return;
      cat.name = newName.trim() || cat.name;
      cat.icon = newIcon.trim() || cat.icon;
      saveStudyConfig();
      studyRefreshAll();
      showToast('分类已更新');
      return;
    }

    // 编辑任务名(进入内联编辑)
    if (action === 'edit-task') {
      studyEditingTask = { id: taskId, action };
      renderPvzCategories();
      renderPvzCyclePanel();
      const input = container.querySelector('[data-study-action="save-task-name"]');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
      return;
    }

    // 保存编辑后的任务名
    if (action === 'save-task-name') {
      return;
    }

    // 恢复默认配置
    if (action === 'reset-config') {
      if (!confirm('恢复默认任务配置?你自定义的分类和任务将被替换回默认设置。')) return;
      studyCategories = JSON.parse(JSON.stringify(DEFAULT_STUDY_CATEGORIES));
      studyExtraTasks = JSON.parse(JSON.stringify(DEFAULT_STUDY_EXTRA_TASKS));
      studyCycleTasks = JSON.parse(JSON.stringify(DEFAULT_STUDY_CYCLE_TASKS));
      saveStudyConfig();
      studyExtraHidden = false;
      studyCycleHidden = false;
      studyRefreshAll();
      showToast('已恢复默认配置');
      return;
    }
  });

  // 任务名内联编辑:回车保存、ESC取消
  container.addEventListener('keydown', (e) => {
    if (e.target.dataset.studyAction === 'save-task-name') {
      if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault();
        const input = e.target;
        const taskId = input.dataset.taskId;
        if (e.key === 'Enter' && input.value.trim()) {
          const found = findTaskById(taskId);
          if (found) {
            found.task.name = input.value.trim();
            saveStudyConfig();
            showToast('已保存');
          }
        }
        studyEditingTask = null;
        studyRefreshAll();
      }
    }
  });

  // 失焦保存
  container.addEventListener('focusout', (e) => {
    if (e.target.dataset.studyAction === 'save-task-name') {
      const input = e.target;
      const taskId = input.dataset.taskId;
      const found = findTaskById(taskId);
      if (found && input.value.trim() && input.value.trim() !== found.task.name) {
        found.task.name = input.value.trim();
        saveStudyConfig();
      }
      studyEditingTask = null;
      setTimeout(() => studyRefreshAll(), 50);
    }
  });
}

// 今日数据(静态注入,打开即显示)

// ========================================================
//   通用二级类目能力（侧边栏树形展开）
//   任何模块只要在 MODULES 里声明 children: [{id,name,icon}...]，
//   左侧导航就会自动成为可展开分组：点击父级在侧边栏内展开/收起子分类，
//   点击子分类进入对应视图（状态由 currentSub / expandedModules 管理）。
//   下方 subNotes 系列是可在任意二级类目中复用的「笔记 / 活动列表」子面板。
// ========================================================

// ========================================================
//   通用「笔记 / 活动列表」子面板（任意模块的二级类目都可复用）
//   数据按 moduleId 隔离存储（localStorage key: liumo_subnotes_<moduleId>）。
//   用法：
//     <textarea class="subnote-input" id="subnote-input-<moduleId>">
//     <button id="subnote-add-<moduleId>">添加</button>
//     <div class="subnote-list" id="subnote-list-<moduleId>"></div>
//     bindSubNotes(moduleId); renderSubNotes(moduleId);
// ========================================================
let subNotesEditingId = null;

function readSubNotes(moduleId) {
  try { return JSON.parse(localStorage.getItem('liumo_subnotes_' + moduleId) || '[]'); }
  catch (e) { return []; }
}

function writeSubNotes(moduleId, arr) {
  localStorage.setItem('liumo_subnotes_' + moduleId, JSON.stringify(arr));
}

function renderSubNotes(moduleId) {
  const el = document.getElementById('subnote-list-' + moduleId);
  if (!el) return;
  const list = readSubNotes(moduleId);

  if (list.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="empty-title">还没有笔记</div>
        <div class="empty-desc">在上方写下第一条记录吧</div>
      </div>`;
    return;
  }

  el.innerHTML = list.map(a => {
    if (subNotesEditingId === a.id) {
      return `
        <div class="subnote-item" data-id="${a.id}">
          <textarea class="subnote-input" id="subnote-edit-${moduleId}-${a.id}" rows="3">${escapeHtml(a.text)}</textarea>
          <div class="subnote-actions">
            <button class="subnote-btn save" data-act="save" data-id="${a.id}">保存</button>
            <button class="subnote-btn cancel" data-act="cancel" data-id="${a.id}">取消</button>
          </div>
        </div>`;
    }
    return `
      <div class="subnote-item" data-id="${a.id}">
        <div class="subnote-text">${escapeHtml(a.text)}</div>
        <div class="subnote-meta">${formatDate(a.createdAt)}${a.updatedAt && a.updatedAt !== a.createdAt ? ' · 已编辑' : ''}</div>
        <div class="subnote-actions">
          <button class="action-btn" data-act="edit" data-id="${a.id}" title="编辑">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="action-btn delete" data-act="delete" data-id="${a.id}" title="删除">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          </button>
        </div>
      </div>`;
  }).join('');
}

function bindSubNotes(moduleId) {
  const input = document.getElementById('subnote-input-' + moduleId);
  const addBtn = document.getElementById('subnote-add-' + moduleId);

  function add() {
    const text = input.value.trim();
    if (!text) { showToast('请输入内容'); input.focus(); return; }
    const list = readSubNotes(moduleId);
    list.unshift({ id: uid(), text, createdAt: Date.now(), updatedAt: Date.now() });
    writeSubNotes(moduleId, list);
    input.value = '';
    renderSubNotes(moduleId);
    input.focus();
    showToast('已添加');
  }

  if (addBtn && input) {
    addBtn.addEventListener('click', add);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); add(); }
    });
  }

  const listEl = document.getElementById('subnote-list-' + moduleId);
  if (listEl) {
    listEl.addEventListener('click', e => {
      const t = e.target.closest('[data-act]');
      if (!t) return;
      const act = t.dataset.act, id = t.dataset.id;
      const list = readSubNotes(moduleId);
      const a = list.find(x => x.id === id);
      if (!a) return;

      if (act === 'edit') {
        subNotesEditingId = id;
        renderSubNotes(moduleId);
        const ta = document.getElementById('subnote-edit-' + moduleId + '-' + id);
        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      } else if (act === 'delete') {
        writeSubNotes(moduleId, list.filter(x => x.id !== id));
        renderSubNotes(moduleId);
        showToast('已删除');
      } else if (act === 'save') {
        const v = document.getElementById('subnote-edit-' + moduleId + '-' + id).value.trim();
        if (!v) { showToast('内容不能为空'); return; }
        a.text = v; a.updatedAt = Date.now();
        writeSubNotes(moduleId, list);
        subNotesEditingId = null;
        renderSubNotes(moduleId);
        showToast('已保存');
      } else if (act === 'cancel') {
        subNotesEditingId = null;
        renderSubNotes(moduleId);
      }
    });
  }
}

function loadNotes() {
  const raw = localStorage.getItem(NOTES_KEY);
  if (raw === null) {
    saveNotes(DEFAULT_NOTES);
    return JSON.parse(JSON.stringify(DEFAULT_NOTES));
  }
  try { return JSON.parse(raw); } catch (e) { return []; }
}

function saveNotes(arr) {
  localStorage.setItem(NOTES_KEY, JSON.stringify(arr));
}

  const list = loadNotes();

  const delSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

          <div class="subnote-actions">

        <div class="note-body${n.html ? '' : ' note-body--text'}">${n.html ? n.body : escapeHtml(n.body)}</div>
        <div class="subnote-meta">${formatDate(n.createdAt)}${n.updatedAt && n.updatedAt !== n.createdAt ? ' · 已编辑' : ''}</div>

          <button class="action-btn delete" data-act="delete" data-id="${n.id}" title="删除">${delSvg}</button>

function bindNotes() {
  const addBtn = document.getElementById('note-add');
  const clearBtn = document.getElementById('note-clear');
  const titleInput = document.getElementById('note-title-input');
  const bodyInput = document.getElementById('note-content-input');

  function add() {
    const body = bodyInput.value.trim();
    if (!body) { showToast('请输入内容'); bodyInput.focus(); return; }
    const list = loadNotes();
    list.unshift({ id: uid(), title: titleInput.value.trim(), body, html: false, createdAt: Date.now(), updatedAt: Date.now() });
    saveNotes(list);
    titleInput.value = '';
    bodyInput.value = '';
    renderNoteList();
    showToast('已发布');
  }

  if (addBtn && bodyInput) {
    addBtn.addEventListener('click', add);
    bodyInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); add(); }
    });
  }
  if (clearBtn && titleInput) {
    clearBtn.addEventListener('click', () => { titleInput.value = ''; bodyInput.value = ''; titleInput.focus(); });
  }

  const searchInput = document.getElementById('note-search');
  if (searchInput) {
    searchInput.addEventListener('input', e => { noteSearch = e.target.value; renderNoteList(); });
  }

  const listEl = document.getElementById('note-list');
  if (listEl) {
    listEl.addEventListener('click', e => {
      const t = e.target.closest('[data-act]');
      if (!t) return;
      const act = t.dataset.act, id = t.dataset.id;
      const list = loadNotes();
      const n = list.find(x => x.id === id);
      if (!n) return;

      if (act === 'edit') {
        noteEditingId = id;
        renderNoteList();
        const ta = document.getElementById('note-edit-body-' + id);
        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      } else if (act === 'delete') {
        saveNotes(list.filter(x => x.id !== id));
        noteEditingId = null;
        renderNoteList();
        showToast('已删除');
      } else if (act === 'save') {
        const v = document.getElementById('note-edit-body-' + id).value.trim();
        if (!v) { showToast('内容不能为空'); return; }
        n.title = document.getElementById('note-edit-title-' + id).value.trim();
        n.body = v; n.updatedAt = Date.now(); n.html = false;
        saveNotes(list);
        noteEditingId = null;
        renderNoteList();
        showToast('已保存');
      } else if (act === 'cancel') {
        noteEditingId = null;
        renderNoteList();
      }
    });
  }
}

// 旧版纯文本笔记 -> 活动（首行作标题，其余作详情，归为日常活动）
function migrateActivities() {
  const oldKey = 'liumo_subnotes_fresh';
  let old = [];
  try { old = JSON.parse(localStorage.getItem(oldKey) || '[]'); } catch (e) {}
  if (Array.isArray(old) && old.length && !localStorage.getItem(ACT_KEY)) {
    const migrated = old.map(n => {
      const text = (n.text || '').trim();
      const idx = text.indexOf('\n');
      const title = (idx > 0 ? text.slice(0, idx) : text).trim() || '未命名活动';
      const detail = idx > 0 ? text.slice(idx + 1).trim() : '';
      return {
        id: n.id || uid(), title, category: 'daily', detail,
        images: [], createdAt: n.createdAt || Date.now(), updatedAt: n.updatedAt || Date.now()
      };
    });
    writeActivities(migrated);
    localStorage.removeItem(oldKey);
  }
}

// 图片压缩：最长边 ~1000px，输出 JPEG（quality≈0.8），便于持久化到 localStorage
function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 1000; quality = quality || 0.8;
  return new Promise((resolve, reject) => {
    if (!file || !file.type || file.type.indexOf('image/') !== 0) { reject(new Error('not-image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('read'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('img'));
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext && canvas.getContext('2d');
        if (!ctx) { reject(new Error('ctx')); return; }
        ctx.drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch (err) { reject(err); }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

}

// 活动图片放大预览（点击卡片图片弹出，可左右切换、保存到本地）
let actLightbox = null;
let actLbImages = [];
let actLbIndex = 0;
function openActLightbox(images, index) {
  if (!actLightbox) {
    actLightbox = document.createElement('div');
    actLightbox.className = 'act-lightbox';
    actLightbox.innerHTML = `
      <div class="act-lightbox-backdrop" data-close="1"></div>
      <div class="act-lightbox-panel">
        <div class="act-lightbox-stage">
          <button type="button" class="act-lb-nav act-lb-prev" data-nav="-1" aria-label="上一张">‹</button>
          <img class="act-lightbox-img" alt="活动图片预览" />
          <button type="button" class="act-lb-nav act-lb-next" data-nav="1" aria-label="下一张">›</button>
        </div>
        <div class="act-lightbox-bar">
          <span class="act-lb-counter">1 / 1</span>
          <button type="button" class="act-lb-save">💾 保存到本地</button>
          <button type="button" class="act-lb-close" data-close="1">✕ 关闭</button>
        </div>
      </div>`;
    document.body.appendChild(actLightbox);
    actLightbox.addEventListener('click', e => {
      if (e.target.dataset.close) { closeActLightbox(); return; }
      const nav = e.target.closest('[data-nav]');
      if (nav) { stepActLightbox(parseInt(nav.dataset.nav, 10)); }
    });
    actLightbox.querySelector('.act-lb-save').addEventListener('click', () => {
      const img = actLightbox.querySelector('.act-lightbox-img');
      if (!img || !img.src) return;
      const a = document.createElement('a');
      a.href = img.src;
      a.download = '活动图片_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.jpg';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    document.addEventListener('keydown', e => {
      if (!actLightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeActLightbox();
      else if (e.key === 'ArrowLeft') stepActLightbox(-1);
      else if (e.key === 'ArrowRight') stepActLightbox(1);
    });
  }
  actLbImages = images || [];
  actLbIndex = Math.max(0, Math.min(index || 0, Math.max(0, actLbImages.length - 1)));
  actLightbox.classList.toggle('single', actLbImages.length <= 1);
  renderActLightbox();
  actLightbox.classList.add('open');
}
function renderActLightbox() {
  if (!actLightbox) return;
  actLightbox.querySelector('.act-lightbox-img').src = actLbImages[actLbIndex] || '';
  actLightbox.querySelector('.act-lb-counter').textContent = (actLbImages.length ? (actLbIndex + 1) : 0) + ' / ' + actLbImages.length;
}
function stepActLightbox(delta) {
  if (!actLbImages.length) return;
  actLbIndex = (actLbIndex + delta + actLbImages.length) % actLbImages.length;
  renderActLightbox();
}
function closeActLightbox() {
  if (actLightbox) actLightbox.classList.remove('open');
}

  const titleEl = document.getElementById('actModalTitle');
  if (titleEl) titleEl.textContent = actEditingId ? '编辑活动' : '添加活动';
  modal.classList.add('open');
  const dlg = modal.querySelector('.act-modal-dialog');
  if (dlg) dlg.focus();
}

function closeActForm() {
  const modal = document.getElementById('actModal');
  if (modal) modal.classList.remove('open');
  actResetForm();
}

function actOpenAdd() {
  actResetForm();
  if (actTab !== 'all') actSelectedCat = actTab;
  syncSegUI();
  openActModal();
}

function actSave() {
  const wasEdit = !!actEditingId;
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  const title = t.value.trim();
  if (!title) { showToast('请填写标题'); if (t) t.focus(); return; }
  const detail = d.value.trim();
  const list = readActivities();
  if (actEditingId) {
    const a = list.find(x => x.id === actEditingId);
    if (a) { a.title = title; a.category = actSelectedCat; a.detail = detail; a.images = actDraftImages.slice(); a.updatedAt = Date.now(); }
  } else {
    list.unshift({ id: uid(), title, category: actSelectedCat, detail, images: actDraftImages.slice(), createdAt: Date.now(), updatedAt: Date.now() });
  }
  writeActivities(list);
  actResetForm();
  renderActTabs();
  renderActList();
  closeActForm();
  showToast(wasEdit ? '已更新' : '已添加');
}

function actStartEdit(id) {
  const a = readActivities().find(x => x.id === id);
  if (!a) return;
  // 先置状态，再渲染（renderActForm 会重建表单，必须在渲染后回填）
  actEditingId = id;
  actDraftImages = (a.images || []).slice();
  actSelectedCat = a.category;
  openActModal();
  const t = document.getElementById('act-title'), d = document.getElementById('act-detail');
  if (t) t.value = a.title;
  if (d) d.value = a.detail || '';
  syncSegUI();
  renderActThumbs();
  const save = document.getElementById('act-save'), cancel = document.getElementById('act-cancel');
  if (save) save.textContent = '保存修改';
  if (cancel) cancel.hidden = false;
  if (t) t.focus();
}

function bindActivities() {
  const tabs = document.getElementById('act-tabs');
  const form = document.getElementById('act-form-container');
  const list = document.getElementById('act-list');
  const addBtn = document.getElementById('actAddBtn');
  const modal = document.getElementById('actModal');

  if (tabs) {
    tabs.addEventListener('click', e => {
      const t = e.target.closest('.act-tab');
      if (!t) return;
      actTab = t.dataset.tab;
      if (actTab !== 'all') actSelectedCat = actTab;
      renderActTabs();
      syncSegUI();
      renderActList();
    });
  }

  if (addBtn) addBtn.addEventListener('click', actOpenAdd);

  if (modal) {
    modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeActForm(); });
    modal.addEventListener('keydown', e => { if (e.key === 'Escape') closeActForm(); });
  }

  if (form) {
    form.addEventListener('click', e => {
      const segBtn = e.target.closest('.act-seg-btn');
      if (segBtn) { actSelectedCat = segBtn.dataset.cat; syncSegUI(); return; }
      if (e.target.closest('#act-img-add')) { const f = document.getElementById('act-file'); if (f) f.click(); return; }
      const rm = e.target.closest('.act-thumb-remove');
      if (rm) {
        const i = parseInt(rm.dataset.idx, 10);
        if (!isNaN(i)) { actDraftImages.splice(i, 1); renderActThumbs(); }
        return;
      }
      if (e.target.closest('#act-save')) { actSave(); return; }
      if (e.target.closest('#act-cancel')) { closeActForm(); return; }
    });

    const fileEl = document.getElementById('act-file');
    if (fileEl) {
      fileEl.addEventListener('change', async e => {
        const files = Array.from(e.target.files || []);
        for (const f of files) {
          try { const d = await compressImage(f); actDraftImages.push(d); }
          catch (err) { showToast('图片处理失败'); }
        }
        renderActThumbs();
        e.target.value = '';
      });
    }
  }

  if (list) {
    list.addEventListener('click', e => {
      const img = e.target.closest('.act-card-img');
      if (img) {
        const card = img.closest('.act-card');
        const imgs = card ? [...card.querySelectorAll('.act-card-img')].map(i => i.getAttribute('src')) : [img.getAttribute('src')];
        const idx = imgs.indexOf(img.getAttribute('src'));
        openActLightbox(imgs, idx < 0 ? 0 : idx);
        return;
      }
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const id = btn.dataset.id, act = btn.dataset.act;
      if (act === 'edit') { actStartEdit(id); }
      else if (act === 'delete') {
        if (typeof confirm === 'function' && !confirm('确定删除该活动？')) return;
        const arr = readActivities().filter(x => x.id !== id);
        writeActivities(arr);
        if (actEditingId === id) actResetForm();
        renderActTabs();
        renderActList();
        showToast('已删除');
      }
    });
  }
}

function renderDailyCheckList() {

      <li class="dc-item ${it.done ? 'done' : ''}" data-id="${it.id}">

        <button class="dc-del" data-act="del" title="删除">✕</button>
      </li>`).join('');
  }
  const total = dailyCheckList.length;
  const done = dailyCheckList.filter(i => i.done).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const fill = document.getElementById('dcFill');
  if (fill) fill.style.width = pct + '%';

function bindDailyCheck() {
  const list = document.getElementById('dcList');
  const addBtn = document.getElementById('dcAdd');
  const addRow = document.getElementById('dcAddRow');
  const input = document.getElementById('dcInput');
  const addConfirm = document.getElementById('dcAddConfirm');
  const resetBtn = document.getElementById('dcReset');
  if (addBtn) addBtn.addEventListener('click', () => { if (addRow) addRow.hidden = !addRow.hidden; if (input) input.focus(); });
  if (addConfirm) addConfirm.addEventListener('click', () => {
    const v = (input && input.value || '').trim();
    if (!v) { if (input) input.focus(); return; }
    dailyCheckList.push({ id: uid(), text: v, done: false });
    saveDailyCheck(); renderDailyCheckList();
    if (input) input.value = '';
    if (addRow) addRow.hidden = true;
  });
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') addConfirm.click(); });
  if (resetBtn) resetBtn.addEventListener('click', () => {
    dailyCheckList.forEach(i => i.done = false); saveDailyCheck(); renderDailyCheckList(); showToast('已重置为未完成');
  });
  if (list) list.addEventListener('click', e => {
    const li = e.target.closest('.dc-item'); if (!li) return;

    const actEl = e.target.closest('[data-act]');

  });
}

// ---------- 渲染:待办列表 ----------
function getFilteredTodos() {
  let list = todos;
  if (filter === 'active') list = list.filter(t => !t.done);
  else if (filter === 'done') list = list.filter(t => t.done);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    list = list.filter(t => (t.title || '').toLowerCase().includes(q));
  }
  const prioOrder = { iq: 4, inq: 3, uq: 2, nuq: 1 };
  const sorted = [...list];
  if (memoSortMode === 'custom') {
    // 自定义顺序:按手动拖拽的 order 升序
    sorted.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  } else {
    // 按优先级:未完成在前,再按优先级(重要且紧急最前),同优先级按添加时间倒序(新添加的在前)
    sorted.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (prioOrder[b.priority] !== prioOrder[a.priority]) return prioOrder[b.priority] - prioOrder[a.priority];
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }
  return sorted;
}

function setMemoSortMode(mode) {
  memoSortMode = mode;
  localStorage.setItem('liumo_memo_sort', mode);
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === mode));
  renderTodoList();
}

function reorderTodos(fromId, toId) {
  const fromIdx = todos.findIndex(t => t.id === fromId);
  const toIdx = todos.findIndex(t => t.id === toId);
  if (fromIdx < 0 || toIdx < 0) return;
  const [moved] = todos.splice(fromIdx, 1);
  todos.splice(toIdx, 0, moved);
  todos.forEach((t, i) => { t.order = i; });
  saveTodos();
  renderTodoList();
}

function bindInspect() {
  const content = document.getElementById('content');
  if (!content) return;
  if (content._inspBound) { content.removeEventListener('click', content._inspClick); content.removeEventListener('change', content._inspChange); }
  content._inspClick = function(e) {
    const t = e.target;
    if (t.closest('[data-close]')) { const m = t.closest('.insp-modal'); if (m) m.classList.remove('open'); return; }
    const roleBtn = t.closest('.insp-role-btn'); if (roleBtn) { inspRole = roleBtn.dataset.role; document.querySelectorAll('.insp-role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === inspRole)); renderInspectBody(); return; }
    if (t.closest('#inspEmpManage')) { openInspEmp(); return; }
    if (t.closest('#inspNewBtn')) { openInspNew(); return; }
    if (t.closest('#inspNewImgAdd')) { const f = document.getElementById('inspNewFile'); if (f) f.click(); return; }
    if (t.closest('#inspNewSave')) { inspNewSave(); return; }
    const tr = t.closest('.insp-thumb-remove');
    if (tr) { const elId = tr.dataset.thumb, i = +tr.dataset.idx; if (elId==='inspNewThumbs') { inspDraftPhotos.splice(i,1); renderInspThumbs('inspNewThumbs', inspDraftPhotos); } else if (elId==='inspReplyThumbs') { inspReplyPhotos.splice(i,1); renderInspThumbs('inspReplyThumbs', inspReplyPhotos); } return; }
    const openBtn = t.closest('[data-act="open"]'); if (openBtn) { openInspDetail(openBtn.dataset.id); return; }
    const img = t.closest('.insp-card-img, .insp-detail-img, .insp-reply-img');
    if (img) { const tk = inspTickets.find(x => x.id === img.dataset.id); if (tk) openActLightbox(tk.photos, +img.dataset.idx); return; }
    if (t.closest('[data-act="confirm"]')) { inspConfirm(); return; }
    if (t.closest('[data-act="reject"]')) { inspReject(); return; }
    if (t.closest('[data-act="rectify"]')) { inspRectify(); return; }
    if (t.closest('#inspReplySend')) { inspReplySend(); return; }
    if (t.closest('#inspReplyImgAdd')) { const f = document.getElementById('inspReplyFile'); if (f) f.click(); return; }
    if (t.closest('#inspEmpAdd')) { inspAddEmp(); return; }
    const ed = t.closest('.insp-emp-del'); if (ed) { inspDelEmp(ed.dataset.emp); return; }
  };
  content._inspChange = function(e) {
    const t = e.target;
    if (t.id === 'inspFilterEmp') { inspFilterEmp = t.value; renderInspList(); }
    else if (t.id === 'inspFilterStatus') { inspFilterStatus = t.value; renderInspList(); }
    else if (t.id === 'inspEmpPick') { inspCurEmp = t.value; renderInspList(); }
  };
  content.addEventListener('click', content._inspClick);
  content.addEventListener('change', content._inspChange);
  if (!content._inspKey) {
    content._inspKey = function(e) { if (e.key === 'Escape') { const m = document.querySelector('.insp-modal.open'); if (m) m.classList.remove('open'); } };
    document.addEventListener('keydown', content._inspKey);
  }
  content._inspBound = true;
}

// ==================== 减肥打卡模块 ====================
const WEIGHT_LOGS_KEY = 'liumo_weight_logs';
const WEIGHT_SET_KEY = 'liumo_weight_settings';

function loadWeight() {
  try {
    const d = localStorage.getItem(WEIGHT_LOGS_KEY);
    weightLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(weightLogs)) weightLogs = [];
  } catch (e) { weightLogs = []; }
  try {
    const s = localStorage.getItem(WEIGHT_SET_KEY);
    if (s) {
      const o = JSON.parse(s);
      weightSettings = {
        target: (typeof o.target === 'number' && o.target > 0) ? o.target : null,
        height: (typeof o.height === 'number' && o.height > 0) ? o.height : null
      };
    }
  } catch (e) {}
  weightLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}

function saveWeightLogs() { localStorage.setItem(WEIGHT_LOGS_KEY, JSON.stringify(weightLogs)); }
function saveWeightSettings() { localStorage.setItem(WEIGHT_SET_KEY, JSON.stringify(weightSettings)); }

function weightAsc() { return [...weightLogs].sort((a, b) => (a.date || '').localeCompare(b.date || '')); }
function weightDesc() { return [...weightLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function bmiCategory(bmi) {
  if (bmi < 18.5) return '偏瘦';
  if (bmi < 24) return '正常';
  if (bmi < 28) return '偏胖';
  return '肥胖';
}
function statCard(label, value, cls) {
  return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value ${cls || ''}">${value}</div></div>`;
}

function renderWeightStats() {
  const el = document.getElementById('wtStats');
  if (!el) return;
  const asc = weightAsc();
  const desc = weightDesc();
  const current = desc.length ? desc[0].weight : null;
  const start = asc.length ? asc[0].weight : null;
  const target = weightSettings.target;
  const height = weightSettings.height;
  const lost = (start != null && current != null) ? +(start - current).toFixed(1) : null;
  const toTarget = (current != null && target != null) ? +(current - target).toFixed(1) : null;
  const bmi = (current != null && height) ? +(current / Math.pow(height / 100, 2)).toFixed(1) : null;

  const cards = [];
  cards.push(statCard('当前体重', current != null ? current + ' kg' : '—', 'primary'));
  cards.push(statCard('起始体重', start != null ? start + ' kg' : '—', ''));
  cards.push(statCard('已减', lost != null ? (lost >= 0 ? '−' : '+') + Math.abs(lost) + ' kg' : '—', lost != null && lost > 0 ? 'success' : ''));
  cards.push(statCard('距目标', toTarget != null ? (toTarget > 0 ? '还差 ' + toTarget + ' kg' : (toTarget < 0 ? '已超标 ' + Math.abs(toTarget) + ' kg' : '已达成 🎉')) : '—', target != null && toTarget <= 0 ? 'success' : 'warning'));
  if (bmi != null) cards.push(statCard('BMI', bmi + ' · ' + bmiCategory(bmi), ''));
  cards.push(statCard('记录天数', weightLogs.length + ' 天', ''));
  el.innerHTML = cards.join('');
}

function buildWeightChartSVG(logs) {
  const W = 600, H = 240, padL = 40, padR = 16, padT = 16, padB = 28;
  const weights = logs.map(l => l.weight);
  let min = Math.min(...weights), max = Math.max(...weights);
  if (weightSettings.target != null) { min = Math.min(min, weightSettings.target); max = Math.max(max, weightSettings.target); }
  if (min === max) { min -= 1; max += 1; }
  const range = max - min;
  const pad = range * 0.12;
  min -= pad; max += pad;
  const n = logs.length;
  const xOf = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
  const yOf = w => H - padB - ((w - min) / (max - min)) * (H - padT - padB);

  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const gy = padT + k * (H - padT - padB) / 3;
    const val = (max - (k / 3) * (max - min)).toFixed(1);
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${val}</text>`;
  }

  const pts = logs.map((l, i) => ({ x: xOf(i), y: yOf(l.weight), l }));
  const line = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => {
    const prev = i > 0 ? logs[i - 1].weight : null;
    const delta = prev != null ? (p.l.weight - prev) : null;
    const tip = `${escapeHtml(p.l.date)}  ${p.l.weight}kg` + (delta != null ? `  (${delta >= 0 ? '+' : ''}${delta.toFixed(1)})` : '');
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#6366f1" stroke="#fff" stroke-width="2"><title>${tip}</title></circle>`;
  }).join('');

  let targetLine = '';
  if (weightSettings.target != null) {
    const ty = yOf(weightSettings.target);
    targetLine = `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${W - padR}" y2="${ty.toFixed(1)}" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W - padR}" y="${(ty - 6).toFixed(1)}" text-anchor="end" font-size="10" fill="#10b981">目标 ${weightSettings.target}kg</text>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}<polyline points="${line}" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round"/>${targetLine}${dots}</svg>`;
}

function renderWeightChart() {
  const el = document.getElementById('wtChart');

function renderWeightMonthChart() {

  const cutoffStr = `${cutoff.getFullYear()}-${('0' + (cutoff.getMonth() + 1)).slice(-2)}-${('0' + cutoff.getDate()).slice(-2)}`;
  const logs = weightAsc().filter(l => l.date >= cutoffStr);
  el.innerHTML = logs.length === 0
    ? `<div class="wt-empty">近 30 天暂无体重记录</div>`

function renderWeightList() {
  const el = document.getElementById('wtList');
  if (!el) return;
  const logs = weightDesc();
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">暂无记录</div>`;

    const prev = i < logs.length - 1 ? logs[i + 1].weight : null;
    const delta = prev != null ? (l.weight - prev) : null;
    const deltaHtml = delta == null ? '<span class="wt-delta neutral">—</span>'
      : delta === 0 ? '<span class="wt-delta neutral">±0</span>'
      : delta < 0 ? `<span class="wt-delta down">▼ ${Math.abs(delta).toFixed(1)}</span>`
      : `<span class="wt-delta up">▲ ${delta.toFixed(1)}</span>`;
    return `
      <div class="wt-item" data-id="${l.id}">
        <div class="wt-item-date">${escapeHtml(l.date)}</div>
        <div class="wt-item-weight">${l.weight}<span class="wt-unit">kg</span></div>

        <button class="action-btn delete" data-action="wt-del" data-id="${l.id}" title="删除">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>

function bindWeightEvents() {
  const addBtn = document.getElementById('weightAddBtn');
  const setBtn = document.getElementById('weightSetBtn');
  const valEl = document.getElementById('weightValue');
  const list = document.getElementById('wtList');

  function addLog() {
    const dateEl = document.getElementById('weightDate');
    const date = dateEl.value || todayStr();
    const w = parseFloat(valEl.value);
    if (!(w > 0)) { showToast('请输入有效体重'); valEl.focus(); return; }
    const exist = weightLogs.find(l => l.date === date);
    if (exist) {
      exist.weight = w;
      exist.updatedAt = Date.now();
    } else {
      weightLogs.push({ id: uid(), date, weight: w, createdAt: Date.now(), updatedAt: Date.now() });
    }
    weightLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveWeightLogs();
    valEl.value = '';
    renderWeightStats();
    renderWeightChart();
    renderWeightMonthChart();
    renderWeightList();
    showToast(exist ? '已更新该日体重' : '已记录体重');
  }

  addBtn.addEventListener('click', addLog);
  valEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });

  setBtn.addEventListener('click', () => {
    const t = parseFloat(document.getElementById('weightTarget').value);
    const h = parseFloat(document.getElementById('weightHeight').value);
    weightSettings.target = (t > 0) ? t : null;
    weightSettings.height = (h > 0) ? h : null;
    saveWeightSettings();
    renderWeightStats();
    renderWeightChart();
    renderWeightMonthChart();
    showToast('目标已保存');
  });

  if (list) {
    list.addEventListener('click', e => {
      const btn = e.target.closest('[data-action="wt-del"]');
      if (!btn) return;
      const id = btn.dataset.id;
      weightLogs = weightLogs.filter(l => l.id !== id);
      saveWeightLogs();
      renderWeightStats();
      renderWeightChart();
      renderWeightMonthChart();
      renderWeightList();
      showToast('已删除该记录');
    });
  }
}

function saveSalaryLogs() { localStorage.setItem(SALARY_LOGS_KEY, JSON.stringify(salaryLogs)); }

function renderSalaryStats() {
  const el = document.getElementById('saStats');
  if (!el) return;
  const asc = salaryAsc();
  const desc = salaryDesc();
  const last = desc.length ? desc[0] : null;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 11, 1);
  const cutoffStr = start.getFullYear() + '-' + ('0' + (start.getMonth() + 1)).slice(-2);
  const last12 = asc.filter(l => l.date >= cutoffStr);
  const sum12 = last12.reduce((s, l) => s + (l.total || 0), 0);
  const avgHead = last12.length ? (last12.reduce((s, l) => s + (l.head || 0), 0) / last12.length) : null;
  // 人效 = 营业额 ÷ 当月天数 ÷（人数 − 2）
  const daysOf = l => { const p = (l.date || '').split('-').map(Number); return (p[0] && p[1]) ? new Date(p[0], p[1], 0).getDate() : null; };
  const effOf = l => { const d = daysOf(l); return (d && l.head > 2) ? (l.revenue || 0) / d / (l.head - 2) : null; };
  // 平均工资 = 总工资 ÷（人数 − 2）（不含管理人员）
  const avgSalOf = l => (l.head > 2 ? l.total / (l.head - 2) : null);
  const perCap = effOf(last);
  const avgSal = avgSalOf(last);
  const effLast12 = last12.map(effOf).filter(v => v != null);
  const avgEff = effLast12.length ? Math.round(effLast12.reduce((s, v) => s + v, 0) / effLast12.length) : null;
  const avgSalLast12 = last12.map(avgSalOf).filter(v => v != null);
  const avgSalary12 = avgSalLast12.length ? Math.round(avgSalLast12.reduce((s, v) => s + v, 0) / avgSalLast12.length) : null;
  const cards = [];
  cards.push(statCard('上月人数', last ? last.head + ' 人' : '—', ''));
  cards.push(statCard('平均月人数', avgHead != null ? avgHead.toFixed(1) + ' 人' : '—', ''));
  cards.push(statCard('上月人效', perCap != null ? Math.round(perCap) + ' 元/人' : '—', 'success'));
  cards.push(statCard('近一年平均人效', avgEff != null ? avgEff + ' 元/人' : '—', ''));
  cards.push(statCard('上月平均工资', avgSal != null ? Math.round(avgSal) + ' 元/人' : '—', ''));
  cards.push(statCard('近一年平均工资', avgSalary12 != null ? avgSalary12 + ' 元/人' : '—', ''));
  el.innerHTML = cards.join('');
}

function buildSalaryLineSVG(logs, getVal, color, unit, marks) {
  const W = 640, H = 210, padL = 54, padR = 14, padT = 12, padB = 28;
  const all = logs.map(getVal).filter(v => v != null && isFinite(v));
  if (all.length === 0) return `<div class="wt-empty" style="padding:18px 0;">暂无数据</div>`;
  let vMin = Math.min.apply(null, all), vMax = Math.max.apply(null, all);
  if (vMin === vMax) { const pad = Math.max(1, Math.abs(vMax) * 0.1 || 1); vMin -= pad; vMax += pad; }
  const vRange = vMax - vMin;
  const n = logs.length;
  const xOf = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
  const yOf = v => H - padB - ((v - vMin) / vRange) * (H - padT - padB);
  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const gy = padT + k * (H - padT - padB) / 3;
    const val = vMax - (k / 3) * vRange;
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${Math.round(val)}</text>`;
  }
  let line = '', dots = '', prev = false;
  logs.forEach((l, i) => {
    const v = getVal(l);
    if (v == null || !isFinite(v)) { prev = false; return; }
    const x = xOf(i), y = yOf(v);
    line += (prev ? ' ' : '') + x.toFixed(1) + ',' + y.toFixed(1);
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}" stroke="#fff" stroke-width="1.5"><title>${escapeHtml(l.date)} ${Math.round(v)}${unit}</title></circle>`;
    prev = true;
  });
  let xlab = '';
  const step = Math.max(1, Math.ceil(n / 6));
  logs.forEach((l, i) => {
    if (i % step === 0 || i === n - 1) {
      const x = xOf(i);
      xlab += `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#9ca3af">${escapeHtml(l.date.slice(5))}</text>`;
    }
  });
  let marksSvg = '';
  if (marks) {
    const markList = [];
    if (marks.last != null) markList.push({ i: marks.last, kind: 'last' });
    if (marks.yoy != null) markList.push({ i: marks.yoy, kind: 'yoy' });
    markList.forEach(m => {
      const l = logs[m.i];
      if (!l) return;
      const v = getVal(l);
      if (v == null || !isFinite(v)) return;
      const x = xOf(m.i), y = yOf(v);
      const ring = m.kind === 'yoy' ? '#dc2626' : color;
      const isEnd = m.i === n - 1;
      const anchor = isEnd ? 'end' : 'middle';
      const tx = isEnd ? x - 6 : x;
      let ty = y - 9;
      if (ty < 14) ty = y + 16;
      marksSvg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="none" stroke="${ring}" stroke-width="2"/>`;
      marksSvg += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" font-size="10" font-weight="700" fill="${ring}">${Math.round(v)}${unit}</text>`;
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}<polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xlab}${marksSvg}</svg>`;
}

// 多项成本年度曲线：x 轴为 1-12 月，每个 series 代表一年（一条曲线），点上标记数值
function buildYearLinesSVG(series) {
  const W = 660, H = 240, padL = 56, padR = 16, padT = 18, padB = 34;
  const allVals = [];
  series.forEach(s => Object.values(s.vals).forEach(v => { if (isFinite(v)) allVals.push(v); }));
  if (allVals.length === 0) return `<div class="wt-empty" style="padding:18px 0;">暂无数据</div>`;
  let vMax = Math.max.apply(null, allVals);
  let vMin = Math.min.apply(null, allVals);
  if (vMin > 0) vMin = 0;
  if (vMax <= vMin) vMax = vMin + Math.max(1, Math.abs(vMin) || 1);
  const vRange = vMax - vMin;
  const months = 12;
  const xOf = m => padL + (m - 1) * (W - padL - padR) / (months - 1);
  const yOf = v => H - padB - (v - vMin) / vRange * (H - padT - padB);
  let grid = '';
  for (let k = 0; k <= 4; k++) {
    const gy = padT + k * (H - padT - padB) / 4;
    const val = vMax - (k / 4) * vRange;
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="#eef0f3"/><text x="${padL - 6}" y="${(gy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#9ca3af">${Math.round(val)}</text>`;
  }
  let xlab = '';
  for (let m = 1; m <= 12; m++) {
    if (m % 2 === 1 || m === 12) {
      const x = xOf(m);
      xlab += `<text x="${x.toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="9" fill="#9ca3af">${m}月</text>`;
    }
  }
  let lines = '', dots = '', labels = '';
  series.forEach(s => {
    const pts = Object.keys(s.vals).map(Number).sort((a, b) => a - b);
    if (pts.length === 0) return;
    let poly = '', prev = false;
    pts.forEach(m => {
      const v = s.vals[m];
      const x = xOf(m), y = yOf(v);
      poly += (prev ? ' ' : '') + x.toFixed(1) + ',' + y.toFixed(1);
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${s.color}" stroke="#fff" stroke-width="1.4"><title>${s.year}年${m}月 ${Math.round(v)}元</title></circle>`;
      let ty = y - 8; if (ty < 12) ty = y + 14; if (ty > H - 6) ty = y - 14;
      labels += `<text x="${x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${s.color}">${Math.round(v)}</text>`;
      prev = true;
    });
    lines += `<polyline points="${poly}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">${grid}${lines}${dots}${xlab}${labels}</svg>`;
}

function renderSalaryChart() {

  if (!el) return;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 23, 1); // 近两年 = 24个月
  const cutoffStr = start.getFullYear() + '-' + ('0' + (start.getMonth() + 1)).slice(-2);
  const logs = salaryAsc().filter(l => l.date >= cutoffStr);
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">还没有工资记录,先在上方记录月份工资吧</div>`;
    return;
  }
  const daysOf = l => { const p = (l.date || '').split('-').map(Number); return (p[0] && p[1]) ? new Date(p[0], p[1], 0).getDate() : null; };
  // 人效 = 营业额 ÷ 当月天数 ÷（人数 − 2）
  const effOf = l => { const d = daysOf(l); return (d && l.head > 2) ? (l.revenue || 0) / d / (l.head - 2) : null; };
  // 平均工资 = 总工资 ÷（人数 − 2）（不含管理人员）
  const avgSalOf = l => (l.head > 2 ? l.total / (l.head - 2) : null);

  const lastDate = lastLog.date;
  const [ly, lm] = lastDate.split('-').map(Number);
  const yoyStr = (ly - 1) + '-' + ('0' + lm).slice(-2);
  const yoyIdx = logs.findIndex(l => l.date === yoyStr);
  const charts = [
    { title: '营业额 (元)', color: '#14b8a6', unit: '元', get: l => l.revenue || 0 },
    { title: '总工资 (元)', color: '#6366f1', unit: '元', get: l => l.total || 0 },
    { title: '人数 (人)', color: '#f59e0b', unit: '人', get: l => l.head || 0 },
    { title: '人效 (元/人·天)', color: '#10b981', unit: '元/人', get: effOf },
    { title: '平均工资 (元/人)', color: '#ec4899', unit: '元/人', get: avgSalOf },
  ];
  el.innerHTML = charts.map(c => `
    <div class="wt-chart-sub">
      <div class="wt-chart-subtitle" style="color:${c.color}">${c.title}</div>
      ${buildSalaryLineSVG(logs, c.get, c.color, c.unit, { last: logs.length - 1, yoy: yoyIdx >= 0 ? yoyIdx : null })}
      <div class="wt-chart-subnote">最新 <b style="color:${c.color}">${lastDate}</b> · 同比 <b style="color:#dc2626">${yoyStr}</b>${yoyIdx >= 0 ? '' : '（暂无数据）'}</div>
    </div>`).join('');
}

  const logs = salaryDesc();
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">暂无记录</div>`;
    return;
  }
  el.innerHTML = logs.map(l => {
    const d = (l.date || '').split('-').map(Number);
    const days = (d[0] && d[1]) ? new Date(d[0], d[1], 0).getDate() : null;
    const eff = (days && l.head > 2) ? Math.round((l.revenue || 0) / days / (l.head - 2)) : null;
    const avgSal = l.head > 2 ? Math.round(l.total / (l.head - 2)) : null;
    return `
      <div class="wt-item" data-id="${l.id}">
        <div class="wt-item-date">${escapeHtml(l.date)}</div>
        <div class="wt-item-delta">营业额 ${(l.revenue || 0)}元 · 总工资 ${l.total}元 · 人数 ${l.head}人${eff != null ? ' · 人效' + eff + '元/人' : ''}${avgSal != null ? ' · 平均工资' + avgSal + '元/人' : ''}</div>
        <button class="action-btn edit" data-action="sa-edit" data-id="${l.id}" title="修改">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        </button>
        <button class="action-btn delete" data-action="sa-del" data-id="${l.id}" title="删除">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </div>`;
  }).join('');
}

function bindSalaryEvents() {
  const addBtn = document.getElementById('salaryAddBtn');
  const totalEl = document.getElementById('salaryTotal');
  const revenueEl = document.getElementById('salaryRevenue');
  const headEl = document.getElementById('salaryHead');
  const list = document.getElementById('saList');

  function addLog() {
    const monthEl = document.getElementById('salaryMonth');
    const date = monthEl.value || currentMonthStr();
    const total = parseFloat(totalEl.value);
    const revenue = parseFloat(revenueEl.value);
    const head = parseFloat(headEl.value);
    if (isNaN(total) || total < 0) { showToast('请输入有效总工资'); totalEl.focus(); return; }
    if (isNaN(revenue) || revenue < 0) { showToast('请输入有效营业额'); revenueEl.focus(); return; }
    if (isNaN(head) || head < 0) { showToast('请输入有效人数'); headEl.focus(); return; }
    const exist = salaryLogs.find(l => l.date === date);
    if (exist) {
      exist.total = total; exist.revenue = revenue; exist.head = head; exist.updatedAt = Date.now();
    } else {
      salaryLogs.push({ id: uid(), date, total, revenue, head, createdAt: Date.now(), updatedAt: Date.now() });
    }
    salaryLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveSalaryLogs();
    totalEl.value = ''; revenueEl.value = ''; headEl.value = '';
    renderSalaryStats();
    renderSalaryChart();
    renderSalaryList();
      showToast(exist ? '已更新该月工资' : '已记录工资');
  }

  addBtn.addEventListener('click', addLog);
  totalEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });
  revenueEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });
  headEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });

  if (list) {
    list.addEventListener('click', e => {
      const delBtn = e.target.closest('[data-action="sa-del"]');
      const editBtn = e.target.closest('[data-action="sa-edit"]');
      if (delBtn) {
        const id = delBtn.dataset.id;
        salaryLogs = salaryLogs.filter(l => l.id !== id);
        saveSalaryLogs();
        renderSalaryStats();
        renderSalaryChart();
        renderSalaryList();
              showToast('已删除该记录');
        return;
      }
      if (editBtn) {
        const rec = salaryLogs.find(l => l.id === editBtn.dataset.id);
        if (rec) {
          document.getElementById('salaryMonth').value = rec.date;
          totalEl.value = rec.total;
          revenueEl.value = (rec.revenue != null ? rec.revenue : '');
          headEl.value = rec.head;
          totalEl.focus();
          renderSalaryList();
          showToast('已载入该月工资,修改后点「记录工资」即可更新');
        }
      }
    });
  }
}

// ==================== 超市成本核算模块 ====================
const COST_LOGS_KEY = 'liumo_cost_logs';
const COST_ITEMS_KEY = 'liumo_cost_items';
// 默认成本项模板（含默认值，每月录入时可一键填入，默认值均可编辑）
const COST_DEFAULT_ITEMS = [
  { name: '房租', default: 5000 },
  { name: '人工', default: 8000 },
  { name: '进货成本', default: 0 },
  { name: '水电', default: 1200 },
  { name: '损耗', default: 800 },
  { name: '其他', default: 0 },
];

function loadCost() {
  try {
    const d = localStorage.getItem(COST_LOGS_KEY);
    costLogs = d ? JSON.parse(d) : [];
    if (!Array.isArray(costLogs)) costLogs = [];
  } catch (e) { costLogs = []; }
  // 兼容旧版（字段为 category/cost/sale/loss）: 转为「成本项」结构
  costLogs = costLogs.map(normalizeCostLog);
  costLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}
function loadCostItems() {
  try {
    const d = localStorage.getItem(COST_ITEMS_KEY);
    let arr = d ? JSON.parse(d) : null;
    if (!Array.isArray(arr)) arr = null;
    costItems = arr;
  } catch (e) { costItems = null; }
  // 首次无数据：初始化一份常见默认成本项（用户可增删改）
  if (!costItems) { costItems = COST_DEFAULT_ITEMS.map(n => ({ id: uid(), name: n.name, default: n.default || 0 })); saveCostItems(); }
  // 兼容旧数据（无 default 字段）
  costItems.forEach(it => { it.default = (it.default != null && !isNaN(Number(it.default))) ? Number(it.default) : 0; });
}
function saveCostItems() { localStorage.setItem(COST_ITEMS_KEY, JSON.stringify(costItems)); }
// 把任意记录规范为 { id, date, items:[{name,amount}], note } 结构
function normalizeCostLog(l) {
  if (!l || typeof l !== 'object') return { id: uid(), date: currentMonthStr(), items: [], note: '' };
  if (Array.isArray(l.items)) {
    const items = l.items
      .map(it => ({ name: String(it && it.name != null ? it.name : '').trim() || '未命名', amount: Number(it && it.amount != null ? it.amount : 0) || 0 }))
      .filter(it => it.amount > 0 || it.name !== '未命名');
    return { id: l.id || uid(), date: l.date, items, note: l.note || '', createdAt: l.createdAt || Date.now(), updatedAt: l.updatedAt || Date.now() };
  }
  // 旧版: 只有单条成本/损耗, 并入 items
  const items = [];
  const cat = (l.category || '').trim() || '进货成本';
  if (l.cost != null && !isNaN(Number(l.cost)) && Number(l.cost) > 0) items.push({ name: cat, amount: Number(l.cost) });
  if (l.loss != null && !isNaN(Number(l.loss)) && Number(l.loss) > 0) items.push({ name: '损耗', amount: Number(l.loss) });
  return { id: l.id || uid(), date: l.date, items, note: l.note || '', createdAt: l.createdAt || Date.now(), updatedAt: l.updatedAt || Date.now() };
}
function saveCostLogs() { localStorage.setItem(COST_LOGS_KEY, JSON.stringify(costLogs)); }
function costAsc() { return [...costLogs].sort((a, b) => (a.date || '').localeCompare(b.date || '')); }
function costDesc() { return [...costLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
// 单条记录的总支出
function costRecTotal(rec) { return (rec.items || []).reduce((s, it) => s + (Number(it.amount) || 0), 0); }
// 全部记录的总支出
function costAllTotal() { return costLogs.reduce((s, r) => s + costRecTotal(r), 0); }
// 各成本项累计（跨所有月份）: { name: total }
function costItemTotals() {
  const map = {};
  costLogs.forEach(r => (r.items || []).forEach(it => {
    const n = (it.name || '').trim() || '未命名';
    map[n] = (map[n] || 0) + (Number(it.amount) || 0);
  }));
  return map;
}
function costWindowLogs() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 23, 1); // 近两年 = 24 个月
  const cutoffStr = start.getFullYear() + '-' + ('0' + (start.getMonth() + 1)).slice(-2);
  return costAsc().filter(l => l.date >= cutoffStr);
}
// 改名成本项：同步所有历史记录里同名的项
function renameCostItem(id, newName) {
  const it = costItems.find(x => x.id === id);
  if (!it) return;
  const oldName = it.name;
  it.name = newName;
  costLogs.forEach(r => (r.items || []).forEach(i => { if (i.name === oldName) i.name = newName; }));
  saveCostItems(); saveCostLogs();
}
// 删除成本项：移除定义并清理所有历史记录中该名称的金额
function removeCostItem(id) {
  const it = costItems.find(x => x.id === id);
  if (!it) return;
  costItems = costItems.filter(x => x.id !== id);
  costLogs.forEach(r => { r.items = (r.items || []).filter(i => i.name !== it.name); });
  saveCostItems(); saveCostLogs();
}

function renderCostStats() {

function renderCostChart() {
  const el = document.getElementById('coChart');
  if (!el) return;
  const logs = costWindowLogs();
  if (logs.length === 0) {
    el.innerHTML = `<div class="wt-empty">还没有成本记录,先在上方记录月份数据吧</div>`;
    return;
  }
  const lastLog = logs[logs.length - 1];
  const lastDate = lastLog.date;
  const [ly, lm] = lastDate.split('-').map(Number);
  const yoyStr = (ly - 1) + '-' + ('0' + lm).slice(-2);
  const yoyIdx = logs.findIndex(l => l.date === yoyStr);

// 月度明细矩阵：月份 × 成本项
function renderCostMatrix() {
  const el = document.getElementById('coMatrix');
  if (!el) return;
  const logs = costDesc();
  if (logs.length === 0) { el.innerHTML = `<div class="wt-empty">暂无数据</div>`; return; }

  const seen = new Set();
  const itemNames = [];
  costItems.forEach(it => {
    const n = (it.name || '').trim();
    if (n && totals[n] != null && !seen.has(n)) { itemNames.push(n); seen.add(n); }
  });
  Object.keys(totals).forEach(n => { if (!seen.has(n)) { itemNames.push(n); seen.add(n); } });
  const money = v => Math.round(v).toLocaleString();
  const sumsOf = r => {
    const s = {};
    (r.items || []).forEach(it => { const n = (it.name || '').trim() || '未命名'; s[n] = (s[n] || 0) + (Number(it.amount) || 0); });
    return s;
  };
  el.innerHTML = `
    <table class="wt-cat co-matrix">
      <thead><tr>
        <th>月份</th>
        ${itemNames.map(n => `<th>${escapeHtml(n)}</th>`).join('')}
        <th>合计</th>

        ${logs.map(r => {
          const sums = sumsOf(r);

            <td>${escapeHtml(r.date)}${r.note ? ' · ' + escapeHtml(r.note) : ''}</td>

}

function bindCostEvents() {
  const addBtn = document.getElementById('costAddBtn');
  const monthEl = document.getElementById('costMonth');
  const noteEl = document.getElementById('costNote');
  const adminList = document.getElementById('coItemList');
  const addItemBtn = document.getElementById('coItemAddBtn');
  const fixedEl = document.getElementById('costFixed');
  const laborEl = document.getElementById('costLabor');
  const otherEl = document.getElementById('costOther');
  const entryTotalEl = document.getElementById('coEntryTotal');
  const fillBtn = document.getElementById('coFillDefaultBtn');
  const getSalaryBtn = document.getElementById('coGetSalaryBtn');
  const list = document.getElementById('coList');

  function refreshDerived() {
    renderCostStats(); renderCostChart(); renderCostSummary(); renderCostMatrix(); renderCostList();
  }

  // 固定成本设置：折叠/展开
  const adminToggle = document.getElementById('coAdminToggle');
  if (adminToggle) {
    adminToggle.addEventListener('click', () => {
      const card = adminToggle.closest('.co-admin-card');
      const collapsed = card.classList.toggle('co-collapsed');
      adminToggle.setAttribute('aria-expanded', String(!collapsed));
    });
  }

  // 成本项管理：添加
  addItemBtn.addEventListener('click', () => {
    costItems.push({ id: uid(), name: '新成本项' });
    saveCostItems();
    renderCostItemAdmin();
    // 添加新项时自动展开，便于立即编辑
    const card = addItemBtn.closest('.co-admin-card');
    if (card && card.classList.contains('co-collapsed')) {
      card.classList.remove('co-collapsed');
      if (adminToggle) adminToggle.setAttribute('aria-expanded', 'true');
    }
    const rows = adminList.querySelectorAll('.co-admin-row');
    const last = rows[rows.length - 1];
    if (last) last.querySelector('.co-admin-name').focus();
  });
  // 成本项管理：删除（同时清理历史金额）
  adminList.addEventListener('click', e => {
    const del = e.target.closest('.co-admin-del');
    if (del) {
      const id = del.dataset.id;
      const it = costItems.find(x => x.id === id);
      removeCostItem(id);
      renderCostItemAdmin();
      refreshDerived();
      showToast('已删除成本项' + (it ? '「' + it.name + '」' : '') + '及其历史金额');
    }
  });
  // 成本项管理：改名 / 改默认值（失焦保存）
  adminList.addEventListener('change', e => {
    const defInp = e.target.closest('.co-admin-default');
    if (defInp) {
      const it = costItems.find(x => x.id === defInp.dataset.id);
      if (it) { it.default = parseFloat(defInp.value) || 0; saveCostItems(); showToast('已更新「' + it.name + '」默认值'); }
      return;
    }
    const nameInp = e.target.closest('.co-admin-name');
    if (nameInp) {
      const id = nameInp.dataset.id;
      const newName = (nameInp.value || '').trim() || '未命名';
      nameInp.value = newName;
      renameCostItem(id, newName);
      refreshDerived();
    }
  });

  // 录入：读取三项聚合金额
  function readEntryItems() {
    const items = [];
    const fixed = parseFloat(fixedEl.value);
    const labor = parseFloat(laborEl.value);
    const other = parseFloat(otherEl.value);
    if (!isNaN(fixed) && fixed > 0) items.push({ name: '固定成本', amount: fixed });
    if (!isNaN(labor) && labor > 0) items.push({ name: '人工成本', amount: labor });
    if (!isNaN(other) && other > 0) items.push({ name: '其他', amount: other });
    return items;
  }

  // 实时合计显示
  function updateEntryTotal() {
    if (!entryTotalEl) return;
    const sum = ['costFixed', 'costLabor', 'costOther'].reduce((s, id) => {
      const v = parseFloat(document.getElementById(id).value);
      return s + (isNaN(v) ? 0 : v);
    }, 0);
    entryTotalEl.textContent = saMoney(sum);
  }
  [fixedEl, laborEl, otherEl].forEach(el => el && el.addEventListener('input', updateEntryTotal));

  function addLog() {
    const date = monthEl.value || currentMonthStr();
    const items = readEntryItems();
    const note = (noteEl.value || '').trim();
    const exist = costLogs.find(l => l.date === date);
    if (exist) { exist.items = items; exist.note = note; exist.updatedAt = Date.now(); }
    else { costLogs.push({ id: uid(), date, items, note, createdAt: Date.now(), updatedAt: Date.now() }); }
    costLogs.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    saveCostLogs();
    fixedEl.value = ''; laborEl.value = ''; otherEl.value = '';
    noteEl.value = '';
    updateEntryTotal();
    refreshDerived();
    showToast(exist ? '已更新 ' + date + ' 成本' : '已记录 ' + date + ' 成本');
  }

  // 一键填入默认值：把上方固定成本设置的成本合计填入「固定成本金额」
  fillBtn.addEventListener('click', () => {
    const total = costItems.reduce((s, it) => s + (Number(it.default) || 0), 0);
    if (fixedEl) { fixedEl.value = total > 0 ? total : ''; updateEntryTotal(); }
    showToast('已填入固定成本设置的成本合计：' + saMoney(total));
  });

  // 获取工资：从工资管理读取选择月份的总工资并填入「人工成本」
  if (getSalaryBtn) {
    getSalaryBtn.addEventListener('click', () => {
      const date = monthEl ? (monthEl.value || currentMonthStr()) : currentMonthStr();
      let logs = [];
      try { const raw = localStorage.getItem('liumo_salary_logs'); logs = raw ? JSON.parse(raw) : []; } catch (e) { logs = []; }
      if (!Array.isArray(logs)) logs = [];
      const rec = logs.find(l => String(l.date) === String(date));
      if (!rec) { showToast('工资管理中未找到 ' + date + ' 的记录'); return; }
      const total = Number(rec.total) || 0;
      if (laborEl) { laborEl.value = total > 0 ? total : ''; updateEntryTotal(); }
      showToast('已填入 ' + date + ' 总工资：' + saMoney(total));
    });
  }

  addBtn.addEventListener('click', addLog);
  noteEl.addEventListener('keydown', e => { if (e.key === 'Enter') addLog(); });

  if (list) list.addEventListener('click', e => {
    const delBtn = e.target.closest('[data-action="co-del"]');
    const editBtn = e.target.closest('[data-action="co-edit"]');
    if (delBtn) {
      const id = delBtn.dataset.id;
      costLogs = costLogs.filter(l => l.id !== id);
      saveCostLogs();
      refreshDerived();
      showToast('已删除该记录');
      return;
    }
    if (editBtn) {
      const rec = costLogs.find(l => l.id === editBtn.dataset.id);
      if (rec) {
        monthEl.value = rec.date;
        noteEl.value = rec.note || '';
        const sums = {};
        (rec.items || []).forEach(it => { sums[(it.name || '').trim()] = it.amount; });
        if (fixedEl) fixedEl.value = sums['固定成本'] != null ? sums['固定成本'] : '';
        if (laborEl) laborEl.value = sums['人工成本'] != null ? sums['人工成本'] : '';
        if (otherEl) otherEl.value = sums['其他'] != null ? sums['其他'] : '';
        updateEntryTotal();
        monthEl.focus();
        showToast('已载入 ' + rec.date + '，修改后点「记录成本」即可更新');
      }
    }
  });
}

function renderCeStats() {
  const el = document.getElementById('ceStats');
  if (!el) return;
  const now = new Date();
  const cy = now.getFullYear(), cm = now.getMonth() + 1;
  const curMonth = cy + '-' + ('0' + cm).slice(-2);
  const lastYearMonth = (cy - 1) + '-' + ('0' + cm).slice(-2);
  const last12 = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(cy, cm - 1 - i, 1);
    last12.push(d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2));
  }
  function findItemId(name) {
    let it = costEntryItems.find(x => (x.name || '').trim() === name);
    if (it) return it.id;
    it = costEntryItems.find(x => (x.name || '').includes(name));
    return it ? it.id : null;
  }
  function monthTotal(itemName, month) {
    const id = findItemId(itemName);
    if (!id) return 0;
    return costEntryLogs.reduce((s, l) => s + (((l.date || '').startsWith(month) && l.itemId === id) ? (Number(l.amount) || 0) : 0), 0);
  }
  function avg12(itemName) {
    const id = findItemId(itemName);
    if (!id) return 0;
    const sum = last12.reduce((s, m) => s + costEntryLogs.reduce((ss, l) => ss + (((l.date || '').startsWith(m) && l.itemId === id) ? (Number(l.amount) || 0) : 0), 0), 0);
    return sum / 12;
  }
  const plasticThis = monthTotal('塑料袋', curMonth);
  const plasticAvg = avg12('塑料袋');
  const elecThis = monthTotal('电费', curMonth);
  const elecLast = monthTotal('电费', lastYearMonth);
  const elecAvg = avg12('电费');
  const cards = [
    statCard('本月塑料袋成本', saMoney(plasticThis), ''),
    statCard('近一年平均每月塑料袋成本', saMoney(plasticAvg), ''),
    statCard('本月电费', saMoney(elecThis), ''),
    statCard('近一年平均每月电费', saMoney(elecAvg), ''),
    statCard('去年同月份电费', saMoney(elecLast), '')
  ];
  el.innerHTML = cards.join('');
}

function renderCeCharts() {
  const el = document.getElementById('ceCharts');
  if (!el) return;
  if (costEntryLogs.length === 0) { el.innerHTML = `<div class="wt-empty">暂无数据，先录入成本记录后这里会显示各成本项的月度趋势</div>`; return; }
  const YEAR_COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#06b6d4', '#ec4899', '#8b5cf6', '#84cc16'];
  const items = costEntryItems.filter(it => costEntryLogs.some(l => l.itemId === it.id));
  if (items.length === 0) { el.innerHTML = `<div class="wt-empty">暂无可绘制的成本项</div>`; return; }
  el.innerHTML = items.map(it => {
    const byYear = {};
    costEntryLogs.filter(l => l.itemId === it.id).forEach(l => {
      const p = (l.date || '').split('-').map(Number);
      const y = p[0], m = p[1];
      if (!y || !m) return;
      byYear[y] = byYear[y] || {};
      byYear[y][m] = (byYear[y][m] || 0) + (Number(l.amount) || 0);
    });
    const years = Object.keys(byYear).map(Number).sort((a, b) => a - b);
    const series = years.map((y, i) => ({ year: y, color: YEAR_COLORS[i % YEAR_COLORS.length], vals: byYear[y] }));
    const legend = years.map((y, i) => `<span class="ce-legend-item"><i style="background:${YEAR_COLORS[i % YEAR_COLORS.length]}"></i>${y}年</span>`).join('');
    return `
      <div class="ce-chart-box">
        <div class="ce-chart-head">
          <span class="ce-chart-name">${escapeHtml(it.name)}</span>
          <span class="ce-chart-legend">${legend}</span>
        </div>
        ${buildYearLinesSVG(series)}
      </div>`;
  }).join('');
}

function renderCeList() {

  const logs = [...costEntryLogs].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
