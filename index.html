function paintStats(basis, cur, days) {
  planCurrentBasis = basis;
  const statsEl = document.getElementById('spStats');
  if (!statsEl) return;
  const ticket = (basis.ds && basis.q) ? basis.ds / basis.q : 0;
  const retail = basis.ds * days;
  const basisLabel = planLoaded ? '已保存计划' : { yoy:'去年同月', m3:'近3月均值', m6:'近6月均值', m12:'近12月均值', grow:'近3月×(1+增长)' }[planStrategy];
  const be = document.getElementById('spBasis'); if (be) be.textContent = '基准：' + basisLabel;
  statsEl.innerHTML = `
    ${statCard('计划零售总额', saMoney(retail), '')}
    ${statCard('计划日均销售额 (元/天)', `<input id="spDs" type="number" class="sp-input" value="${Math.round(basis.ds)}">`, '')}
    ${statCard('计划日均客单量 (单/天)', `<input id="spQ" type="number" class="sp-input" value="${Math.round(basis.q)}">`, '')}
    ${statCard('计划日均客单价 (元)', ticket.toFixed(2), '')}
  `;
  const dsEl = document.getElementById('spDs');
  const qEl = document.getElementById('spQ');
  if (dsEl) dsEl.addEventListener('input', () => { planCurrentBasis.ds = +dsEl.value || 0; paintDerived(cur, days); });
  if (qEl) qEl.addEventListener('input', () => { planCurrentBasis.q = +qEl.value || 0; paintDerived(cur, days); });
  paintDerived(cur, days);
}

function paintDerived(cur, days) {
  const b = planCurrentBasis;
  const ticket = (b.ds && b.q) ? b.ds / b.q : 0;
  const retail = b.ds * days;
  const statsEl = document.getElementById('spStats');
  if (!statsEl) return;
  const cards = statsEl.children;
  if (cards[0] && cards[0].querySelector('.stat-value')) cards[0].querySelector('.stat-value').textContent = saMoney(retail);
  if (cards[3] && cards[3].querySelector('.stat-value')) cards[3].querySelector('.stat-value').textContent = ticket.toFixed(2);
  const cons = document.getElementById('spCons');
  if (cons) cons.innerHTML = (b.ds>0 && b.q>0)
    ? `四项指标<b class="sp-ok">自洽</b>：零售 = ${saMoney(b.ds)} × ${days}天 = ${saMoney(retail)}；客单价 = ${saMoney(b.ds)} ÷ ${Math.round(b.q)} = ${ticket.toFixed(2)} 元。`
    : '请填写日均销售额与客单量。';
  paintCompare(retail, cur);
}

function paintCompare(planRetail, cur) {
  const el = document.getElementById('spCompare');
  if (!el) return;
  const actual = salesLogs.find(l => l.date === cur);
  if (actual) {
    const aRet = (actual.dailySales||0) * (daysInMonth(cur)||30);
    const rate = planRetail ? Math.min(100, aRet / planRetail * 100) : 0;
    const aTick = (actual.dailySales && actual.dailyOrders) ? actual.dailySales/actual.dailyOrders : 0;
    const dsOk = (actual.dailySales||0) >= (planCurrentBasis.ds||0);
    el.innerHTML = `
      <div class="sp-compare-row"><span>零售总额达成率</span><span>${rate.toFixed(1)}%</span></div>
      <div class="sp-bar"><i style="width:${rate}%"></i></div>
      <div class="sp-compare-row" style="margin-top:12px;"><span>实际日均销售额</span><span>${saMoney(actual.dailySales)} <span class="sp-pill ${dsOk?'g':'r'}">${dsOk?'达标':'未达'}</span></span></div>
      <div class="sp-compare-row"><span>实际日均客单量</span><span>${actual.dailyOrders||0} 单</span></div>
      <div class="sp-compare-row"><span>实际日均客单价</span><span>${aTick? aTick.toFixed(2):'—'} 元</span></div>`;
  } else {
    el.innerHTML = `<div class="wt-note" style="margin:0;">本月「销售数据管理」中尚无实际录入，保存计划后可在此对比达成情况。</div>`;
  }
}


function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ===================== 云端同步（GitHub Gist） =====================
let SKIP_SYNC = false;
let syncTimer = null;
const SYNC_PREFIX = 'liumo_sync_';
const SYNC_TOKEN_KEY = SYNC_PREFIX + 'token';
const SYNC_GIST_KEY = SYNC_PREFIX + 'gist';
const SYNC_AUTO_KEY = SYNC_PREFIX + 'auto';
const SYNC_FILE = 'liumo-workbench-data.json';
const SYNC_LASTPUSH_CONTENT = SYNC_PREFIX + 'lastpush';

// 规范化序列化（排序键），用于比较本地/云端/基线内容是否一致
function canon(obj){
  if(!obj || typeof obj !== 'object') return JSON.stringify(obj);
  const o = {};
  for(const k of Object.keys(obj).sort()) o[k] = obj[k];
  return JSON.stringify(o);
}

// 解析云端快照：兼容新格式 {updatedAt,data} 与旧格式（裸平铺 JSON）
function safeParseSnapshot(content){
  try {
    const o = JSON.parse(content);
    if(o && typeof o === 'object' && o.data && typeof o.data === 'object') return o;
    return { updatedAt: null, data: (o && typeof o === 'object') ? o : {} };
  } catch(e){ return null; }
}

// 把云端快照写入本地（保留同步配置键），可选回写 lastpush 时间戳
async function applyCloudSnapshot(snap, opts){
  opts = opts || {};
  const data = snap && snap.data ? snap.data : {};
  SKIP_SYNC = true;
  try {
    clearLocalUserData();
    for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
    reloadAllData();
    renderContent();
    if(opts.setLastPush && snap) localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(snap.data || {}));
  } finally {
    SKIP_SYNC = false; // 任何异常都必须释放，否则自动同步会永久失效
  }
}

// 拦截 setItem, 实现改动后防抖自动同步
(function(){
  const _set = Storage.prototype.setItem;
  Storage.prototype.setItem = function(k, v){
    _set.call(this, k, v);
    if(!SKIP_SYNC && typeof k === 'string' && !k.startsWith(SYNC_PREFIX)) scheduleSync();
  };
})();

function scheduleSync(){
  if(localStorage.getItem(SYNC_AUTO_KEY) !== '1') return;
  if(!localStorage.getItem(SYNC_TOKEN_KEY) || !localStorage.getItem(SYNC_GIST_KEY)) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncPushNow(true); }, 2000);
}

function gatherLocal(){
  const o = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && !k.startsWith(SYNC_PREFIX)) o[k] = localStorage.getItem(k);
  }
  return o;
}

// 同步超限降级：去掉活动图片（仅保留标题/类别/详情等文字），让其余数据仍可备份
function stripActivityImages(data){
  const out = {};
  for(const k in data){
    if(k === 'liumo_activities_fresh'){
      try {
        const arr = JSON.parse(data[k] || '[]');
        out[k] = JSON.stringify(arr.map(a => { const c = Object.assign({}, a); delete c.images; return c; }));
      } catch(e){ out[k] = data[k]; }
    } else {
      out[k] = data[k];
    }
  }
  return out;
}

function timeStr(){
  const d = new Date();
  return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
}
function setSyncStatus(t){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = t;
}

async function syncPushNow(silent, opts){
  opts = opts || {};
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  if(!tok){ if(!silent) showToast('请先在云端同步面板填入 GitHub Token'); return; }
  // 首次同步且无 GID 时，复用账号下最新的备份 Gist（避免不断新建孤儿 Gist）
  if(!gid){ const fg = await findSyncGist(tok); if(fg){ gid = fg; localStorage.setItem(SYNC_GIST_KEY, fg); } }
  const now = new Date().toISOString();
  const localData = gatherLocal();
  let content = JSON.stringify({ updatedAt: now, data: localData });
  // 守卫 + 降级：GitHub Gist 单文件上限约 1MB。活动图片为 base64 易超限，
  // 超限时先尝试「仅同步文字、跳过活动图片」让其余数据仍可备份，仍超限才中止。
  if (content.length > 950000) {
    const reduced = stripActivityImages(localData);
    const reducedContent = JSON.stringify({ updatedAt: now, data: reduced });
    if (reducedContent.length <= 950000) {
      setSyncStatus('已同步(跳过图片)');
      if (!silent) showToast('活动图片过大已跳过，已同步其余数据（标题/类别/详情）');
      content = reducedContent;
    } else {
      setSyncStatus('数据过大');
      if (!silent) showToast('同步失败：本地数据过大，已超过 GitHub Gist 单文件上限，建议精简数据后再同步');
      return;
    }
  }

  // 冲突感知（三路）：云端自我们上次同步后若被改过，则拉取云端而不是覆盖它
  if(gid && !opts.force){
    const base = localStorage.getItem(SYNC_LASTPUSH_CONTENT);
    if(base !== null && base !== undefined){
      try {
        const cres = await fetch('https://api.github.com/gists/' + gid, {
          headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
        });
        if(cres.ok){
          const cj = await cres.json();
          const cf = cj.files && cj.files[SYNC_FILE];
          if(cf){
            const cs = safeParseSnapshot(cf.content);
            const remoteData = cs ? (cs.data || {}) : {};
            if(canon(remoteData) !== base){
              await applyCloudSnapshot(cs, { setLastPush:true });
              setSyncStatus('已合并云端更新 ' + timeStr());
              if(!silent) showToast('云端有更新，已合并（未覆盖）');
              return;
            }
          }
        }
      } catch(e){ /* 忽略，继续推送 */ }
    }
  }
  const payload = JSON.stringify({ public:false, files: { [SYNC_FILE]: { content: content } } });
  async function doPush(g){
    let url = 'https://api.github.com/gists', method = 'POST';
    if(g){ url = 'https://api.github.com/gists/' + g; method = 'PATCH'; }
    return fetch(url, { method: method, headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body: payload });
  }
  try {
    let res = await doPush(gid);
    if(res.status === 401){ showToast('同步失败: Token 无效/无权限（401），请确认填入的是带 gist 权限的 Token'); return; }
    if(res.status === 404 && gid){            // Gist 已不存在（被删除等），清空 GID 重建
      localStorage.removeItem(SYNC_GIST_KEY);
      gid = null;
      res = await doPush(null);
      if(res.status === 401){ showToast('同步失败: Token 无效/无权限（401），请确认填入的是带 gist 权限的 Token'); return; }
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if(!gid && j.id){
      SKIP_SYNC = true;
      localStorage.setItem(SYNC_GIST_KEY, j.id);
      SKIP_SYNC = false;
    }
    localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(localData));
    setSyncStatus('已同步 ' + timeStr());
    if(!silent) showToast('已同步到云端');
  } catch(e){
    setSyncStatus('同步失败');
    if(!silent) showToast('同步失败: ' + e.message);
  }
}

async function restoreFromCloud(){
  clearTimeout(syncTimer); // 取消可能待推送的本地改动，避免把云端覆盖掉
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  if(!tok){ showToast('请先配置云端同步（填入 Token）'); return; }
  if(!gid){ gid = await findSyncGist(tok); if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); } }
  if(!gid){ showToast('未找到云端备份 Gist，请先「立即同步」'); return; }
  if(!confirm('从云端恢复将覆盖本地当前数据，确定继续？')) return;
  try {
    let res = await fetch('https://api.github.com/gists/' + gid, {
      headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
    });
    if(res.status === 404){            // GID 失效，重新查找最新备份
      localStorage.removeItem(SYNC_GIST_KEY);
      gid = await findSyncGist(tok);
      if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); res = await fetch('https://api.github.com/gists/'+gid, { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } }); }
      else { showToast('未找到云端备份 Gist，请先「立即同步」'); return; }
    }
    if(res.status === 401){ showToast('恢复失败: Token 无效/无权限，请确认填入的是带 gist 权限的 Token'); return; }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const f = j.files && j.files[SYNC_FILE];
    if(!f){ showToast('云端暂无数据'); return; }
    const snap = safeParseSnapshot(f.content);
    if(!snap){ showToast('云端数据格式异常'); return; }
    await applyCloudSnapshot(snap, { setLastPush:true });
    showToast('已从云端恢复数据');
    setSyncStatus('已配置');
  } catch(e){ showToast('恢复失败: ' + e.message); }
}

async function findSyncGist(tok){
  try {
    const u = await fetch('https://api.github.com/user', { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } });
    if(!u.ok) return null;
    const me = await u.json();
    const r = await fetch('https://api.github.com/users/'+me.login+'/gists?per_page=100', { headers:{ Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' } });
    if(!r.ok) return null;
    const list = await r.json();
    // 选 updated_at 最新的那份备份（列表不含文件内容，故以 Gist 更新时间为准）
    let best = null, bestScore = -1;
    for(const g of list){
      if(!(g.files && g.files[SYNC_FILE])) continue;
      const score = Date.parse(g.updated_at || g.created_at || 0);
      if(score > bestScore){ bestScore = score; best = g.id; }
    }
    return best;
  } catch(e){ return null; }
}

function clearLocalUserData(){
  const keep = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SYNC_PREFIX) === 0) keep[k] = localStorage.getItem(k);
  }
  localStorage.clear();
  for(const k in keep) localStorage.setItem(k, keep[k]);
}

async function tryCloudRestoreFirst(){
  let gid = localStorage.getItem(SYNC_GIST_KEY);
  const tok = localStorage.getItem(SYNC_TOKEN_KEY);
  if(!tok) return false;
  if(!gid){ gid = await findSyncGist(tok); if(gid){ localStorage.setItem(SYNC_GIST_KEY, gid); } }
  if(!gid) return false;
  try {
    const res = await fetch('https://api.github.com/gists/' + gid, {
      headers: { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' }
    });
    if(!res.ok) return false;
    const j = await res.json();
    const f = j.files && j.files[SYNC_FILE];
    if(!f) return false;
    const snap = safeParseSnapshot(f.content);
    if(!snap) return false;
    const data = snap.data || {};
    if(Object.keys(data).length === 0) return false;
    let hasLocal = false;
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && !k.startsWith(SYNC_PREFIX) && k!=='liumo_workbench_initialized'){ hasLocal=true; break; } }
    if(hasLocal) return false;
    SKIP_SYNC = true;
    try {
      for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
      reloadAllData();
      if(snap.updatedAt) localStorage.setItem(SYNC_LASTPUSH_CONTENT, canon(snap.data || {}));
    } finally {
      SKIP_SYNC = false; // 异常也必须释放，避免自动同步永久失效
    }
    return Object.keys(data).length > 0;
  } catch(e){ return false; }
}

function reloadAllData(){
  loadQuotes(); loadStudyRecords(); loadStudyConfig(); loadStudyPoints(); loadWeight(); loadSalary(); loadCost(); loadCostItems(); loadScrap(); loadRope(); loadSales(); loadPoster(); loadDailySales(); tmLoad();
}

function exportBackup(){
  const data = gatherLocal();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const ds = d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
  a.href = url; a.download = 'liumo-backup-'+ds+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  showToast('已导出备份文件');
}

function importBackupFromFile(file){
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const data = JSON.parse(reader.result);
      SKIP_SYNC = true;
      try {
        for(const k in data){ if(k.startsWith(SYNC_PREFIX)) continue; localStorage.setItem(k, data[k]); }
        reloadAllData();
        renderContent();
      } finally {
        SKIP_SYNC = false; // 导入异常也必须释放，避免自动同步永久失效
      }
      showToast('已从备份文件恢复数据');
      if(localStorage.getItem(SYNC_AUTO_KEY) === '1') syncPushNow(true);
    } catch(e){ showToast('导入失败: 文件格式错误'); }
  };
  reader.readAsText(file);
}

function bindSyncUI(){

  const tokEl = document.getElementById('syncToken');

  tokEl.value = localStorage.getItem(SYNC_TOKEN_KEY) || '';
  autoEl.checked = localStorage.getItem(SYNC_AUTO_KEY) === '1';

  document.getElementById('syncRestore').onclick = function(){ restoreFromCloud(); };
  document.getElementById('syncDisconnect').onclick = function(){

// init() 统一在脚本最末尾调用（见文件结尾），确保所有模块常量已初始化


function tmLoad() {
  try {
    const raw = localStorage.getItem(TASKMGR_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    tmTasks = Array.isArray(arr) ? arr : [];
  } catch (e) { tmTasks = []; }
  tmNormalize();
}
function tmSave() {
  localStorage.setItem(TASKMGR_KEY, JSON.stringify(tmTasks));
  tmTasks.forEach(t => { t.updatedAt = t.updatedAt || Date.now(); });
}
function tmLoadMeta() {
  try { return JSON.parse(localStorage.getItem(TASKMGR_META_KEY) || '{}') || {}; }
  catch (e) { return {}; }
}
function tmSaveMeta(m) {
  localStorage.setItem(TASKMGR_META_KEY, JSON.stringify(m));
}

// 补齐字段 / 校正非法数据
function tmNormalize() {
  let changed = false;
  tmTasks.forEach((t, i) => {
    if (!t.id) { t.id = uid(); changed = true; }
    if (!TASKMGR_KINDS.some(k => k.id === t.kind)) { t.kind = 'daily'; changed = true; }
    if (typeof t.done !== 'boolean') { t.done = false; changed = true; }
    if (typeof t.order !== 'number' || isNaN(t.order)) { t.order = i; changed = true; }
    if (!t.createdAt) { t.createdAt = Date.now(); changed = true; }
    if (t.kind === 'weekly') {
      const p = parseInt(t.plan, 10);
      if (!(p >= 1 && p <= 7)) { t.plan = 1; changed = true; } else { t.plan = p; }
    } else if (t.kind === 'monthly') {
      const p = parseInt(t.plan, 10);
      if (!(p >= 1 && p <= 31)) { t.plan = 1; changed = true; } else { t.plan = p; }
    } else {
      if (t.plan !== undefined && t.plan !== null) { t.plan = null; changed = true; }
    }
  });
  if (changed) localStorage.setItem(TASKMGR_KEY, JSON.stringify(tmTasks));
}

// ---------- 周期重置 ----------
function tmDateKey(d) {
  const x = d || new Date();
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
// 本周一 00:00 的日期
function tmWeekKey(d) {
  const x = new Date(d || Date.now());
  x.setHours(0,0,0,0);
  const day = x.getDay();                 // 0=周日
  const diff = (day === 0 ? -6 : 1 - day); // 回退到周一
  x.setDate(x.getDate() + diff);
  return tmDateKey(x);
}
function tmMonthKey(d) {
  const x = new Date(d || Date.now());
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;
}
// 按周期重置完成状态：每日按天、每周按周、每月按月；紧急任务不重置
function tmApplyCycles() {
  const meta = tmLoadMeta();
  const dayKey = tmDateKey(), weekKey = tmWeekKey(), monthKey = tmMonthKey();
  let changed = false;

  if (meta.day !== dayKey) {
    tmTasks.forEach(t => { if (t.kind === 'daily' && t.done) { t.done = false; t.doneAt = null; changed = true; } });
    meta.day = dayKey;
  }
  if (meta.week !== weekKey) {
    tmTasks.forEach(t => { if (t.kind === 'weekly' && t.done) { t.done = false; t.doneAt = null; changed = true; } });
    meta.week = weekKey;
  }
  if (meta.month !== monthKey) {
    tmTasks.forEach(t => { if (t.kind === 'monthly' && t.done) { t.done = false; t.doneAt = null; changed = true; } });
    meta.month = monthKey;
  }
  tmSaveMeta(meta);
  if (changed) localStorage.setItem(TASKMGR_KEY, JSON.stringify(tmTasks));

  // 安排到下一个零点再检查一次（页面长时间挂着也能自动重置）
  clearTimeout(tmApplyCycles._timer);
  const now = new Date();
  const next = new Date(now); next.setHours(24, 0, 2, 0);
  tmApplyCycles._timer = setTimeout(() => { tmApplyCycles(); tmRerender(); }, next - now);
}

// ---------- 排序 ----------
// 返回规则：未完成在前 → 已完成在后（各自内部按 kind 规则排）
function tmSortList(list, kind) {
  const arr = list.slice();
  if (kind === 'daily' || kind === 'urgent') {
    // 每日任务 / 紧急任务：手动拖动顺序
    arr.sort((a,b) => (a.order||0) - (b.order||0));
  } else if (kind === 'weekly' || kind === 'monthly') {
    // 周/月任务：默认按计划时间数字升序
    arr.sort((a,b) => (a.plan||0) - (b.plan||0));
  }
  // 未完成在前，已完成置后
  const undone = arr.filter(t => !t.done);
  const done = arr.filter(t => t.done);
  return undone.concat(done);
}
function tmListOf(kind) {
  return tmSortList(tmTasks.filter(t => t.kind === kind), kind);
}

// 拖动后重算某个类型的 order（每日任务 / 紧急任务支持手动排序）
function tmRenumberKind(kind) {
  if (!kind) kind = 'daily';
  tmTasks.filter(t => t.kind === kind)
    .sort((a,b) => (a.order||0) - (b.order||0))
    .forEach((t,i) => { t.order = i; });
}
// 兼容旧调用
function tmRenumberDaily() { tmRenumberKind('daily'); }

// 判断任务是否应标红（逾期未完成）
//   每日任务：今天未完成 → 标红
//   每周任务：计划星期 早于 今天（不含今天） → 标红
//   每月任务：计划日 小于等于 今天（含今天） → 标红
//   紧急任务：未完成 → 标红
function tmIsOverdue(t) {
  if (!t || t.done) return false;
  const now = new Date();
  if (t.kind === 'weekly') {
    const todayWd = now.getDay();                 // 0=周日, 1=周一 ...
    const todayIso = todayWd === 0 ? 7 : todayWd; // 转为 1~7（周一~周日）
    const p = parseInt(t.plan, 10);
    if (!(p >= 1 && p <= 7)) return false;
    return p < todayIso;                          // 严格早于今天才标红
  }
  if (t.kind === 'monthly') {
    const p = parseInt(t.plan, 10);
    if (!(p >= 1 && p <= 31)) return false;
    return p <= now.getDate();                    // 含今天
  }
  // 每日任务 / 紧急任务：未完成即标红
  return true;
}

function tmRenderTask(t, kind) {
  const isDaily = kind.id === 'daily';
  const isUrgent = kind.id === 'urgent';
  // 计划时间展示
  let planHtml = '';
  if (kind.id === 'weekly') {
    planHtml = `<span class="tm-plan-tag" data-tm-action="edit-plan" data-tm-id="${t.id}" title="点击修改计划时间">周${['','一','二','三','四','五','六','日'][t.plan]}</span>`;
  } else if (kind.id === 'monthly') {
    planHtml = `<span class="tm-plan-tag" data-tm-action="edit-plan" data-tm-id="${t.id}" title="点击修改计划时间">${t.plan} 号</span>`;
  }

  const editorOpen = (tmEditingId === t.id);
  // 未完成任务标红判定（已完成的一律不标红）
  const overdueCls = tmIsOverdue(t) ? 'tm-overdue' : '';
  // 每日任务 / 紧急任务 支持手动拖动排序
  const draggable = (isDaily || kind.id === 'urgent');

  return `
    <div class="tm-task ${t.done ? 'done' : ''} ${overdueCls}" data-tm-id="${t.id}"
         ${draggable ? 'draggable="true"' : ''}>
      ${draggable ? '<span class="tm-drag-handle" title="拖动排序">⠿</span>' : ''}
      <div class="tm-check ${t.done ? 'checked' : ''}" data-tm-action="toggle" data-tm-id="${t.id}" title="标记完成/未完成">
        ${t.done ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
      </div>
      <div class="tm-task-body">
        ${editorOpen ? tmRenderInlineEditor(t, kind) : `
          <div class="tm-task-line">
            <span class="tm-task-title">${escapeHtml(t.title)}</span>
            ${planHtml}
            ${t.done && t.doneAt ? `<span class="tm-done-tag">完成于 ${formatDate(t.doneAt)}</span>` : ''}
          </div>
        `}
      </div>
      ${editorOpen ? '' : `
        <div class="tm-task-actions">
          <button class="tm-task-btn" data-tm-action="edit" data-tm-id="${t.id}" title="修改">✏️</button>
          <button class="tm-task-btn" data-tm-action="delete" data-tm-id="${t.id}" title="删除">🗑️</button>
        </div>
      `}
    </div>
  `;
}

// 行内编辑：标题 + 计划时间
function tmRenderInlineEditor(t, kind) {
  const needPlan = (kind.id === 'weekly' || kind.id === 'monthly');
  const max = kind.id === 'weekly' ? 7 : 31;
  let opts = '';
  if (kind.id === 'weekly') {
    opts = WEEKDAY_FULL.map((n,i) => `<option value="${i+1}" ${t.plan===i+1?'selected':''}>${i+1} · ${n}</option>`).join('');
  } else if (kind.id === 'monthly') {
    for (let i=1;i<=31;i++) opts += `<option value="${i}" ${t.plan===i?'selected':''}>${i} 号</option>`;
  }
  return `
    <div class="tm-edit-row">
      <input type="text" class="tm-input" id="tmEditTitle" value="${escapeAttr(t.title)}" placeholder="任务内容" />
      ${needPlan ? `<select class="tm-select" id="tmEditPlan">${opts}</select>` : ''}
    </div>
    <div class="tm-edit-actions">
      <button class="tm-btn-primary" data-tm-action="save-edit" data-tm-id="${t.id}">保存</button>
      <button class="tm-btn-ghost" data-tm-action="cancel-edit">取消</button>
    </div>
  `;
}

// 新增表单（弹层）
function tmRenderForm(kind) {

// ---------- 增删改 ----------
function tmAddTask(kind, title, plan) {
  title = (title || '').trim();
  if (!title) { showToast('请输入任务内容'); return false; }
  const task = {
    id: uid(),
    kind,
    title,
    plan: (kind === 'weekly' || kind === 'monthly') ? parseInt(plan, 10) || 1 : null,
    done: false,
    doneAt: null,
    order: kind === 'daily' ? tmTasks.filter(t => t.kind === 'daily').length : 0,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  tmTasks.push(task);
  tmSave();
  showToast('任务已添加');
  return true;
}

function tmUpdateTask(id, patch) {
  const t = tmTasks.find(x => x.id === id);
  if (!t) return;
  if (patch.title !== undefined) {
    const v = String(patch.title).trim();
    if (!v) { showToast('任务内容不能为空'); return; }
    t.title = v;
  }
  if (patch.plan !== undefined && (t.kind === 'weekly' || t.kind === 'monthly')) {
    const max = t.kind === 'weekly' ? 7 : 31;
    let p = parseInt(patch.plan, 10);
    if (!(p >= 1 && p <= max)) p = 1;
    t.plan = p;
  }
  t.updatedAt = Date.now();
  tmSave();
  showToast('任务已更新');
}

function tmDeleteTask(id) {
  const t = tmTasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`确定删除任务「${t.title}」?`)) return;
  tmTasks = tmTasks.filter(x => x.id !== id);
  tmRenumberDaily();
  tmSave();
  showToast('任务已删除');
  tmRerender();
}

// 切换完成状态（标记/取消）
function tmToggleDone(id) {
  const t = tmTasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  t.updatedAt = Date.now();
  tmSave();
  tmRerender();
  if (t.done) {
    const list = tmTasks.filter(x => x.kind === t.kind);
    if (list.length && list.every(x => x.done)) {
      const k = TASKMGR_KINDS.find(x => x.id === t.kind);
      showToast(`🎉 ${k.name}已全部完成`);
    }
  }
}

// 快速改计划时间
function tmQuickSetPlan(id, plan) {
  tmUpdateTask(id, { plan });
  tmRerender();
}

// ---------- 事件绑定 ----------
function tmHandleClick(e) {
  const stopEl = e.target.closest('[data-tm-stop]');
  const actionEl = e.target.closest('[data-tm-action]');
  if (!actionEl) return;
  const action = actionEl.getAttribute('data-tm-action');
  const id = actionEl.getAttribute('data-tm-id');
  const kind = actionEl.getAttribute('data-tm-kind');

  switch (action) {
    case 'toggle-kind': {
      if (!kind) return;
      tmExpandedKinds[kind] = !tmExpandedKinds[kind];
      tmRerender();
      break;
    }
    case 'add': {
      tmEditingId = null;
      tmFormKind = kind;
      tmRerender();
      // 自动聚焦输入框
      setTimeout(() => { const el = document.getElementById('tmNewTitle'); if (el) el.focus(); }, 0);
      break;
    }
    case 'close-form': {
      // 点击遮罩关闭；点击弹层内部不关闭
      if (actionEl.classList.contains('tm-modal-mask') && stopEl) return;
      if (actionEl.classList.contains('tm-btn-ghost')) { /* 取消按钮 */ }
      tmFormKind = null;
      tmRerender();
      break;
    }
    case 'save-new': {
      const titleEl = document.getElementById('tmNewTitle');
      const planEl = document.getElementById('tmNewPlan');
      const ok = tmAddTask(kind, titleEl ? titleEl.value : '', planEl ? planEl.value : 1);
      if (ok) { tmFormKind = null; tmRerender(); }
      break;
    }
    case 'toggle': {
      tmToggleDone(id);
      break;
    }
    case 'edit': {
      tmFormKind = null;
      tmEditingId = (tmEditingId === id) ? null : id;
      tmRerender();
      setTimeout(() => { const el = document.getElementById('tmEditTitle'); if (el) { el.focus(); el.select(); } }, 0);
      break;
    }
    case 'save-edit': {
      const titleEl = document.getElementById('tmEditTitle');
      const planEl = document.getElementById('tmEditPlan');
      const patch = { title: titleEl ? titleEl.value : undefined };
      if (planEl) patch.plan = planEl.value;
      tmUpdateTask(id, patch);
      tmEditingId = null;
      tmRerender();
      break;
    }
    case 'cancel-edit': {
      tmEditingId = null;
      tmRerender();
      break;
    }
    case 'edit-plan': {
      // 点击计划时间标签：直接弹一个快速选择
      const t = tmTasks.find(x => x.id === id);
      if (!t) return;
      const max = t.kind === 'weekly' ? 7 : 31;
      const input = prompt(
        t.kind === 'weekly' ? '请输入计划时间（1~7，表示周一到周日）' : '请输入计划时间（1~31，表示每月1号到31号）',
        String(t.plan)
      );
      if (input === null) return;
      const p = parseInt(input, 10);
      if (!(p >= 1 && p <= max)) { showToast(`请输入 1~${max} 之间的数字`); return; }
      tmQuickSetPlan(id, p);
      break;
    }
    case 'delete': {
      tmDeleteTask(id);
      break;
    }
  }
}

// 键盘：回车保存 / Esc 取消
function tmHandleKeydown(e) {
  if (e.key === 'Escape') {
    if (tmFormKind !== null) { tmFormKind = null; tmRerender(); return; }
    if (tmEditingId !== null) { tmEditingId = null; tmRerender(); return; }
  }
  if (e.key === 'Enter') {
    const target = e.target;
    if (target && target.id === 'tmNewTitle') {
      const planEl = document.getElementById('tmNewPlan');
      if (tmAddTask(tmFormKind, target.value, planEl ? planEl.value : 1)) { tmFormKind = null; tmRerender(); }
    } else if (target && target.id === 'tmEditTitle') {
      const row = target.closest('.tm-task');
      const planEl = document.getElementById('tmEditPlan');
      if (row) {
        const patch = { title: target.value };
        if (planEl) patch.plan = planEl.value;
        tmUpdateTask(row.dataset.tmId, patch);
        tmEditingId = null;
        tmRerender();
      }
    }
  }
}

// 拖动排序（每日任务 / 紧急任务）
function tmBindDrag(listEl) {
  const kind = listEl.dataset.tmList;   // daily | urgent
  let dragEl = null;
  listEl.querySelectorAll('.tm-task[draggable="true"]').forEach(el => {
    // 已完成任务不允许拖动排序（它们固定在末尾）
    if (el.classList.contains('done')) {
      el.setAttribute('draggable', 'false');
      return;
    }
    el.addEventListener('dragstart', e => {
      dragEl = el;
      tmDragId = el.dataset.tmId;
      el.classList.add('tm-dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', el.dataset.tmId); } catch (_) {}
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('tm-dragging');
      listEl.querySelectorAll('.tm-task').forEach(x => x.classList.remove('tm-drop-over'));
      dragEl = null; tmDragId = null;
      // 落位后回写 order
      const ids = Array.from(listEl.querySelectorAll('.tm-task:not(.done)')).map(x => x.dataset.tmId);
      tmTasks.filter(t => t.kind === kind).forEach(t => {
        const idx = ids.indexOf(t.id);
        if (idx >= 0) t.order = idx;
      });
      tmRenumberKind(kind);
      tmSave();
      tmRerender();
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragEl || dragEl === el) return;
      if (el.classList.contains('done')) return;   // 不允许拖到已完成区
      el.classList.add('tm-drop-over');
      const rect = el.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      if (after) {
        if (el.nextSibling !== dragEl) listEl.insertBefore(dragEl, el.nextSibling);
      } else {
        if (el.previousSibling !== dragEl) listEl.insertBefore(dragEl, el);
      }
    });
    el.addEventListener('dragleave', () => el.classList.remove('tm-drop-over'));
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('tm-drop-over'); });
  });
}

function bindTaskMgrEvents() {
  // 点击事件委托（只处理任务管理模块内的元素）
  document.addEventListener('click', (e) => {
    if (currentModule !== 'taskmgr') return;
    const content = document.getElementById('content');
    if (!content || !content.contains(e.target)) return;
    tmHandleClick(e);
  });
  document.addEventListener('keydown', (e) => {
    if (currentModule !== 'taskmgr') return;
    const content = document.getElementById('content');
    if (!content || !content.contains(e.target)) return;
    tmHandleKeydown(e);
  });
  // 拖动排序：每次重新渲染后为支持拖动的列表绑定
  const observer = new MutationObserver(() => {
    if (currentModule !== 'taskmgr') return;
    ['daily', 'urgent'].forEach(kind => {
      const listEl = document.querySelector(`[data-tm-list="${kind}"]`);
      if (listEl && listEl.dataset.tmDragBound !== '1') {
        listEl.dataset.tmDragBound = '1';
        tmBindDrag(listEl);
      }
    });
  });
  observer.observe(document.getElementById('content'), { childList: true, subtree: true });
}

// ===================== 超市海报模块（果然鲜 · 绿底白卡样式） =====================
const POSTER_KEY_V2 = 'liumo_poster_v2';
const POSTER_PF = '"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
const P_W = 1024, P_S = 2;          // 逻辑尺寸 / 导出倍率（导出 2048px 高清）
const P_L = 18, P_R = 1006, P_T = 19, P_RAD = 40;
const P_ROW_H = 242, P_GRID_TOP = 34;
const P_COL_W = (P_R - P_L) / 2;
const P_RED = '#e6004c';
const posterImgCache = {};

function posterTodayText() {
  const d = new Date(), p = n => ('0' + n).slice(-2);
  return '活动时间：' + d.getFullYear() + '年' + p(d.getMonth() + 1) + '月' + p(d.getDate()) + '日';
}
// 空白海报模板：不再预置任何示例商品（图片/名称/价格/单位均为空）
function defaultPoster() {
  return {
    actText: posterTodayText(),
    slogan: '今日特价',
    items: []
  };
}

function loadPoster() {
  try {
    const r = localStorage.getItem(POSTER_KEY_V2);
    const d = r ? JSON.parse(r) : null;
    // 有保存记录时完整恢复（商品、图片、文字、标语），没有则给出空白模板
    poster = (d && Array.isArray(d.items)) ? Object.assign(defaultPoster(), d) : defaultPoster();
    poster.items = poster.items.map(it => Object.assign({ img: '', name: '', price: '', unit: '' }, it || {}));
    // 旧的示例默认文案自动迁移到新默认值；用户自行修改过的内容保持不变
    if (poster.actText === '活动时间：2026年11月08日') poster.actText = posterTodayText();
    if (poster.slogan === '周末吃好点') poster.slogan = '今日特价';
  } catch (e) { poster = defaultPoster(); }
}
function savePoster() {
  try {
    poster.savedAt = Date.now();
    localStorage.setItem(POSTER_KEY_V2, JSON.stringify(poster));
  } catch (e) { showToast('图片过大，本地保存失败，请换张小图'); }
}
function posterSavedHint() {
  const t = poster && poster.savedAt;
  if (!t) return '首次使用：点「+ 添加商品」开始制作；修改会自动保存，下次打开自动恢复。';
  const d = new Date(t), z = n => ('0' + n).slice(-2);
  return '已恢复上次保存的海报（' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate())
    + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()) + '），可直接继续修改。';
}
function escAttr(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function pWrap(ctx, text, maxW, maxLines) {
  const chars = String(text == null ? '' : text).split('');
  let line = '', lines = [];
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line); line = ch;
      if (lines.length >= maxLines) break;
    } else line = test;
  }
  if (line && lines.length < maxLines) lines.push(line);
  return lines;
}

// 图片缓存：异步加载完成后自动重绘（dataURL 同源，不会污染 canvas）
function posterGetImg(src) {
  if (!src) return null;
  if (posterImgCache[src]) return posterImgCache[src];
  const im = new Image();
  im.onload = () => { posterDraw(); };
  im.onerror = () => { posterDraw(); };
  im.src = src;
  posterImgCache[src] = im;
  return im;
}

// ---------- 绿色背景：深绿渐变 + 亮绿波浪带 + 斜纹 ----------
function posterDrawBg(ctx, W, H, arcSide, arcCenter) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0d6f02'); g.addColorStop(0.45, '#0a6202'); g.addColorStop(1, '#118002');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 顶部亮绿（中间亮、两侧偏深）
  const tg = ctx.createLinearGradient(0, 0, 0, 470);
  tg.addColorStop(0, 'rgba(96,205,6,0.92)'); tg.addColorStop(1, 'rgba(96,205,6,0)');
  ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 470);
  const hg = ctx.createLinearGradient(0, 0, W, 0);
  hg.addColorStop(0, 'rgba(0,60,0,0.30)'); hg.addColorStop(0.5, 'rgba(0,60,0,0)'); hg.addColorStop(1, 'rgba(0,60,0,0.12)');
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, 470);

  // 下半亮绿波浪带
  const bg1 = ctx.createLinearGradient(0, arcSide - 80, W, H);
  bg1.addColorStop(0, '#3eb003'); bg1.addColorStop(0.5, '#55c405'); bg1.addColorStop(1, '#2b9602');
  ctx.fillStyle = bg1;
  ctx.beginPath();
  ctx.moveTo(0, arcSide - 18);
  ctx.bezierCurveTo(W * 0.28, arcSide - 96, W * 0.68, arcSide + 116, W, arcSide + 26);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  // 深绿波浪叠加，做出层次
  ctx.fillStyle = 'rgba(6,88,0,0.20)';
  ctx.beginPath();
  ctx.moveTo(0, arcSide + 62);
  ctx.bezierCurveTo(W * 0.32, arcSide + 6, W * 0.66, arcSide + 178, W, arcSide + 118);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  // 细斜纹
  ctx.save(); ctx.globalAlpha = 0.055; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 12;
  for (let i = -H; i < W; i += 74) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + H, H); ctx.stroke(); }
  ctx.restore();
}

// 白色圆角卡片 + 底部向下凸的弧
function posterDrawCard(ctx, arcSide, arcCenter) {
  const ctrl = 2 * arcCenter - arcSide;
  ctx.beginPath();
  ctx.moveTo(P_L + P_RAD, P_T);
  ctx.lineTo(P_R - P_RAD, P_T);
  ctx.quadraticCurveTo(P_R, P_T, P_R, P_T + P_RAD);
  ctx.lineTo(P_R, arcSide);
  ctx.quadraticCurveTo(P_W / 2, ctrl, P_L, arcSide);
  ctx.lineTo(P_L, P_T + P_RAD);
  ctx.quadraticCurveTo(P_L, P_T, P_L + P_RAD, P_T);
  ctx.closePath();
  ctx.fillStyle = '#ffffff'; ctx.fill();
}

// 单个价格：¥ + 大整数 + 上标小数 + 单位，超宽自动缩放
function posterDrawPrice(ctx, it, px, py) {
  const price = String(it.price == null ? '' : it.price).trim();
  const unit = String(it.unit == null ? '' : it.unit).trim();
  if (!price && !unit) return;   // 空白商品不画价格
  const m = price.match(/^(\d+)(?:\.(\d+))?$/);
  const intPart = m ? m[1] : (price || '0');
  const decPart = m && m[2] ? '.' + m[2] : '';
  const unitTxt = unit ? '/' + unit : '';
  const PF = POSTER_PF;

  ctx.font = 'bold 96px ' + PF;
  const iw = ctx.measureText(intPart).width;
  ctx.font = 'bold 46px ' + PF;
  const dw = decPart ? ctx.measureText(decPart).width : 0;
  ctx.font = 'bold 26px ' + PF;
  const uw = unitTxt ? ctx.measureText(unitTxt).width : 0;
  const sx = 34 + iw + 10;
  const need = sx + Math.max(dw, uw) + 16;
  const k = Math.min(1, 224 / Math.max(need, 1));

  ctx.save();
  ctx.translate(px, py); ctx.scale(k, k);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = P_RED;
  ctx.font = 'bold 30px ' + PF; ctx.fillText('¥', 0, 0);
  ctx.font = 'bold 96px ' + PF; ctx.fillText(intPart, 34, 0);
  if (decPart) { ctx.font = 'bold 46px ' + PF; ctx.fillText(decPart, sx, -50); }
  if (unitTxt) { ctx.font = 'bold 26px ' + PF; ctx.fillText(unitTxt, sx + 6, 0); }
  ctx.restore();
}

function posterDraw() {
  const cv = document.getElementById('posterCanvas');
  if (!cv) return;
  if (!poster) loadPoster();
  const items = poster.items || [];
  const rows = Math.max(1, Math.ceil(items.length / 2));
  const shift = (rows - 3) * P_ROW_H;
  const H = 1024 + shift;
  const arcSide = 731 + shift, arcCenter = 857 + shift, actY = 805 + shift;

  if (cv.width !== P_W * P_S || cv.height !== Math.round(H * P_S)) {
    cv.width = P_W * P_S; cv.height = Math.round(H * P_S);
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(P_S, 0, 0, P_S, 0, 0);
  ctx.clearRect(0, 0, P_W, H);

  posterDrawBg(ctx, P_W, H, arcSide, arcCenter);
  posterDrawCard(ctx, arcSide, arcCenter);

  // 商品：2 列 × N 行，左图右文（名称在上、价格在下）
  items.forEach((it, idx) => {
    const col = idx % 2, row = Math.floor(idx / 2);
    const cx = P_L + col * P_COL_W;
    const cy = P_GRID_TOP + row * P_ROW_H;
    const imgX = cx + (col === 0 ? 62 : 30);
    const imgY = cy + 38, imgW = 200, imgH = 150;
    const txtX = cx + (col === 0 ? 290 : 260);
    const px = cx + (col === 0 ? 272 : 250);

    const im = posterGetImg(it.img);
    if (im && im.complete && im.naturalWidth) {
      const ratio = Math.min(imgW / im.naturalWidth, imgH / im.naturalHeight);
      const w = im.naturalWidth * ratio, h = im.naturalHeight * ratio;
      ctx.drawImage(im, imgX + (imgW - w) / 2, imgY + (imgH - h) / 2, w, h);
    } else {
      ctx.save();
      ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
      ctx.strokeRect(imgX + 8, imgY + 8, imgW - 16, imgH - 16);
      ctx.setLineDash([]);
      ctx.fillStyle = '#9ca3af'; ctx.font = '20px ' + POSTER_PF;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('上传图片', imgX + imgW / 2, imgY + imgH / 2);
      ctx.restore();
    }

    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#111111';
    // 名称整体下移并放大；名称过长时适度回缩字号，避免三行放不下被截断
    const nameText = String(it.name == null ? '' : it.name).trim();
    const nameW = col === 0 ? 202 : 228;
    let nameFs = 34;
    ctx.font = 'bold ' + nameFs + 'px ' + POSTER_PF;
    while (nameFs > 28 && pWrap(ctx, nameText, nameW, 2).join('').length < nameText.length) {
      nameFs -= 1; ctx.font = 'bold ' + nameFs + 'px ' + POSTER_PF;
    }
    let lines = nameText ? pWrap(ctx, nameText, nameW, 2) : [];
    // 名称超过 2 行时只显示 2 行，第二行末尾加省略号提示被截断
    if (lines.length === 2 && lines.join('').length < nameText.length) {
      let last = lines[1];
      while (last.length && ctx.measureText(last + '…').width > nameW) last = last.slice(0, -1);
      lines[1] = last + '…';
    }
    const lineH = Math.round(nameFs * 1.18);
    // 名称按行数动态垂直居中于左侧商品图片；整体再上移 58px，两行名称受下方价格限制
    const imgCenterY = imgY + imgH / 2;
    const blockH = (lines.length - 1) * lineH + nameFs * 0.95;
    const idealFirst = imgCenterY - blockH / 2 + nameFs * 0.78;
    const maxFirst = cy + 160 - (lines.length - 1) * lineH - nameFs * 0.25;
    const firstY = Math.min(idealFirst, maxFirst) - 58;
    if (!lines.length) {
      ctx.fillStyle = '#c8cdd2'; ctx.font = '26px ' + POSTER_PF;
      ctx.fillText('商品名称', txtX, firstY);
    } else {
      lines.forEach((ln, i) => ctx.fillText(ln, txtX, firstY + i * lineH));
    }
    posterDrawPrice(ctx, it, px, cy + 188);
  });

  // 活动时间（字号调大；过长时先适度回缩，仍放不下再截断，避免两端跑出白色卡片弧线）
  const actText = String(poster.actText == null ? '' : poster.actText).trim();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#111111';
  let actFs = 34;
  ctx.font = actFs + 'px ' + POSTER_PF;
  while (actFs > 26 && ctx.measureText(actText).width > 500) {
    actFs -= 1; ctx.font = actFs + 'px ' + POSTER_PF;
  }
  let actDraw = actText;
  if (ctx.measureText(actDraw).width > 500) {
    while (actDraw.length && ctx.measureText(actDraw + '…').width > 500) actDraw = actDraw.slice(0, -1);
    actDraw += '…';
  }
  ctx.fillText(actDraw, P_W / 2, actY + 10);

  // 左下角品牌 logo
  const lg = posterGetImg(POSTER_LOGO_SRC);
  if (lg && lg.complete && lg.naturalWidth) {
    const lw = 340, lh = lw * lg.naturalHeight / lg.naturalWidth;
    ctx.drawImage(lg, 48, arcCenter - 4, lw, lh);
  }

  // 右下角自定义大字
  const slogan = String(poster.slogan || '').trim();
  if (slogan) {
    let fs = 86;
    ctx.font = 'bold ' + fs + 'px ' + POSTER_PF;
    while (ctx.measureText(slogan).width > 430 && fs > 30) {
      fs -= 2; ctx.font = 'bold ' + fs + 'px ' + POSTER_PF;
    }
    ctx.textAlign = 'right'; ctx.fillStyle = '#ffffff';
    ctx.fillText(slogan, P_R - 6, arcCenter + 128);
  }
}

function posterRerender() {
  const old = document.querySelector('.poster-items');
  const st = old ? old.scrollTop : 0;
  const c = document.getElementById('content');
  const m = MODULES.find(x => x.id === 'poster');
  renderPosterModule(c, m);
  const nl = document.querySelector('.poster-items');
  if (nl) nl.scrollTop = st;
}

  content.innerHTML = `

    <div class="poster-saved">${posterSavedHint()}</div>
    <div class="poster-app">
      <div class="poster-form">
        <div class="poster-field">

        </div>
        <div class="poster-field">
          <label>右下角标语</label>
          <input type="text" data-poster-field="slogan" value="${escAttr(poster.slogan)}" placeholder="如：今日特价">

        <div class="poster-actions">
          <button class="btn-primary" type="button" data-poster-download="1">下载海报</button>
          <button class="btn-primary" type="button" data-poster-save="1">保存</button>
          <button class="btn-ghost" type="button" data-poster-reset="1">清空重来</button>
        </div>
      </div>
      <div class="poster-preview">
        <div class="poster-preview-label">实时预览</div>
        <canvas id="posterCanvas"></canvas>
      </div>
    </div>`;
  posterDraw();
}

function posterDownload() {
  const cv = document.getElementById('posterCanvas');
  if (!cv) return;
  try {
    const a = document.createElement('a');
    a.href = cv.toDataURL('image/png');
    a.download = '果然鲜-促销海报.png';
    document.body.appendChild(a); a.click(); a.remove();
    showToast('海报已下载');
  } catch (e) { showToast('下载失败：' + e.message); }
}

// 上传图片：压到最长边 420px 的 JPEG，避免 localStorage 爆掉
function posterHandleFile(input, idx) {
  const f = input.files && input.files[0];
  if (!f || !poster.items[idx]) return;
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 420;
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const cx = c.getContext('2d');
      cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, h);
      cx.drawImage(im, 0, 0, w, h);
      poster.items[idx].img = c.toDataURL('image/jpeg', 0.85);
      savePoster(); posterRerender(); showToast('图片已更换');
    };
    im.onerror = () => showToast('图片读取失败');
    im.src = reader.result;
  };
  reader.readAsDataURL(f);
}

function posterHandleInput(e) {
  const el = e.target.closest('[data-poster-field]');
  if (!el) return;
  const f = el.getAttribute('data-poster-field');
  if (f === 'items') {
    const idx = +el.getAttribute('data-idx'), sub = el.getAttribute('data-sub');
    if (!poster.items[idx]) return;
    poster.items[idx][sub] = el.value;
  } else poster[f] = el.value;
  posterDraw(); savePoster();
}

function posterHandleClick(e) {
  const addBtn = e.target.closest('[data-poster-add]');
  if (addBtn) { poster.items.push({ img: '', name: '', price: '', unit: '' }); savePoster(); posterRerender(); return; }
  const delBtn = e.target.closest('[data-poster-del]');
  if (delBtn) { poster.items.splice(+delBtn.getAttribute('data-poster-del'), 1); savePoster(); posterRerender(); return; }
  const mvBtn = e.target.closest('[data-poster-move]');
  if (mvBtn) {
    const i = +mvBtn.getAttribute('data-idx'), j = i + (+mvBtn.getAttribute('data-poster-move'));
    if (j >= 0 && j < poster.items.length) {
      const t = poster.items[i]; poster.items[i] = poster.items[j]; poster.items[j] = t;
      savePoster(); posterRerender();
    }
    return;
  }
  const saveBtn = e.target.closest('[data-poster-save]');
  if (saveBtn) { savePoster(); showToast('已保存'); return; }
  const dlBtn = e.target.closest('[data-poster-download]');
  if (dlBtn) { posterDownload(); return; }
  const rsBtn = e.target.closest('[data-poster-reset]');
  if (rsBtn) { poster = defaultPoster(); savePoster(); posterRerender(); showToast('已清空，可重新添加商品'); return; }
}

function bindPosterEvents() {
  document.addEventListener('click', (e) => {
    if (currentModule !== 'poster') return;
    const c = document.getElementById('content');
    if (!c || !c.contains(e.target)) return;
    posterHandleClick(e);
  });
  document.addEventListener('input', (e) => {
    if (currentModule !== 'poster') return;
    const c = document.getElementById('content');
    if (!c || !c.contains(e.target)) return;
    posterHandleInput(e);
  });
  document.addEventListener('change', (e) => {
    if (currentModule !== 'poster') return;
    const c = document.getElementById('content');
    if (!c || !c.contains(e.target)) return;
    const fi = e.target.closest('[data-poster-img]');
    if (fi && fi.type === 'file') posterHandleFile(fi, +fi.getAttribute('data-poster-img'));
  });
}


// ========================================================
//  生日提醒模块
//  数据：localStorage key = liumo_birthdays
//  条目模型：{ id, name, calType: 'solar'|'lunar', year: Number|null,
//             month: 1-12, day: 1-31, leap: Boolean }
//   - calType='solar'：公历生日，month/day 为公历月日
//   - calType='lunar'：农历生日，month/day 为农历月日，leap 表示是否闰月
//   - year 为出生年份（选填），用于计算年龄
// ========================================================
const BIRTHDAY_KEY = 'liumo_birthdays';

// ---------- 农历公历转换（lunarInfo 表，覆盖 1900-2049）----------
const BD_LUNAR_INFO = [0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b5a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a0,0x096d0,0x04af5,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x15d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,0x0d520];
function bdLYearDays(y) { let s = 348; for (let i = 0x8000; i > 0x8; i >>= 1) s += (BD_LUNAR_INFO[y - 1900] & i) ? 1 : 0; return s + bdLeapDays(y); }
function bdLeapDays(y) { return bdLeapMonth(y) ? ((BD_LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0; }
function bdLeapMonth(y) { return BD_LUNAR_INFO[y - 1900] & 0xf; }
function bdMonthDays(y, m) { return (BD_LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
// 公历 → 农历，返回 { lYear, lMonth, lDay, isLeap }
function bdSolarToLunar(y, m, d) {
  const base = new Date(1900, 0, 31);
  const obj = new Date(y, m - 1, d);
  let offset = Math.round((obj - base) / 86400000);
  let lunarYear = 1900, temp = 0;
  for (lunarYear = 1900; lunarYear < 2100 && offset > 0; lunarYear++) { temp = bdLYearDays(lunarYear); offset -= temp; }
  if (offset < 0) { offset += temp; lunarYear--; }
  let isLeap = false;
  const leapM = bdLeapMonth(lunarYear);
  let lunarMonth;
  for (lunarMonth = 1; lunarMonth <= 12 && offset > 0; lunarMonth++) {
    if (leapM > 0 && lunarMonth === (leapM + 1) && !isLeap) { lunarMonth--; isLeap = true; temp = bdLeapDays(lunarYear); }
    else { temp = bdMonthDays(lunarYear, lunarMonth); }
    if (isLeap && lunarMonth === (leapM + 1)) isLeap = false;
    offset -= temp;
  }
  if (offset === 0 && leapM > 0 && lunarMonth === leapM + 1) { if (isLeap) isLeap = false; else { isLeap = true; lunarMonth--; } }
  if (offset < 0) { offset += temp; lunarMonth--; }
  return { lYear: lunarYear, lMonth: lunarMonth, lDay: offset + 1, isLeap: isLeap };
}
function bdIsLeapYear(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
// 取得某人某公历年份的庆生公历日期（不存在则返回 null，如 2/29 平年、或农历某日当年无对应）
function bdSolarOnYear(p, year) {
  if (p.calType === 'solar') {
    if (p.month === 2 && p.day === 29 && !bdIsLeapYear(year)) return null;
    return new Date(year, p.month - 1, p.day);
  }
  // lunar：在该公历年份范围内逐日匹配农历月日（含闰月），取第一个匹配
  let startY = (year === new Date().getFullYear()) ? year - 1 : year; // 当年农历可能在去年 1 月
  for (let y = startY; y <= year; y++) {
    const days = bdIsLeapYear(y) ? 366 : 365;
    for (let i = 0; i < days; i++) {
      const dt = new Date(y, 0, 1); dt.setDate(dt.getDate() + i);
      const lu = bdSolarToLunar(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
      if (lu.lMonth === p.month && lu.lDay === p.day && (lu.isLeap === !!p.leap)) return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
    }
  }
  return null;
}
// 从 fromDate（含）起，下一次庆生公历日期
function bdNextCelebration(p, fromDate) {
  if (p.calType === 'solar') {
    for (let y = fromDate.getFullYear(); y <= fromDate.getFullYear() + 2; y++) {
      const c = bdSolarOnYear(p, y);
      if (c && c >= fromDate) return c;
    }
  } else {
    for (let y = fromDate.getFullYear() - 1; y <= fromDate.getFullYear() + 2; y++) {
      const c = bdSolarOnYear(p, y);
      if (c && c >= fromDate) return c;
    }
  }
  return null;
}
function bdCnMonth(m) { return ['正','二','三','四','五','六','七','八','九','十','冬','腊'][m - 1] + '月'; }
function bdCnDay(d) {
  const u = ['','一','二','三','四','五','六','七','八','九','十'];
  if (d <= 10) return d === 10 ? '初十' : '初' + u[d];
  if (d < 20) return '十' + u[d - 10];
  if (d === 20) return '二十';
  if (d < 30) return '廿' + u[d - 20];
  if (d === 30) return '三十';
  return '卅一';
}
function bdBirthText(p) {
  if (p.calType === 'lunar') {
    return '农历 ' + (p.leap ? '闰' : '') + bdCnMonth(p.month) + bdCnDay(p.day) + (p.year ? '（' + p.year + '）' : '');
  }
  return (p.year ? p.year + '-' : '') + ('0' + p.month).slice(-2) + '-' + ('0' + p.day).slice(-2);
}
function bdThisYearSolar(p, cy) { return bdSolarOnYear(p, cy); }

// ---------- 数据读写 ----------
function loadBirthdays() {
  try { const raw = localStorage.getItem(BIRTHDAY_KEY); const a = raw ? JSON.parse(raw) : []; return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function saveBirthdays(arr) { localStorage.setItem(BIRTHDAY_KEY, JSON.stringify(arr)); }
function bdInitial(name) { return (name || '?').trim().charAt(0) || '?'; }

// ---------- 列表渲染 ----------
function renderBirthdayModule(content, mod) {
  const list = loadBirthdays();
  const today = new Date(); today.setHours(0,0,0,0);
  const cy = today.getFullYear();

  const rows = list.map(p => {
    const next = bdNextCelebration(p, today);
    let days = null, passed = false;
    if (next) {
      days = Math.round((next - today) / 86400000);
      passed = next.getFullYear() > cy;
    }
    let age = null;
    if (p.year) {
      const ty = bdThisYearSolar(p, cy);
      const turned = cy - p.year;
      age = (ty && ty < today) ? turned : Math.max(0, turned - 1);
    }
    return { p, next, days, passed, age };
  }).sort((a, b) => {
    if (a.passed !== b.passed) return a.passed ? 1 : -1;
    if (a.next && b.next) return a.next - b.next;
    return 0;
  });

  const upcoming = rows.filter(r => !r.passed);
  const passedRows = rows.filter(r => r.passed);

  const cardHtml = (r) => {
    const { p, next, days, passed, age } = r;
    const todayHit = (days === 0);
    const isLunar = p.calType === 'lunar';
    const tagCls = isLunar ? 'bd-tag lunar' : 'bd-tag';
    let countdown;
    if (todayHit) countdown = '今天生日🎂';
    else if (passed) countdown = '今年已过';
    else countdown = '还有 ' + days + ' 天';
    const cdCls = passed ? 'bd-countdown passed' : 'bd-countdown';
    const nextTxt = next ? (next.getFullYear() + '年' + (next.getMonth()+1) + '月' + next.getDate() + '日') : '—';
    const dateLine = isLunar ? ('今年过：' + nextTxt) : ('公历：' + nextTxt);
    return `<div class="bd-card${passed ? ' bd-passed' : ''}${todayHit ? ' bd-today' : ''}">
      <div class="bd-avatar">${escapeHtml(bdInitial(p.name))}</div>
      <div class="bd-main">
        <div class="bd-name">${escapeHtml(p.name)}<span class="${tagCls}">${isLunar ? '农历' : '公历'}</span>${passed ? '<span class="bd-tag passed">已过</span>' : ''}${todayHit ? '<span class="bd-tag">今天</span>' : ''}</div>
        <div class="bd-sub">生日：${escapeHtml(bdBirthText(p))}</div>
        <div class="bd-date">${dateLine}${age != null ? ' · ' + age + ' 岁' : ''}</div>
      </div>
      <div class="bd-right">
        <div class="${cdCls}">${countdown}</div>
        <div class="bd-actions">
          <button class="bd-edit" data-id="${p.id}" type="button">编辑</button>
          <button class="bd-del" data-id="${p.id}" type="button">删除</button>
        </div>
      </div>
    </div>`;
  };

  content.innerHTML = `
    <div class="page-header">
      <div class="page-title">${mod.name}</div>
      <div class="page-desc">${mod.desc}</div>
    </div>
    <div class="bd-head">
      <div class="bd-hint">共 ${list.length} 人 · 按庆生日期排序，今年已过的沉到下方</div>
      <button class="bd-add" id="bdAdd" type="button">+ 添加生日</button>
    </div>
    <div class="bd-list" id="bdList">
      ${list.length === 0 ? '<div class="wt-empty">还没有记录，点「添加生日」开始吧</div>' :
        (upcoming.length ? upcoming.map(cardHtml).join('') : '') +
        (passedRows.length ? `<div class="bd-sep">今年已过的生日（${passedRows.length}）</div>` + passedRows.map(cardHtml).join('') : '')
      }
    </div>
  `;

  content.querySelector('#bdAdd').addEventListener('click', () => bdOpenModal(content, mod, null));
  content.querySelectorAll('.bd-edit').forEach(b => b.addEventListener('click', () => {
    const p = list.find(x => x.id === b.getAttribute('data-id'));
    if (p) bdOpenModal(content, mod, p);
  }));
  content.querySelectorAll('.bd-del').forEach(b => b.addEventListener('click', () => {
    const id = b.getAttribute('data-id');
    if (confirm('确定删除该生日记录？')) {
      saveBirthdays(list.filter(x => x.id !== id));
      renderBirthdayModule(content, mod);
      showToast('已删除');
    }
  }));
}

// ---------- 新增/编辑弹窗 ----------
function bdOpenModal(content, mod, p) {
  const ex = document.getElementById('bdMask'); if (ex) ex.remove();
  const isEdit = !!p;
  const calType = (p && p.calType) || 'solar';
  const year = (p && p.year) || '';
  const month = (p && p.month) || 1;
  const day = (p && p.day) || 1;
  const leap = !!(p && p.leap);
  const name = (p && p.name) || '';

  const solarMonthOpts = Array.from({length:12}, (_,i) => `<option value="${i+1}"${i+1===month?' selected':''}>${i+1} 月</option>`).join('');
  const solarDayOpts = Array.from({length:31}, (_,i) => `<option value="${i+1}"${i+1===day?' selected':''}>${i+1} 日</option>`).join('');
  const lunarMonthOpts = Array.from({length:12}, (_,i) => `<option value="${i+1}"${i+1===month?' selected':''}>${bdCnMonth(i+1)}</option>`).join('');
  const lunarDayOpts = Array.from({length:30}, (_,i) => `<option value="${i+1}"${i+1===day?' selected':''}>${bdCnDay(i+1)}</option>`).join('');

  const mask = document.createElement('div');
  mask.className = 'ds-cal-mask';
  mask.id = 'bdMask';
  mask.innerHTML = `
    <div class="ds-cal-modal">
      <div class="ds-cal-modal-head">
        <div class="ds-cal-modal-title">${isEdit ? '编辑生日' : '添加生日'}</div>
        <button class="ds-cal-close" id="bdClose" type="button">×</button>
      </div>
      <div class="ds-cal-modal-body">
        <div class="bd-field"><label>姓名</label><input class="bd-input" id="bdName" placeholder="称呼 / 昵称" value="${escapeHtml(name)}" /></div>
        <div class="bd-field"><label>过生日用</label>
          <div class="bd-radio">
            <label><input type="radio" name="bdCal" value="solar"${calType==='solar'?' checked':''}/> 公历</label>
            <label><input type="radio" name="bdCal" value="lunar"${calType==='lunar'?' checked':''}/> 农历</label>
          </div>
        </div>
        <div class="bd-field" id="bdDateField"></div>
        <div class="bd-field"><label>出生年份（选填，用于算年龄）</label><input class="bd-input" id="bdYear" type="number" min="1900" max="2100" placeholder="如 1990" value="${escapeHtml(String(year))}" /></div>
      </div>
      <div class="ds-cal-modal-foot">
        <button class="btn-add" id="bdSave" type="button">${isEdit ? '保存' : '添加'}</button>
      </div>
    </div>`;
  content.appendChild(mask);

  const renderDateField = () => {
    const t = mask.querySelector('input[name="bdCal"]:checked').value;
    const f = mask.querySelector('#bdDateField');
    if (t === 'solar') {
      f.innerHTML = `<label>公历生日</label><div class="bd-row">
        <div class="bd-field"><select class="bd-select" id="bdMonth">${solarMonthOpts}</select></div>
        <div class="bd-field"><select class="bd-select" id="bdDay">${solarDayOpts}</select></div>
      </div>`;
    } else {
      f.innerHTML = `<label>农历生日</label><div class="bd-row">
        <div class="bd-field"><select class="bd-select" id="bdMonth">${lunarMonthOpts}</select></div>
        <div class="bd-field"><select class="bd-select" id="bdDay">${lunarDayOpts}</select></div>
      </div>
      <label class="bd-check"><input type="checkbox" id="bdLeap"${leap?' checked':''}/> 闰月（如生日是闰月才勾选）</label>`;
    }
  };
  renderDateField();
  mask.querySelectorAll('input[name="bdCal"]').forEach(r => r.addEventListener('change', renderDateField));

  mask.querySelector('#bdClose').addEventListener('click', () => mask.remove());
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
  mask.querySelector('#bdSave').addEventListener('click', () => {
    const nm = (mask.querySelector('#bdName').value || '').trim();
    if (!nm) { showToast('请填写姓名'); return; }
    const t = mask.querySelector('input[name="bdCal"]:checked').value;
    const m = +mask.querySelector('#bdMonth').value;
    const d = +mask.querySelector('#bdDay').value;
    const yr = (mask.querySelector('#bdYear').value || '').trim();
    const yv = yr ? Math.max(1900, Math.min(2100, +yr)) : null;
    const lp = t === 'lunar' ? !!(mask.querySelector('#bdLeap') && mask.querySelector('#bdLeap').checked) : false;
    const item = { id: isEdit ? p.id : uid(), name: nm, calType: t, year: yv, month: m, day: d, leap: lp };
    let arr = loadBirthdays();
    if (isEdit) arr = arr.map(x => x.id === p.id ? item : x); else arr.push(item);
    saveBirthdays(arr);
    mask.remove();
    renderBirthdayModule(content, mod);
    showToast(isEdit ? '已保存' : '已添加');
  });
}

// 所有模块（海报、生日等）的常量与函数均已定义完毕，再执行初始化，
// 避免 init() 中的 loadPoster() 等访问到尚未初始化的 const 而落入 TDZ 报错
init();
</script>
